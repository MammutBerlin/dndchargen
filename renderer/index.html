on", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You gain the ability to enter a tree and move from inside it to inside another tree of the same kind within 500 feet. Both trees must be living and at least the same size as you. You must use 5 feet of movement to enter a tree. You instantly know the location of all other trees of the same kind within 500 feet and, as part of the move used to enter the tree, can either pass into one of those trees or step out of the tree you're in. You appear in a spot of your choice within 5 feet of the destination tree, using another 5 feet of movement. If you have no movement left, you appear within 5 feet of the tree you entered. \n\nYou can use this transportation ability only once on each of your turns. You must end each turn outside a tree.", "higherLevel": null, "gistDe": "Ermöglicht es, in einen Baum einzutreten und sofort zu einem anderen Baum derselben Art in der Nähe zu wechseln - praktisch zur schnellen Fortbewegung im Wald."}, {"key": "srd-2024_true-polymorph", "name": "True Polymorph", "level": 9, "school": "transmutation", "classes": ["bard", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a drop of mercury, a dollop of gum arabic, and a wisp of smoke", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "Choose one creature or nonmagical object that you can see within range. The creature shape-shifts into a different creature or a nonmagical object, or the object shape-shifts into a creature (the object must be neither worn nor carried). The transformation lasts for the duration or until the target dies or is destroyed, but if you maintain Concentration on this spell for the full duration, the spell lasts until dispelled. \n\nAn unwilling creature can make a Wisdom saving throw, and if it succeeds, it isn't affected by this spell. \n\n**Creature into Creature**. If you turn a creature into another kind of creature, the new form can be any kind you choose that has a Challenge Rating equal to or less than the target's Challenge Rating or level. The target's game statistics are replaced by the stat block of the new form, but it retains its Hit Points, Hit Point Dice, alignment, and personality. \n\nThe target gains a number of Temporary Hit Points equal to the Hit Points of the new form. The spell ends early on the target if it has no Temporary Hit Points left. \n\nThe target is limited in the actions it can perform by the anatomy of its new form, and it can't speak or cast spells. \n\nThe target's gear melds into the new form. The creature can't use or otherwise benefit from any of that equipment. \n\n**Object into Creature**. You can turn an object into any kind of creature, as long as the creature's size is no larger than the object's size and the creature has a Challenge Rating of 9 or lower. The creature is Friendly to you and your allies. In combat, it takes its turns immediately after yours, and it obeys your commands. If the spell lasts more than an hour, you no longer control the creature. It might remain Friendly to you, depending on how you have treated it. \n\n**Creature into Object**. If you turn a creature into an object, it transforms along with whatever it is wearing and carrying into that form, as long as the object's size is no larger than the creature's size. The creature's statistics become those of the object, and the creature has no memory of time spent in this form after the spell ends and it returns to normal.", "higherLevel": null, "gistDe": "Verwandelt eine Kreatur oder ein Objekt dauerhaft (bei durchgehender Konzentration sogar unwiderruflich) in eine andere Kreatur oder ein anderes Objekt. Extrem mächtiger und vielseitiger Verwandlungszauber der höchsten Stufe."}, {"key": "srd-2024_true-resurrection", "name": "True Resurrection", "level": 9, "school": "necromancy", "classes": ["cleric", "druid"], "castingTime": "1 hour", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "diamonds worth 25,000+ GP, which the spell consumes", "duration": "Instantaneous", "concentration": false, "description": "You touch a creature that has been dead for no longer than 200 years and that died for any reason except old age. The creature is revived with all its Hit Points. \n\nThis spell closes all wounds, neutralizes any poison, cures all magical contagions, and lifts any curses affecting the creature when it died. The spell replaces damaged or missing organs and limbs. If the creature was Undead, it is restored to its non-Undead form. \n\nThe spell can provide a new body if the original no longer exists, in which case you must speak the creature's name. The creature then appears in an unoccupied space you choose within 10 feet of you.", "higherLevel": null, "gistDe": "Erweckt einen bis zu 200 Jahre Toten vollständig zum Leben, heilt sämtliche Wunden, Krankheiten und Flüche und kann sogar einen neuen Körper erschaffen. Mächtigster Wiederbelebungszauber im Spiel."}, {"key": "srd-2024_true-seeing", "name": "True Seeing", "level": 6, "school": "divination", "classes": ["bard", "cleric", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "mushroom powder worth 25+ GP, which the spell consumes", "duration": "1 hour", "concentration": false, "description": "For the duration, the willing creature you touch has Truesight with a range of 120 feet.", "higherLevel": null, "gistDe": "Verleiht einer berührten Kreatur für die Dauer Wahre Sicht, mit der Illusionen, Tarnung und Unsichtbarkeit durchschaut werden."}, {"key": "srd-2024_true-strike", "name": "True Strike", "level": 0, "school": "divination", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "S, M", "material": "a weapon with which you have proficiency and that is worth 1+ CP", "duration": "Instantaneous", "concentration": false, "description": "Guided by a flash of magical insight, you make one attack with the weapon used in the spell's casting. The attack uses your spellcasting ability for the attack and damage rolls instead of using Strength or Dexterity. If the attack deals damage, it can be Radiant damage or the weapon's normal damage type (your choice).", "higherLevel": "**Cantrip Upgrade.** Whether you deal Radiant damage or the weapon's normal damage type, the attack deals extra Radiant damage when you reach levels 5 (1d6), 11 (2d6), and 17 (3d6).", "gistDe": "Cantrip: Ermöglicht einen präzisen Waffenangriff, bei dem statt Stärke oder Geschicklichkeit der Zauberfähigkeitswert für Treffer und Schaden zählt."}, {"key": "srd-2024_tsunami", "name": "Tsunami", "level": 8, "school": "conjuration", "classes": ["druid"], "castingTime": "1 minute", "ritual": false, "range": "1 miles", "components": "V, S", "material": null, "duration": "Concentration, up to 6 rounds", "concentration": true, "description": "A wall of water springs into existence at a point you choose within range. You can make the wall up to 300 feet long, 300 feet high, and 50 feet thick. The wall lasts for the duration. When the wall appears, each creature in its area makes a Strength saving throw, taking 6d10 Bludgeoning damage on a failed save or half as much damage on a successful one. \n\nAt the start of each of your turns after the wall appears, the wall, along with any creatures in it, moves 50 feet away from you. Any Huge or smaller creature inside the wall or whose space the wall enters when it moves must succeed on a Strength saving throw or take 5d10 Bludgeoning damage. A creature can take this damage only once per round. At the end of the turn, the wall's height is reduced by 50 feet, and the damage the wall deals on later rounds is reduced by 1d10. When the wall reaches O feet in height, the spell ends. \n\nA creature caught in the wall can move by swimming. Because of the wave's force, though, the creature must succeed on a Strength (Athletics) check against your spell save DC to move at all. If it fails the check, it can't move. A creature that moves out of the wall falls to the ground.", "higherLevel": null, "gistDe": "Erschafft eine riesige, sich bewegende Wasserwand, die beim Erscheinen und bei Berührung erheblichen Schaden verursacht. Sehr mächtiger Flächenzauber."}, {"key": "srd-2024_unseen-servant", "name": "Unseen Servant", "level": 1, "school": "conjuration", "classes": ["bard", "warlock", "wizard"], "castingTime": "1 action", "ritual": true, "range": "60 feet", "components": "V, S, M", "material": "a bit of string and of wood", "duration": "1 hour", "concentration": false, "description": "This spell creates an Invisible, mindless, shapeless, Medium force that performs simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 Hit Point, and a Strength of 2, and it can't attack. If it drops to 0 Hit Points, the spell ends. \n\nOnce on each of your turns as a Bonus Action, you can mentally command the servant to move up to 15 feet and interact with an object. The servant can perform simple tasks that a human could do, such as fetching things, cleaning, mending, folding clothes, lighting fires, serving food, and pouring drinks. Once you give the command, the servant performs the task to the best of its ability until it completes the task, then waits for your next command. \n\nIf you command the servant to perform a task that would move it more than 60 feet away from you, the spell ends.", "higherLevel": null, "gistDe": "Erschafft einen unsichtbaren, kraftlosen Helfer, der einfache Handlangerdienste wie Tragen oder Aufräumen übernimmt."}, {"key": "srd-2024_vampiric-touch", "name": "Vampiric Touch", "level": 3, "school": "necromancy", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "The touch of your shadow-wreathed hand can siphon life force from others to heal your wounds. Make a melee spell attack against one creature within reach. On a hit, the target takes 3d6 Necrotic damage, and you regain Hit Points equal to half the amount of Necrotic damage dealt. \n\nUntil the spell ends, you can make the attack again on each of your turns as a Magic action, targeting the same creature or a different one.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 3.", "gistDe": "Berührungsangriff, der dem Ziel nekrotischen Schaden zufügt und dem Zaubernden die Hälfte davon als Heilung zurückgibt; kann jede Runde wiederholt werden."}, {"key": "srd-2024_vicious-mockery", "name": "Vicious Mockery", "level": 0, "school": "enchantment", "classes": ["bard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You unleash a string of insults laced with subtle enchantments at one creature you can see or hear within range. The target must succeed on a Wisdom saving throw or take 1d6 Psychic damage and have Disadvantage on the next attack roll it makes before the end of its next turn.", "higherLevel": "**Cantrip Upgrade.** The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).", "gistDe": "Cantrip: Verbale Beleidigung, die psychischen Schaden verursacht und dem Ziel einen Nachteil auf seinen nächsten Angriff gibt."}, {"key": "srd-2024_vitriolic-sphere", "name": "Vitriolic Sphere", "level": 4, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "150 feet", "components": "V, S, M", "material": "a drop of bile", "duration": "Instantaneous", "concentration": false, "description": "You point at a location within range, and a glowing, 1-foot- diameter ball of acid streaks there and explodes in a 20-foot-radius Sphere. Each creature in that area makes a Dexterity saving throw. On a failed save, a creature takes 10d4 Acid damage and another Sd4 Acid damage at the end of its next turn. On a successful save, a creature takes half the initial damage only.", "higherLevel": "**Using a Higher-Level Spell Slot.** The initial damage increases by 2d4 for each spell slot level above 4.", "gistDe": "Schleudert eine explodierende Säurekugel in einen Bereich, die sofortigen und eine Runde später nochmals verzögerten Säureschaden verursacht."}, {"key": "srd-2024_wall-of-fire", "name": "Wall of Fire", "level": 4, "school": "evocation", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a piece of charcoal", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration. \n\nWhen the wall appears, each creature in its area makes a Dexterity saving throw, taking 5d8 Fire damage on a failed save or half as much damage on a successful one. \n\nOne side of the wall, selected by you when you cast this spell, deals 5d8 Fire damage to each creature that ends its turn within 10 feet of that side or inside the wall. A creature takes the same damage when it enters the wall for the first time on a turn or ends its turn there. The other side of the wall deals no damage.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 4.", "gistDe": "Erschafft eine Feuerwand, die beim Erscheinen und bei Kontakt mit einer Seite Feuerschaden verursacht sowie Sicht und Bewegung blockiert."}, {"key": "srd-2024_wall-of-force", "name": "Wall of Force", "level": 5, "school": "evocation", "classes": ["wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a shard of glass", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "An Invisible wall of force springs into existence at a point you choose within range. The wall appears in any orientation you choose, as a horizontal or vertical barrier or at an angle. It can be free floating or resting on a solid surface. You can form it into a hemispherical dome or a globe with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. In any form, the wall is 1/4 inch thick and lasts for the duration. If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (you choose which side). \n\nNothing can physically pass through the wall. It is immune to all damage and can't be dispelled by Dispel Magic. A Disintegrate spell destroys the wall instantly, however. The wall also extends into the Ethereal Plane and blocks ethereal travel through the wall.", "higherLevel": null, "gistDe": "Erschafft eine unsichtbare, undurchdringliche Kraftwand in wählbarer Form wie Kuppel, Kugel oder Flächen, die praktisch nichts durchlässt."}, {"key": "srd-2024_wall-of-ice", "name": "Wall of Ice", "level": 6, "school": "evocation", "classes": ["wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a piece of quartz", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You create a wall of ice on a solid surface within range. You can form it into a hemispherical dome or a globe with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot- square panels. Each panel must be contiguous with another panel. In any form, the wall is 1 foot thick and lasts for the duration. \n\nIf the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (you choose which side) and makes a Dexterity saving throw, taking 10d6 Cold damage on a failed save or half as much damage on a successful one. \n\nThe wall is an object that can be damaged and thus breached. It has AC 12 and 30 Hit Points per 10-foot section, and it has Immunity to Cold, Poison, and Psychic damage and Vulnerability to Fire damage. Reducing a 10-foot section of wall to 0 Hit Points destroys it and leaves behind a sheet of frigid air in the space the wall occupied. \n\nA creature moving through the sheet of frigid air for the first time on a turn makes a Constitution saving throw, taking 5d6 Cold damage on a failed save or half as much damage on a successful one.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage the wall deals when it appears increases by 2d6 and the damage from passing through the sheet of frigid air increases by 1d6 for each spell slot level above 6.", "gistDe": "Erschafft eine Eiswand, die beim Erscheinen Kälteschaden verursacht und Sicht sowie Bewegung blockiert."}, {"key": "srd-2024_wall-of-stone", "name": "Wall of Stone", "level": 5, "school": "evocation", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a cube of granite", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "A nonmagical wall of solid stone springs into existence at a point you choose within range. The wall is 6 inches thick and is composed of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. Alternatively, you can create 10- foot-by-20-foot panels that are only 3 inches thick. \n\nIf the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (you choose which side). If a creature would be surrounded on all sides by the wall (or the wall and another solid surface), that creature can make a Dexterity saving throw. On a success, it can use its Reaction to move up to its Speed so that it is no longer enclosed by the wall.\n\nThe wall can have any shape you desire, though it can't occupy the same space as a creature or object. The wall doesn't need to be vertical or rest on a firm foundation. It must, however, merge with and be solidly supported by existing stone. Thus, you can use this spell to bridge a chasm or create a ramp. \n\nIf you create a span greater than 20 feet in length, you must halve the size of each panel to create supports. You can crudely shape the wall to create battlements and the like. \n\nThe wall is an object made of stone that can be damaged and thus breached. Each panel has AC 15 and 30 Hit Points per inch of thickness, and it has Immunity to Poison and Psychic damage. Reducing a panel to 0 Hit Points destroys it and might cause connected panels to collapse at the DM's discretion. \n\nIf you maintain your Concentration on this spell for its full duration, the wall becomes permanent and can't be dispelled. Otherwise, the wall disappears when the spell ends.", "higherLevel": null, "gistDe": "Erschafft eine solide Steinwand aus mehreren Segmenten, die Räume abtrennt oder Gegner einschließen kann."}, {"key": "srd-2024_wall-of-thorns", "name": "Wall of Thorns", "level": 6, "school": "conjuration", "classes": ["druid"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a handful of thorns", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You create a wall of tangled brush bristling with needle-sharp thorns. The wall appears within range on a solid surface and lasts for the duration. You choose to make the wall up to 60 feet long, 10 feet high, and 5 feet thick or a circle that has a 20-foot diameter and is up to 20 feet high and 5 feet thick. The wall blocks line of sight. \n\nWhen the wall appears, each creature in its area makes a Dexterity saving throw, taking 7d8 Piercing damage on a failed save or half as much damage on a successful one. \n\nA creature can move through the wall, albeit slowly and painfully. For every 1 foot a creature moves through the wall, it must spend 4 feet of movement. Furthermore, the first time a creature enters a space in the wall on a turn or ends its turn there, the creature makes a Dexterity saving throw, taking 7d8 Slashing damage on a failed save or half as much damage on a successful one. A creature makes this save only once per turn.", "higherLevel": "**Using a Higher-Level Spell Slot.** Both types of damage increase by 1d8 for each spell slot level above 6.", "gistDe": "Erschafft eine dornige Dickichtwand, die beim Erscheinen Stichschaden verursacht und das Durchqueren schmerzhaft und langsam macht."}, {"key": "srd-2024_warding-bond", "name": "Warding Bond", "level": 2, "school": "abjuration", "classes": ["cleric", "paladin"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a pair of platinum rings worth 50+ GP each, which you and the target must wear for the duration", "duration": "1 hour", "concentration": false, "description": "You touch another creature that is willing and create a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has Resistance to all damage. Also, each time it takes damage, you take the same amount of damage. \n\nThe spell ends if you drop to 0 Hit Points or if you and the target become separated by more than 60 feet. It also ends if the spell is cast again on either of the connected creatures.", "higherLevel": null, "gistDe": "Verbindet den Zaubernden mit einem willigen Ziel: Das Ziel erhält Bonus auf Rüstung und Rettungswürfe sowie Schadensresistenz, während der Zaubernde einen Teil seines Schadens übernimmt."}, {"key": "srd-2024_water-breathing", "name": "Water Breathing", "level": 3, "school": "transmutation", "classes": ["druid", "ranger", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": true, "range": "30 feet", "components": "V, S, M", "material": "a short reed", "duration": "24 hours", "concentration": false, "description": "This spell grants up to ten willing creatures of your choice within range the ability to breathe underwater until the spell ends. Affected creatures also retain their normal mode of respiration.", "higherLevel": null, "gistDe": "Verleiht mehreren willigen Kreaturen die Fähigkeit, für die Dauer unter Wasser zu atmen."}, {"key": "srd-2024_water-walk", "name": "Water Walk", "level": 3, "school": "transmutation", "classes": ["cleric", "druid", "ranger", "sorcerer"], "castingTime": "1 action", "ritual": true, "range": "30 feet", "components": "V, S, M", "material": "a piece of cork", "duration": "1 hour", "concentration": false, "description": "This spell grants the ability to move across any liquid surface—such as water, acid, mud, snow, quicksand, or lava—as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures of your choice within range gain this ability for the duration. \n\nAn affected target must take a Bonus Action to pass from the liquid's surface into the liquid itself and vice versa, but if the target falls into the liquid, the target passes through the surface into the liquid below.", "higherLevel": null, "gistDe": "Verleiht mehreren willigen Kreaturen die Fähigkeit, über flüssige Oberflächen wie Wasser oder Lava zu gehen, als wären sie fester Boden."}, {"key": "srd-2024_web", "name": "Web", "level": 2, "school": "conjuration", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a bit of spiderweb", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You conjure a mass of sticky webbing at a point within range. The webs fill a 20-foot Cube there for the duration. The webs are Difficult Terrain, and the area within them is Lightly Obscured. If the webs aren't anchored between two solid masses (such as walls or trees) or layered across a floor, wall, or ceiling, the web collapses on itself, and the spell ends at the start of your next turn. Webs layered over a flat surface have a depth of 5 feet. \n\nThe first time a creature enters the webs on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Restrained condition while in the webs or until it breaks free. A creature Restrained by the webs can take an action to make a Strength (Athletics) check against your spell save DC. If it succeeds, it is no longer Restrained. \n\nThe webs are flammable. Any 5-foot Cube of webs exposed to fire burns away in 1 round, dealing 2d4 Fire damage to any creature that starts its turn in the fire.", "higherLevel": null, "gistDe": "Erschafft ein klebriges Spinnennetz in einem Bereich, das Bewegung erschwert und Kreaturen bei misslungenem Rettungswurf festhält."}, {"key": "srd-2024_weird", "name": "Weird", "level": 9, "school": "illusion", "classes": ["warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You try to create illusory terrors in others' minds. Each creature of your choice in a 30-foot-radius Sphere centered on a point within range makes a Wisdom saving throw. On a failed save, a target takes 10d10 Psychic damage and has the Frightened condition for the duration. On a successful save, a target takes half as much damage only. \n\nA Frightened target makes a Wisdom saving throw at the end of each of its turns. On a failed save, it takes 5d10 Psychic damage. On a successful save, the spell ends on that target.", "higherLevel": null, "gistDe": "Erzeugt illusionäre Schreckensbilder in den Köpfen mehrerer Ziele in einem großen Bereich, die massiven psychischen Schaden verursachen und anhaltende Angst auslösen. Einer der stärksten Angstzauber der höchsten Stufe."}, {"key": "srd-2024_wind-walk", "name": "Wind Walk", "level": 6, "school": "transmutation", "classes": ["druid"], "castingTime": "1 minute", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a candle", "duration": "8 hours", "concentration": false, "description": "You and up to ten willing creatures of your choice within range assume gaseous forms for the duration, appearing as wisps of cloud. While in this cloud form, a target has a Fly Speed of 300 feet and can hover; it has Immunity to the Prone condition; and it has Resistance to Bludgeoning, Piercing, and Slashing damage. The only actions a target can take in this form are the Dash action or a Magic action to begin reverting to its normal form. Reverting takes 1 minute, during which the target has the Stunned condition. Until the spell ends, the target can revert to cloud form, which also requires a Magic action followed by a 1-minute transformation. \n\nIf a target is in cloud form and flying when the effect ends, the target descends 60 feet per round for 1 minute until it lands, which it does safely. If it can't land after 1 minute, it falls the remaining distance.", "higherLevel": null, "gistDe": "Verwandelt den Zaubernden und Begleiter in gasförmige Wolkenwesen mit hoher Fluggeschwindigkeit und Schadensresistenz, sodass sie nahezu ungefährdet weite Strecken reisen können."}, {"key": "srd-2024_wind-wall", "name": "Wind Wall", "level": 3, "school": "evocation", "classes": ["druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a fan and a feather", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "A wall of strong wind rises from the ground at a point you choose within range. You can make the wall up to 50 feet long, 15 feet high, and 1 foot thick. You can shape the wall in any way you choose so long as it makes one continuous path along the ground. The wall lasts for the duration. \n\nWhen the wall appears, each creature in its area makes a Strength saving throw, taking 4d8 Bludgeoning damage on a failed save or half as much damage on a successful one. \n\nThe strong wind keeps fog, smoke, and other gases at bay. Small or smaller flying creatures or objects can't pass through the wall. Loose, lightweight materials brought into the wall fly upward. Arrows, bolts, and other ordinary projectiles launched at targets behind the wall are deflected upward and miss automatically. Boulders hurled by Giants or siege engines, and similar projectiles, are unaffected. Creatures in gaseous form can't pass through it.", "higherLevel": null, "gistDe": "Erschafft eine Windwand, die beim Erscheinen Schaden verursacht, kleine fliegende Objekte und Kreaturen blockiert und Gas, Rauch oder Nebel fernhält."}, {"key": "srd-2024_wish", "name": "Wish", "level": 9, "school": "conjuration", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Wish is the mightiest spell a mortal can cast. By simply speaking aloud, you can alter reality itself. The basic use of this spell is to duplicate any other spell of level 8 or lower. If you use it this way, you don't need to meet any requirements to cast that spell, including costly components. The spell simply takes effect. Alternatively, you can create one of the following effects of your choice: \n\n**Object Creation**. You create one object of up to 25,000 GP in value that isn't a magic item. The object can be no more than 300 feet in any dimension, and it appears in an unoccupied space that you can see on the ground. \n\n**Instant Health**. You allow yourself and up to twenty creatures that you can see to regain all Hit Points, and you end all effects on them listed in the Greater Restoration spell. \n\n**Resistance**. You grant up to ten creatures that you can see Resistance to one damage type that you choose. This Resistance is permanent. \n\n**Spell Immunity**. You grant up to ten creatures you can see immunity to a single spell or other magical effect for 8 hours. \n\n**Sudden Learning**. You replace one of your feats with another feat for which you are eligible. You lose all the benefits of the old feat and gain the benefits of the new one. You can't replace a feat that is a prerequisite for any of your other feats or features. \n\n**Roll Redo**. You undo a single recent event by forcing a reroll of any die roll made within the last round (including your last turn). Reality reshapes itself to accommodate the new result. For example, a Wish spell could undo an ally's failed saving throw or a foe's Critical Hit. You can force the reroll to be made with Advantage or Disadvantage, and you choose whether to use the reroll or the original roll. \n\n**Reshape Reality**. You may wish for something not included in any of the other effects. To do so, state your wish to the DM as precisely as possible. The DM has great latitude in ruling what occurs in such an instance; the greater the wish, the greater the likelihood that something goes wrong. This spell might simply fail, the effect you desire might be achieved only in part, or you might suffer an unforeseen consequence as a result of how you worded the wish. For example, wishing that a villain were dead might propel you forward in time to a period when that villain is no longer alive, effectively removing you from the game. Similarly, wishing for a Legendary magic item or an Artifact might instantly transport you to the presence of the item's current owner. If your wish is granted and its effects have consequences for a whole community, region, or world, you are likely to attract powerful foes. If your wish would affect a god, the god's divine servants might instantly intervene to prevent it or to encourage you to craft the wish in a particular way. If your wish would undo the multiverse itself, threaten the City of Sigil, or affect the Lady of Pain in any way, you see an image of her in your mind for a moment; she shakes her head, and your wish fails. The stress of casting Wish to produce any effect other than duplicating another spell weakens you. After enduring that stress, each time you cast a spell until you finish a Long Rest, you take 1d10 Necrotic damage per level of that spell. This damage can't be reduced or prevented in any way. In addition, your Strength score becomes 3 for 2d4 days. For each of those days that you spend resting and doing nothing more than light activity, your remaining recovery time decreases by 2 days. Finally, there is a 33 percent chance that you are unable to cast Wish ever again if you suffer this stress.", "higherLevel": null, "gistDe": "Der mächtigste aller Zauber: kann jeden anderen Zauber der Stufe 8 oder niedriger ohne Einschränkungen wirken oder nahezu jeden gewünschten Realitätseffekt erzielen, birgt aber bei riskanter Nutzung erhebliche persönliche Gefahren."}, {"key": "srd-2024_word-of-recall", "name": "Word of Recall", "level": 6, "school": "conjuration", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "5 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You and up to five willing creatures within 5 feet of you instantly teleport to a previously designated sanctuary. You and any creatures that teleport with you appear in the nearest unoccupied space to the spot you designated when you prepared your sanctuary (see below). If you cast this spell without first preparing a sanctuary, the spell has no effect. \n\nYou must designate a location, such as a temple, as a sanctuary by casting this spell there.", "higherLevel": null, "gistDe": "Teleportiert den Zaubernden und bis zu fünf Begleiter sofort zu einem zuvor festgelegten, sicheren Zufluchtsort."}, {"key": "srd-2024_zone-of-truth", "name": "Zone of Truth", "level": 2, "school": "enchantment", "classes": ["bard", "cleric", "paladin"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "10 minutes", "concentration": false, "description": "You create a magical zone that guards against deception in a 15- foot-radius Sphere centered on a point within range. Until the spell ends, a creature that enters the spell's area for the first time on a turn or starts its turn there makes a Charisma saving throw. On a failed save, a creature can't speak a deliberate lie while in the radius. You know whether a creature succeeds or fails on this save. An affected creature is aware of the spell and can avoid answering questions to which it would normally respond with a lie. Such a creature can be evasive yet must be truthful.", "higherLevel": null, "gistDe": "Erschafft einen Bereich, in dem Betroffene bei misslungenem Rettungswurf nicht bewusst lügen können, wobei sie unbequeme Fragen dennoch ausweichend beantworten dürfen."}];

const DE_TRANSLATIONS_CLASSES = {
  'srd-2024_bard': {
    'srd-2024_bard_ability-score-improvement': 'Du erhältst den Feat Attributssteigerung (siehe „Feats") oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst. Du erhältst dieses Merkmal erneut auf den Bardenstufen 8, 12 und 16.',
    'srd-2024_bard_bardic-inspiration': 'Du kannst andere auf übernatürliche Weise durch Worte, Musik oder Tanz inspirieren. Diese Inspiration wird durch deinen Bardeninspirationswürfel dargestellt, einem W6. — Als Bonusaktion kannst du ein anderes Wesen in 18 m, das dich sehen oder hören kann, inspirieren. Dieses Wesen erhält einen deiner Bardeninspirationswürfel (ein Wesen kann immer nur einen gleichzeitig besitzen). Innerhalb der nächsten Stunde kann das Wesen, sobald es eine W20-Probe verpatzt, den Würfel dazuaddieren — dadurch kann aus einem Fehlschlag ein Erfolg werden. Der Würfel wird beim Würfeln verbraucht. — Du kannst einen Bardeninspirationswürfel so oft vergeben, wie dein Charisma-Modifikator angibt (mindestens einmal), und erhältst alle verbrauchten Nutzungen nach einer langen Rast zurück. Der Würfel wird auf Stufe 5 zu einem W8, auf Stufe 10 zu einem W10 und auf Stufe 15 zu einem W12.',
    'srd-2024_bard_countercharm': 'Du kannst mit Tönen oder Machtworten geisteslenkende Effekte stören. Scheitert ein Rettungswurf gegen einen Effekt, der Bezaubert oder Verängstigt hervorruft (bei dir oder einem Wesen in 9 m), kannst du als Reaktion die Wiederholung dieses Rettungswurfs erzwingen — mit Vorteil.',
    'srd-2024_bard_epic-boon': 'Du erhältst einen Epischen Feat (siehe „Feats") oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst. Empfohlen: Segen der Zaubererinnerung.',
    'srd-2024_bard_expertise': 'Du erhältst Expertise (siehe Regelglossar) in zwei Fertigkeiten deiner Wahl, in denen du bereits geübt bist. Empfohlen: Auftreten und Überzeugen, sofern vorhanden. — Auf Bardenstufe 9 erhältst du Expertise in zwei weiteren Fertigkeiten deiner Wahl.',
    'srd-2024_bard_font-of-inspiration': 'Du erhältst nun alle verbrauchten Nutzungen der Bardeninspiration sowohl nach einer kurzen als auch nach einer langen Rast zurück. — Außerdem kannst du (ohne Aktion) einen Zauberplatz ausgeben, um eine verbrauchte Nutzung der Bardeninspiration zurückzuerhalten.',
    'srd-2024_bard_jack-of-all-trades': 'Du kannst die Hälfte deines Übungsbonus (abgerundet) zu jeder Fähigkeitsprobe addieren, für die du keine Fertigkeitsübung besitzt und die deinen Übungsbonus sonst nicht einbezieht.',
    'srd-2024_bard_magical-secrets': 'Du hast Geheimnisse verschiedener magischer Traditionen erlernt. Immer wenn sich die Zahl vorbereiteter Zauber in der Bardenmerkmale-Tabelle erhöht (auch auf dieser Stufe), kannst du neue vorbereitete Zauber aus den Zauberlisten von Barde, Kleriker, Druide und Zauberer wählen — sie gelten für dich als Bardenzauber. Beim Ersetzen eines vorbereiteten Zaubers kannst du ebenfalls aus diesen Listen wählen.',
    'srd-2024_bard_spellcasting': 'Du hast gelernt, durch deine bardische Kunst Zauber zu wirken. — **Zaubertricks.** Du kennst zwei Zaubertricks deiner Wahl aus der Bardenzauberliste. Bei jedem Stufenaufstieg kannst du einen Zaubertrick gegen einen anderen aus der Bardenzauberliste austauschen. Auf Bardenstufe 4 und 10 lernst du einen weiteren Zaubertrick hinzu. — **Zauberplätze.** Du regenerierst alle verbrauchten Zauberplätze nach einer langen Rast. — **Vorbereitete Zauber des 1. Grades und höher.** Wähle zu Beginn vier Zauber des 1. Grades aus der Bardenzauberliste. Die Anzahl wählbarer Zauber steigt mit deiner Bardenstufe. Bei jedem Stufenaufstieg kannst du einen vorbereiteten Zauber gegen einen anderen Bardenzauber austauschen, für den du einen Zauberplatz besitzt. — Charisma ist dein Zauberattribut für Bardenzauber. Du kannst ein Musikinstrument als Zauberfokus verwenden.',
    'srd-2024_bard_superior-inspiration': 'Würfelst du deine Initiative und hast weniger als zwei Nutzungen der Bardeninspiration übrig, erhältst du Nutzungen zurück, bis du zwei hast.',
    'srd-2024_bard_words-of-creation': 'Du beherrschst zwei der Schöpfungsworte: das Wort des Lebens und das Wort des Todes. Dadurch hast du stets die Zauber Heilendes Machtwort und Todesmachtwort vorbereitet. Wirkst du einen davon, kannst du ein zweites Ziel innerhalb von 3 m des ersten mit einbeziehen.'
  },
  'srd-2024_cleric': {
    'srd-2024_cleric_spellcasting': 'Du hast gelernt, durch Gebet und Meditation Zauber zu wirken. — Charisma ist NICHT dein Zauberattribut als Kleriker; stattdessen ist es Weisheit. Ein Heiliges Symbol dient dir als Zauberfokus.',
    'srd-2024_cleric_divine-order': 'Du hast dich einer der folgenden geweihten Aufgaben verschrieben: **Schützer** — du erhältst Übung mit Kriegswaffen und Übung mit schwerer Rüstung. **Gelehrter** — du erhältst einen Zaubertrick der Magierliste deiner Wahl sowie Übung in einer Wissensfertigkeit deiner Wahl (Arkane Kunde, Geschichte, Naturkunde oder Religion).',
    'srd-2024_cleric_channel-divinity': 'Du kannst göttliche Energie direkt aus den Außenebenen kanalisieren, um magische Effekte zu erzeugen. Du beginnst mit zwei solchen Effekten: Untote Vertreiben und einem weiteren, der von deiner Domäne bestimmt wird. Jedes Mal, wenn du Kanal der Göttlichkeit einsetzt, wählst du, welchen Effekt du erzeugen willst. Höhere Klerikerstufen bringen weitere Effekte.',
    'srd-2024_cleric_turn-undead': 'Als Magieaktion präsentierst du dein Heiliges Symbol und verurteilst Untote. Jedes Untote deiner Wahl in 9 m muss einen Weisheitsrettungswurf ablegen. Scheitert es, gilt es für die Dauer als Vertrieben (Zustand). Es versucht, sich so weit wie möglich von dir zu entfernen, und dieser Effekt endet vorzeitig, wenn das Wesen Schaden nimmt, den Zustand Kampfunfähig erhält oder stirbt.',
    'srd-2024_cleric_bonus-proficiency': 'Wählst du diese Domäne auf Stufe 1, erhältst du Übung mit schwerer Rüstung und mit Schmiedewerkzeug.',
    'srd-2024_cleric_blessing-of-the-forge': 'Auf Stufe 1 kannst du Waffen und Rüstung magisch verstärken. Am Ende einer langen Rast kannst du einen unmagischen Gegenstand berühren, der eine Rüstung oder eine einfache/Kriegswaffe ist. Bis zum Ende deiner nächsten langen Rast (oder bis du stirbst) wird der Gegenstand zu einem magischen Gegenstand: +1 auf die Rüstungsklasse bei Rüstung, oder +1 auf Angriffs- und Schadenswürfe bei einer Waffe.',
    'srd-2024_cleric_channel-divinity-artisans-blessing': 'Ab Stufe 2 kannst du deinen Kanal der Göttlichkeit einsetzen, um einfache Gegenstände herzustellen.',
    'srd-2024_cleric_divine-spark': 'Als Magieaktion richtest du dein Heiliges Symbol auf ein Wesen in 9 m, das du sehen kannst, und lenkst göttliche Energie darauf. Würfle 1W8 und addiere deinen Weisheitsmodifikator: Entweder heilst du das Ziel um diesen Betrag, oder du zwingst es zu einem Konstitutionsrettungswurf. Scheitert das Ziel, erleidet es nekrotischen oder strahlenden Schaden (deine Wahl) in Höhe dieses Betrags; bei Erfolg nur die Hälfte (abgerundet).',
    'srd-2024_cleric_divine-strike': 'Ab Stufe 8 wird dein Waffenschaden bei einem Treffer einmal pro Zug um 1W8 zusätzlichen Schaden eines von deiner Domäne bestimmten Typs erhöht. Ab Stufe 14 steigt dieser Bonusschaden auf 2W8.',
    'srd-2024_cleric_sear-undead': 'Ab Stufe 5 wird ein Untotes der Herausforderungsstufe 1/2 oder niedriger, das seinen Rettungswurf gegen dein Merkmal Untote Vertreiben verpatzt, sofort vernichtet.',
    'srd-2024_cleric_potent-spellcasting': 'Ab Stufe 8 addierst du deinen Weisheitsmodifikator zum Schaden, den du mit Klerikerzaubertricks verursachst.'
  },
  'srd-2024_barbarian': {
    'srd-2024_barbarian_rage': 'Als Bonusaktion kannst du in Rage geraten. Solange du in Rage bist, gilt: Du hast Vorteil bei Stärke-Fähigkeitsproben und Stärke-Rettungswürfen (außer bei Übungen); dein Nahkampf-Waffenschaden mit Stärke erhält einen Bonus (siehe Barbarenmerkmale-Tabelle); du hast Widerstand gegen Wucht-, Hieb- und Stichschaden. Du kannst keine Zauber wirken oder konzentrieren, außer bestimmten Merkmalen erlauben das. Die Rage endet vorzeitig, wenn du bewusstlos wirst oder eine Runde lang weder angegriffen noch Schaden erlitten hast. Du regenerierst alle verbrauchten Nutzungen nach einer langen Rast.',
    'srd-2024_barbarian_unarmored-defense': 'Trägst du keine Rüstung, beträgt deine Rüstungsklasse 10 + Geschicklichkeitsmodifikator + Konstitutionsmodifikator. Du kannst dabei einen Schild verwenden und behältst diesen Vorteil trotzdem.',
    'srd-2024_barbarian_weapon-mastery': 'Du beherrschst die Meistereigenschaften einer Anzahl von Waffen, mit denen du geübt bist (siehe Barbarenmerkmale-Tabelle). Du kannst diese Auswahl bei jedem Stufenaufstieg ändern.',
    'srd-2024_barbarian_danger-sense': 'Du hast Vorteil bei Geschicklichkeitsrettungswürfen gegen Effekte, die du sehen kannst, wie Fallen und manche Zauber, solange du nicht Blind, Taub oder Kampfunfähig bist.',
    'srd-2024_barbarian_reckless-attack': 'Wenn du zum ersten Mal in deinem Zug einen Angriff ausführst, kannst du dich rücksichtslos in den Kampf stürzen. Du erhältst dadurch bis zum Beginn deines nächsten Zugs Vorteil bei Angriffswürfen mit Stärke, aber auch alle Angriffswürfe gegen dich haben bis dahin Vorteil.',
    'srd-2024_barbarian_extra-attack': 'Du kannst zweimal statt einmal angreifen, wenn du die Angriffsaktion in deinem Zug ausführst.',
    'srd-2024_barbarian_fast-movement': 'Deine Grundbewegungsrate erhöht sich um 3 m (10 Fuß), solange du keine schwere Rüstung trägst.',
    'srd-2024_barbarian_feral-instinct': 'Du hast Vorteil bei Initiativewürfen. Außerdem kannst du, wenn du überrascht bist, aber bereits in Rage bist oder in deinem ersten Zug in Rage gerätst, trotzdem handeln.',
    'srd-2024_barbarian_instinctive-pounce': 'Als Teil der Bonusaktion, mit der du in Rage gerätst, kannst du dich bis zu deiner halben Bewegungsrate weit bewegen.',
    'srd-2024_barbarian_brutal-strike': 'Setzt du Rücksichtsloser Angriff ein und triffst mit einem Nahkampf-Waffenangriff mit Stärke, kannst du einen zusätzlichen, verheerenden Effekt auslösen (deine Wahl); dafür erleidest du selbst Nachteil bei diesem Angriffswurf.',
    'srd-2024_barbarian_relentless-rage': 'Wenn du während einer Rage auf 0 Trefferpunkte fällst, ohne sofort zu sterben, kannst du einen Konstitutionsrettungswurf (SG 10, steigt bei jeder erneuten Nutzung um 5) ablegen; bei Erfolg bleibst du auf 1 Trefferpunkt.',
    'srd-2024_barbarian_persistent-rage': 'Deine Rage endet nur noch, wenn du bewusstlos wirst oder sie selbst beendest.',
    'srd-2024_barbarian_indomitable-might': 'Ist das Ergebnis deiner Stärkeprobe niedriger als dein Stärkewert, kannst du stattdessen diesen Wert verwenden.',
    'srd-2024_barbarian_primal-champion': 'Deine Stärke und Konstitution erhöhen sich je um 4, bis zu einem Maximum von 25.',
    'srd-2024_barbarian_primal-knowledge': 'Während einer Rage kannst du zusätzlich Übung in einer der Fertigkeiten Akrobatik, Einschätzen, Einschüchtern, Naturkunde oder Wahrnehmung einsetzen.',
    'srd-2024_barbarian_ability-score-improvement': 'Du erhältst den Feat Attributssteigerung oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst.',
    'srd-2024_barbarian_epic-boon': 'Du erhältst einen Epischen Feat deiner Wahl.'
  },
  'srd-2024_druid': {
    'srd-2024_druid_spellcasting': 'Du hast gelernt, die Kräfte der Natur zu kanalisieren, um Zauber zu wirken. Weisheit ist dein Zauberattribut. Ein Druidenfokus (siehe Ausrüstung) dient dir als Zauberfokus.',
    'srd-2024_druid_druidic': 'Du kennst Druidisch, die geheime Sprache der Druiden. Du kannst sie sprechen und geheime Botschaften darin hinterlassen, die nur andere Druidisch-Sprecher erkennen.',
    'srd-2024_druid_primal-order': 'Du wählst eine Ausrichtung: **Magier** — zusätzlicher Zaubertrick der Druidenliste. **Wächter** — Übung mit Kriegswaffen und mittelschwerer Rüstung.',
    'srd-2024_druid_wild-shape': 'Als Bonusaktion kannst du dich magisch in die Gestalt eines Tieres verwandeln, das du bereits kennst. Du kannst diese Fähigkeit zweimal nutzen und erhältst verbrauchte Nutzungen nach einer kurzen oder langen Rast zurück. In Tiergestalt behältst du Intelligenz, Weisheit und Charisma, übernimmst aber die restlichen Statistiken des Tieres.',
    'srd-2024_druid_wild-companion': 'Du kannst den Zauber Vertrauten rufen wirken, ohne einen Zauberplatz oder Materialkomponenten zu verbrauchen; der beschworene Vertraute hat dabei die Gestalt eines Tieres (Fee-Geist). Du regenerierst diese Fähigkeit nach einer langen Rast.',
    'srd-2024_druid_expert-druid': 'Deine Tiergestalten verbessern sich weiter (siehe Wildform-Tabelle), und du kannst in Tiergestalt weiterhin Zauber mit nur verbalen Komponenten wirken.',
    'srd-2024_druid_elemental-fury': 'Wähle eine der beiden Optionen: **Machtvolle Zauber** — addiere deinen Weisheitsmodifikator zum Schaden von Druidenzaubertricks. **Elementarer Zauberwirker** — einmal pro Zug zusätzlicher Schaden bei einem Zaubertreffer.',
    'srd-2024_druid_beast-spells': 'Du kannst in Tiergestalt Druidenzauber wirken, die keine materiellen Komponenten benötigen.',
    'srd-2024_druid_improved-primal-order': 'Der Bonus deiner gewählten Primalen Ausrichtung (Magier oder Wächter) verbessert sich weiter.',
    'srd-2024_druid_archdruid': 'Du kannst dich als Bonusaktion unbegrenzt oft in Wildform verwandeln, und Alter beeinträchtigt dich nicht mehr magisch.',
    'srd-2024_druid_ability-score-improvement': 'Du erhältst den Feat Attributssteigerung oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst.',
    'srd-2024_druid_epic-boon': 'Du erhältst einen Epischen Feat deiner Wahl.'
  },
  'srd-2024_fighter': {
    'srd-2024_fighter_fighting-style': 'Du wählst einen Kampfstil, der dir Vorteile im Kampf verschafft. Du kannst diesen Stil nicht erneut wählen, selbst wenn du diese Wahlmöglichkeit anderweitig erhältst.',
    'srd-2024_fighter_second-wind': 'Als Bonusaktion kannst du 1W10 + deine Kämpferstufe an Trefferpunkten zurückgewinnen. Du regenerierst diese Fähigkeit nach einer kurzen oder langen Rast.',
    'srd-2024_fighter_weapon-mastery': 'Du beherrschst die Meistereigenschaften einer Anzahl von Waffen, mit denen du geübt bist (siehe Kämpfermerkmale-Tabelle). Du kannst diese Auswahl bei jedem Stufenaufstieg ändern.',
    'srd-2024_fighter_action-surge': 'Einmal pro kurzer oder langer Rast kannst du dir in deinem Zug eine zusätzliche Aktion gönnen.',
    'srd-2024_fighter_tactical-mind': 'Scheitert eine deiner Fähigkeitsproben, kannst du Zweite Chance einsetzen, um deinem Wurf 1W10 hinzuzufügen. Nutzung wird nach kurzer/langer Rast regeneriert.',
    'srd-2024_fighter_extra-attack': 'Du kannst zweimal statt einmal angreifen, wenn du die Angriffsaktion in deinem Zug ausführst. Diese Zahl steigt auf drei (Stufe 11) und vier (Stufe 20).',
    'srd-2024_fighter_indomitable': 'Du kannst einen misslungenen Rettungswurf wiederholen. Du musst das zweite Ergebnis verwenden. Nutzung wird nach einer langen Rast regeneriert.',
    'srd-2024_fighter_tactical-shift': 'Setzt du Zweite Chance ein, kannst du dich zusätzlich bis zur Hälfte deiner Bewegungsrate weit bewegen, ohne Gelegenheitsangriffe auszulösen.',
    'srd-2024_fighter_studied-attacks': 'Verfehlst du eine Kreatur mit einem Angriffswurf, hast du Vorteil bei deinem nächsten Angriffswurf gegen sie vor Ende deines nächsten Zuges.',
    'srd-2024_fighter_ability-score-improvement': 'Du erhältst den Feat Attributssteigerung oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst.',
    'srd-2024_fighter_epic-boon': 'Du erhältst einen Epischen Feat deiner Wahl.'
  },
  'srd-2024_monk': {
    'srd-2024_monk_martial-arts': 'Du kannst Kampfsportkünste anwenden. Bei unbewaffneten Schlägen und Mönchswaffen kannst du deinen Geschicklichkeitsmodifikator statt Stärke für Angriffs- und Schadenswürfe verwenden, und der Schadenswürfel skaliert mit deiner Mönchsstufe (siehe Mönchsmerkmale-Tabelle). Zusätzlich kannst du einmal pro Zug als Bonusaktion einen zusätzlichen unbewaffneten Schlag ausführen.',
    'srd-2024_monk_unarmored-defense': 'Trägst du weder Rüstung noch Schild, beträgt deine Rüstungsklasse 10 + Geschicklichkeitsmodifikator + Weisheitsmodifikator.',
    'srd-2024_monk_monks-focus': 'Du erhältst Fokuspunkte (siehe Mönchsmerkmale-Tabelle), die du für besondere Mönchsfähigkeiten wie Fokusschlag, Patiente Verteidigung oder Windschritt ausgeben kannst. Du regenerierst alle Fokuspunkte nach einer kurzen oder langen Rast.',
    'srd-2024_monk_unarmored-movement': 'Deine Bewegungsrate erhöht sich, solange du weder Rüstung noch Schild trägst (siehe Tabelle). Ab Stufe 9 kannst du zudem über instabile Oberflächen laufen und in der Luft laufen, sofern du dich zu Beginn und Ende deines Zuges über festem Boden befindest.',
    'srd-2024_monk_deflect-attacks': 'Triffst du dich ein Nahkampfangriff mit einer Waffe, kannst du als Reaktion den Schaden um 1W10 + Geschicklichkeitsmodifikator + Mönchsstufe verringern. Reduzierst du ihn auf 0, kannst du (sofern erlaubt) einen Teil davon an den Angreifer zurückwerfen.',
    'srd-2024_monk_slow-fall': 'Als Reaktion beim Fallen kannst du den erlittenen Fallschaden um das Fünffache deiner Mönchsstufe verringern.',
    'srd-2024_monk_extra-attack': 'Du kannst zweimal statt einmal angreifen, wenn du die Angriffsaktion in deinem Zug ausführst.',
    'srd-2024_monk_stunning-strike': 'Triffst du eine Kreatur mit einem Waffenangriff, kannst du einen Fokuspunkt ausgeben, um sie zu betäuben zu versuchen. Sie muss einen Konstitutionsrettungswurf bestehen oder gilt bis zum Ende deines nächsten Zuges als Betäubt.',
    'srd-2024_monk_ki-empowered-strikes': 'Deine unbewaffneten Schläge zählen als magisch für die Zwecke, Widerstand und Immunität gegen nichtmagische Angriffe/Schaden zu überwinden.',
    'srd-2024_monk_empowered-strikes': 'Deine unbewaffneten Schläge und Mönchswaffen verursachen zusätzlichen Schaden gemäß deiner Mönchsstufe.',
    'srd-2024_monk_evasion': 'Wirst du einem Effekt ausgesetzt, der einen Geschicklichkeitsrettungswurf für halben Schaden erlaubt, erleidest du bei Erfolg keinen und bei Misserfolg nur halben Schaden.',
    'srd-2024_monk_diamond-soul': 'Du hast Übung in allen Rettungswürfen. Scheitert ein Rettungswurf, kannst du einen Fokuspunkt ausgeben, um ihn zu wiederholen — mit dem neuen Ergebnis.',
    'srd-2024_monk_body-and-mind': 'Dein Weisheits- oder Geschicklichkeitswert (deine Wahl) erhöht sich um 4, bis zu einem Maximum von 25.',
    'srd-2024_monk_perfect-self': 'Hast du keine Fokuspunkte mehr und würfelst du Initiative, erhältst du 4 Fokuspunkte zurück.',
    'srd-2024_monk_ability-score-improvement': 'Du erhältst den Feat Attributssteigerung oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst.',
    'srd-2024_monk_epic-boon': 'Du erhältst einen Epischen Feat deiner Wahl.'
  },
  'srd-2024_paladin': {
    'srd-2024_paladin_lay-on-hands': 'Du besitzt einen Heilungsvorrat von 5 × deiner Paladinstufe Trefferpunkten, den du nach einer langen Rast auffüllst. Als Magieaktion kannst du davon Trefferpunkte an ein berührtes Wesen verteilen; du kannst auch 5 Punkte ausgeben, um stattdessen eine Krankheit zu heilen oder ein Gift zu neutralisieren.',
    'srd-2024_paladin_spellcasting': 'Durch Gebet und Meditation hast du gelernt, göttliche Magie zu wirken. Charisma ist dein Zauberattribut. Ein Heiliges Symbol dient dir als Zauberfokus.',
    'srd-2024_paladin_weapon-mastery': 'Du beherrschst die Meistereigenschaften einer Anzahl von Waffen, mit denen du geübt bist (siehe Paladinmerkmale-Tabelle).',
    'srd-2024_paladin_fighting-style': 'Du wählst einen Kampfstil, der dir Vorteile im Kampf verschafft.',
    'srd-2024_paladin_divine-smite': 'Wenn du mit einem Nahkampfangriff mit einer Waffe triffst, kannst du einen Zauberplatz ausgeben, um zusätzlichen strahlenden Schaden zu verursachen (1W8 pro Zauberplatzgrad, max. 5W8; +1W8 gegen Untote/Fiesende).',
    'srd-2024_paladin_channel-divinity': 'Du kannst göttliche Energie kanalisieren, um bestimmte magische Effekte auszulösen. Du beginnst mit zwei Effekten: Göttliches Verurteilen und einem weiteren, der von deinem Eid bestimmt wird. Nutzung wird nach kurzer/langer Rast regeneriert.',
    'srd-2024_paladin_faithful-steed': 'Du kannst den Zauber Berittenen finden wirken, ohne einen Zauberplatz zu verbrauchen. Du regenerierst diese Fähigkeit nach einer langen Rast.',
    'srd-2024_paladin_extra-attack': 'Du kannst zweimal statt einmal angreifen, wenn du die Angriffsaktion in deinem Zug ausführst.',
    'srd-2024_paladin_faith-and-formidability': 'Bei bestimmten Zaubern und Merkmalen kannst du Charisma anstelle eines anderen angegebenen Attributs verwenden.',
    'srd-2024_paladin_aura-of-protection': 'Du und Verbündete in 3 m um dich addieren deinen Charismamodifikator (mindestens +1) zu allen Rettungswürfen.',
    'srd-2024_paladin_restoring-touch': 'Setzt du Handauflegen ein, kannst du zusätzlich 5 Punkte daraus ausgeben, um bei der berührten Kreatur einen der Zustände Bezaubert, Verängstigt, Gelähmt, Betäubt zu beenden.',
    'srd-2024_paladin_aura-of-courage': 'Du und Verbündete in 3 m um dich können nicht durch den Zustand Verängstigt betroffen werden.',
    'srd-2024_paladin_epic-boon': 'Du erhältst einen Epischen Feat deiner Wahl.',
    'srd-2024_paladin_ability-score-improvement': 'Du erhältst den Feat Attributssteigerung oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst.'
  },
  'srd-2024_ranger': {
    'srd-2024_ranger_spellcasting': 'Durch deine Verbindung zur Natur hast du gelernt, Zauber zu wirken. Weisheit ist dein Zauberattribut. Ein Druidenfokus dient dir als Zauberfokus.',
    'srd-2024_ranger_favored-enemy': 'Du kennst den Zauber Feind Erspähen und kannst ihn ohne Zauberplatz und ohne Konzentration wirken. Du regenerierst diese Fähigkeit nach einer langen Rast.',
    'srd-2024_ranger_weapon-mastery': 'Du beherrschst die Meistereigenschaften einer Anzahl von Waffen, mit denen du geübt bist.',

    'srd-2024_ranger_extra-attack': 'Du kannst zweimal statt einmal angreifen, wenn du die Angriffsaktion in deinem Zug ausführst.',
    'srd-2024_ranger_land-s-stride': 'Nichtmagisches, schwieriges Gelände kostet dich keine zusätzliche Bewegung, und du hast Vorteil bei Rettungswürfen gegen magisch erzeugtes schwieriges Gelände.',
    'srd-2024_ranger_tireless': 'Als Magieaktion kannst du Kraft in dir wecken und dabei temporäre Trefferpunkte erhalten. Außerdem verringert sich dein Erschöpfungsgrad um 1, wenn du eine kurze Rast beendest.',

    'srd-2024_ranger_epic-boon': 'Du erhältst einen Epischen Feat deiner Wahl.',
    'srd-2024_ranger_foe-slayer': 'Einmal pro Zug kannst du deinen Weisheitsmodifikator zu einem Angriffs- oder Schadenswurf gegen ein von dir mit Feind Erspähen markiertes Wesen addieren.',
    'srd-2024_ranger_ability-score-improvement': 'Du erhältst den Feat Attributssteigerung oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst.'

  'srd-2024_rogue': {
    'srd-2024_rogue_expertise': 'Du erhältst Expertise in zwei Fertigkeiten deiner Wahl, in denen du bereits geübt bist (oder in Diebeswerkzeug).',
    'srd-2024_rogue_sneak-attack': 'Einmal pro Zug kannst du zusätzlichen Schaden verursachen, wenn du mit einer Fein- oder Fernwaffe triffst und dabei Vorteil hast oder ein weiterer Feind der getroffenen Kreatur sich in 1,5 m von ihr befindet (und du nicht im Nachteil bist). Der Bonusschaden skaliert mit deiner Schurkenstufe.',
    'srd-2024_rogue_thieves-cant': 'Du kennst Diebesjargon, einen geheimen Mix aus Dialekt, Jargon und Zeichen, der es erlaubt, versteckte Botschaften zu übermitteln.',
    'srd-2024_rogue_weapon-mastery': 'Du beherrschst die Meistereigenschaften einer Anzahl von Waffen, mit denen du geübt bist.',
    'srd-2024_rogue_cunning-action': 'Als Bonusaktion kannst du die Aktion Ausweichen, Rückzug oder Verstecken ausführen.',
    'srd-2024_rogue_steady-aim': 'Als Bonusaktion kannst du dir Vorteil bei deinem nächsten Angriffswurf in diesem Zug verschaffen, sofern du dich nicht bewegst; deine Bewegungsrate wird dabei auf 0 gesetzt.',
    'srd-2024_rogue_cunning-strike': 'Setzt du Meucheln ein, kannst du auf einen Teil des Bonusschadens verzichten, um einen zusätzlichen Effekt auszulösen (z. B. entwaffnen, betäuben, verunsichern).',

    'srd-2024_rogue_evasion': 'Wirst du einem Effekt ausgesetzt, der einen Geschicklichkeitsrettungswurf für halben Schaden erlaubt, erleidest du bei Erfolg keinen und bei Misserfolg nur halben Schaden.',
    'srd-2024_rogue_reliable-talent': 'Wirfst du eine Fähigkeitsprobe mit einer Fertigkeit, in der du geübt bist, gilt jedes W20-Ergebnis unter 10 als 10.',
    'srd-2024_rogue_devious-strikes': 'Setzt du Meucheln ein, stehen dir weitere, mächtigere Zusatzeffekte zur Verfügung.',
    'srd-2024_rogue_slippery-mind': 'Du hast Übung bei Weisheits- und Charismarettungswürfen.',
    'srd-2024_rogue_elusive': 'Angriffswürfe gegen dich haben keinen Vorteil mehr, solange du nicht Kampfunfähig bist.',
    'srd-2024_rogue_stroke-of-luck': 'Du kannst eine misslungene Fähigkeitsprobe oder einen misslungenen Angriffswurf stattdessen als Erfolg werten, bzw. bei einem gegnerischen Angriff automatisch verfehlen lassen. Nutzung wird nach einer kurzen oder langen Rast regeneriert.',
    'srd-2024_rogue_epic-boon': 'Du erhältst einen Epischen Feat deiner Wahl.',

  'srd-2024_sorcerer': {
    'srd-2024_sorcerer_spellcasting': 'Ein Ereignis in deinem Leben oder deiner Abstammung hat dir angeborene Magie verliehen. Charisma ist dein Zauberattribut. Ein arkaner Fokus dient dir als Zauberfokus, du kannst aber auch deine Zauberkomponenten selbst als Fokus verwenden.',
    'srd-2024_sorcerer_innate-sorcery': 'Als Bonusaktion kannst du dein angeborenes Magiepotenzial entfesseln: für 1 Minute hast du Vorteil bei Angriffswürfen von Zaubertricks und der Rettungswurf-SG deiner Zauber erhöht sich um 1.',
    'srd-2024_sorcerer_font-of-magic': 'Du erhältst Zaubermacht-Punkte, die du in Zauberplätze umwandeln kannst oder umgekehrt. Du regenerierst alle Punkte nach einer langen Rast.',
    'srd-2024_sorcerer_metamagic': 'Du erhältst die Fähigkeit, deine Zauber auf besondere Weise zu verändern. Du wählst Metamagie-Optionen (z. B. Verstärkter Zauber, Leiser Zauber), für die du Zaubermacht-Punkte ausgibst.',
    'srd-2024_sorcerer_sorcerous-restoration': 'Du erhältst nach einer kurzen Rast einen Teil deiner verbrauchten Zaubermacht-Punkte zurück.',
    'srd-2024_sorcerer_sorcery-incarnate': 'Du kannst Innate Sorcery ohne Beschränkung der Nutzungshäufigkeit einsetzen.',
    'srd-2024_sorcerer_epic-boon': 'Du erhältst einen Epischen Feat deiner Wahl.',
    'srd-2024_sorcerer_ability-score-improvement': 'Du erhältst den Feat Attributssteigerung oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst.'
  },
  'srd-2024_warlock': {
    'srd-2024_warlock_pact-magic': 'Durch einen Pakt mit einem übernatürlichen Wesen hast du gelernt, Zauber zu wirken. Charisma ist dein Zauberattribut. Deine Zauberplätze sind besonders: Sie regenerieren sich bereits nach einer kurzen Rast, und alle deine Zauberplätze wirken immer auf demselben, mit der Stufe steigenden Grad.',
    'srd-2024_warlock_eldritch-invocations': 'Du erlernst besondere, magische Fähigkeiten (Eldritch-Invokationen), die du bei bestimmten Stufenaufstiegen austauschen kannst.',
    'srd-2024_warlock_magical-cunning': 'Als Bonusaktion während einer kurzen Rast kannst du einen Teil deiner verbrauchten Zauberplätze zurückgewinnen.',
    'srd-2024_warlock_epic-boon': 'Du erhältst einen Epischen Feat deiner Wahl.',
    'srd-2024_warlock_ability-score-improvement': 'Du erhältst den Feat Attributssteigerung oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst.'
  },
  'srd-2024_wizard': {
    'srd-2024_wizard_spellcasting': 'Durch systematisches Studium hast du gelernt, Zauber zu wirken. Intelligenz ist dein Zauberattribut. Ein arkaner Fokus oder dein Zauberbuch dient dir als Zauberfokus.',

  let detail;
  if(e == null) detail = '';
  else if(e.code || e.message) detail = e.code ? (e.code + (e.message ? ': ' + e.message : '')) : e.message;

/* ============== Lokaler Speicher (echte Dateien via Electron) — ersetzt die
   Server-API ================================================================
   Desktop-App-Version: kein Server, kein Login, keine gemeinsame Datenbank.
   Gespeichert wird in echten JSON-Dateien in einem sichtbaren Ordner
   (siehe main.js: standardmaessig ~/Dokumente/Charakterkompendium), über die
   in preload.js gezielt freigegebene window.electronAPI — nicht direkt per
   Node/fs aus dieser Seite heraus (contextIsolation bleibt an).
   idbAll/idbGet/idbPut/idbDelete behalten bewusst denselben Namen/dieselbe
   Aufrufsignatur wie in der reinen Browser-Standalone-Version, damit der
   komplette Rest der App (apiFetch() und alles, was darauf aufbaut)
   unveraendert bleibt — nur DIESER Block hier weiss, wie der Speicher
   tatsaechlich funktioniert. */
function idbAll(store){ return window.electronAPI.storeAll(store); }
function idbGet(store, key){ return window.electronAPI.storeGet(store, key); }
function idbPut(store, obj){ return window.electronAPI.storePut(store, obj); }
function idbDelete(store, key){ return window.electronAPI.storeDelete(store, key); }

function newLocalId(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
}
function slugifyLocal(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'eintrag';
}
function customKeyLocal(name){ return 'custom_' + slugifyLocal(name) + '_' + Math.random().toString(16).slice(2,8); }
function apiError(message, code){ const e = new Error(message); if(code) e.code = code; return e; }

const CUSTOM_STORE_BY_KIND = { species:'customSpecies', backgrounds:'customBackgrounds', classes:'customClasses' };
const STATIC_LIST_BY_KIND = { species: STATIC_SPECIES, backgrounds: STATIC_BACKGROUNDS, classes: STATIC_CLASSES };
async function srdRowsLocal(kind){
  if(kind === 'spells') return STATIC_SPELLS;
  const custom = await idbAll(CUSTOM_STORE_BY_KIND[kind]);
  return [...STATIC_LIST_BY_KIND[kind], ...custom];
}
async function srdRowLocal(kind, key){
  return (await srdRowsLocal(kind)).find(x => x.key === key) || null;
}

function buildCustomSpeciesDataLocal(key, b){

    tremorsense: b.tremorsense || '', truesight: b.truesight || '',
    abilityBonuses: (b.abilityBonuses && typeof b.abilityBonuses === 'object') ? {

function buildCustomBackgroundDataLocal(key, b){
  const bonusMode = b.bonusMode === 'fixed' ? 'fixed' : 'choice';
  return {

function buildCustomClassDataLocal(key, b){
  const progression = ['none','full','half'].includes(b.casterProgression) ? b.casterProgression : 'none';
  const isCaster = progression !== 'none';
  const features = Array.isArray(b.features) ? b.features.map(f => ({
    key: key+'_'+slugifyLocal(f.name), name: f.name||'', desc: f.desc||'',
    levels: Array.isArray(f.levels) ? f.levels.map(Number).filter(n=>n>=1 && n<=20) : []
  })) : [];

    startingEquipment: b.startingEquipment||'',

async function apiFetch(url, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  const body = opts.body ? JSON.parse(opts.body) : null;
  let m;

  if(url === '/api/characters' && method==='GET') return idbAll('characters');
  if(url === '/api/characters' && method==='POST'){
    if(!body || !body.name || !String(body.name).trim()) throw apiError('name_required');
    const now = new Date().toISOString();
    const data = Object.assign({}, body); delete data.id; // eine evtl. mitgeschickte id nie uebernehmen
    const rec = Object.assign({ id:newLocalId() }, data, { createdAt:now, updatedAt:now });
    return idbPut('characters', rec);
  }
  if((m = url.match(/^\/api\/characters\/(.+)$/)) && method==='PUT'){
    const id = decodeURIComponent(m[1]);
    if(!body || !body.name || !String(body.name).trim()) throw apiError('name_required');
    const existing = await idbGet('characters', id);
    if(!existing) throw apiError('not_found');
    const rec = Object.assign({}, body, { id, updatedAt:new Date().toISOString() });
    return idbPut('characters', rec);
  }
  if((m = url.match(/^\/api\/characters\/(.+)$/)) && method==='DELETE'){
    await idbDelete('characters', decodeURIComponent(m[1]));
    return { ok:true };
  }

  if(url === '/api/srd/species' && method==='GET') return srdRowsLocal('species');
  if(url === '/api/srd/backgrounds' && method==='GET') return srdRowsLocal('backgrounds');
  if(url === '/api/srd/classes' && method==='GET') return srdRowsLocal('classes');
  if(url === '/api/srd/spells' && method==='GET') return srdRowsLocal('spells');

  for(const kind of ['species','backgrounds','classes']){
    const store = CUSTOM_STORE_BY_KIND[kind];
    const builder = kind==='species' ? buildCustomSpeciesDataLocal : kind==='backgrounds' ? buildCustomBackgroundDataLocal : buildCustomClassDataLocal;
    if(url === `/api/custom/${kind}` && method==='POST'){
      if(!body || !body.name || !String(body.name).trim()) throw apiError('name_required');
      const rec = builder(customKeyLocal(body.name), body);
      return idbPut(store, rec);
    }
    if((m = url.match(new RegExp(`^/api/custom/${kind}/(.+)$`))) && method==='PUT'){
      const key = decodeURIComponent(m[1]);
      if(!key.startsWith('custom_')) throw apiError('not_custom');
      if(!body || !body.name || !String(body.name).trim()) throw apiError('name_required');
      return idbPut(store, builder(key, body));
    }
    if((m = url.match(new RegExp(`^/api/custom/${kind}/(.+)$`))) && method==='DELETE'){
      const key = decodeURIComponent(m[1]);
      if(!key.startsWith('custom_')) throw apiError('not_custom');
      await idbDelete(store, key);
      return { ok:true };
    }
  }

  if(url === '/api/srd/build-level1' && method==='POST'){
    const [species, background, klass] = await Promise.all([
      srdRowLocal('species', body.speciesKey), srdRowLocal('backgrounds', body.backgroundKey), srdRowLocal('classes', body.classKey)
    ]);
    if(!species || !background || !klass) throw apiError('unknown_species_background_or_class');
    return buildLevel1({ species, background, klass, baseAbilities:body.baseAbilities, bgBonusChoice:body.bgBonusChoice, skillChoices:body.skillChoices });
  }
  if((m = url.match(/^\/api\/srd\/level-up\/(.+)$/)) && method==='POST'){
    const id = decodeURIComponent(m[1]);
    const character = await idbGet('characters', id);
    if(!character) throw apiError('not_found');
    if(!character.classKey) throw apiError('Dieser Charakter wurde nicht mit dem Assistenten erstellt und hat keine hinterlegte Klasse.', 'not_srd_character');
    const klass = await srdRowLocal('classes', character.classKey);
    if(!klass) throw apiError('class_not_cached');
    const lvl = Number(body.newLevel);
    if(!lvl || lvl<1 || lvl>20 || lvl <= (character.level||1)) throw apiError('invalid_level');
    const updated = levelUp(character, klass, lvl);
    return idbPut('characters', updated);
  }

  if(url === '/api/de-translations' && method==='GET'){
    return { species: DE_TRANSLATIONS_SPECIES, classes: DE_TRANSLATIONS_CLASSES };
  }
  if(url === '/api/logout') return { ok:true }; // kein Login im Standalone-Tool

  throw apiError('Unbekannter lokaler Endpunkt: '+method+' '+url);
}

/* ============== Charakterberechnung (aus lib/character-builder.js + lib/caster-progression.js) ==============
   1:1 uebernommene Logik, nur ohne require()/module.exports. Eigene Namen fuer
   oneLine/pipe (als *Srd), da es im Frontend bereits ein oneLine/pipeLine fuer
   den FoundryVTT-Import gibt — das kennt aber keine Markdown-Tabellen (kommen
   bei Foundrys bereits-HTML-Text nicht vor), die Open5e-Beschreibungstexte
   brauchen das hier aber. mod() existiert im Frontend schon identisch, wird
   hier bewusst nicht erneut deklariert. */
function profBonusForLevel(level){ return Math.floor((level-1)/4)+2; }
function stripMarkdownTableSrd(text){
  const lines = String(text||'').split('\n');
  const out = []; let i = 0;
  while(i < lines.length){
    if(/^\s*\|.*\|\s*$/.test(lines[i])){
      const rows = [];
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        const cells = lines[i].split('|').map(c=>c.trim()).filter(Boolean);
        if(!cells.every(c=>/^:?-+:?$/.test(c))) rows.push(cells.join(' – '));
        i++;
      }
      if(rows.length) out.push(rows.join('; '));
    } else { out.push(lines[i]); i++; }
  }
  return out.join('\n');
}
function stripMarkdownEmphasisSrd(text){
  return String(text||'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1');
}
function oneLineSrd(s){
  let text = String(s==null?'':s);
  text = stripMarkdownTableSrd(text);
  text = stripMarkdownEmphasisSrd(text);
  return text.replace(/\s*\n+\s*/g,' — ').replace(/[ \t]{2,}/g,' ').trim();
}
function pipeSrd(fields){ return fields.map(f=>oneLineSrd(f).replace(/\|/g,'/')).join('|'); }

function applyBackgroundBonus(baseAbilities, background, bonusChoice){
  const out = Object.assign({}, baseAbilities);
  if(background.bonusMode === 'fixed' && background.abilityBonuses){
    Object.keys(background.abilityBonuses).forEach(a => {
      const bonus = Number(background.abilityBonuses[a])||0;
      if(bonus) out[a] = (out[a]||0)+bonus;
    });
    return out;
  }
  if(!bonusChoice || bonusChoice.mode==='even'){
    (background.abilityChoices||[]).forEach(a => { out[a] = (out[a]||0)+1; });
  } else if(bonusChoice.mode==='2-1'){
    if(bonusChoice.plus2) out[bonusChoice.plus2] = (out[bonusChoice.plus2]||0)+2;
    if(bonusChoice.plus1) out[bonusChoice.plus1] = (out[bonusChoice.plus1]||0)+1;
  }
  return out;
}
function dieMax(hitDie){ const m = String(hitDie||'').match(/(\d+)/); return m ? Number(m[1]) : 8; }

function buildLevel1({ species, background, klass, baseAbilities, bgBonusChoice, skillChoices }){
  let abilities = applyBackgroundBonus(baseAbilities, background, bgBonusChoice);
  if(species.abilityBonuses){
    abilities = Object.assign({}, abilities);
    Object.keys(species.abilityBonuses).forEach(a => {
      const bonus = Number(species.abilityBonuses[a])||0;
      if(bonus) abilities[a] = (abilities[a]||0)+bonus;
    });
  }
  const profBonus = profBonusForLevel(1);
  const saveProf = {};
  ['str','dex','con','int','wis','cha'].forEach(a => { saveProf[a] = (klass.savingThrows||[]).includes(a); });
  const skillProf = {};
  const ALL_SKILLS = SKILLS.map(s=>s[0]);
  ALL_SKILLS.forEach(s => { skillProf[s] = 0; });
  (background.skillProficiencies||[]).forEach(code => { if(skillProf[code]!==undefined) skillProf[code]=1; });
  (species.skillsChecked||[]).forEach(code => { if(skillProf[code]!==undefined) skillProf[code]=1; });
  (skillChoices||[]).forEach(code => { if(skillProf[code]!==undefined) skillProf[code]=1; });

  const hpMax = dieMax(klass.hitDie) + mod(abilities.con);
  const featureLines = [];
  (species.traits||[]).forEach(t => featureLines.push(pipeSrd([t.name,'',t.desc,t.descDe||''])));
  if(background.feat) featureLines.push(pipeSrd([background.feat,'Herkunfts-Feat','']));
  (klass.features||[]).forEach(f => { if(f.levels.includes(1)) featureLines.push(pipeSrd([f.name,'',f.desc,f.descDe||''])); });

  const equipmentLines = [];
  if(background.equipmentText) equipmentLines.push(pipeSrd(['Hintergrund-Ausrüstung (Wahl): '+background.equipmentText,'']));
  if(klass.startingEquipment) equipmentLines.push(pipeSrd(['Start-Ausrüstung (Wahl): '+klass.startingEquipment,'']));

  const isCaster = !!klass.isCaster;
  const spellAbilityCode = klass.spellAbility;
  const slotsRaw = (klass.spellSlotsByLevel && klass.spellSlotsByLevel[1]) || [];
  const slots = Array.from({length:9},(_,i)=>slotsRaw[i]||0);

  const movementFields = { speed:species.speed||'', speedFly:species.speedFly||'', speedSwim:species.speedSwim||'', speedClimb:species.speedClimb||'', speedBurrow:species.speedBurrow||'' };
  const visionFields = { darkvision:species.darkvision||'', blindsight:species.blindsight||'', tremorsense:species.tremorsense||'', truesight:species.truesight||'' };

  return {
    name:'', subtitle:`${species.name} · ${klass.name} 1`, background:background.name, size:species.size,
    ...movementFields, ...visionFields, profBonus, untrainedBonus:0, abilities, saveProf, skillProf,
    ac: 10+mod(abilities.dex), initiative: mod(abilities.dex), hpCur:hpMax, hpMax, weaponsText:'',
    spellEnabled:isCaster, spellAbility: isCaster ? ABILITY_LABEL_DE[spellAbilityCode] : '',
    spellDc: isCaster ? 8+profBonus+mod(abilities[spellAbilityCode]) : 0,
    spellAttack: isCaster ? profBonus+mod(abilities[spellAbilityCode]) : 0,
    slots, spellsText:'', featuresText:featureLines.join('\n'), magicItemsText:'', equipmentText:equipmentLines.join('\n'),
    armorChecked:(klass.armorChecked||[]).slice(), weaponsChecked:(klass.weaponsChecked||[]).slice(),
    toolsChecked:[...(klass.toolsChecked||[]), ...(background.toolsChecked||[])],
    resistanceChecked:(species.resistanceChecked||[]).slice(), languagesChecked:(species.languagesChecked||[]).slice(),
    profArmor:klass.armorProficiencies||'', profWeapons:klass.weaponProficiencies||'',
    profTools:[klass.toolProficiencies, background.toolProficiency].filter(Boolean).join(', '),
    resistance:'', languages:'', notes:'',
    speciesKey:species.key, backgroundKey:background.key, classKey:klass.key, level:1
  };
}

function levelUp(character, klass, newLevel){
  const oldLevel = character.level||1;
  if(newLevel <= oldLevel) return character;
  const c = JSON.parse(JSON.stringify(character));
  const conMod = mod(c.abilities.con);
  const dMax = dieMax(klass.hitDie);
  const newFeatureLines = [];
  (klass.features||[]).forEach(f => {
    f.levels.forEach(l => { if(l>oldLevel && l<=newLevel) newFeatureLines.push(pipeSrd([f.name,'',f.desc,f.descDe||''])); });
  });
  if(SUBCLASS_LEVELS_DATA[klass.name.toLowerCase()] !== undefined){
    const subLevel = SUBCLASS_LEVELS_DATA[klass.name.toLowerCase()];
    if(subLevel>oldLevel && subLevel<=newLevel){
      newFeatureLines.push(pipeSrd([`${klass.name}-Unterklasse wählen`,'Subclass',`Ab dieser Stufe muss eine Unterklasse gewählt werden (im Datensatz nicht automatisch befüllt).`]));
    }
  }
  c.featuresText = [c.featuresText, ...newFeatureLines].filter(Boolean).join('\n');
  for(let lvl=oldLevel+1; lvl<=newLevel; lvl++){ c.hpMax += Math.floor(dMax/2)+1+conMod; }
  c.hpCur = c.hpMax;
  c.profBonus = profBonusForLevel(newLevel);
  if(c.spellEnabled){
    const abilityCode = Object.keys(ABILITY_LABEL_DE).find(k => ABILITY_LABEL_DE[k]===c.spellAbility);
    const aMod = mod(c.abilities[abilityCode]);
    c.spellDc = 8+c.profBonus+aMod;
    c.spellAttack = c.profBonus+aMod;
    const slotsRaw = (klass.spellSlotsByLevel && klass.spellSlotsByLevel[newLevel]) || [];
    c.slots = Array.from({length:9},(_,i)=>slotsRaw[i]||0);
  }
  c.subtitle = c.subtitle.replace(/\s\d+$/,'') + ' ' + newLevel;
  c.level = newLevel;
  return c;
}

function progressionTableLocal(type){
  const out = {};
  for(let lvl=1; lvl<=20; lvl++){
    if(type==='full') out[lvl]=FULL_CASTER_TABLE[lvl];
    else if(type==='half') out[lvl]=HALF_CASTER_TABLE[lvl];
    else out[lvl]=[0,0,0,0,0,0,0,0,0];
  }
  return out;
}
