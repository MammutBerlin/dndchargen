stellen und darauf verlässliche Antworten zu erhalten. Starker Wahrsagezauber zur Informationsbeschaffung."}, {"key": "srd-2024_commune-with-nature", "name": "Commune with Nature", "level": 5, "school": "divination", "classes": ["druid", "ranger"], "castingTime": "1 minute", "ritual": true, "range": "Self", "components": "V, S", "material": null, "duration": "1 minute", "concentration": false, "description": "You commune with nature spirits and gain knowledge of the surrounding area. In the outdoors, the spell gives you knowledge of the area within 3 miles of you. In caves and other natural underground settings, the radius is limited to 300 feet. The spell doesn't function where nature has been replaced by construction, such as in castles and settlements. \n\nChoose three of the following facts; you learn those facts as they pertain to the spell's area: \n\n- Locations of settlements \n\n- Locations of portals to other planes of existence \n\n- Location of one Challenge Rating 10+ creature (DM's choice) that is a Celestial, an Elemental, a Fey, a Fiend, or an Undead \n\n- The most prevalent kind of plant, mineral, or Beast (you choose which to learn) \n\n- Locations of bodies of water \n\nFor example, you could determine the location of a powerful monster in the area, the locations of bodies of water, and the locations of any towns.", "higherLevel": null, "gistDe": "Verschafft Wissen über die nähere Umgebung im Freien, etwa über Siedlungen, Gewässer oder gefährliche Kreaturen. Nützlicher Erkundungszauber in der Wildnis."}, {"key": "srd-2024_comprehend-languages", "name": "Comprehend Languages", "level": 1, "school": "divination", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": true, "range": "Self", "components": "V, S, M", "material": "a pinch of soot and salt", "duration": "1 hour", "concentration": false, "description": "For the duration, you understand the literal meaning of any language that you hear or see signed. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn't decode symbols or secret messages.", "higherLevel": null, "gistDe": "Ermöglicht es, jede gehörte, gesehene oder geschriebene Sprache sinngemäß zu verstehen (keine Geheimcodes). Praktischer Nützlichkeitszauber für Kommunikation und Recherche."}, {"key": "srd-2024_compulsion", "name": "Compulsion", "level": 4, "school": "enchantment", "classes": ["bard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Each creature of your choice that you can see within range must succeed on a Wisdom saving throw or have the Charmed condition until the spell ends. \n\nFor the duration, you can take a Bonus Action to designate a direction that is horizontal to you. Each Charmed target must use as much of its movement as possible to move in that direction on its next turn, taking the safest route. After moving in this way, a target repeats the save, ending the spell on itself on a success.", "higherLevel": null, "gistDe": "Zwingt bezauberte Kreaturen, sich in eine vom Zauberwirkenden vorgegebene Richtung zu bewegen. Kontrollzauber, um Gegner aus einer Formation oder in eine Falle zu treiben."}, {"key": "srd-2024_cone-of-cold", "name": "Cone of Cold", "level": 5, "school": "evocation", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self (60-foot cone)", "components": "V, S, M", "material": "a small crystal or glass cone", "duration": "Instantaneous", "concentration": false, "description": "You unleash a blast of cold air. Each creature in a 60-foot Cone originating from you makes a Constitution saving throw, taking 8d8 Cold damage on a failed save or half as much damage on a successful one. A creature killed by this spell becomes a frozen statue until it thaws.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 5.", "gistDe": "Erzeugt einen großen Kältekegel, der mehrere Kreaturen mit hohem Kälteschaden trifft; getötete Kreaturen erstarren zu Eisstatuen. Starker klassischer Flächenschadenszauber."}, {"key": "srd-2024_confusion", "name": "Confusion", "level": 4, "school": "enchantment", "classes": ["bard", "druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "90 feet", "components": "V, S, M", "material": "three nut shells", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Each creature in a 10-foot-radius Sphere centered on a point you choose within range must succeed on a Wisdom saving throw, or that target can't take Bonus Actions or Reactions and must roll 1d10 at the start of each of its turns to determine its behavior for that turn, consulting the table below. \n\n| **1d10** | **Behavior for the Turn**                                                                                                                                                      |\n| -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| 1        | The target doesn't take an action, and it uses all its movement to move. Roll 1d4 for the direction: 1, north; 2, east; 3, south; or 4, west.                                  |\n| 2-6      | The target doesn't move or take actions.                                                                                                                                       |\n| 7-8      | The target doesn't move, and it takes the Attack action to make one melee attack against a random creature within reach. If none are within reach, the target takes no action. |\n| 9-10     | The target chooses its behavior.                                                                                                                                               |\n\nAt the end of each of its turns, an affected target repeats the save, ending the spell on itself on a success.", "higherLevel": "**Using a Higher-Level Spell Slot.** The Sphere's radius increases by 5 feet for each spell slot level above 4.", "gistDe": "Versetzt Kreaturen in einem Bereich in Verwirrung, sodass sie jede Runde zufällig handeln (etwa wahllos angreifen oder umherirren). Starker Kontrollzauber gegen mehrere Gegner."}, {"key": "srd-2024_conjure-animals", "name": "Conjure Animals", "level": 3, "school": "conjuration", "classes": ["druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You conjure nature spirits that appear as a Large pack of spectral, intangible animals in an unoccupied space you can see within range. The pack lasts for the duration, and you choose the spirits' animal form, such as wolves, serpents, or birds. \n\nYou have Advantage on Strength saving throws while you're within 5 feet of the pack, and when you move on your turn, you can also move the pack up to 30 feet to an unoccupied space you can see. Whenever the pack moves within 10 feet of a creature you can see and whenever a creature you can see enters a space within 10 feet of the pack or ends its turn there, you can force that creature to make a Dexterity saving throw. On a failed save, the creature takes 3d10 Slashing damage. A creature makes this save only once per turn.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d10 for each spell slot level above 3.", "gistDe": "Beschwört ein Rudel geisterhafter Tiere, das mitkämpft und Gegner in seiner Nähe mit Schneidenschaden verletzt. Guter Zauber zur Verstärkung der eigenen Seite durch Beschwörung."}, {"key": "srd-2024_conjure-celestial", "name": "Conjure Celestial", "level": 7, "school": "conjuration", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "90 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You conjure a spirit from the Upper Planes, which manifests as a pillar of light in a 10-foot-radius, 40-foot-high Cylinder centered on a point within range. For each creature you can see in the Cylinder, choose which of these lights shines on it: \n\n**Healing Light.** The target regains Hit Points equal to 4d12 plus your spellcasting ability modifier.\n\n**Searing Light.** The target makes a Dexterity saving throw, taking 6d12 Radiant damage on a failed save or half as much damage on a successful one. \n\nUntil the spell ends, Bright Light fills the Cylinder, and when you move on your turn, you can also move the Cylinder up to 30 feet.\n\nWhenever the Cylinder moves into the space of a creature you can see and whenever a creature you can see enters the Cylinder or ends its turn there, you can bathe it in one of the lights. A creature can be affected by this spell only once per turn.", "higherLevel": "**Using a Higher-Level Spell Slot.** The healing and damage increase by 1d12 for each spell slot level above 7.", "gistDe": "Beschwört einen himmlischen Geist als Lichtsäule, die Kreaturen darin wahlweise heilt oder mit Strahlungsschaden verletzt. Vielseitiger und starker Zauber für Heilung oder Schaden auf hoher Stufe."}, {"key": "srd-2024_conjure-elemental", "name": "Conjure Elemental", "level": 5, "school": "conjuration", "classes": ["druid", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You conjure a Large, intangible spirit from the Elemental Planes that appears in an unoccupied space within range. Choose the spirit's element, which determines its damage type: air (Lightning), earth (Thunder), fire (Fire), or water (Cold). The spirit lasts for the duration. \n\nWhenever a creature you can see enters the spirit's space or starts its turn within 5 feet of the spirit, you can force that creature to make a Dexterity saving throw if the spirit has no creature Restrained. On failed save, the target takes 8d8 damage of the spirit's type, and the target has the Restrained condition until the spell ends. At the start of each of its turns, the Restrained target repeats the save. On a failed save, the target takes 4d8 damage of the spirit's type. On a successful save, the target isn't Restrained by the spirit.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 5.", "gistDe": "Beschwört einen elementaren Geist (Luft, Erde, Feuer oder Wasser), der Gegner in seiner Nähe mit hohem Elementarschaden trifft und festhalten kann. Starker Beschwörungs- und Kontrollzauber."}, {"key": "srd-2024_conjure-fey", "name": "Conjure Fey", "level": 6, "school": "conjuration", "classes": ["druid"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You conjure a Medium spirit from the Feywild in an unoccupied space you can see within range. The spirit lasts for the duration, and it looks like a Fey creature of your choice. When the spirit appears, you can make one melee spell attack against a creature within 5 feet of it. On a hit, the target takes Psychic damage equal to 3d12 plus your spellcasting ability modifier, and the target has the Frightened condition until the start of your next turn, with both you and the spirit as the source of the fear. \n\nAs a Bonus Action on your later turns, you can teleport the spirit to an unoccupied space you can see within 30 feet of the space it left and make the attack against a creature within 5 feet of it.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d12 for each spell slot level above 6.", "gistDe": "Beschwört einen Feengeist, der Gegner mit psychischem Schaden angreift und in Furcht versetzt und sich danach frei bewegen und erneut angreifen lässt. Starker beweglicher Angriffszauber."}, {"key": "srd-2024_conjure-minor-elementals", "name": "Conjure Minor Elementals", "level": 4, "school": "conjuration", "classes": ["druid", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self (15-foot emanation)", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You conjure spirits from the Elemental Planes that flit around you in a 15-foot Emanation for the duration. Until the spell ends, any attack you make deals an extra 2d8 damage when you hit a creature in the Emanation. This damage is Acid, Cold, Fire, or Lightning (your choice when you make the attack). In addition, the ground in the Emanation is Difficult Terrain for your enemies.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 4.", "gistDe": "Umgibt den Zauberwirkenden mit kleinen Elementargeistern, die eigene Angriffe um zusätzlichen Elementarschaden verstärken und den Boden für Gegner zu schwierigem Gelände machen. Guter Buff für kämpfende Zauberwirkende."}, {"key": "srd-2024_conjure-woodland-beings", "name": "Conjure Woodland Beings", "level": 4, "school": "conjuration", "classes": ["druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "Self (10-foot emanation)", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You conjure nature spirits that flit around you in a 10-foot Emanation for the duration. Whenever the Emanation enters the space of a creature you can see and whenever a creature you can see enters the Emanation or ends its turn there, you can force that creature to make a Wisdom saving throw. The creature takes 5d8 Force damage on a failed save or half as much damage on a successful one. A creature makes this save only once per turn. In addition, you can take the Disengage action as a Bonus Action for the spell's duration.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 4.", "gistDe": "Umgibt den Zauberwirkenden mit Naturgeistern, die nahestehende Gegner mit Kraftschaden verletzen, und erlaubt es, sich ohne Gelegenheitsangriffe zurückzuziehen. Guter defensiver Flächenschadenszauber."}, {"key": "srd-2024_contact-other-plane", "name": "Contact Other Plane", "level": 5, "school": "divination", "classes": ["warlock", "wizard"], "castingTime": "1 minute", "ritual": true, "range": "Self", "components": "V", "material": null, "duration": "1 minute", "concentration": false, "description": "You mentally contact a demigod, the spirit of a long-dead sage, or some other knowledgeable entity from another plane. Contacting this otherworldly intelligence can break your mind. When you cast this spell, make a DC 15 Intelligence saving throw. On a successful save, you can ask the entity up to five questions. You must ask your questions before the spell ends. The DM answers each question with one word, such as \"yes,\" \"no,\" \"maybe,\" \"never,\" \"irrelevant,\" or \"unclear\" (if the entity doesn't know the answer to the question). If a one-word answer would be misleading, the DM might instead offer a short phrase as an answer. On a failed save, you take 6d6 Psychic damage and have the Incapacitated condition until you finish a Long Rest. A Greater Restoration spell cast on you ends this effect.", "higherLevel": null, "gistDe": "Kontaktiert eine überirdische Intelligenz und darf ihr bis zu fünf knappe Ja/Nein-Fragen stellen; scheitert die Probe, erleidet man psychischen Schaden und wird handlungsunfähig."}, {"key": "srd-2024_contagion", "name": "Contagion", "level": 5, "school": "necromancy", "classes": ["cleric", "druid"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "7 days", "concentration": false, "description": "Your touch inflicts a magical contagion. The target must succeed on a Constitution saving throw or take 11d8 Necrotic damage and have the Poisoned condition. Also, choose one ability when you cast the spell. While Poisoned, the target has Disadvantage on saving throws made with the chosen ability. The target must repeat the saving throw at the end of each of its turns until it gets three successes or failures. If the target succeeds on three of these saves, the spell ends on the target. If the target fails three of the saves, the spell lasts for 7 days on it. Whenever the Poisoned target receives an effect that would end the Poisoned condition, the target must succeed on a Constitution saving throw, or the Poisoned condition doesn't end on it.", "higherLevel": null, "gistDe": "Berührungszauber, der ein Ziel schwer vergiftet und stark schädigt; hält es lange fest und schwächt eine gewählte Fähigkeit, solange die Vergiftung anhält."}, {"key": "srd-2024_contingency", "name": "Contingency", "level": 6, "school": "abjuration", "classes": ["wizard"], "castingTime": "10 minutes", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a gem-encrusted statuette of yourself worth 1,500+ GP", "duration": "10 days", "concentration": false, "description": "Choose a spell of level 5 or lower that you can cast, that has a casting time of an action, and that can target you. You cast that spell—called the contingent spell—as part of casting Contingency, expending spell slots for both, but the contingent spell doesn't come into effect. Instead, it takes effect when a certain trigger occurs. You describe that trigger when you cast the two spells. For example, a Contingency cast with Water Breathing might stipulate that Water Breathing comes into effect when you are engulfed in water or a similar liquid. \n\nThe contingent spell takes effect immediately after the trigger occurs for the first time, whether or not you want it to, and then Contingency ends. \n\nThe contingent spell takes effect only on you, even if it can normally target others. You can use only one Contingency spell at a time. If you cast this spell again, the effect of another Contingency spell on you ends. Also, Contingency ends on you if its material component is ever not on your person.", "higherLevel": null, "gistDe": "Legt einen zweiten Zauber „auf Vorrat“, der automatisch nur am eigenen Körper ausgelöst wird, sobald eine vorher festgelegte Bedingung eintritt."}, {"key": "srd-2024_continual-flame", "name": "Continual Flame", "level": 2, "school": "evocation", "classes": ["cleric", "druid", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "ruby dust worth 50+ GP, which the spell consumes", "duration": "Until dispelled", "concentration": false, "description": "A flame springs from an object that you touch. The effect casts Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. It looks like a regular flame, but it creates no heat and consumes no fuel. The flame can be covered or hidden but not smothered or quenched.", "higherLevel": null, "gistDe": "Erzeugt an einem berührten Gegenstand eine dauerhafte, hitzelose Lichtquelle."}, {"key": "srd-2024_control-water", "name": "Control Water", "level": 4, "school": "transmutation", "classes": ["cleric", "druid", "wizard"], "castingTime": "1 action", "ritual": false, "range": "300 feet", "components": "V, S, M", "material": "a mixture of water and dust", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "Until the spell ends, you control any water inside an area you choose that is a Cube up to 100 feet on a side, using one of the following effects. As a Magic action on your later turns, you can repeat the same effect or choose a different one. \n\n**Flood.** You cause the water level of all standing water in the area to rise by as much as 20 feet. If you choose an area in a large body of water, you instead create a 20-foot tall wave that travels from one side of the area to the other and then crashes. Any Huge or smaller vehicles in the wave's path are carried with it to the other side. Any Huge or smaller vehicles struck by the wave have a 25 percent chance of capsizing. The water level remains elevated until the spell ends or you choose a different effect. If this effect produced a wave, the wave repeats on the start of your next turn while the flood effect lasts. \n\n**Part Water.** You part water in the area and create a trench. The trench extends across the spell's area, and the separated water forms a wall to either side. The trench remains until the spell ends or you choose a different effect. The water then slowly fills in the trench over the course of the next round until the normal water level is restored. \n\n**Redirect Flow.** You cause flowing water in the area to move in a direction you choose, even if the water has to flow over obstacles, up walls, or in other unlikely directions. The water in the area moves as you direct it, but once it moves beyond the spell's area, it resumes its flow based on the terrain. The water continues to move in the direction you chose until the spell ends or you choose a different effect. \n\n**Whirlpool.** You cause a whirlpool to form in the center of the area, which must be at least 50 feet square and 25 feet deep. The whirlpool lasts until you choose a different effect or the spell ends. The whirlpool is 5 feet wide at the base, up to 50 feet wide at the top, and 25 feet tall. Any creature in the water and within 25 feet of the whirlpool is pulled 10 feet toward it. When a creature enters the whirlpool for the first time on a turn or ends its turn there, it makes a Strength saving throw. On a failed save, the creature takes 2d8 Bludgeoning damage. On a successful save, the creature takes half as much damage. A creature can swim away from the whirlpool only if it first takes an action to pull away and succeeds on a Strength (Athletics) check against your spell save DC.", "higherLevel": null, "gistDe": "Erlaubt es, große Wassermengen in einem Bereich zu manipulieren: fluten, teilen, umlenken oder einen Strudel erzeugen."}, {"key": "srd-2024_control-weather", "name": "Control Weather", "level": 8, "school": "transmutation", "classes": ["cleric", "druid", "wizard"], "castingTime": "10 minutes", "ritual": false, "range": "Self (5-miles sphere)", "components": "V, S, M", "material": "burning incense", "duration": "Concentration, up to 8 hours", "concentration": true, "description": "You take control of the weather within 5 miles of you for the duration. You must be outdoors to cast this spell, and it ends early if you go indoors. When you cast the spell, you change the current weather conditions, which are determined by the DM. You can change precipitation, temperature, and wind. It takes 1d4 × 10 minutes for the new conditions to take effect. Once they do so, you can change the conditions again. When the spell ends, the weather gradually returns to normal. When you change the weather conditions, find a current condition on the following tables and change its stage by one, up or down. When changing the wind, you can change its direction. \n\n**Precipitation** \n\nStage Condition \n\n1 Clear \n\n2 Light clouds \n\n3 Overcast or ground fog \n\n4 Rain, hail, or snow \n\n5 Torrential rain, driving hail, or blizzard \n\n**Temperature** \n\nStage Condition \n\n1 Heat wave \n\n2 Hot \n\n3 Warm \n\n4 Cool \n\n5 Cold \n\n6 Freezing \n\n**Wind** \n\nStage Condition \n\n1 Calm \n\n2 Moderate wind \n\n3 Strong wind \n\n4 Gale \n\n5 Storm.", "higherLevel": null, "gistDe": "Verändert über die Zauberdauer schrittweise das Wetter in einem großen Umkreis (Niederschlag, Temperatur, Wind)."}, {"key": "srd-2024_counterspell", "name": "Counterspell", "level": 3, "school": "abjuration", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 reaction, which you take when you see a creature within 60 feet of yourself casting a spell with Verbal, Somatic, or Material components", "ritual": false, "range": "60 feet", "components": "S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You attempt to interrupt a creature in the process of casting a spell. The creature must make a Constitution saving throw. On a failed save, the spell dissipates with no effect, and the action, Bonus Action, or Reaction used to cast it is wasted. If that spell was cast with a spell slot, the slot isn't expended.", "higherLevel": null, "gistDe": "Unterbricht einen gegnerischen Zauber im Wirken und macht ihn wirkungslos."}, {"key": "srd-2024_create-food-and-water", "name": "Create Food and Water", "level": 3, "school": "conjuration", "classes": ["cleric", "paladin"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You create 45 pounds of food and 30 gallons of fresh water on the ground or in containers within range—both useful in fending off the hazards of malnutrition and dehydration. The food is bland but nourishing and looks like a food of your choice, and the water is clean. The food spoils after 24 hours if uneaten.", "higherLevel": null, "gistDe": "Erzeugt Nahrung und Wasser für eine Gruppe, praktisch gegen Hunger und Durst auf Reisen."}, {"key": "srd-2024_create-or-destroy-water", "name": "Create or Destroy Water", "level": 1, "school": "transmutation", "classes": ["cleric", "druid"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a mix of water and sand", "duration": "Instantaneous", "concentration": false, "description": "You do one of the following: Create Water. You create up to 10 gallons of clean water within range in an open container. Alternatively, the water falls as rain in a 30-foot Cube within range, extinguishing exposed flames there. Destroy Water. You destroy up to 10 gallons of water in an open container within range. Alternatively, you destroy fog in a 30-foot Cube within range.", "higherLevel": "**Using a Higher-Level Spell Slot.** You create or destroy 10 additional gallons of water, or the size of the Cube increases by 5 feet, for each spell slot level above 1.", "gistDe": "Erschafft oder vernichtet eine bestimmte Menge Wasser beziehungsweise löscht Feuer oder vertreibt Nebel."}, {"key": "srd-2024_create-undead", "name": "Create Undead", "level": 6, "school": "necromancy", "classes": ["cleric", "warlock", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "10 feet", "components": "V, S, M", "material": "one 150+ GP black onyx stone for each corpse", "duration": "Instantaneous", "concentration": false, "description": "You can cast this spell only at night. Choose up to three corpses of Medium or Small Humanoids within range. Each one becomes a Ghoul under your control. As a Bonus Action on each of your turns, you can mentally command any creature you animated with this spell if the creature is within 120 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to them). You decide what action the creature will take and where it will move on its next turn, or you can issue a general command, such as to guard a particular place. If you issue no commands, the creature takes the Dodge action and moves only to avoid harm. Once given an order, the creature continues to follow the order until its task is complete. \n\nThe creature is under your control for 24 hours, after which it stops obeying any command you've given it. To maintain control of the creature for another 24 hours, you must cast this spell on the creature before the current 24-hour period ends. This use of the spell reasserts your control over up to three creatures you have animated with this spell rather than animating new ones.", "higherLevel": "**Using a Higher-Level Spell Slot.** If you use a level 7 spell slot, you can animate or reassert control over four Ghouls. If you use a level 8 spell slot, you can animate or reassert control over five Ghouls or two Ghasts or Wights. If you use a level 9 spell slot, you can animate or reassert control over six Ghouls, three Ghasts or Wights, or two Mummies. See the Monster Manual for these stat blocks.", "gistDe": "Erweckt bis zu drei Leichen zu gehorsamen Ghulen, die man per Befehl steuern kann."}, {"key": "srd-2024_creation", "name": "Creation", "level": 5, "school": "illusion", "classes": ["sorcerer", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a paintbrush", "duration": "Special", "concentration": false, "description": "You pull wisps of shadow material from the Shadowfell to create an object within range. It is either an object of vegetable matter (soft goods, rope, wood, and the like) or mineral matter (stone, crystal, metal, and the like). The object must be no larger than a 5-foot Cube, and the object must be of a form and material that you have seen. \n\nThe spell's duration depends on the object's material, as shown in the Materials table. If the object is composed of multiple materials, use the shortest duration. Using any object created by this spell as another spell's Material component causes the other spell to fail.\n\n| Material              | Duration   |\n|-----------------------|------------|\n| Vegetable matter | 24 hours |\n| Stone or crystal | 12 hours |\n| Precious metals | 1 hour |\n| Gems | 10 minutes |\n| Adamantine or mithral | 1 minute. |\n|                       |            |\n\n ", "higherLevel": "**Using a Higher-Level Spell Slot.** The Cube increases by 5 feet for each spell slot level above 5.", "gistDe": "Formt aus Schattenmaterie ein Objekt aus Stoff, Holz oder Mineral, das je nach Material nach einiger Zeit wieder vergeht."}, {"key": "srd-2024_cure-wounds", "name": "Cure Wounds", "level": 1, "school": "abjuration", "classes": ["bard", "cleric", "druid", "paladin", "ranger"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "A creature you touch regains a number of Hit Points equal to 2d8 plus your spellcasting ability modifier.", "higherLevel": "**Using a Higher-Level Spell Slot.** The healing increases by 2d8 for each spell slot level above 1.", "gistDe": "Heilt eine berührte Kreatur um einen mittleren Betrag an Trefferpunkten."}, {"key": "srd-2024_dancing-lights", "name": "Dancing Lights", "level": 0, "school": "illusion", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a bit of phosphorus", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You create up to four torch-size lights within range, making them appear as torches, lanterns, or glowing orbs that hover for the duration. Alternatively, you combine the four lights into one glowing Medium form that is vaguely humanlike. Whichever form you choose, each light sheds Dim Light in a 10-foot radius. \n\nAs a Bonus Action, you can move the lights up to 60 feet to a space within range. A light must be within 20 feet of another light created by this spell, and a light vanishes if it exceeds the spell's range.", "higherLevel": null, "gistDe": "Erzeugt bis zu vier schwebende, steuerbare Lichter (oder eine humanoide Lichtgestalt) zur Beleuchtung oder Ablenkung."}, {"key": "srd-2024_darkness", "name": "Darkness", "level": 2, "school": "evocation", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, M", "material": "bat fur and a piece of coal", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "For the duration, magical Darkness spreads from a point within range and fills a 15-foot-radius Sphere. Darkvision can't see through it, and nonmagical light can't illuminate it. \n\nAlternatively, you cast the spell on an object that isn't being worn or carried, causing the Darkness to fill a 15-foot Emanation originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the Darkness.\n\nIf any of this spell's area overlaps with an area of Bright Light or Dim Light created by a spell of level 2 or lower, that other spell is dispelled.", "higherLevel": null, "gistDe": "Erzeugt eine Kugel absoluter, selbst mit Dunkelsicht undurchdringlicher Finsternis."}, {"key": "srd-2024_darkvision", "name": "Darkvision", "level": 2, "school": "transmutation", "classes": ["druid", "ranger", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a dried carrot", "duration": "8 hours", "concentration": false, "description": "For the duration, a willing creature you touch has Darkvision with a range of 150 feet.", "higherLevel": null, "gistDe": "Verleiht einer berührten Kreatur die Fähigkeit, auch im Dunkeln zu sehen."}, {"key": "srd-2024_daylight", "name": "Daylight", "level": 3, "school": "evocation", "classes": ["cleric", "druid", "paladin", "ranger", "sorcerer"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "1 hour", "concentration": false, "description": "For the duration, sunlight spreads from a point within range and fills a 60-foot-radius Sphere. The sunlight's area is Bright Light and sheds Dim Light for an additional 60 feet. \n\nAlternatively, you cast the spell on an object that isn't being worn or carried, causing the sunlight to fill a 60-foot Emanation originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the sunlight. \n\nIf any of this spell's area overlaps with an area of Darkness created by a spell of level 3 or lower, that other spell is dispelled.", "higherLevel": null, "gistDe": "Erzeugt eine große Kugel aus echtem Sonnenlicht, die auch magische Dunkelheit niedrigerer Stufe aufhebt."}, {"key": "srd-2024_death-ward", "name": "Death Ward", "level": 4, "school": "abjuration", "classes": ["cleric", "paladin"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "8 hours", "concentration": false, "description": "You touch a creature and grant it a measure of protection from death. The first time the target would drop to 0 Hit Points before the spell ends, the target instead drops to 1 Hit Point, and the spell ends. \n\nIf the spell is still in effect when the target is subjected to an effect that would kill it instantly without dealing damage, that effect is negated against the target, and the spell ends.", "higherLevel": null, "gistDe": "Bewahrt eine berührte Kreatur einmalig davor, tödlich zu sterben; sie bleibt stattdessen bei 1 Trefferpunkt stehen."}, {"key": "srd-2024_delayed-blast-fireball", "name": "Delayed Blast Fireball", "level": 7, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "150 feet", "components": "V, S, M", "material": "a ball of bat guano and sulfur", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "A beam of yellow light flashes from you, then condenses at a chosen point within range as a glowing bead for the duration. When the spell ends, the bead explodes, and each creature in a 20- foot-radius Sphere centered on that point makes a Dexterity saving throw. A creature takes Fire damage equal to the total accumulated damage on a failed save or half as much damage on a successful one. \n\nThe spell's base damage is 12d6, and the damage increases by 1d6 whenever your turn ends and the spell hasn't ended. If a creature touches the glowing bead before the spell ends, that creature makes a Dexterity saving throw. On a failed save, the spell ends, causing the bead to explode. \n\nOn a successful save, the creature can throw the bead up to 40 feet. If the thrown bead enters a creature's space or collides with a solid object, the spell ends, and the bead explodes. \n\nWhen the bead explodes, flammable objects in the explosion that aren't being worn or carried start burning.", "higherLevel": "**Using a Higher-Level Spell Slot.** The base damage increases by 1d6 for each spell slot level above 7.", "gistDe": "Erschafft eine schwebende Feuerkugel, die mit der Zeit stärker wird und beim Explodieren einen großen Bereich mit Feuerschaden trifft."}, {"key": "srd-2024_demiplane", "name": "Demiplane", "level": 8, "school": "conjuration", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "S", "material": null, "duration": "1 hour", "concentration": false, "description": "You create a shadowy Medium door on a flat solid surface that you can see within range. This door can be opened and closed, and it leads to a demiplane that is an empty room 30 feet in each dimension, made of wood or stone (your choice). \n\nWhen the spell ends, the door vanishes, and any objects inside the demiplane remain there. Any creatures inside also remain unless they opt to be shunted through the door as it vanishes, landing with the Prone condition in the unoccupied spaces closest to the door's former space. \n\nEach time you cast this spell, you can create a new demiplane or connect the shadowy door to a demiplane you created with a previous casting of this spell. Additionally, if you know the nature and contents of a demiplane created by a casting of this spell by another creature, you can connect the shadowy door to that demiplane instead.", "higherLevel": null, "gistDe": "Erschafft eine Tür zu einem leeren, abgeschlossenen Raum auf einer eigenen kleinen Zwischenebene, nützlich als Versteck oder Lager."}, {"key": "srd-2024_detect-evil-and-good", "name": "Detect Evil and Good", "level": 1, "school": "divination", "classes": ["cleric", "paladin"], "castingTime": "1 action", "ritual": false, "range": "Self (30-foot sphere)", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "For the duration, you sense the location of any Aberration, Celestial, Elemental, Fey, Fiend, or Undead within 30 feet of yourself. You also sense whether the Hallow spell is active there and, if so, where. \n\nThe spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.", "higherLevel": null, "gistDe": "Spürt in der Nähe befindliche übernatürliche Kreaturentypen auf, etwa Untote, Dämonen oder Engel."}, {"key": "srd-2024_detect-magic", "name": "Detect Magic", "level": 1, "school": "divination", "classes": ["bard", "cleric", "druid", "paladin", "ranger", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": true, "range": "Self (30-foot sphere)", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "For the duration, you sense the presence of magical effects within 30 feet of yourself. If you sense such effects, you can take the Magic action to see a faint aura around any visible creature or object in the area that bears the magic, and if an effect was created by a spell, you learn the spell's school of magic.\n\nThe spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.", "higherLevel": null, "gistDe": "Macht magische Auren an Kreaturen und Gegenständen in der Nähe sichtbar."}, {"key": "srd-2024_detect-poison-and-disease", "name": "Detect Poison and Disease", "level": 1, "school": "divination", "classes": ["cleric", "druid", "paladin", "ranger"], "castingTime": "1 action", "ritual": true, "range": "Self (30-foot sphere)", "components": "V, S, M", "material": "a yew leaf", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "For the duration, you sense the location of poisons, poisonous or venomous creatures, and magical contagions within 30 feet of yourself. You sense the kind of poison, creature, or contagion in each case. \n\nThe spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.", "higherLevel": null, "gistDe": "Spürt Gifte, giftige Kreaturen und Krankheiten in der Nähe auf."}, {"key": "srd-2024_detect-thoughts", "name": "Detect Thoughts", "level": 2, "school": "divination", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "1 Copper Piece", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You activate one of the effects below. Until the spell ends, you can activate either effect as a Magic action on your later turns. \n\n**Sense Thoughts.** You sense the presence of thoughts within 30 feet of yourself that belong to creatures that know languages or are telepathic. You don't read the thoughts, but you know that a thinking creature is present. \n\nThe spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead. \n\n**Read Thoughts.** Target one creature you can see within 30 feet of yourself or one creature within 30 feet of yourself that you detected with the Sense Thoughts option. You learn what is most on the target's mind right now. If the target doesn't know any languages and isn't telepathic, you learn nothing. \n\nAs a Magic action on your next turn, you can try to probe deeper into the target's mind. If you probe deeper, the target makes a Wisdom saving throw. On a failed save, you discern the target's reasoning, emotions, and something that looms large in its mind (such as a worry, love, or hate). On a successful save, the spell ends. Either way, the target knows that you are probing into its mind, and until you shift your attention away from the target's mind, the target can take an action on its turn to make an Intelligence (Arcana) check against your spell save DC, ending the spell on a success.", "higherLevel": null, "gistDe": "Erlaubt es, Gedanken in der Nähe wahrzunehmen und bei einem einzelnen Ziel gezielt zu lesen."}, {"key": "srd-2024_dimension-door", "name": "Dimension Door", "level": 4, "school": "conjuration", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "500 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You teleport to a location within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe by stating distance and direction, such as \"200 feet straight downward\" or \"300 feet upward to the northwest at a 45-degree angle.\" \n\nYou can also teleport one willing creature. The creature must be within 5 feet of you when you teleport, and it teleports to a space within 5 feet of your destination space. \n\nIf you, the other creature, or both would arrive in a space occupied by a creature or completely filled by one or more objects, you and any creature traveling with you each take 4d6 Force damage, and the teleportation fails.", "higherLevel": null, "gistDe": "Teleportiert den Wirkenden, optional mit einer weiteren Person, sofort an einen gewünschten Ort in Reichweite."}, {"key": "srd-2024_disguise-self", "name": "Disguise Self", "level": 1, "school": "illusion", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "1 hour", "concentration": false, "description": "You make yourself—including your clothing, armor, weapons, and other belongings on your person—look different until the spell ends. You can seem 1 foot shorter or taller and can appear heavier or lighter. You must adopt a form that has the same basic arrangement of limbs as you have. Otherwise, the extent of the illusion is up to you. \n\nThe changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to your outfit, objects pass through the hat, and anyone who touches it would feel nothing. \n\nTo discern that you are disguised, a creature must take the Study action to inspect your appearance and succeed on an Intelligence (Investigation) check against your spell save DC.", "higherLevel": null, "gistDe": "Verändert das eigene Aussehen illusorisch, hält aber einer genauen körperlichen Prüfung nicht stand."}, {"key": "srd-2024_disintegrate", "name": "Disintegrate", "level": 6, "school": "transmutation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a lodestone and dust", "duration": "Instantaneous", "concentration": false, "description": "You launch a green ray at a target you can see within range. The target can be a creature, a nonmagical object, or a creation of magical force, such as the wall created by Wall of Force. \n\nA creature targeted by this spell makes a Dexterity saving throw. On a failed save, the target takes 10d6 + 40 Force damage. If this damage reduces it to 0 Hit Points, it and everything nonmagical it is wearing and carrying are disintegrated into gray dust. The target can be revived only by a True Resurrection or a Wish spell. \n\nThis spell automatically disintegrates a Large or smaller nonmagical object or a creation of magical force. If such a target is Huge or larger, this spell disintegrates a 10-foot-Cube portion of it.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 3d6 for each spell slot level above 6.", "gistDe": "Feuert einen Strahl ab, der massiven Schaden verursacht und ein besiegtes Ziel vollständig zu Staub zerfallen lässt."}, {"key": "srd-2024_dispel-evil-and-good", "name": "Dispel Evil and Good", "level": 5, "school": "abjuration", "classes": ["cleric", "paladin"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "powdered silver and iron", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "For the duration, Celestials, Elementals, Fey, Fiends, and Undead have Disadvantage on attack rolls against you. You can end the spell early by using either of the following special functions. \n\n**Break Enchantment.** As a Magic action, you touch a creature that is possessed by or has the Charmed or Frightened condition from one or more creatures of the types above. The target is no longer possessed, Charmed, or Frightened by such creatures. \n\n**Dismissal.** As a Magic action, you target one creature you can see within 5 feet of you that has one of the creature types above. The target must succeed on a Charisma saving throw or be sent back to its home plane if it isn't there already. If they aren't on their home plane, Undead are sent to the Shadowfell, and Fey are sent to the Feywild.", "higherLevel": null, "gistDe": "Schützt vor bestimmten übernatürlichen Kreaturentypen und kann Besessenheit, Furcht oder Bezauberung durch sie aufheben oder solche Kreaturen zurück auf ihre Heimatebene verbannen."}, {"key": "srd-2024_dispel-magic", "name": "Dispel Magic", "level": 3, "school": "abjuration", "classes": ["bard", "cleric", "druid", "paladin", "ranger", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Choose one creature, object, or magical effect within range. Any ongoing spell of level 3 or lower on the target ends. For each ongoing spell of level 4 or higher on the target, make an ability check using your spellcasting ability (DC 10 plus that spell's level). On a successful check, the spell ends.", "higherLevel": "**Using a Higher-Level Spell Slot.** You automatically end a spell on the target if the spell's level is equal to or less than the level of the spell slot you use.", "gistDe": "Beendet einen laufenden Zauber auf einem Ziel."}, {"key": "srd-2024_dissonant-whispers", "name": "Dissonant Whispers", "level": 1, "school": "enchantment", "classes": ["bard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "One creature of your choice that you can see within range hears a discordant melody in its mind. The target makes a Wisdom saving throw. On a failed save, it takes 3d6 Psychic damage and must immediately use its Reaction, if available, to move as far away from you as it can, using the safest route. On a successful save, the target takes half as much damage only.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 1.", "gistDe": "Fügt einer Kreatur mit einer erschreckenden Melodie psychischen Schaden zu und zwingt sie zur panischen Flucht."}, {"key": "srd-2024_divination", "name": "Divination", "level": 4, "school": "divination", "classes": ["cleric", "druid", "wizard"], "castingTime": "1 action", "ritual": true, "range": "Self", "components": "V, S, M", "material": "incense worth 25+ GP, which the spell consumes", "duration": "Instantaneous", "concentration": false, "description": "This spell puts you in contact with a god or a god's servants. You ask one question about a specific goal, event, or activity to occur within 7 days. The DM offers a truthful reply, which might be a short phrase or cryptic rhyme. The spell doesn't account for circumstances that might change the answer, such as the casting of other spells.\n\nIf you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer.", "higherLevel": null, "gistDe": "Stellt über göttlichen Kontakt eine Frage zu einem nahen Ereignis und erhält eine wahrheitsgemäße, aber knappe Antwort."}, {"key": "srd-2024_divine-favor", "name": "Divine Favor", "level": 1, "school": "transmutation", "classes": ["paladin"], "castingTime": "1 bonus action", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "1 minute", "concentration": false, "description": "Until the spell ends, your attacks with weapons deal an extra 1d4 Radiant damage on a hit.", "higherLevel": null, "gistDe": "Verstärkt die eigenen Waffenangriffe für die Dauer um zusätzlichen strahlenden Schaden."}, {"key": "srd-2024_divine-smite", "name": "Divine Smite", "level": 1, "school": "evocation", "classes": ["paladin"], "castingTime": "1 bonus action, which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike", "ritual": false, "range": "Self", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "The target takes an extra 2d8 Radiant damage from the attack. The damage increases by 1d8 if the target is a Fiend or an Undead.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 1.", "gistDe": "Fügt einem getroffenen Ziel zusätzlichen strahlenden Schaden zu, gegen Untote und Dämonen sogar noch mehr."}, {"key": "srd-2024_divine-word", "name": "Divine Word", "level": 7, "school": "evocation", "classes": ["cleric"], "castingTime": "1 bonus action", "ritual": false, "range": "30 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You utter a word imbued with power from the Upper Planes. Each creature of your choice in range makes a Charisma saving throw. On a failed save, a target that has 50 Hit Points or fewer suffers an effect based on its current Hit Points, as shown in the Divine Word Effects table. Regardless of its Hit Points, a Celestial, an Elemental, a Fey, or a Fiend target that fails its save is forced back to its plane of origin (if it isn't there already) and can't return to the current plane for 24 hours by any means short of a Wish spell. \n\n| Hit Points | Effect                                                                   |\n| ---------- | ------------------------------------------------------------------------ |\n|            |                                                                          |\n| 0–20       | The target dies.                                                         |\n| 21–30      | The target has the Blinded, Deafened, and Stunned conditions for 1 hour. |\n| 31–40      | The target has the Blinded and Deafened conditions for 10 minutes.       |\n| 41–50      | The target has the Deafened condition for 1 minute                       |.", "higherLevel": null, "gistDe": "Spricht ein mächtiges Wort, das schwer verwundete Gegner je nach verbleibenden Trefferpunkten blendet, betäubt oder tötet, und verbannt bestimmte außerweltliche Kreaturen."}, {"key": "srd-2024_dominate-beast", "name": "Dominate Beast", "level": 4, "school": "enchantment", "classes": ["druid", "ranger", "sorcerer"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "One Beast you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success. \n\nYou have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as \"Attack that creature,\" \"Move over there,\" or \"Fetch that object.\" The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself. \n\nYou can command the target to take a Reaction but must take your own Reaction to do so.", "higherLevel": "**Using a Higher-Level Spell Slot.** Your Concentration can last longer with a spell slot of level 5 (up to 10 minutes), 6 (up to 1 hour), or 7+ (up to 8 hours).", "gistDe": "Übernimmt die Kontrolle über ein Tier und erlaubt es, ihm Befehle zu geben."}, {"key": "srd-2024_dominate-monster", "name": "Dominate Monster", "level": 8, "school": "enchantment", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 hour", "concentration": true, "description": "One creature you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success. \n\nYou have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as \"Attack that creature,\" \"Move over there,\" or \"Fetch that object.\" The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself. \n\nYou can command the target to take a Reaction but must take your own Reaction to do so.", "higherLevel": "**Using a Higher-Level Spell Slot.** Your Concentration can last longer with a level 9 spell slot (up to 8 hours).", "gistDe": "Übernimmt die Kontrolle über praktisch jede Kreatur und erlaubt es, ihr Befehle zu geben; eine der mächtigsten Bezauberungen überhaupt."}, {"key": "srd-2024_dominate-person", "name": "Dominate Person", "level": 5, "school": "enchantment", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "One Humanoid you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success. \n\nYou have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as \"Attack that creature,\" \"Move over there,\" or \"Fetch that object.\" The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself. \n\nYou can command the target to take a Reaction but must take your own Reaction to do so.", "higherLevel": "**Using a Higher-Level Spell Slot.** Your Concentration can last longer with a spell slot of level 6 (up to 10 minutes), 7 (up to 1 hour), or 8+ (up to 8 hours).", "gistDe": "Übernimmt die Kontrolle über eine humanoide Kreatur und erlaubt es, ihr Befehle zu geben."}, {"key": "srd-2024_dragon-s-breath", "name": "Dragon's Breath", "level": 2, "school": "transmutation", "classes": ["sorcerer", "wizard"], "castingTime": "1 bonus action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a hot pepper", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You touch one willing creature, and choose Acid, Cold, Fire, Lightning, or Poison. Until the spell ends, the target can take a Magic action to exhale a 15-foot Cone. Each creature in that area makes a Dexterity saving throw, taking 3d6 damage of the chosen type on a failed save or half as much damage on a successful one.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 2.", "gistDe": "Verleiht einer berührten Kreatur die Fähigkeit, einmal pro Zug einen Odemangriff mit wählbarem Elementarschaden auszustoßen."}, {"key": "srd-2024_dream", "name": "Dream", "level": 5, "school": "illusion", "classes": ["bard", "warlock", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a handful of sand", "duration": "8 hours", "concentration": false, "description": "You target a creature you know on the same plane of existence. You or a willing creature you touch enters a trance state to act as a dream messenger. While in the trance, the messenger is Incapacitated and has a Speed of 0. \n\nIf the target is asleep, the messenger appears in the target's dreams and can converse with the target as long as it remains asleep, through the spell's duration. The messenger can also shape the dream's environment, creating landscapes, objects, and other images. The messenger can emerge from the trance at any time, ending the spell. The target recalls the dream perfectly upon waking. \n\nIf the target is awake when you cast the spell, the messenger knows it and can either end the trance (and the spell) or wait for the target to sleep, at which point the messenger enters its dreams. You can make the messenger terrifying to the target. If you do so, the messenger can deliver a message of no more than ten words, and then the target makes a Wisdom saving throw. On a failed save, the target gains no benefit from its rest, and it takes 3d6 Psychic damage when it wakes up.", "higherLevel": null, "gistDe": "Ermöglicht es, in den Traum einer entfernten Zielperson einzudringen, um mit ihr zu sprechen oder ihr optional einen Schrecken einzujagen."}, {"key": "srd-2024_druidcraft", "name": "Druidcraft", "level": 0, "school": "transmutation", "classes": ["druid"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "**Weather Sensor.** You create a Tiny, harmless sensory effect that predicts what the weather will be at your location for the next 24 hours. The effect might manifest as a golden orb for clear skies, a cloud for rain, falling snowflakes for snow, and so on. This effect persists for 1 round. \n\n**Bloom.** You instantly make a flower blossom, a seed pod open, or a leaf bud bloom. \n\n**Sensory Effect.** You create a harmless sensory effect, such as falling leaves, spectral dancing fairies, a gentle breeze, the sound of an animal, or the faint odor of skunk. The effect must fit in a 5-foot Cube. \n\n**Fire Play.** You light or snuff out a candle, a torch, or a campfire.", "higherLevel": null, "gistDe": "Kleiner Naturzauber für harmlose Effekte wie Wettervorhersage, aufblühende Pflanzen, sensorische Spielereien oder das Entfachen kleiner Flammen."}, {"key": "srd-2024_earthquake", "name": "Earthquake", "level": 8, "school": "transmutation", "classes": ["cleric", "druid", "sorcerer"], "castingTime": "1 action", "ritual": false, "range": "500 feet", "components": "V, S, M", "material": "a fractured rock", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Choose a point on the ground that you can see within range. For the duration, an intense tremor rips through the ground in a 100- foot-radius circle centered on that point. The ground there is Difficult Terrain. \n\nWhen you cast this spell and at the end of each of your turns for the duration, each creature on the ground in the area makes a Dexterity saving throw. On a failed save, a creature has the Prone condition, and its Concentration is broken. You can also cause the effects below. \n\n**Fissures.** A total of 1d6 fissures open in the spell's area at the end of the turn you cast it. You choose the fissures' locations, which can't be under structures. Each fissure is 1d10 x 10 feet deep and 10 feet wide, and it extends from one edge of the spell's area to another edge. A creature in the same space as a fissure must succeed on a Dexterity saving throw or fall in. A creature that successfully saves moves with the fissure's edge as it opens. \n\n**Structures.** The tremor deals 50 Bludgeoning damage to any structure in contact with the ground in the area when you cast the spell and at the end of each of your turns until the spell ends. If a structure drops to 0 Hit Points, it collapses. \n\nA creature within a distance from a collapsing structure equal to half the structure's height makes a Dexterity saving throw. On a failed save, the creature takes 12d6 Bludgeoning damage, has the Prone condition, and is buried in the rubble, requiring a DC 20 Strength (Athletics) check as an action to escape. On a successful save, the creature takes half as much damage only.", "higherLevel": null, "gistDe": "Erschüttert ein sehr großes Gebiet heftig, wirft Kreaturen zu Boden, reißt Erdspalten auf und lässt Gebäude einstürzen."}, {"key": "srd-2024_eldritch-blast", "name": "Eldritch Blast", "level": 0, "school": "evocation", "classes": ["warlock"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You hurl a beam of crackling energy. Make a ranged spell attack against one creature or object in range. On a hit, the target takes 1d10 Force damage.", "higherLevel": "**Cantrip Upgrade.** The spell creates two beams at level 5, three beams at level 11, and four beams at level 17. You can direct the beams at the same target or at different ones. Make a separate attack roll for each beam.", "gistDe": "Grundlegender Fernkampf-Zaubertrick, der mit einem Energiestrahl Kraftschaden verursacht."}, {"key": "srd-2024_elementalism", "name": "Elementalism", "level": 0, "school": "transmutation", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You exert control over the elements, creating one of the following effects within range: \n\n**Beckon Air.** You create a breeze strong enough to ripple cloth, stir dust, rustle leaves, and close open doors and shutters, all in a 5-foot Cube. Doors and shutters being held open by someone or something aren't affected. \n\n**Beckon Earth.** You create a thin shroud of dust or sand that covers surfaces in a 5-foot-square area, or you cause a single word to appear in your handwriting in a patch of dirt or sand. \n\n**Beckon Fire.** You create a thin cloud of harmless embers and colored, scented smoke in a 5-foot Cube. You choose the color and scent, and the embers can light candles, torches, or lamps in that area. The smoke's scent lingers for 1 minute. \n\n**Beckon Water.** You create a spray of cool mist that lightly dampens creatures and objects in a 5-foot Cube. Alternatively, you create 1 cup of clean water either in an open container or on a surface, and the water evaporates in 1 minute. \n\n**Sculpt Element.** You cause dirt, sand, fire, smoke, mist, or water that can fit in a 1-foot Cube to assume a crude shape (such as that of a creature or an object) for 1 hour.", "higherLevel": null, "gistDe": "Kleiner Zaubertrick mit harmlosen Elementareffekten wie Wind, Staub, Rauch oder Wasser für atmosphärische Spielereien."}, {"key": "srd-2024_enhance-ability", "name": "Enhance Ability", "level": 2, "school": "transmutation", "classes": ["bard", "cleric", "druid", "ranger", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "fur or a feather", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You touch a creature and choose Strength, Dexterity, Intelligence, Wisdom, or Charisma. For the duration, the target has Advantage on ability checks using the chosen ability.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 2. You can choose a different ability for each target.", "gistDe": "Verleiht einer berührten Kreatur einen Vorteil bei Proben mit einer gewählten Fähigkeit."}, {"key": "srd-2024_enlarge-reduce", "name": "Enlarge/Reduce", "level": 2, "school": "transmutation", "classes": ["bard", "druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a pinch of powdered iron", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "For the duration, the spell enlarges or reduces a creature or an object you can see within range (see the chosen effect below). A targeted object must be neither worn nor carried. If the target is an unwilling creature, it can make a Constitution saving throw. On a successful save, the spell has no effect. \n\nEverything that a targeted creature is wearing and carrying changes size with it. Any item it drops returns to normal size at once. A thrown weapon or piece of ammunition returns to normal size immediately after it hits or misses a target. \n\n**Enlarge.** The target's size increases by one category—from Medium to Large, for example. The target also has Advantage on Strength checks and Strength saving throws. The target's attacks with its enlarged weapons or Unarmed Strikes deal an extra 1d4 damage on a hit. \n\n**Reduce.** The target's size decreases by one category—from Medium to Small, for example. The target also has Disadvantage on Strength checks and Strength saving throws. The target's attacks with its reduced weapons or Unarmed Strikes deal 1d4 less damage on a hit (this can't reduce the damage below 1).", "higherLevel": null, "gistDe": "Vergrößert oder verkleinert eine Kreatur oder ein Objekt, was Stärke und Waffenschaden entsprechend erhöht oder senkt."}, {"key": "srd-2024_ensnaring-strike", "name": "Ensnaring Strike", "level": 1, "school": "conjuration", "classes": ["ranger"], "castingTime": "1 bonus action, which you take immediately after hitting a creature with a weapon", "ritual": false, "range": "Self", "components": "V", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "As you hit the target, grasping vines appear on it, and it makes a Strength saving throw. A Large or larger creature has Advantage on this save. On a failed save, the target has the Restrained condition until the spell ends. On a successful save, the vines shrivel away, and the spell ends.\n\nWhile Restrained, the target takes 1d6 Piercing damage at the start of each of its turns. The target or a creature within reach of it can take an action to make a Strength (Athletics) check against your spell save DC. On a success, the spell ends.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 1.", "gistDe": "Lässt bei einem Waffentreffer Ranken wachsen, die das Ziel festhalten und ihm wiederholt Stichschaden zufügen."}, {"key": "srd-2024_entangle", "name": "Entangle", "level": 1, "school": "conjuration", "classes": ["druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "90 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Grasping plants sprout from the ground in a 20-foot square within range. For the duration, these plants turn the ground in the area into Difficult Terrain. They disappear when the spell ends. Each creature (other than you) in the area when you cast the spell must succeed on a Strength saving throw or have the Restrained condition until the spell ends. A Restrained creature can take an action to make a Strength (Athletics) check against your spell save DC. On a success, it frees itself from the grasping plants and is no longer Restrained by them.", "higherLevel": null, "gistDe": "Lässt Pflanzen aus dem Boden wachsen, die ein Gebiet zu Sperrgelände machen und Gegner darin festhalten."}, {"key": "srd-2024_enthrall", "name": "Enthrall", "level": 2, "school": "enchantment", "classes": ["bard", "warlock"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You weave a distracting string of words, causing creatures of your choice that you can see within range to make a Wisdom saving throw. Any creature you or your companions are fighting automatically succeeds on this save. On a failed save, a target has a −10 penalty to Wisdom (Perception) checks and Passive Perception until the spell ends.", "higherLevel": null, "gistDe": "Fesselt mit ablenkenden Worten die Aufmerksamkeit von Zuhörern, sodass ihre Wahrnehmung der Umgebung deutlich sinkt."}, {"key": "srd-2024_etherealness", "name": "Etherealness", "level": 7, "school": "conjuration", "classes": ["bard", "cleric", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "8 hours", "concentration": false, "description": "You step into the border regions of the Ethereal Plane, where it overlaps with your current plane. You remain in the Border Ethereal for the duration. During this time, you can move in any direction. If you move up or down, every foot of movement costs an extra foot. You can perceive the plane you left, which looks gray, and you can't see anything there more than 60 feet away. While on the Ethereal Plane, you can affect and be affected only by creatures, objects, and effects on that plane. Creatures that aren't on the Ethereal Plane can't perceive or interact with you unless a feature gives them the ability to do so. \n\nWhen the spell ends, you return to the plane you left in the spot that corresponds to your space in the Border Ethereal. If you appear in an occupied space, you are shunted to the nearest unoccupied space and take Force damage equal to twice the number of feet you are moved. \n\nThis spell ends instantly if you cast it while you are on the Ethereal Plane or a plane that doesn't border it, such as one of the Outer Planes.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target up to three willing creatures (including yourself) for each spell slot level above 7. The creatures must be within 10 feet of you when you cast the spell.", "gistDe": "Versetzt den Wirkenden auf die Ätherebene, wo er unsichtbar für die normale Welt agieren und sich frei durch Wände bewegen kann."}, {"key": "srd-2024_expeditious-retreat", "name": "Expeditious Retreat", "level": 1, "school": "transmutation", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 bonus action", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You take the Dash action, and until the spell ends, you can take that action again as a Bonus Action.", "higherLevel": null, "gistDe": "Ermöglicht es, sich für die Zauberdauer zusätzlich als Bonusaktion schnell fortzubewegen."}, {"key": "srd-2024_eyebite", "name": "Eyebite", "level": 6, "school": "necromancy", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "For the duration, your eyes become an inky void. One creature of your choice within 60 feet of you that you can see must succeed on a Wisdom saving throw or be affected by one of the following effects of your choice for the duration. \n\nOn each of your turns until the spell ends, you can take a Magic action to target another creature but can't target a creature again if it has succeeded on a save against this casting of the spell. \n\n**Asleep.** The target has the Unconscious condition. It wakes up if it takes any damage or if another creature takes an action to shake it awake. \n\n**Panicked.** The target has the Frightened condition. On each of its turns, the Frightened target must take the Dash action and move away from you by the safest and shortest route available. If the target moves to a space at least 60 feet away from you where it can't see you, this effect ends. \n\n**Sickened.** The target has the Poisoned condition.", "higherLevel": null, "gistDe": "Verhext ein Ziel wahlweise in Schlaf, Panik oder Vergiftung; der Effekt kann in späteren Runden auf weitere Ziele übertragen werden."}, {"key": "srd-2024_fabricate", "name": "Fabricate", "level": 4, "school": "transmutation", "classes": ["wizard"], "castingTime": "10 minutes", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You convert raw materials into products of the same material. For example, you can fabricate a wooden bridge from a clump of trees, a rope from a patch of hemp, or clothes from flax or wool. Choose raw materials that you can see within range. You can fabricate a Large or smaller object (contained within a 10-foot Cube or eight connected 5-foot Cubes) given a sufficient quantity of material. If you're working with metal, stone, or another mineral substance, however, the fabricated object can be no larger than Medium (contained within a 5-foot Cube). The quality of any fabricated objects is based on the quality of the raw materials. \n\nCreatures and magic items can't be created by this spell. You also can't use it to create items that require a high degree of skill—such as weapons and armor—unless you have proficiency with the type of Artisan's Tools used to craft such objects.", "higherLevel": null, "gistDe": "Verwandelt rohe Materialien direkt in fertige Gegenstände aus demselben Material, etwa ein Seil aus Hanf oder ein Brett aus Bäumen."}, {"key": "srd-2024_faerie-fire", "name": "Faerie Fire", "level": 1, "school": "evocation", "classes": ["bard", "druid"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Objects in a 20-foot Cube within range are outlined in blue, green, or violet light (your choice). Each creature in the Cube is also outlined if it fails a Dexterity saving throw. For the duration, objects and affected creatures shed Dim Light in a 10-foot radius and can't benefit from the Invisible condition. \n\nAttack rolls against an affected creature or object have Advantage if the attacker can see it.", "higherLevel": null, "gistDe": "Umrandet Objekte und Kreaturen in einem Bereich mit leuchtenden Konturen, wodurch sie nicht mehr unsichtbar sein können und leichter zu treffen sind."}, {"key": "srd-2024_faithful-hound", "name": "Faithful Hound", "level": 4, "school": "conjuration", "classes": ["wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a silver whistle", "duration": "8 hours", "concentration": false, "description": "You conjure a phantom watchdog in an unoccupied space that you can see within range. The hound remains for the duration or until the two of you are more than 300 feet apart from each other. \n\nNo one but you can see the hound, and it is intangible and invulnerable. When a Small or larger creature comes within 30 feet of it without first speaking the password that you specify when you cast this spell, the hound starts barking loudly. The hound has Truesight with a range of 30 feet. \n\nAt the start of each of your turns, the hound attempts to bite one enemy within 5 feet of it. That enemy must succeed on a Dexterity saving throw or take 4d8 Force damage.\n\nOn your later turns, you can take a Magic action to move the hound up to 30 feet.", "higherLevel": null, "gistDe": "Beschwört einen unsichtbaren Wachhund, der Eindringlinge anbellt und angreifende Gegner beißt. Guter Alarm- und Wachzauber für Lager."}, {"key": "srd-2024_false-life", "name": "False Life", "level": 1, "school": "necromancy", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a drop of alcohol", "duration": "Instantaneous", "concentration": false, "description": "You gain 2d4 + 4 Temporary Hit Points.", "higherLevel": "**Using a Higher-Level Spell Slot.** You gain 5 additional Temporary Hit Points for each spell slot level above 1.", "gistDe": "Verleiht dem Wirkenden vorübergehend zusätzliche, temporäre Trefferpunkte als Puffer."}, {"key": "srd-2024_fear", "name": "Fear", "level": 3, "school": "illusion", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self (30-foot cone)", "components": "V, S, M", "material": "a white feather", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Each creature in a 30-foot Cone must succeed on a Wisdom saving throw or drop whatever it is holding and have the Frightened condition for the duration. \n\nA Frightened creature takes the Dash action and moves away from you by the safest route on each of its turns unless there is nowhere to move. If the creature ends its turn in a space
