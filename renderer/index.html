 create an illusion of yourself to appear and warn off others who attempt to open a trapped door.\n\nPhysical interaction with the image reveals it to be illusory, since things can pass through it. A creature that takes the Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and any noise it makes sounds hollow to the creature.", "higherLevel": null, "gistDe": "Erschafft eine Illusion, die erst bei einem vorher festgelegten Auslöser erscheint und eine kurze, vorbereitete Vorführung abspielt, etwa zur Abschreckung."}, {"key": "srd-2024_project-image", "name": "Project Image", "level": 7, "school": "illusion", "classes": ["bard", "wizard"], "castingTime": "1 action", "ritual": false, "range": "500 miles", "components": "V, S, M", "material": "a statuette of yourself worth 5+ GP", "duration": "Concentration, up to 1 day", "concentration": true, "description": "You create an illusory copy of yourself that lasts for the duration. The copy can appear at any location within range that you have seen before, regardless of intervening obstacles. The illusion looks and sounds like you, but it is intangible. If the illusion takes any damage, it disappears, and the spell ends. \n\nYou can see through the illusion's eyes and hear through its ears as if you were in its space. As a Magic action, you can move it up to 60 feet and make it gesture, speak, and behave in whatever way you choose. It mimics your mannerisms perfectly. \n\nPhysical interaction with the image reveals it to be illusory, since things can pass through it. A creature that takes the Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and any noise it makes sounds hollow to the creature.", "higherLevel": null, "gistDe": "Erzeugt eine unberührbare Illusionskopie des Zauberwirkers an einem entfernten, bekannten Ort, durch die er sehen, hören und sprechen kann."}, {"key": "srd-2024_protection-from-energy", "name": "Protection from Energy", "level": 3, "school": "abjuration", "classes": ["cleric", "druid", "ranger", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Concentration, up to 1 hour", "concentration": true, "description": "For the duration, the willing creature you touch has Resistance to one damage type of your choice: Acid, Cold, Fire, Lightning, or Thunder.", "higherLevel": null, "gistDe": "Verleiht einer berührten Kreatur Resistenz gegen eine gewählte Elementarschadensart für die Dauer."}, {"key": "srd-2024_protection-from-evil-and-good", "name": "Protection from Evil and Good", "level": 1, "school": "abjuration", "classes": ["cleric", "druid", "paladin", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a flask of Holy Water worth 25+ GP, which the spell consumes", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "Until the spell ends, one willing creature you touch is protected against creatures that are Aberrations, Celestials, Elementals, Fey, Fiends, or Undead. The protection grants several benefits. Creatures of those types have Disadvantage on attack rolls against the target. The target also can't be possessed by or gain the Charmed or Frightened conditions from them. If the target is already possessed, Charmed, or Frightened by such a creature, the target has Advantage on any new saving throw against the relevant effect.", "higherLevel": null, "gistDe": "Schützt eine Kreatur vor bestimmten übernatürlichen Kreaturentypen wie Untoten oder Dämonen, erschwert deren Angriffe und schützt vor Besessenheit, Furcht und Bezauberung."}, {"key": "srd-2024_protection-from-poison", "name": "Protection from Poison", "level": 2, "school": "abjuration", "classes": ["cleric", "druid", "paladin", "ranger"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "1 hour", "concentration": false, "description": "You touch a creature and end the Poisoned condition on it. For the duration, the target has Advantage on saving throws to avoid or end the Poisoned condition, and it has Resistance to Poison damage.", "higherLevel": null, "gistDe": "Heilt eine Vergiftung sofort und schützt die Kreatur danach für die Dauer besser vor weiterem Gift."}, {"key": "srd-2024_purify-food-and-drink", "name": "Purify Food and Drink", "level": 1, "school": "transmutation", "classes": ["cleric", "druid", "paladin"], "castingTime": "1 action", "ritual": true, "range": "10 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You remove poison and rot from nonmagical food and drink in a 5- foot-radius Sphere centered on a point within range.", "higherLevel": null, "gistDe": "Entfernt Gift und Verderb aus Nahrung und Getränken in einem kleinen Bereich. Reiner Alltagsnutzen ohne Kampfwirkung."}, {"key": "srd-2024_raise-dead", "name": "Raise Dead", "level": 5, "school": "necromancy", "classes": ["bard", "cleric", "paladin"], "castingTime": "1 hour", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a diamond worth 500+ GP, which the spell consumes", "duration": "Instantaneous", "concentration": false, "description": "With a touch, you revive a dead creature if it has been dead no longer than 10 days and it wasn't Undead when it died. The creature returns to life with 1 Hit Point. This spell also neutralizes any poisons that affected the creature at the time of death. \n\nThis spell closes all mortal wounds, but it doesn't restore missing body parts. If the creature is lacking body parts or organs integral for its survival—its head, for instance—the spell automatically fails. Coming back from the dead is an ordeal. The target takes a −4 penalty to D20 Tests. Every time the target finishes a Long Rest, the penalty is reduced by 1 until it becomes 0.", "higherLevel": null, "gistDe": "Erweckt eine kürzlich verstorbene Kreatur mit wenigen Trefferpunkten wieder zum Leben, solange keine lebenswichtigen Körperteile fehlen; die Rückkehr schwächt sie vorübergehend."}, {"key": "srd-2024_ray-of-enfeeblement", "name": "Ray of Enfeeblement", "level": 2, "school": "necromancy", "classes": ["warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "A beam of enervating energy shoots from you toward a creature within range. The target must make a Constitution saving throw. On a successful save, the target has Disadvantage on the next attack roll it makes until the start of your next turn. \n\nOn a failed save, the target has Disadvantage on Strength-based D20 Tests for the duration. During that time, it also subtracts 1d8 from all its damage rolls. The target repeats the save at the end of each of its turns, ending the spell on a success.", "higherLevel": null, "gistDe": "Schwächt eine Kreatur bei Misserfolg deutlich: reduzierter körperlicher Schaden und Nachteil bei kraftbasierten Proben für die Dauer."}, {"key": "srd-2024_ray-of-frost", "name": "Ray of Frost", "level": 0, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "A frigid beam of blue-white light streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 Cold damage, and its Speed is reduced by 10 feet until the start of your next turn.", "higherLevel": "**Cantrip Upgrade.** The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", "gistDe": "Einfacher Fernangriffscantrip mit Kälteschaden, der die Bewegungsrate des Ziels kurzzeitig verringert."}, {"key": "srd-2024_ray-of-sickness", "name": "Ray of Sickness", "level": 1, "school": "necromancy", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You shoot a greenish ray at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 2d8 Poison damage and has the Poisoned condition until the end of your next turn.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 1.", "gistDe": "Fernangriff mit Giftschaden, der das getroffene Ziel zusätzlich kurzzeitig vergiftet."}, {"key": "srd-2024_regenerate", "name": "Regenerate", "level": 7, "school": "transmutation", "classes": ["bard", "cleric", "druid"], "castingTime": "1 minute", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a prayer wheel", "duration": "1 hour", "concentration": false, "description": "A creature you touch regains 4d8 + 15 Hit Points. For the duration, the target regains 1 Hit Point at the start of each of its turns, and any severed body parts regrow after 2 minutes.", "higherLevel": null, "gistDe": "Heilt eine berührte Kreatur stark, lässt sie danach über Zeit weiter regenerieren und sogar abgetrennte Körperteile nachwachsen."}, {"key": "srd-2024_reincarnate", "name": "Reincarnate", "level": 5, "school": "necromancy", "classes": ["druid"], "castingTime": "1 hour", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "rare oils worth 1,000+ GP, which the spell consumes", "duration": "Instantaneous", "concentration": false, "description": "You touch a dead Humanoid or a piece of one. If the creature has been dead no longer than 10 days, the spell forms a new body for it and calls the soul to enter that body. Roll 1d10 and consult the table below to determine the body’s species, or the DM chooses another playable species. \n\n| 1d10 | Species    |\n| ---- | ---------- |\n| 1    | Aasimar    |\n| 2    | Dragonborn |\n| 3    | Dwarf      |\n| 4    | Elf        |\n| 5    | Gnome      |\n| 6    | Goliath    |\n| 7    | Halfling   |\n| 8    | Human      |\n| 9    | Orc        |\n| 10   | Tiefling   |\n\n  The reincarnated creature makes any choices that a species’ description offers, and the creature recalls its former life. It retains the capabilities it had in its original form, except it loses the traits of its previous species and gains the traits of its new one.", "higherLevel": null, "gistDe": "Erweckt einen kürzlich verstorbenen Humanoiden in einem neuen, zufällig bestimmten Körper einer anderen Spezies wieder zum Leben; Erinnerungen bleiben erhalten."}, {"key": "srd-2024_remove-curse", "name": "Remove Curse", "level": 3, "school": "abjuration", "classes": ["cleric", "paladin", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner's Attunement to the object so it can be removed or discarded.", "higherLevel": null, "gistDe": "Beendet alle Flüche auf einer Kreatur oder einem Objekt; bei verfluchten Magiegegenständen wird zumindest die Bindung an den Besitzer gelöst."}, {"key": "srd-2024_resistance", "name": "Resistance", "level": 0, "school": "abjuration", "classes": ["cleric", "druid"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You touch a willing creature and choose a damage type: Acid, Bludgeoning, Cold, Fire, Lightning, Necrotic, Piercing, Poison, Radiant, Slashing, or Thunder. When the creature takes damage of the chosen type before the spell ends, the creature reduces the total damage taken by 1d4. A creature can benefit from this spell only once per turn.", "higherLevel": null, "gistDe": "Kleiner Schutzcantrip: die berührte Kreatur reduziert einmal pro Runde erlittenen Schaden einer gewählten Art um einen kleinen Betrag."}, {"key": "srd-2024_resurrection", "name": "Resurrection", "level": 7, "school": "necromancy", "classes": ["bard", "cleric"], "castingTime": "1 hour", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a diamond worth 1,000+ GP, which the spell consumes", "duration": "Instantaneous", "concentration": false, "description": "With a touch, you revive a dead creature that has been dead for no more than a century, didn't die of old age, and wasn't Undead when it died. \n\nThe creature returns to life with all its Hit Points. This spell also neutralizes any poisons that affected the creature at the time of death. This spell closes all mortal wounds and restores any missing body parts. \n\nComing back from the dead is an ordeal. The target takes a −4 penalty to D20 Tests. Every time the target finishes a Long Rest, the penalty is reduced by 1 until it becomes 0. \n\nCasting this spell to revive a creature that has been dead for 365 days or longer taxes you. Until you finish a Long Rest, you can't cast spells again, and you have Disadvantage on D20 Tests.", "higherLevel": null, "gistDe": "Erweckt eine schon lange verstorbene Kreatur vollständig geheilt wieder zum Leben; sie ist danach vorübergehend geschwächt, und sehr lange Totenzeiten belasten auch den Zauberwirker."}, {"key": "srd-2024_reverse-gravity", "name": "Reverse Gravity", "level": 7, "school": "transmutation", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "100 feet", "components": "V, S, M", "material": "a lodestone and iron filings", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "This spell reverses gravity in a 50-foot-radius, 100-foot high Cylinder centered on a point within range. All creatures and objects in that area that aren't anchored to the ground fall upward and reach the top of the Cylinder. A creature can make a Dexterity saving throw to grab a fixed object it can reach, thus avoiding the fall upward. \n\nIf a ceiling or an anchored object is encountered in this upward fall, creatures and objects strike it just as they would during a downward fall. If an affected creature or object reaches the Cylinder's top without striking anything, it hovers there for the duration. When the spell ends, affected objects and creatures fall downward.", "higherLevel": null, "gistDe": "Kehrt die Schwerkraft in einem großen Bereich um, sodass Kreaturen und Objekte nach oben fallen und beim Enden des Zaubers wieder herabstürzen."}, {"key": "srd-2024_revivify", "name": "Revivify", "level": 3, "school": "necromancy", "classes": ["cleric", "druid", "paladin", "ranger"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a diamond worth 300+ GP, which the spell consumes", "duration": "Instantaneous", "concentration": false, "description": "You touch a creature that has died within the last minute. That creature revives with 1 Hit Point. This spell can't revive a creature that has died of old age, nor does it restore any missing body parts.", "higherLevel": null, "gistDe": "Erweckt eine erst vor kurzem verstorbene Kreatur sofort mit minimalen Trefferpunkten wieder zum Leben. Schnelle Notfall-Wiederbelebung."}, {"key": "srd-2024_rope-trick", "name": "Rope Trick", "level": 2, "school": "transmutation", "classes": ["wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a segment of rope", "duration": "1 hour", "concentration": false, "description": "You touch a rope. One end of it hovers upward until the rope hangs perpendicular to the ground or the rope reaches a ceiling. At the rope's upper end, an Invisible 3-foot-by-5-foot portal opens to an extradimensional space that lasts until the spell ends. That space can be reached by climbing the rope, which can be pulled into or dropped out of it. \n\nThe space can hold up to eight Medium or smaller creatures. Attacks, spells, and other effects can't pass into or out of the space, but creatures inside it can see through the portal. Anything inside the space drops out when the spell ends.", "higherLevel": null, "gistDe": "Öffnet am oberen Ende eines Seils einen unsichtbaren Zugang zu einem kleinen, sicheren Zwischenraum für mehrere Kreaturen. Guter versteckter Rastplatz."}, {"key": "srd-2024_sacred-flame", "name": "Sacred Flame", "level": 0, "school": "evocation", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Flame-like radiance descends on a creature that you can see within range. The target must succeed on a Dexterity saving throw or take 1d8 Radiant damage. The target gains no benefit from Half Cover or Three-Quarters Cover for this save.", "higherLevel": "**Cantrip Upgrade.** The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", "gistDe": "Einfacher Angriffscantrip mit Strahlungsschaden, gegen den normale Deckung nicht hilft."}, {"key": "srd-2024_sanctuary", "name": "Sanctuary", "level": 1, "school": "abjuration", "classes": ["cleric"], "castingTime": "1 bonus action", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a shard of glass from a mirror", "duration": "1 minute", "concentration": false, "description": "You ward a creature within range. Until the spell ends, any creature who targets the warded creature with an attack roll or a damaging spell must succeed on a Wisdom saving throw or either choose a new target or lose the attack or spell. This spell doesn't protect the warded creature from areas of effect. \n\nThe spell ends if the warded creature makes an attack roll, casts a spell, or deals damage.", "higherLevel": null, "gistDe": "Schützt eine Kreatur davor, direkt angegriffen zu werden: Angreifer müssen einen Rettungswurf bestehen oder ihr Ziel wechseln. Endet, sobald die geschützte Kreatur selbst angreift."}, {"key": "srd-2024_scorching-ray", "name": "Scorching Ray", "level": 2, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You hurl three fiery rays. You can hurl them at one target within range or at several. Make a ranged spell attack for each ray. On a hit, the target takes 2d6 Fire damage.", "higherLevel": "**Using a Higher-Level Spell Slot.** You create one additional ray for each spell slot level above 2.", "gistDe": "Schleudert drei Feuerstrahlen, die einzeln auf ein oder mehrere Ziele gerichtet werden können. Solider Fernkampf-Schadenszauber."}, {"key": "srd-2024_scrying", "name": "Scrying", "level": 5, "school": "divination", "classes": ["bard", "cleric", "druid", "warlock", "wizard"], "castingTime": "10 minutes", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a focus worth 1,000+ GP, such as a crystal ball, mirror, or water-filled font", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You can see and hear a creature you choose that is on the same plane of existence as you. The target makes a Wisdom saving throw, which is modified (see the tables below) by how well you know the target and the sort of physical connection you have to it. The target doesn’t know what it is making the save against, only that it feels uneasy. \n\n| Your Knowledge of the Target Is... | Save Modifier |\n| ---------------------------------- | ------------- |\n| Secondhand (heard of the target)   | +5            |\n| Firsthand (met the target)         | +0            |\n| Extensive (know the target well)   | -5            |\n| You Have the Target’s...                | Save Modifier |\n| --------------------------------------- | ------------- |\n| Picture or other likeness               | -2            |\n| Garment or other possession             | -4            |\n| Body part, lock of hair, or bit of nail | -10           |\n\nOn a successful save, the target isn’t affected, and you can’t use this spell on it again for 24 hours. \n\nOn a failed save, the spell creates an Invisible, intangible sensor within 10 feet of the target. You can see and hear through the sensor as if you were there. The sensor moves with the target, remaining within 10 feet of it for the duration. If something can see the sensor, it appears as a luminous orb about the size of your fist. Instead of targeting a creature, you can target a location you have seen. When you do so, the sensor appears at that location and doesn’t move.", "higherLevel": null, "gistDe": "Erlaubt es, eine bekannte Kreatur oder einen bekannten Ort aus der Ferne zu sehen und zu hören, sofern das Ziel den Rettungswurf nicht besteht. Nützlich zum Ausspähen."}, {"key": "srd-2024_searing-smite", "name": "Searing Smite", "level": 1, "school": "evocation", "classes": ["paladin"], "castingTime": "1 bonus action, which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike", "ritual": false, "range": "Self", "components": "V", "material": null, "duration": "1 minute", "concentration": false, "description": "As you hit the target, it takes an extra 1d6 Fire damage from the attack. At the start of each of its turns until the spell ends, the target takes 1d6 Fire damage and then makes a Constitution saving throw. On a failed save, the spell continues. On a successful save, the spell ends.", "higherLevel": "**Using a Higher-Level Spell Slot.** All the damage increases by 1d6 for each spell slot level above 1.", "gistDe": "Fügt bei einem Waffentreffer zusätzlichen Feuerschaden zu und lässt das Ziel danach mehrere Runden weiterbrennen, bis es sich befreit."}, {"key": "srd-2024_secret-chest", "name": "Secret Chest", "level": 4, "school": "conjuration", "classes": ["wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a chest, 3 feet by 2 feet by 2 feet, constructed from rare materials worth 5,000+ GP, and a Tiny replica of the chest made from the same materials worth 50+ GP", "duration": "Until dispelled", "concentration": false, "description": "You hide a chest and all its contents on the Ethereal Plane. You must touch the chest and the miniature replica that serve as Material components for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet). \n\nWhile the chest remains on the Ethereal Plane, you can take a Magic action and touch the replica to recall the chest. It appears in an unoccupied space on the ground within 5 feet of you. You can send the chest back to the Ethereal Plane by taking a Magic action to touch the chest and the replica. \n\nAfter 60 days, there is a cumulative 5 percent chance at the end of each day that the spell ends. The spell also ends if you cast this spell again or if the Tiny replica chest is destroyed. If the spell ends and the larger chest is on the Ethereal Plane, the chest remains there for you or someone else to find.", "higherLevel": null, "gistDe": "Versteckt eine Truhe samt Inhalt auf einer anderen Ebene und erlaubt es, sie später jederzeit wieder herbeizurufen. Nützlich zur sicheren Aufbewahrung von Gegenständen."}, {"key": "srd-2024_see-invisibility", "name": "See Invisibility", "level": 2, "school": "divination", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a pinch of talc", "duration": "1 hour", "concentration": false, "description": "For the duration, you see creatures and objects that have the Invisible condition as if they were visible, and you can see into the Ethereal Plane. Creatures and objects there appear ghostly.", "higherLevel": null, "gistDe": "Macht unsichtbare Kreaturen und Objekte sowie die Astralebene für die Dauer sichtbar."}, {"key": "srd-2024_seeming", "name": "Seeming", "level": 5, "school": "illusion", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S", "material": null, "duration": "8 hours", "concentration": false, "description": "You give an illusory appearance to each creature of your choice that you can see within range. An unwilling target can make a Charisma saving throw, and if it succeeds, it is unaffected by this spell. \n\nYou can give the same appearance or different ones to the targets. The spell can change the appearance of the targets' bodies and equipment. You can make each creature seem 1 foot shorter or taller and appear heavier or lighter. A target's new appearance must have the same basic arrangement of limbs as the target, but the extent of the illusion is otherwise up to you. The spell lasts for the duration. \n\nThe changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to a creature's outfit, objects pass through the hat. \n\nA creature that takes the Study action to examine a target can make an Intelligence (Investigation) check against your spell save DC. If it succeeds, it becomes aware that the target is disguised.", "higherLevel": null, "gistDe": "Verändert illusorisch das Aussehen mehrerer Kreaturen, etwa Größe, Gewicht oder Kleidung; hält näherer körperlicher Prüfung aber nicht stand."}, {"key": "srd-2024_sending", "name": "Sending", "level": 3, "school": "divination", "classes": ["bard", "cleric", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Unlimited", "components": "V, S, M", "material": "a copper wire", "duration": "Instantaneous", "concentration": false, "description": "You send a short message of 25 words or fewer to a creature you have met or a creature described to you by someone who has met it. The target hears the message in its mind, recognizes you as the sender if it knows you, and can answer in a like manner immediately. The spell enables targets to understand the meaning of your message. \n\nYou can send the message across any distance and even to other planes of existence, but if the target is on a different plane than you, there is a 5 percent chance that the message doesn't arrive. You know if the delivery fails. \n\nUpon receiving your message, a creature can block your ability to reach it again with this spell for 8 hours. If you try to send another message during that time, you learn that you are blocked, and the spell fails.", "higherLevel": null, "gistDe": "Sendet eine kurze telepathische Nachricht an eine bekannte Kreatur über beliebige Entfernung, die sofort antworten kann."}, {"key": "srd-2024_sequester", "name": "Sequester", "level": 7, "school": "transmutation", "classes": ["wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "gem dust worth 5,000+ GP, which the spell consumes", "duration": "Until dispelled", "concentration": false, "description": "With a touch, you magically sequester an object or a willing creature. For the duration, the target has the Invisible condition and can't be targeted by Divination spells, detected by magic, or viewed remotely with magic. \n\nIf the target is a creature, it enters a state of suspended animation; it has the Unconscious condition, doesn't age, and doesn't need food, water, or air. \n\nYou can set a condition for the spell to end early. The condition can be anything you choose, but it must occur or be visible within 1 mile of the target. Examples include “after 1,000 years” or “when the tarrasque awakens.” This spell also ends if the target takes any damage.", "higherLevel": null, "gistDe": "Macht ein Objekt oder eine willige Kreatur unsichtbar und für Magie unauffindbar; eine so behandelte Kreatur fällt bis zu einer festgelegten Bedingung in eine Art Winterschlaf."}, {"key": "srd-2024_shapechange", "name": "Shapechange", "level": 9, "school": "transmutation", "classes": ["druid", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a jade circlet worth 1,500+ GP", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You shape-shift into another creature for the duration or until you take a Magic action to shape-shift into a different eligible form. The new form must be of a creature that has a Challenge Rating no higher than your level or Challenge Rating. You must have seen the sort of creature before, and it can't be a Construct or an Undead. When you shape-shift, you gain a number of Temporary Hit Points equal to the Hit Points of the form. The spell ends early if you have no Temporary Hit Points left. \n\nYour game statistics are replaced by the stat block of the chosen form, but you retain your creature type; alignment; personality; Intelligence, Wisdom, and Charisma scores; Hit Points; Hit Point Dice; proficiencies; and ability to communicate. If you have the Spellcasting feature, you retain it too. \n\nUpon shape-shifting, you determine whether your equipment drops to the ground or changes in size and shape to fit the new form while you're in it.", "higherLevel": null, "gistDe": "Verwandelt den Zauberwirker für die Dauer in eine beliebige bekannte Kreatur, deren Fähigkeiten und Werte er übernimmt. Sehr mächtiger, vielseitiger Verwandlungszauber hoher Stufe."}, {"key": "srd-2024_shatter", "name": "Shatter", "level": 2, "school": "evocation", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a chip of mica", "duration": "Instantaneous", "concentration": false, "description": "A loud noise erupts from a point of your choice within range. Each creature in a 10-foot-radius Sphere centered there makes a Constitution saving throw, taking 3d8 Thunder damage on a failed save or half as much damage on a successful one. A Construct has Disadvantage on the save.\n\nA nonmagical object that isn't being worn or carried also takes the damage if it's in the spell's area.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 2.", "gistDe": "Erzeugt einen lauten Knall, der allen Kreaturen in einem kleinen Bereich Donnerschaden zufügt; Konstrukte sind besonders anfällig dafür."}, {"key": "srd-2024_shield", "name": "Shield", "level": 1, "school": "abjuration", "classes": ["sorcerer", "wizard"], "castingTime": "1 reaction, which you take when you are hit by an attack roll or targeted by the Magic Missile spell", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "1 round", "concentration": false, "description": "An imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from Magic Missile.", "higherLevel": null, "gistDe": "Reaktionszauber, der die Rüstungsklasse kurzzeitig deutlich erhöht und vollständig vor Magischem Geschoss schützt. Klassischer Defensivzauber."}, {"key": "srd-2024_shield-of-faith", "name": "Shield of Faith", "level": 1, "school": "abjuration", "classes": ["cleric", "paladin"], "castingTime": "1 bonus action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a prayer scroll", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "A shimmering field surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration.", "higherLevel": null, "gistDe": "Verleiht einer Kreatur für die Dauer einen moderaten Bonus auf die Rüstungsklasse."}, {"key": "srd-2024_shillelagh", "name": "Shillelagh", "level": 0, "school": "transmutation", "classes": ["druid"], "castingTime": "1 bonus action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "mistletoe", "duration": "1 minute", "concentration": false, "description": "A Club or Quarterstaff you are holding is imbued with nature's power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon's damage die becomes a d8. If the attack deals damage, it can be Force damage or the weapon's normal damage type (your choice).\n\nThe spell ends early if you cast it again or if you let go of the weapon.", "higherLevel": "**Cantrip Upgrade.** The damage die changes when you reach levels 5 (d10), 11 (d12), and 17 (2d6).", "gistDe": "Verzaubert eine einfache Nahkampfwaffe, sodass geistige statt körperliche Werte für Treffer und Schaden zählen und der Schaden steigt. Beliebt bei kampfschwächeren Zauberwirkern."}, {"key": "srd-2024_shining-smite", "name": "Shining Smite", "level": 2, "school": "transmutation", "classes": ["paladin"], "castingTime": "1 bonus action, which you take immediately after hitting a creature with a Melee weapon or an Unarmed Strike", "ritual": false, "range": "Self", "components": "V", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "The target hit by the strike takes an extra 2d6 Radiant damage from the attack. Until the spell ends, the target sheds Bright Light in a 5-foot radius, attack rolls against it have Advantage, and it can't benefit from the Invisible condition.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 2.", "gistDe": "Fügt bei einem Treffer zusätzlichen Strahlungsschaden zu und lässt das Ziel leuchten, wodurch es leichter zu treffen ist und sich nicht unsichtbar machen kann."}, {"key": "srd-2024_shocking-grasp", "name": "Shocking Grasp", "level": 0, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Lightning springs from you to a creature that you try to touch. Make a melee spell attack against the target. On a hit, the target takes 1d8 Lightning damage, and it can't make Opportunity Attacks until the start of its next turn.", "higherLevel": "**Cantrip Upgrade.** The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", "gistDe": "Nahkampf-Angriffscantrip mit Blitzschaden, der zudem verhindert, dass das Ziel Gelegenheitsangriffe ausführt."}, {"key": "srd-2024_silence", "name": "Silence", "level": 2, "school": "illusion", "classes": ["bard", "cleric", "ranger"], "castingTime": "1 action", "ritual": true, "range": "120 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "For the duration, no sound can be created within or pass through a 20-foot-radius Sphere centered on a point you choose within range. Any creature or object entirely inside the Sphere has Immunity to Thunder damage, and creatures have the Deafened condition while entirely inside it. Casting a spell that includes a Verbal component is impossible there.", "higherLevel": null, "gistDe": "Erzeugt eine Zone völliger Stille, in der kein Schall entsteht und keine Zauber mit gesprochener Komponente gewirkt werden können."}, {"key": "srd-2024_silent-image", "name": "Silent Image", "level": 1, "school": "illusion", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a bit of fleece", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot Cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects. \n\nAs a Magic action, you can cause the image to move to any spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. \n\nPhysical interaction with the image reveals it to be an illusion, since things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image.", "higherLevel": null, "gistDe": "Erschafft eine rein visuelle, bewegliche Illusion eines Objekts, einer Kreatur oder Szene ohne Ton oder andere Sinneswahrnehmungen. Nützlich für Täuschungen."}, {"key": "srd-2024_simulacrum", "name": "Simulacrum", "level": 7, "school": "illusion", "classes": ["wizard"], "castingTime": "12 hours", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "powdered ruby worth 1,500+ GP, which the spell consumes", "duration": "Until dispelled", "concentration": false, "description": "You create a simulacrum of one Beast or Humanoid that is within 10 feet of you for the entire casting of the spell. You finish the casting by touching both the creature and a pile of ice or snow that is the same size as that creature, and the pile turns into the simulacrum, which is a creature. It uses the game statistics of the original creature at the time of casting, except it is a Construct, its Hit Point maximum is half as much, and it can't cast this spell.\n\nThe simulacrum is Friendly to you and creatures you designate. It obeys your commands and acts on your turn in combat. The simulacrum can't gain levels, and it can't take Short or Long Rests. If the simulacrum takes damage, the only way to restore its Hit Points is to repair it as you take a Long Rest, during which you expend components worth 100 GP per Hit Point restored. The simulacrum must stay within 5 feet of you for the repair.\n\nThe simulacrum lasts until it drops to 0 Hit Points, at which point it reverts to snow and melts away. If you cast this spell again, any simulacrum you created with this spell is instantly destroyed.", "higherLevel": null, "gistDe": "Erschafft aus Eis oder Schnee eine loyale, aber geschwächte Kopie einer bekannten Kreatur, die dem Zauberwirker gehorcht. Aufwändiger Zauber zur dauerhaften Verbündeten-Beschaffung."}, {"key": "srd-2024_sleep", "name": "Sleep", "level": 1, "school": "enchantment", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a pinch of sand or rose petals", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Each creature of your choice in a 5-foot-radius Sphere centered on a point within range must succeed on a Wisdom saving throw or have the Incapacitated condition until the end of its next turn, at which point it must repeat the save. If the target fails the second save, the target has the Unconscious condition for the duration. The spell ends on a target if it takes damage or someone within 5 feet of it takes an action to shake it out of the spell's effect.\n\nCreatures that don't sleep, such as elves, or that have Immunity to the Exhaustion condition automatically succeed on saves against this spell.", "higherLevel": null, "gistDe": "Versetzt Kreaturen in einem kleinen Bereich in Schlaf, sofern sie den Rettungswurf nicht bestehen; wirkt nicht bei Kreaturen, die nicht schlafen, und endet bei Schaden."}, {"key": "srd-2024_sleet-storm", "name": "Sleet Storm", "level": 3, "school": "conjuration", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "150 feet", "components": "V, S, M", "material": "a miniature umbrella", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Until the spell ends, sleet falls in a 40-foot-tall, 20-foot-radius Cylinder centered on a point you choose within range. The area is Heavily Obscured, and exposed flames in the area are doused. Ground in the Cylinder is Difficult Terrain. When a creature enters the Cylinder for the first time on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Prone condition and lose Concentration.", "higherLevel": null, "gistDe": "Lässt in einem großen Bereich Graupel fallen, der die Sicht stark einschränkt, Feuer löscht und den Boden rutschig macht."}, {"key": "srd-2024_slow", "name": "Slow", "level": 3, "school": "transmutation", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a drop of molasses", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You alter time around up to six creatures of your choice in a 40- foot Cube within range. Each target must succeed on a Wisdom saving throw or be affected by this spell for the duration. \n\nAn affected target's Speed is halved, it takes a −2 penalty to AC and Dexterity saving throws, and it can't take Reactions. On its turns, it can take either an action or a Bonus Action, not both, and it can make only one attack if it takes the Attack action. If it casts a spell with a Somatic component, there is a 25 percent chance the spell fails as a result of the target making the spell's gestures too slowly. \n\nAn affected target repeats the save at the end of each of its turns, ending the spell on itself on a success.", "higherLevel": null, "gistDe": "Verlangsamt bis zu sechs Kreaturen deutlich: weniger Bewegung, schlechtere Verteidigung und eingeschränkte Handlungsmöglichkeiten pro Runde."}, {"key": "srd-2024_sorcerous-burst", "name": "Sorcerous Burst", "level": 0, "school": "evocation", "classes": ["sorcerer"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You cast sorcerous energy at one creature or object within range. Make a ranged attack roll against the target. On a hit, the target takes 1d8 damage of a type you choose: Acid, Cold, Fire, Lightning, Poison, Psychic, or Thunder. \n\nIf you roll an 8 on a d8 for this spell, you can roll another d8, and add it to the damage. When you cast this spell, the maximum number of these d8s you can add to the spell's damage equals your spellcasting ability modifier.", "higherLevel": "**Cantrip Upgrade.** The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", "gistDe": "Fernangriffscantrip mit wählbarer Schadensart, der bei guten Würfeln zusätzlichen Bonusschaden erzeugen kann."}, {"key": "srd-2024_spare-the-dying", "name": "Spare the Dying", "level": 0, "school": "necromancy", "classes": ["cleric", "druid"], "castingTime": "1 action", "ritual": false, "range": "15 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Choose a creature within range that has 0 Hit Points and isn't dead. The creature becomes Stable.", "higherLevel": "**Cantrip Upgrade.** The range doubles when you reach levels 5 (30 feet), 11 (60 feet), and 17 (120 feet).", "gistDe": "Stabilisiert eine sterbende Kreatur bei 0 Trefferpunkten sofort, sodass sie nicht weiter dem Tod nahekommt. Wichtiger Notfallcantrip."}, {"key": "srd-2024_speak-with-animals", "name": "Speak with Animals", "level": 1, "school": "divination", "classes": ["bard", "druid", "ranger", "warlock"], "castingTime": "1 action", "ritual": true, "range": "Self", "components": "V, S", "material": null, "duration": "10 minutes", "concentration": false, "description": "For the duration, you can comprehend and verbally communicate with Beasts, and you can use any of the Influence action's skill options with them. \n\nMost Beasts have little to say about topics that don't pertain to survival or companionship, but at minimum, a Beast can give you information about nearby locations and monsters, including whatever it has perceived within the past day.", "higherLevel": null, "gistDe": "Ermöglicht Verständigung mit Tieren für die Dauer, die begrenzt Informationen über ihre Umgebung geben können."}, {"key": "srd-2024_speak-with-dead", "name": "Speak with Dead", "level": 3, "school": "necromancy", "classes": ["bard", "cleric", "wizard"], "castingTime": "1 action", "ritual": false, "range": "10 feet", "components": "V, S, M", "material": "burning incense", "duration": "10 minutes", "concentration": false, "description": "You grant the semblance of life to a corpse of your choice within range, allowing it to answer questions you pose. The corpse must have a mouth, and this spell fails if the deceased creature was Undead when it died. The spell also fails if the corpse was the target of this spell within the past 10 days. \n\nUntil the spell ends, you can ask the corpse up to five questions. The corpse knows only what it knew in life, including the languages it knew. Answers are usually brief, cryptic, or repetitive, and the corpse is under no compulsion to offer a truthful answer if you are antagonistic toward it or it recognizes you as an enemy. This spell doesn't return the creature's soul to its body, only its animating spirit. Thus, the corpse can't learn new information, doesn't comprehend anything that has happened since it died, and can't speculate about future events.", "higherLevel": null, "gistDe": "Erweckt einen Leichnam kurzzeitig zum Sprechen und erlaubt bis zu fünf Fragen; Antworten beruhen nur auf dem Wissen zu Lebzeiten und können knapp oder rätselhaft sein."}, {"key": "srd-2024_speak-with-plants", "name": "Speak with Plants", "level": 3, "school": "transmutation", "classes": ["bard", "druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "Self (30-foot emanation)", "components": "V, S", "material": null, "duration": "10 minutes", "concentration": false, "description": "You imbue plants in an immobile 30-foot Emanation with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell's area within the past day, gaining information about creatures that have passed, weather, and other circumstances. \n\nYou can also turn Difficult Terrain caused by plant growth (such as thickets and undergrowth) into ordinary terrain that lasts for the duration. Or you can turn ordinary terrain where plants are present into Difficult Terrain that lasts for the duration. \n\nThe spell doesn't enable plants to uproot themselves and move about, but they can move their branches, tendrils, and stalks for you. \n\nIf a Plant creature is in the area, you can communicate with it as if you shared a common language.", "higherLevel": null, "gistDe": "Verleiht Pflanzen in der Umgebung begrenztes Bewusstsein, sodass sie Informationen geben und Gelände be- oder entschwerlicher machen können."}, {"key": "srd-2024_spider-climb", "name": "Spider Climb", "level": 2, "school": "transmutation", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a drop of bitumen and a spider", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and along ceilings, while leaving its hands free. The target also gains a Climb Speed equal to its Speed.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 2.", "gistDe": "Verleiht einer Kreatur die Fähigkeit, mühelos Wände und Decken hochzuklettern, mit freien Händen."}, {"key": "srd-2024_spike-growth", "name": "Spike Growth", "level": 2, "school": "transmutation", "classes": ["druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "150 feet", "components": "V, S, M", "material": "seven thorns", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "The ground in a 20-foot-radius Sphere centered on a point within range sprouts hard spikes and thorns. The area becomes Difficult Terrain for the duration. When a creature moves into or within the area, it takes 2d4 Piercing damage for every 5 feet it travels. \n\nThe transformation of the ground is camouflaged to look natural. Any creature that can't see the area when the spell is cast must take a Search action and succeed on a Wisdom (Perception or Survival) check against your spell save DC to recognize the terrain as hazardous before entering it.", "higherLevel": null, "gistDe": "Lässt in einem Bereich getarnte Dornen und Stacheln wachsen, die Kreaturen beim Durchqueren Schaden zufügen und das Gelände erschweren."}, {"key": "srd-2024_spirit-guardians", "name": "Spirit Guardians", "level": 3, "school": "conjuration", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "Self (15-foot emanation)", "components": "V, S, M", "material": "a prayer scroll", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "Protective spirits flit around you in a 15-foot Emanation for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish. When you cast this spell, you can designate creatures to be unaffected by it. Any other creature's Speed is halved in the Emanation, and whenever the Emanation enters a creature's space and whenever a creature enters the Emanation or ends its turn there, the creature must make a Wisdom saving throw. On a failed save, the creature takes 3d8 Radiant damage (if you are good or neutral) or 3d8 Necrotic damage (if you are evil). On a successful save, the creature takes half as much damage. A creature makes this save only once per turn.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 3.", "gistDe": "Umgibt den Zauberwirker mit schützenden Geistern, die Angreifer in der Nähe verlangsamen und ihnen bei Kontakt Schaden zufügen. Starker Nahkampf-Verteidigungszauber für Kleriker."}, {"key": "srd-2024_spiritual-weapon", "name": "Spiritual Weapon", "level": 2, "school": "evocation", "classes": ["cleric"], "castingTime": "1 bonus action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You create a floating, spectral force that resembles a weapon of your choice and lasts for the duration. \n\nThe force appears within range in a space of your choice, and you can immediately make one melee spell attack against one creature within 5 feet of the force. On a hit, the target takes Force damage equal to 1d8 plus your spellcasting ability modifier. \n\nAs a Bonus Action on your later turns, you can move the force up to 20 feet and repeat the attack against a creature within 5 feet of it.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for every slot level above 2.", "gistDe": "Erschafft eine schwebende Geisterwaffe, die sofort und in späteren Runden per Bonusaktion angreifen kann. Beliebter Nebenschaden-Zauber für Kleriker."}, {"key": "srd-2024_starry-wisp", "name": "Starry Wisp", "level": 0, "school": "evocation", "classes": ["bard", "druid"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You launch a mote of light at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 Radiant damage, and until the end of your next turn, it emits Dim Light in a 10-foot radius and can't benefit from the Invisible condition.", "higherLevel": "**Cantrip Upgrade.** The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", "gistDe": "Fernangriffscantrip mit Strahlungsschaden, der das Ziel danach leicht erhellt und seine Unsichtbarkeit aufhebt."}, {"key": "srd-2024_stinking-cloud", "name": "Stinking Cloud", "level": 3, "school": "conjuration", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "90 feet", "components": "V, S, M", "material": "a rotten egg", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You create a 20-foot-radius Sphere of yellow, nauseating gas centered on a point within range. The cloud is Heavily Obscured. The cloud lingers in the air for the duration or until a strong wind (such as the one created by Gust of Wind) disperses it. \n\nEach creature that starts its turn in the Sphere must succeed on a Constitution saving throw or have the Poisoned condition until the end of the current turn. While Poisoned in this way, the creature can't take an action or a Bonus Action.", "higherLevel": null, "gistDe": "Erzeugt eine übelriechende Gaswolke, die die Sicht blockiert und Kreaturen darin bei Misserfolg handlungsunfähig macht."}, {"key": "srd-2024_stone-shape", "name": "Stone Shape", "level": 4, "school": "transmutation", "classes": ["cleric", "druid", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "soft clay", "duration": "Instantaneous", "concentration": false, "description": "You touch a stone object of Medium size or smaller or a section of stone no more than 5 feet in any dimension and form it into any shape you like. For example, you could shape a large rock into a weapon, statue, or coffer, or you could make a small passage through a wall that is 5 feet thick. You could also shape a stone door or its frame to seal the door shut. The object you create can have up to two hinges and a latch, but finer mechanical detail isn't possible.", "higherLevel": null, "gistDe": "Formt einen Stein oder eine Steinwand nach Belieben um, etwa zu einem Werkzeug, einer Statue oder einem Durchgang."}, {"key": "srd-2024_stoneskin", "name": "Stoneskin", "level": 4, "school": "transmutation", "classes": ["druid", "ranger", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "diamond dust worth 100+ GP, which the spell consumes", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "Until the spell ends, one willing creature you touch has Resistance to Bludgeoning, Piercing, and Slashing damage.", "higherLevel": null, "gistDe": "Verleiht einer berührten Kreatur Resistenz gegen die häufigsten physischen Schadensarten (Wuchtschaden, Stich- und Hiebwaffen)."}, {"key": "srd-2024_storm-of-vengeance", "name": "Storm of Vengeance", "level": 9, "school": "conjuration", "classes": ["druid"], "castingTime": "1 action", "ritual": false, "range": "1 miles", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "A churning storm cloud forms for the duration, centered on a point within range and spreading to a radius of 300 feet. Each creature under the cloud when it appears must succeed on a Constitution saving throw or take 2d6 Thunder damage and have the Deafened condition for the duration. \n\nAt the start of each of your later turns, the storm produces different effects, as detailed below. \n\n**Turn 2**. Acidic rain falls. Each creature and object under the cloud takes 4d6 Acid damage. \n\n**Turn 3**. You call six bolts of lightning from the cloud to strike six different creatures or objects beneath it. Each target makes a Dexterity saving throw, taking 10d6 Lightning damage on a failed save or half as much damage on a successful one. \n\n**Turn 4**. Hailstones rain down. Each creature under the cloud takes 2d6 Bludgeoning damage. \n\n**Turns 5-10**. Gusts and freezing rain assail the area under the cloud. Each creature there takes 1d6 Cold damage. Until the spell ends, the area is Difficult Terrain and Heavily Obscured, ranged attacks with weapons are impossible there, and strong wind blows through the area.", "higherLevel": null, "gistDe": "Beschwört ein riesiges Unwetter über einem großen Areal, das über mehrere Runden wechselnde Elementarschäden verursacht (Donner, Säure, Blitz, Hagel, Kälte) und Sicht sowie Bewegung erschwert. Extrem mächtiger Flächenzauber der höchsten Stufe."}, {"key": "srd-2024_suggestion", "name": "Suggestion", "level": 2, "school": "enchantment", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, M", "material": "a drop of honey", "duration": "Concentration, up to 8 hours", "concentration": true, "description": "You suggest a course of activity—described in no more than 25 words—to one creature you can see within range that can hear and understand you. The suggestion must sound achievable and not involve anything that would obviously deal damage to the target or its allies. For example, you could say, “Fetch the key to the cult's treasure vault, and give the key to me.” Or you could say, “Stop fighting, leave this library peacefully, and don't return.” \n\nThe target must succeed on a Wisdom saving throw or have the Charmed condition for the duration or until you or your allies deal damage to the target. The Charmed target pursues the suggestion to the best of its ability. The suggested activity can continue for the entire duration, but if the suggested activity can be completed in a shorter time, the spell ends for the target upon completing it.", "higherLevel": null, "gistDe": "Man gibt einem Ziel einen kurzen, plausibel klingenden Befehl ein, dem es bei misslungenem Rettungswurf zwangsläufig folgt. Nützlich, um Gegner oder NPCs unauffällig zu manipulieren."}, {"key": "srd-2024_summon-dragon", "name": "Summon Dragon", "level": 5, "school": "conjuration", "classes": ["wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "an object with the image of a dragon engraved on it worth 500+ GP", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You call forth a Dragon spirit. It manifests in an unoccupied space that you can see within range and uses the Draconic Spirit stat block. The creature disappears when it drops to 0 Hit Points or when the spell ends. \n\nThe creature is an ally to you and your allies. In combat, the creature shares your Initiative count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't issue any, it takes the Dodge action and uses its movement to avoid danger.", "higherLevel": "**Using a Higher-Level Spell Slot.** Use the spell slot's level for the spell's level in the stat block.", "gistDe": "Beschwört einen Drachengeist als kampfstarken, gehorsamen Verbündeten."}, {"key": "srd-2024_sunbeam", "name": "Sunbeam", "level": 6, "school": "evocation", "classes": ["cleric", "druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self (60-foot line)", "components": "V, S, M", "material": "a magnifying glass", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You launch a sunbeam in a 5-foot-wide, 60-foot-long Line. Each creature in the Line makes a Constitution saving throw. On a failed save, a creature takes 6d8 Radiant damage and has the Blinded condition until the start of your next turn. On a successful save, it takes half as much damage only. \n\nUntil the spell ends, you can take a Magic action to create a new Line of radiance. \n\nFor the duration, a mote of brilliant radiance shines above you. It sheds Bright Light in a 30-foot radius and Dim Light for an additional 30 feet. This light is sunlight.", "higherLevel": null, "gistDe": "Erzeugt einen Sonnenstrahl in einer Linie, der starken Strahlungsschaden verursacht und blendet; kann während der Wirkungsdauer mehrfach wiederholt werden."}, {"key": "srd-2024_sunburst", "name": "Sunburst", "level": 8, "school": "evocation", "classes": ["cleric", "druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "150 feet", "components": "V, S, M", "material": "a piece of sunstone", "duration": "Instantaneous", "concentration": false, "description": "Brilliant sunlight flashes in a 60-foot-radius Sphere centered on a point you choose within range. Each creature in the Sphere makes a Constitution saving throw. On a failed save, a creature takes 12d6 Radiant damage and has the Blinded condition for 1 minute. On a successful save, it takes half as much damage only.\n\nA creature Blinded by this spell makes another Constitution saving throw at the end of each of its turns, ending the effect on itself on a success. \n\nThis spell dispels Darkness in its area that was created by any spell.", "higherLevel": null, "gistDe": "Löst eine gewaltige Lichtexplosion in einer großen Kugel aus, die starken Strahlungsschaden verursacht, blendet und magische Dunkelheit vertreibt."}, {"key": "srd-2024_symbol", "name": "Symbol", "level": 7, "school": "abjuration", "classes": ["bard", "cleric", "druid", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "powdered diamond worth 1,000+ GP, which the spell consumes", "duration": "Until dispelled or triggered", "concentration": false, "description": "You inscribe a harmful glyph either on a surface (such as a section of floor or wall) or within an object that can be closed (such as a book or chest). The glyph can cover an area no larger than 10 feet in diameter. If you choose an object, it must remain in place; if it is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered. The glyph is nearly imperceptible and requires a successful Wisdom (Perception) check against your spell save DC to notice. When you inscribe the glyph, you set its trigger and choose which effect the symbol bears: Death, Discord, Fear, Pain, Sleep, or Stunning. Each one is explained below. \n\n**Set the Trigger**. You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph. \n\nYou can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don't trigger the glyph, such as those who say a certain password.\n\nOnce triggered, the glyph glows, filling a 60-foot-radius Sphere with Dim Light for 10 minutes, after which time the spell ends. Each creature in the Sphere when the glyph activates is targeted by its effect, as is a creature that enters the Sphere for the first time on a turn or ends its turn there. A creature is targeted only once per turn. \n\n**Death**. Each target makes a Constitution saving throw, taking 10d10 Necrotic damage on a failed save or half as much damage on a successful save. \n\n**Discord**. Each target makes a Wisdom saving throw. On a failed save, a target argues with other creatures for 1 minute. During this time, it is incapable of meaningful communication and has Disadvantage on attack rolls and ability checks.\n\n**Fear**. Each target must succeed on a Wisdom saving throw or have the Frightened condition for 1 minute. While Frightened, the target must move at least 30 feet away from the glyph on each of its turns, if able. \n\n**Pain**. Each target must succeed on a Constitution saving throw or have the Incapacitated condition for 1 minute. \n\n**Sleep**. Each target must succeed on a Wisdom saving throw or have the Unconscious condition for 10 minutes. A creature awakens if it takes damage or if someone takes an action to shake it awake. \n\n**Stunning**. Each target must succeed on a Wisdom saving throw or have the Stunned condition for 1 minute.", "higherLevel": null, "gistDe": "Erschafft eine nahezu unsichtbare magische Falle mit wählbarem Auslöser, die bei Aktivierung einen schädlichen Effekt wie Angst, Schlaf oder Wahnsinn über ein kleines Areal auslöst."}, {"key": "srd-2024_telekinesis", "name": "Telekinesis", "level": 5, "school": "transmutation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You gain the ability to move or manipulate creatures or objects by thought. When you cast the spell and as a Magic action on your later turns before the spell ends, you can exert your will on one creature or object that you can see within range, causing the appropriate effect below. You can affect the same target round after round or choose a new one at any time. If you switch targets, the prior target is no longer affected by the spell. \n\n**Creature**. You can try to move a Huge or smaller creature. The target must succeed on a Strength saving throw, or you move it up to 30 feet in any direction within the spell's range. Until the end of your next turn, the creature has the Restrained condition, and if you lift it into the air, it is suspended there. It falls at the end of your next turn unless you use this option on it again and it fails the save. \n\n**Object**. You can try to move a Huge or smaller object. If the object isn't being worn or carried, you automatically move it up to 30 feet in any direction within the spell's range. \n\nIf the object is worn or carried by a creature, that creature must succeed on a Strength saving throw, or you pull the object away and move it up to 30 feet in any direction within the spell's range. You can exert fine control on objects with your telekinetic grip, such as manipulating a simple tool, opening a door or a container, stowing or retrieving an item from an open container, or pouring the contents from a vial.", "higherLevel": null, "gistDe": "Ermöglicht es, aus der Ferne Kreaturen oder Objekte allein durch Gedankenkraft zu bewegen, festzuhalten oder zu beeinflussen."}, {"key": "srd-2024_telepathic-bond", "name": "Telepathic Bond", "level": 5, "school": "divination", "classes": ["bard", "wizard"], "castingTime": "1 action", "ritual": true, "range": "30 feet", "components": "V, S, M", "material": "two eggs", "duration": "1 hour", "concentration": false, "description": "You forge a telepathic link among up to eight willing creatures of your choice within range, psychically linking each creature to all the others for the duration. Creatures that can’t communicate in any languages aren’t affected by this spell.\n\nUntil the spell ends, the targets can communicate telepathically through the bond whether or not they share a language. The communication is possible over any distance, though it cannot extend to other planes of existence.", "higherLevel": null, "gistDe": "Verbindet bis zu acht willige Kreaturen telepathisch, sodass sie unabhängig von Sprache und Entfernung miteinander kommunizieren können."}, {"key": "srd-2024_teleport", "name": "Teleport", "level": 7, "school": "conjuration", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "10 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "This spell instantly transports you and up to eight willing creatures that you can see within range, or a single object that you can see within range, to a destination you select. If you target an object, it must be Large or smaller, and it can’t be held or carried by an unwilling creature. The destination you choose must be known to you, and it must be on the same plane of existence as you. Your familiarity with the destination determines whether you arrive there successfully. The DM rolls 1d100 and consults the Teleportation Outcome table and the explanations after it. \n\n| Familiarity              | Mishap | Similar Area | Off Target | On Target |\n| ------------------------ | ------ | ------------ | ---------- | --------- |\n| Permanent circle         | -      | -            | -          | 01-00     |\n| Linked object            | -      | -            | -          | 01–00     |\n| Very familiar            | 01-05  | 06-13        | 14-24      | 25-00     |\n| Seen casually            | 01-33  | 34-43        | 44-53      | 54-00     |\n| Viewed once or described | 01-43  | 44-53        | 54-73      | 74-00     |\n| False destination        | 01-50  | 51-00        | -          | -         |\n\n  **Familiarity**. Here are the meanings of the terms in the table’s Familiarity column: \n\n  - “Permanent circle” means a permanent teleportation circle whose sigil sequence you know. \n\n  - “Linked object” means you possess an object taken from the desired destination within the last six months, such as a book from a wizard’s library. \n\n  - “Very familiar” is a place you have visited often, a place you have carefully studied, or a place you can see when you cast the spell. \n\n  - “Seen casually” is a place you have seen more than once but with which you aren’t very familiar. \n\n  - “Viewed once or described” is a place you have seen once, possibly using magic, or a place you know through someone else’s description, perhaps from a map. \n\n  - “False destination” is a place that doesn’t exist. Perhaps you tried to scry an enemy’s sanctum but instead viewed an illusion, or you are attempting to teleport to a location that no longer exists.\n\n  **Mishap**. The spell’s unpredictable magic results in a difficult journey. Each teleporting creature (or the target object) takes 3d10 Force damage, and the DM rerolls on the table to see where you wind up (multiple mishaps can occur, dealing damage each time). \n\n  **Similar Area**. You and your group (or the target object) appear in a different area that’s visually or thematically similar to the target area. You appear in the closest similar place. If you are heading for your home laboratory, for example, you might appear in another person’s laboratory in the same city. \n\n  **Off Target**. You and your group (or the target object) appear 2d12 miles away from the destination in a random direction. Roll 1d8 for the direction: 1, east; 2, southeast; 3, south; 4, southwest; 5, west; 6, northwest; 7, north; or 8, northeast. \n\n  **On Target**. You and your group (or the target object) appear where you intended.", "higherLevel": null, "gistDe": "Transportiert den Zaubernden und bis zu acht Begleiter, oder ein Objekt, sofort an einen bekannten Ort; der Erfolg hängt von der Vertrautheit mit dem Ziel ab und kann bei Pech unerwartete Folgen haben."}, {"key": "srd-2024_teleportation-circle", "name": "Teleportation Circle", "level": 5, "school": "conjuration", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "10 feet", "components": "V, M", "material": "rare inks worth 50+ GP, which the spell consumes", "duration": "1 round", "concentration": false, "description": "As you cast the spell, you draw a 5-foot-radius circle on the ground inscribed with sigils that link your location to a permanent teleportation circle of your choice whose sigil sequence you know and that is on the same plane of existence as you. A shimmering portal opens within the circle you drew and remains open until the end of your next turn. Any creature that enters the portal instantly appears within 5 feet of the destination circle or in the nearest unoccupied space if that space is occupied.\n\nMany major temples, guildhalls, and other important places have permanent teleportation circles. Each circle includes a unique sigil sequence—a string of runes arranged in a particular pattern. When you first gain the ability to cast this spell, you learn the sigil sequences for two destinations on the Material Plane, determined by the DM. You might learn additional sigil sequences during your adventures. You can commit a new sigil sequence to memory after studying it for 1 minute. \n\nYou can create a permanent teleportation circle by casting this spell in the same location every day for 365 days.", "higherLevel": null, "gistDe": "Öffnet kurzzeitig ein Portal zu einem bekannten, dauerhaften Teleportationskreis auf derselben Ebene, durch das Kreaturen hindurchgehen können."}, {"key": "srd-2024_thaumaturgy", "name": "Thaumaturgy", "level": 0, "school": "transmutation", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V", "material": null, "duration": "1 minute", "concentration": false, "description": "You manifest a minor wonder within range. You create one of the effects below within range. If you cast this spell multiple times, you can have up to three of its 1-minute effects active at a time. \n\n**Altered Eyes**. You alter the appearance of your eyes for 1 minute. \n\n**Booming Voice**. Your voice booms up to three times as loud as normal for 1 minute. For the duration, you have Advantage on Charisma (Intimidation) checks. \n\n**Fire Play**. You cause flames to flicker, brighten, dim, or change color for 1 minute. \n\n**Invisible Hand**. You instantaneously cause an unlocked door or window to fly open or slam shut. \n\n**Phantom Sound**. You create an instantaneous sound that originates from a point of your choice within range, such as a rumble of thunder, the cry of a raven, or ominous whispers. \n\n**Tremors**. You cause harmless tremors in the ground for 1 minute.", "higherLevel": null, "gistDe": "Cantrip mit kleinen, harmlosen magischen Effekten wie verstärkter Stimme, sich bewegenden Türen oder flackernden Flammen für Show- und Alltagszwecke."}, {"key": "srd-2024_thunderwave", "name": "Thunderwave", "level": 1, "school": "evocation", "classes": ["bard", "druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self (15-foot cube)", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You unleash a wave of thunderous energy. Each creature in a 15- foot Cube originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only. \n\nIn addition, unsecured objects that are entirely within the Cube are pushed 10 feet away from you, and a thunderous boom is audible within 300 feet.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 1.", "gistDe": "Erzeugt eine Druckwelle im Bereich um den Zaubernden, die Schaden verursacht und Kreaturen sowie lose Gegenstände zurückstößt."}, {"key": "srd-2024_time-stop", "name": "Time Stop", "level": 9, "school": "transmutation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You briefly stop the flow of time for everyone but yourself. No time passes for other creatures, while you take 1d4 + 1 turns in a row, during which you can use actions and move as normal. \n\nThis spell ends if one of the actions you use during this period, or any effects that you create during it, affects a creature other than you or an object being worn or carried by someone other than you. In addition, the spell ends if you move to a place more than 1,000 feet from the location where you cast it.", "higherLevel": null, "gistDe": "Hält kurzzeitig die Zeit für alle außer dem Zaubernden an, sodass dieser mehrere freie Runden zum Handeln hat, solange dabei niemand sonst betroffen wird."}, {"key": "srd-2024_tiny-hut", "name": "Tiny Hut", "level": 3, "school": "evocation", "classes": ["bard", "wizard"], "castingTime": "1 minute", "ritual": true, "range": "Self (10-foot emanation)", "components": "V, S, M", "material": "a crystal bead", "duration": "8 hours", "concentration": false, "description": "A 10-foot Emanation springs into existence around you and remains stationary for the duration. The spell fails when you cast it if the Emanation isn't big enough to fully encapsulate all creatures in its area. \n\nCreatures and objects within the Emanation when you cast the spell can move through it freely. All other creatures and objects are barred from passing through it. Spells of level 3 or lower can't be cast through it, and the effects of such spells can't extend into it. The atmosphere inside the Emanation is comfortable and dry, regardless of the weather outside. Until the spell ends, you can command the interior to have Dim Light or Darkness (no action required). The Emanation is opaque from the outside and of any color you choose, but it's transparent from the inside. \n\nThe spell ends early if you leave the Emanation or if you cast it again.", "higherLevel": null, "gistDe": "Erschafft eine schützende Kuppel, die Wetter, niedrige Zaubersprüche und ungebetene Besucher abhält. Beliebter Zauber für sichere Rastplätze."}, {"key": "srd-2024_tongues", "name": "Tongues", "level": 3, "school": "divination", "classes": ["bard", "cleric", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, M", "material": "a miniature ziggurat", "duration": "1 hour", "concentration": false, "description": "This spell grants the creature you touch the ability to understand any spoken or signed language that it hears or sees. Moreover, when the target communicates by speaking or signing, any creature that knows at least one language can understand it if that creature can hear the speech or see the signing.", "higherLevel": null, "gistDe": "Verleiht einer berührten Kreatur die Fähigkeit, jede gesprochene oder gebärdete Sprache zu verstehen und von jedem verstanden zu werden."}, {"key": "srd-2024_transport-via-plants", "name": "Transport via Plants", "level": 6, "school": "conjuration", "classes": ["druid"], "castingTime": "1 action", "ritual": false, "range": "10 feet", "components": "V, S", "material": null, "duration": "10 minutes", "concentration": false, "description": "This spell creates a magical link between a Large or larger inanimate plant within range and another plant, at any distance, on the same plane of existence. You must have seen or touched the destination plant at least once before. For the duration, any creature can step into the target plant and exit from the destination plant by using 5 feet of movement.", "higherLevel": null, "gistDe": "Erschafft eine magische Verbindung zwischen zwei großen Pflanzen, durch die Kreaturen unabhängig von der Entfernung von einer zur anderen wandern können."}, {"key": "srd-2024_tree-stride", "name": "Tree Stride", "level": 5, "school": "conjuration", "classes": ["druid", "ranger"], "castingTime": "1 acti
