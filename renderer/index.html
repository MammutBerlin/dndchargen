 Advantage on attack rolls against it. On each of its turns, the target can take an action to collect itself and repeat the save, ending the spell on itself on a success.", "higherLevel": null, "gistDe": "Zwingt eine Kreatur zu unkontrolliertem Tanzen, wodurch sie kampfunfähig wird und Nachteile bei Verteidigung und Angriff erleidet. Starker Kontrollzauber."}, {"key": "srd-2024_jump", "name": "Jump", "level": 1, "school": "transmutation", "classes": ["druid", "ranger", "sorcerer", "wizard"], "castingTime": "1 bonus action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a grasshopper's hind leg", "duration": "1 minute", "concentration": false, "description": "You touch a willing creature. Once on each of its turns until the spell ends, that creature can jump up to 30 feet by spending 10 feet of movement.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 1.", "gistDe": "Erhöht kurzzeitig die Sprungweite einer berührten Kreatur deutlich. Nützlich zum Überwinden von Hindernissen."}, {"key": "srd-2024_knock", "name": "Knock", "level": 2, "school": "transmutation", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Choose an object that you can see within range. The object can be a door, a box, a chest, a set of manacles, a padlock, or another object that contains a mundane or magical means that prevents access. A target that is held shut by a mundane lock or that is stuck or barred becomes unlocked, unstuck, or unbarred. If the object has multiple locks, only one of them is unlocked. \n\nIf the target is held shut by Arcane Lock, that spell is suppressed for 10 minutes, during which time the target can be opened and closed. \n\nWhen you cast the spell, a loud knock, audible up to 300 feet away, emanates from the target.", "higherLevel": null, "gistDe": "Öffnet aus der Ferne verschlossene oder verklemmte Türen, Kisten und Schlösser, verursacht dabei aber ein lautes Geräusch. Praktisch zum Überwinden von Hindernissen."}, {"key": "srd-2024_legend-lore", "name": "Legend Lore", "level": 5, "school": "divination", "classes": ["bard", "cleric", "wizard"], "castingTime": "10 minutes", "ritual": false, "range": "Self", "components": "V, S, M", "material": "incense worth 250+ GP, which the spell consumes, and four ivory strips worth 50+ GP each", "duration": "Instantaneous", "concentration": false, "description": "Name or describe a famous person, place, or object. The spell brings to your mind a brief summary of the significant lore about that famous thing, as described by the DM. \n\nThe lore might consist of important details, amusing revelations, or even secret lore that has never been widely known. The more information you already know about the thing, the more precise and detailed the information you receive is. That information is accurate but might be couched in figurative language or poetry, as determined by the DM. \n\nIf the famous thing you chose isn't actually famous, you hear sad musical notes played on a trombone, and the spell fails.", "higherLevel": null, "gistDe": "Liefert Hintergrundwissen und Legenden über eine bekannte Person, einen Ort oder einen Gegenstand. Rein informativer Erkundungszauber."}, {"key": "srd-2024_lesser-restoration", "name": "Lesser Restoration", "level": 2, "school": "abjuration", "classes": ["bard", "cleric", "druid", "paladin", "ranger"], "castingTime": "1 bonus action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You touch a creature and end one condition on it: Blinded, Deafened, Paralyzed, or Poisoned.", "higherLevel": null, "gistDe": "Heilt eine berührte Kreatur von Blindheit, Taubheit, Lähmung oder Vergiftung. Wichtiger Unterstützungszauber gegen Statuseffekte."}, {"key": "srd-2024_levitate", "name": "Levitate", "level": 2, "school": "transmutation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a metal spring", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "One creature or loose object of your choice that you can see within range rises vertically up to 20 feet and remains suspended there for the duration. The spell can levitate an object that weighs up to 500 pounds. An unwilling creature that succeeds on a Constitution saving throw is unaffected. \n\nThe target can move only by pushing or pulling against a fixed object or surface within reach (such as a wall or a ceiling), which allows it to move as if it were climbing. You can change the target's altitude by up to 20 feet in either direction on your turn. If you are the target, you can move up or down as part of your move. Otherwise, you can take a Magic action to move the target, which must remain within the spell's range. \n\nWhen the spell ends, the target floats gently to the ground if it is still aloft.", "higherLevel": null, "gistDe": "Lässt eine Kreatur oder ein Objekt in der Luft schweben und ermöglicht begrenzte Höhenänderung. Nützlich zum Überwinden von Abgründen oder Fallen."}, {"key": "srd-2024_light", "name": "Light", "level": 0, "school": "evocation", "classes": ["bard", "cleric", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, M", "material": "a firefly or phosphorescent moss", "duration": "1 hour", "concentration": false, "description": "You touch one Large or smaller object that isn't being worn or carried by someone else. Until the spell ends, the object sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. The light can be colored as you like. \n\nCovering the object with something opaque blocks the light. The spell ends if you cast it again.", "higherLevel": null, "gistDe": "Lässt ein berührtes Objekt hell leuchten. Einfacher Beleuchtungszauber ohne Kampfnutzen."}, {"key": "srd-2024_lightning-bolt", "name": "Lightning Bolt", "level": 3, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self (100-foot line)", "components": "V, S, M", "material": "a bit of fur and a crystal rod", "duration": "Instantaneous", "concentration": false, "description": "A stroke of lightning forming a 100-foot-long, 5-foot-wide Line blasts out from you in a direction you choose. Each creature in the Line makes a Dexterity saving throw, taking 8d6 Lightning damage on a failed save or half as much damage on a successful one.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 3.", "gistDe": "Schleudert eine lange Blitzlinie, die alle Kreaturen darin mit erheblichem Blitzschaden trifft. Klassischer Flächenschadenzauber."}, {"key": "srd-2024_locate-animals-or-plants", "name": "Locate Animals or Plants", "level": 2, "school": "divination", "classes": ["bard", "druid", "ranger"], "castingTime": "1 action", "ritual": true, "range": "Self", "components": "V, S, M", "material": "fur from a bloodhound", "duration": "Instantaneous", "concentration": false, "description": "Describe or name a specific kind of Beast, Plant creature, or nonmagical plant. You learn the direction and distance to the closest creature or plant of that kind within 5 miles, if any are present.", "higherLevel": null, "gistDe": "Verrät Richtung und Entfernung zum nächsten Exemplar einer gesuchten Tier- oder Pflanzenart in der Umgebung. Reiner Erkundungszauber."}, {"key": "srd-2024_locate-creature", "name": "Locate Creature", "level": 4, "school": "divination", "classes": ["bard", "cleric", "druid", "paladin", "ranger", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "fur from a bloodhound", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "Describe or name a creature that is familiar to you. You sense the direction to the creature's location if that creature is within 1,000 feet of you. If the creature is moving, you know the direction of its movement. \n\nThe spell can locate a specific creature known to you or the nearest creature of a specific kind (such as a human or a unicorn) if you have seen such a creature up close—within 30 feet—at least once. If the creature you described or named is in a different form, such as under the effects of a Flesh to Stone or Polymorph spell, this spell doesn't locate the creature. \n\nThis spell can't locate a creature if any thickness of lead blocks a direct path between you and the creature.", "higherLevel": null, "gistDe": "Zeigt die Richtung zu einer bekannten oder nach Art beschriebenen Kreatur in der Nähe an. Nützlich zum Aufspüren von Personen oder Monstern."}, {"key": "srd-2024_locate-object", "name": "Locate Object", "level": 2, "school": "divination", "classes": ["bard", "cleric", "druid", "paladin", "ranger", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a forked twig", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "Describe or name an object that is familiar to you. You sense the direction to the object's location if that object is within 1,000 feet of you. If the object is in motion, you know the direction of its movement. \n\nThe spell can locate a specific object known to you if you have seen it up close—within 30 feet—at least once. Alternatively, the spell can locate the nearest object of a particular kind, such as a certain kind of apparel, jewelry, furniture, tool, or weapon. \n\nThis spell can't locate an object if any thickness of lead blocks a direct path between you and the object.", "higherLevel": null, "gistDe": "Zeigt die Richtung zu einem bekannten oder nach Art beschriebenen Gegenstand in der Nähe an. Praktisch zum Wiederfinden verlorener Objekte."}, {"key": "srd-2024_longstrider", "name": "Longstrider", "level": 1, "school": "transmutation", "classes": ["bard", "druid", "ranger", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a pinch of dirt", "duration": "1 hour", "concentration": false, "description": "You touch a creature. The target's Speed increases by 10 feet until the spell ends.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 1.", "gistDe": "Erhöht für die Zauberdauer die Bewegungsrate einer berührten Kreatur. Kleiner, aber praktischer Mobilitätsbonus."}, {"key": "srd-2024_mage-armor", "name": "Mage Armor", "level": 1, "school": "abjuration", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a piece of cured leather", "duration": "8 hours", "concentration": false, "description": "You touch a willing creature who isn't wearing armor. Until the spell ends, the target's base AC becomes 13 plus its Dexterity modifier. The spell ends early if the target dons armor.", "higherLevel": null, "gistDe": "Verleiht einer ungerüsteten Kreatur eine solide Grundrüstungsklasse. Standard-Selbstschutzzauber vieler Zauberwirkender."}, {"key": "srd-2024_mage-hand", "name": "Mage Hand", "level": 0, "school": "conjuration", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S", "material": null, "duration": "1 minute", "concentration": false, "description": "A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration. The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again. When you cast the spell, you can use the hand to manipulate an object, open an unlocked door or container, stow or retrieve an item from an open container, or pour the contents out of a vial. \n\nAs a Magic action on your later turns, you can control the hand thus again. As part of that action, you can move the hand up to 30 feet.\n\nThe hand can't attack, activate magic items, or carry more than 10 pounds.", "higherLevel": null, "gistDe": "Erschafft eine schwebende Geisterhand, die aus der Ferne kleine Gegenstände greifen, tragen oder Mechanismen bedienen kann. Nützlicher Alltags- und Trickzauber."}, {"key": "srd-2024_magic-circle", "name": "Magic Circle", "level": 3, "school": "abjuration", "classes": ["cleric", "paladin", "warlock", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "10 feet", "components": "V, S, M", "material": "salt and powdered silver worth 100+ GP, which the spell consumes", "duration": "1 hour", "concentration": false, "description": "You create a 10-foot-radius, 20-foot-tall Cylinder of magical energy centered on a point on the ground that you can see within range. Glowing runes appear wherever the Cylinder intersects with the floor or other surface. \n\nChoose one or more of the following types of creatures: Celestials, Elementals, Fey, Fiends, or Undead. The circle affects a creature of the chosen type in the following ways: \n\n- The creature can't willingly enter the Cylinder by nonmagical means. If the creature tries to use teleportation or interplanar travel to do so, it must first succeed on a Charisma saving throw. \n\n- The creature has Disadvantage on attack rolls against targets within the Cylinder. \n\n- Targets within the Cylinder can't be possessed by or gain the Charmed or Frightened condition from the creature. \n\nEach time you cast this spell, you can cause its magic to operate in the reverse direction, preventing a creature of the specified type from leaving the Cylinder and protecting targets outside it.", "higherLevel": "**Using a Higher-Level Spell Slot.** The duration increases by 1 hour for each spell slot level above 3.", "gistDe": "Errichtet einen Bannkreis, der einen gewählten Kreaturentyp, etwa Untote oder Dämonen, am Betreten hindert oder schwächt. Guter Schutzzauber gegen bestimmte Gegnerarten."}, {"key": "srd-2024_magic-jar", "name": "Magic Jar", "level": 6, "school": "necromancy", "classes": ["wizard"], "castingTime": "1 minute", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a gem, crystal, or reliquary worth 500+ GP", "duration": "Until dispelled", "concentration": false, "description": "Your body falls into a catatonic state as your soul leaves it and enters the container you used for the spell's Material component. While your soul inhabits the container, you are aware of your surroundings as if you were in the container's space. You can't move or take Reactions. The only action you can take is to project your soul up to 100 feet out of the container, either returning to your living body (and ending the spell) or attempting to possess a Humanoid's body. \n\nYou can attempt to possess any Humanoid within 100 feet of you that you can see (creatures warded by a Protection from Evil and Good or Magic Circle spell can't be possessed). The target makes a Charisma saving throw. On a failed save, your soul enters the target's body, and the target's soul becomes trapped in the container. On a successful save, the target resists your efforts to possess it, and you can't attempt to possess it again for 24 hours. Once you possess a creature's body, you control it. Your Hit Points, Hit Point Dice, Strength, Dexterity, Constitution, Speed, and senses are replaced by the creature's. You otherwise keep your game statistics. \n\nMeanwhile, the possessed creature's soul can perceive from the container using its own senses, but it can't move and it is Incapacitated. \n\nWhile possessing a body, you can take a Magic action to return from the host body to the container if it is within 100 feet of you, returning the host creature's soul to its body. If the host body dies while you're in it, the creature dies, and you make a Charisma saving throw against your own spellcasting DC. On a success, you return to the container if it is within 100 feet of you. Otherwise, you die. \n\nIf the container is destroyed or the spell ends, your soul returns to your body. If your body is more than 100 feet away from you or if your body is dead, you die. If another creature's soul is in the container when it is destroyed, the creature's soul returns to its body if the body is alive and within 100 feet. Otherwise, that creature dies.\n\nWhen the spell ends, the container is destroyed.", "higherLevel": null, "gistDe": "Der Wirkende verlässt seinen Körper und kann versuchen, den Körper einer anderen humanoiden Kreatur zu übernehmen. Mächtiger, aber riskanter Kontrollzauber."}, {"key": "srd-2024_magic-missile", "name": "Magic Missile", "level": 1, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You create three glowing darts of magical force. Each dart strikes a creature of your choice that you can see within range. A dart deals 1d4 + 1 Force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several.", "higherLevel": "**Using a Higher-Level Spell Slot.** The spell creates one more dart for each spell slot level above 1.", "gistDe": "Erschafft mehrere Kraftgeschosse, die automatisch ihr Ziel treffen und Schaden verursachen. Zuverlässiger Standard-Angriffszauber."}, {"key": "srd-2024_magic-mouth", "name": "Magic Mouth", "level": 2, "school": "illusion", "classes": ["bard", "wizard"], "castingTime": "1 minute", "ritual": true, "range": "30 feet", "components": "V, S, M", "material": "jade dust worth 10+ GP, which the spell consumes", "duration": "Until dispelled", "concentration": false, "description": "You implant a message within an object in range—a message that is uttered when a trigger condition is met. Choose an object that you can see and that isn't being worn or carried by another creature. Then speak the message, which must be 25 words or fewer, though it can be delivered over as long as 10 minutes. Finally, determine the circumstance that will trigger the spell to deliver your message. When that trigger occurs, a magical mouth appears on the object and recites the message in your voice and at the same volume you spoke. If the object you chose has a mouth or something that looks like a mouth (for example, the mouth of a statue), the magical mouth appears there, so the words appear to come from the object's mouth. When you cast this spell, you can have the spell end after it delivers its message, or it can remain and repeat its message whenever the trigger occurs. \n\nThe trigger can be as general or as detailed as you like, though it must be based on visual or audible conditions that occur within 30 feet of the object. For example, you could instruct the mouth to speak when any creature moves within 30 feet of the object or when a silver bell rings within 30 feet of it.", "higherLevel": null, "gistDe": "Verankert eine kurze Botschaft in einem Objekt, die bei einer festgelegten Bedingung automatisch abgespielt wird. Nützlich als Falle, Warnung oder Botschaft."}, {"key": "srd-2024_magic-weapon", "name": "Magic Weapon", "level": 2, "school": "transmutation", "classes": ["paladin", "ranger", "sorcerer", "wizard"], "castingTime": "1 bonus action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "1 hour", "concentration": false, "description": "You touch a nonmagical weapon. Until the spell ends, that weapon becomes a magic weapon with a +1 bonus to attack rolls and damage rolls. The spell ends early if you cast it again.", "higherLevel": "**Using a Higher-Level Spell Slot.** The bonus increases to +2 with a level 3-5 spell slot. The bonus increases to +3 with a level 6+ spell slot.", "gistDe": "Verleiht einer nichtmagischen Waffe vorübergehend einen Bonus auf Angriffs- und Schadenswürfe. Sinnvoll gegen Gegner mit Resistenz gegen normale Waffen."}, {"key": "srd-2024_magnificent-mansion", "name": "Magnificent Mansion", "level": 7, "school": "conjuration", "classes": ["bard", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "300 feet", "components": "V, S, M", "material": "a miniature door worth 15+ GP", "duration": "24 hours", "concentration": false, "description": "You conjure a shimmering door in range that lasts for the duration. The door leads to an extradimensional dwelling and is 5 feet wide and 10 feet tall. You and any creature you designate when you cast the spell can enter the extradimensional dwelling as long as the door remains open. You can open or close it (no action required) if you are within 30 feet of it. While closed, the door is imperceptible.\n\nBeyond the door is a magnificent foyer with numerous chambers beyond. The dwelling’s atmosphere is clean, fresh, and warm.\n\nYou can create any floor plan you like for the dwelling, but it can’t exceed 50 contiguous 10-foot Cubes. The place is furnished and decorated as you choose. It contains sufficient food to serve a nine course banquet for up to 100 people. Furnishings and other objects created by this spell dissipate into smoke if removed from it.\n\nA staff of 100 near-transparent servants attends all who enter. You determine the appearance of these servants and their attire. They are invulnerable and obey your commands. Each servant can perform tasks that a human could perform, but they can’t attack or take any action that would directly harm another creature. Thus the servants can fetch things, clean, mend, fold clothes, light fires, serve food, pour wine, and so on. The servants can’t leave the dwelling.\n\nWhen the spell ends, any creatures or objects left inside the extradimensional space are expelled into the unoccupied spaces nearest to the entrance.", "higherLevel": null, "gistDe": "Öffnet eine Tür zu einer geräumigen, komfortablen Zwischenraumunterkunft mit Dienerschaft. Luxuriöser Rast- und Rückzugszauber."}, {"key": "srd-2024_major-image", "name": "Major Image", "level": 3, "school": "illusion", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a bit of fleece", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 20-foot Cube. The image appears at a spot that you can see within range and lasts for the duration. It seems real, including sounds, smells, and temperature appropriate to the thing depicted, but it can't deal damage or cause conditions. \n\nIf you are within range of the illusion, you can take a Magic action to cause the image to move to any other spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. Similarly, you can cause the illusion to make different sounds at different times, even making it carry on a conversation, for example. \n\nPhysical interaction with the image reveals it to be an illusion, for things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and its other sensory qualities become faint to the creature.", "higherLevel": "**Using a Higher-Level Spell Slot.** The spell lasts until dispelled, without requiring Concentration, if cast with a level 4+ spell slot.", "gistDe": "Erschafft eine überzeugende Illusion mit Bild, Ton und Geruch, die jedoch keinen echten Schaden anrichten kann. Vielseitiger Täuschungszauber."}, {"key": "srd-2024_mass-cure-wounds", "name": "Mass Cure Wounds", "level": 5, "school": "abjuration", "classes": ["bard", "cleric", "druid"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "A wave of healing energy washes out from a point you can see within range. Choose up to six creatures in a 30-foot-radius Sphere centered on that point. Each target regains Hit Points equal to 5d8 plus your spellcasting ability modifier.", "higherLevel": "**Using a Higher-Level Spell Slot.** The healing increases by 1d8 for each spell slot level above 5.", "gistDe": "Heilt mehrere Kreaturen in einem Bereich gleichzeitig um eine deutliche Menge an Trefferpunkten. Effizienter Gruppenheilzauber."}, {"key": "srd-2024_mass-heal", "name": "Mass Heal", "level": 9, "school": "abjuration", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "A flood of healing energy flows from you into creatures around you. You restore up to 700 Hit Points, divided as you choose among any number of creatures that you can see within range. Creatures healed by this spell also have the Blinded, Deafened, and Poisoned conditions removed from them.", "higherLevel": null, "gistDe": "Verteilt eine sehr große Menge an Heilung auf beliebig viele sichtbare Kreaturen und beseitigt zudem mehrere Zustände. Einer der mächtigsten Heilzauber überhaupt."}, {"key": "srd-2024_mass-healing-word", "name": "Mass Healing Word", "level": 3, "school": "abjuration", "classes": ["bard", "cleric"], "castingTime": "1 bonus action", "ritual": false, "range": "60 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Up to six creatures of your choice that you can see within range regain Hit Points equal to 2d4 plus your spellcasting ability modifier.", "higherLevel": "**Using a Higher-Level Spell Slot.** The healing increases by 1d4 for each spell slot level above 3.", "gistDe": "Heilt aus der Ferne mehrere Kreaturen gleichzeitig um eine moderate Menge an Trefferpunkten. Schneller Gruppenheilzauber ohne Berührung."}, {"key": "srd-2024_mass-suggestion", "name": "Mass Suggestion", "level": 6, "school": "enchantment", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, M", "material": "a snake's tongue", "duration": "24 hours", "concentration": false, "description": "You suggest a course of activity—described in no more than 25 words—to twelve or fewer creatures you can see within range that can hear and understand you. The suggestion must sound achievable and not involve anything that would obviously deal damage to any of the targets or their allies. For example, you could say, “Walk to the village down that road, and help the villagers there harvest crops until sunset.” Or you could say, “Now is not the time for violence. Drop your weapons, and dance! Stop in an hour.” Each target must succeed on a Wisdom saving throw or have the Charmed condition for the duration or until you or your allies deal damage to the target. Each Charmed target pursues the suggestion to the best of its ability. The suggested activity can continue for the entire duration, but if the suggested activity can be completed in a shorter time, the spell ends for a target upon completing it.", "higherLevel": "**Using a Higher-Level Spell Slot.** The duration is longer with a spell slot of level 7 (10 days), 8 (30 days), or 9 (366 days).", "gistDe": "Legt bis zu zwölf Kreaturen eine bestimmte Verhaltensweise nahe, der sie bei misslungenem Widerstand folgen. Starker Massenmanipulationszauber."}, {"key": "srd-2024_maze", "name": "Maze", "level": 8, "school": "conjuration", "classes": ["wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You banish a creature that you can see within range into a labyrinthine demiplane. The target remains there for the duration or until it escapes the maze. \n\nThe target can take a Study action to try to escape. When it does so, it makes a DC 20 Intelligence (Investigation) check. If it succeeds, it escapes, and the spell ends. \n\nWhen the spell ends, the target reappears in the space it left or, if that space is occupied, in the nearest unoccupied space.", "higherLevel": null, "gistDe": "Verbannt eine Kreatur in eine labyrinthische Zwischenebene, aus der sie sich nur mit Mühe befreien kann. Starker Zauber, um einen gefährlichen Gegner vorübergehend auszuschalten."}, {"key": "srd-2024_meld-into-stone", "name": "Meld into Stone", "level": 3, "school": "transmutation", "classes": ["cleric", "druid", "ranger"], "castingTime": "1 action", "ritual": true, "range": "Touch", "components": "V, S", "material": null, "duration": "8 hours", "concentration": false, "description": "You step into a stone object or surface large enough to fully contain your body, merging yourself and your equipment with the stone for the duration. You must touch the stone to do so. Nothing of your presence remains visible or otherwise detectable by nonmagical senses. \n\nWhile merged with the stone, you can't see what occurs outside it, and any Wisdom (Perception) checks you make to hear sounds outside it are made with Disadvantage. You remain aware of the passage of time and can cast spells on yourself while merged in the stone. You can use 5 feet of movement to leave the stone where you entered it, which ends the spell. You otherwise can't move. \n\nMinor physical damage to the stone doesn't harm you, but its partial destruction or a change in its shape (to the extent that you no longer fit within it) expels you and deals 6d6 Force damage to you. The stone's complete destruction (or transmutation into a different substance) expels you and deals 50 Force damage to you. If expelled, you move into an unoccupied space closest to where you first entered and have the Prone condition.", "higherLevel": null, "gistDe": "Der Wirkende verschmilzt vollständig mit einem Steinobjekt und wird darin unsichtbar und unauffindbar. Guter Zauber zum Verstecken oder für sicheren Schlaf."}, {"key": "srd-2024_mending", "name": "Mending", "level": 0, "school": "transmutation", "classes": ["bard", "cleric", "druid", "sorcerer", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "two lodestones", "duration": "Instantaneous", "concentration": false, "description": "This spell repairs a single break or tear in an object you touch, such as a broken chain link, two halves of a broken key, a torn cloak, or a leaking wineskin. As long as the break or tear is no larger than 1 foot in any dimension, you mend it, leaving no trace of the former damage. \n\nThis spell can physically repair a magic item, but it can't restore magic to such an object.", "higherLevel": null, "gistDe": "Repariert einen einzelnen Bruch oder Riss an einem Gegenstand vollständig. Praktischer Alltagszauber ohne Kampfnutzen."}, {"key": "srd-2024_message", "name": "Message", "level": 0, "school": "transmutation", "classes": ["bard", "druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "S, M", "material": "a copper wire", "duration": "1 round", "concentration": false, "description": "You point toward a creature within range and whisper a message. The target (and only the target) hears the message and can reply in a whisper that only you can hear. You can cast this spell through solid objects if you are familiar with the target and know it is beyond the barrier. Magical silence; 1 foot of stone, metal, or wood; or a thin sheet of lead blocks the spell.", "higherLevel": null, "gistDe": "Ermöglicht ein geflüstertes, nur für das Ziel hörbares Gespräch über Distanz, sogar durch manche Hindernisse hindurch. Nützlicher Kommunikationszauber."}, {"key": "srd-2024_meteor-swarm", "name": "Meteor Swarm", "level": 9, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "1 miles", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Blazing orbs of fire plummet to the ground at four different points you can see within range. Each creature in a 40-foot-radius Sphere centered on each of those points makes a Dexterity saving throw. A creature takes 20d6 Fire damage and 20d6 Bludgeoning damage on a failed save or half as much damage on a successful one. A creature in the area of more than one fiery Sphere is affected only once. \n\nA nonmagical object that isn't being worn or carried also takes the damage if it's in the spell's area, and the object starts burning if it's flammable.", "higherLevel": null, "gistDe": "Lässt an bis zu vier Punkten riesige Feuerkugeln einschlagen, die enormen Feuer- und Wuchtschaden über große Flächen verursachen. Einer der zerstörerischsten Zauber im Spiel."}, {"key": "srd-2024_mind-blank", "name": "Mind Blank", "level": 8, "school": "abjuration", "classes": ["bard", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "24 hours", "concentration": false, "description": "Until the spell ends, one willing creature you touch has Immunity to Psychic damage and the Charmed condition. The target is also unaffected by anything that would sense its emotions or alignment, read its thoughts, or magically detect its location, and no spell—not even Wish—can gather information about the target, observe it remotely, or control its mind.", "higherLevel": null, "gistDe": "Macht eine Kreatur immun gegen psychischen Schaden sowie gegen Gedankenlesen, Ortung und die meisten Formen magischer Überwachung. Starker Schutz gegen Wahrsage- und Geisteszauber."}, {"key": "srd-2024_mind-spike", "name": "Mind Spike", "level": 2, "school": "divination", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "S", "material": null, "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You drive a spike of psionic energy into the mind of one creature you can see within range. The target makes a Wisdom saving throw, taking 3d8 Psychic damage on a failed save or half as much damage on a successful one. On a failed save, you also always know the target's location until the spell ends, but only while the two of you are on the same plane of existence. While you have this knowledge, the target can't become hidden from you, and if it has the Invisible condition, it gains no benefit from that condition against you.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 2.", "gistDe": "Fügt einer Kreatur psychischen Schaden zu und erlaubt es dem Wirkenden, ihren Aufenthaltsort danach zu spüren, selbst wenn sie unsichtbar ist. Schaden mit Ortungsnutzen."}, {"key": "srd-2024_minor-illusion", "name": "Minor Illusion", "level": 0, "school": "illusion", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "S, M", "material": "a bit of fleece", "duration": "1 minute", "concentration": false, "description": "You create a sound or an image of an object within range that lasts for the duration. See the descriptions below for the effects of each. The illusion ends if you cast this spell again. If a creature takes a Study action to examine the sound or image, the creature can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the illusion becomes faint to the creature. \n\n**Sound.** If you create a sound, its volume can range from a whisper to a scream. It can be your voice, someone else's voice, a lion's roar, a beating of drums, or any other sound you choose. The sound continues unabated throughout the duration, or you can make discrete sounds at different times before the spell ends. \n\n**Image.** If you create an image of an object—such as a chair, muddy footprints, or a small chest—it must be no larger than a 5- foot Cube. The image can't create sound, light, smell, or any other sensory effect. Physical interaction with the image reveals it to be an illusion, since things can pass through it.", "higherLevel": null, "gistDe": "Erschafft ein einfaches Bild oder Geräusch als kleine Täuschung. Vielseitiger, aber schwacher Trickcantrip."}, {"key": "srd-2024_mirage-arcane", "name": "Mirage Arcane", "level": 7, "school": "illusion", "classes": ["bard", "druid", "wizard"], "castingTime": "10 minutes", "ritual": false, "range": "Sight", "components": "V, S", "material": null, "duration": "10 days", "concentration": false, "description": "You make terrain in an area up to 1 mile square look, sound, smell, and even feel like some other sort of terrain. Open fields or a road could be made to resemble a swamp, hill, crevasse, or some other rough or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. \n\nSimilarly, you can alter the appearance of structures or add them where none are present. The spell doesn't disguise, conceal, or add creatures. \n\nThe illusion includes audible, visual, tactile, and olfactory elements, so it can turn clear ground into Difficult Terrain (or vice versa) or otherwise impede movement through the area. Any piece of the illusory terrain (such as a rock or stick) that is removed from the spell's area disappears immediately. \n\nCreatures with Truesight can see through the illusion to the terrain's true form; however, all other elements of the illusion remain, so while the creature is aware of the illusion's presence, the creature can still physically interact with the illusion.", "higherLevel": null, "gistDe": "Verändert das Aussehen, den Klang und das Gefühl eines großen Geländeabschnitts täuschend echt. Starker Täuschungszauber für Gelände statt für Kreaturen."}, {"key": "srd-2024_mirror-image", "name": "Mirror Image", "level": 2, "school": "illusion", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "1 minute", "concentration": false, "description": "Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions, shifting position so it's impossible to track which image is real. \n\nEach time a creature hits you with an attack roll during the spell's duration, roll a d6 for each of your remaining duplicates. If any of the d6s rolls a 3 or higher, one of the duplicates is hit instead of you, and the duplicate is destroyed. The duplicates otherwise ignore all other damage and effects. The spell ends when all three duplicates are destroyed. \n\nA creature is unaffected by this spell if it has the Blinded condition, Blindsight, or Truesight.", "higherLevel": null, "gistDe": "Erschafft drei illusionäre Doppelgänger, die eingehende Treffer mit einer gewissen Wahrscheinlichkeit statt des Wirkenden abbekommen. Guter Selbstschutz im Nahkampf."}, {"key": "srd-2024_mislead", "name": "Mislead", "level": 5, "school": "illusion", "classes": ["bard", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "S", "material": null, "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You gain the Invisible condition at the same time that an illusory double of you appears where you are standing. The double lasts for the duration, but the invisibility ends immediately after you make an attack roll, deal damage, or cast a spell. \n\nAs a Magic action, you can move the illusory double up to twice your Speed and make it gesture, speak, and behave in whatever way you choose. It is intangible and invulnerable. \n\nYou can see through its eyes and hear through its ears as if you were located where it is.", "higherLevel": null, "gistDe": "Der Wirkende wird unsichtbar, während ein steuerbares Trugbild an seiner Stelle agiert. Starker Täuschungs- und Fluchtzauber."}, {"key": "srd-2024_misty-step", "name": "Misty Step", "level": 2, "school": "conjuration", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 bonus action", "ritual": false, "range": "Self", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space you can see.", "higherLevel": null, "gistDe": "Ermöglicht eine kurze, sofortige Teleportation über wenige Meter. Schneller Mobilitäts- und Fluchtzauber."}, {"key": "srd-2024_modify-memory", "name": "Modify Memory", "level": 5, "school": "enchantment", "classes": ["bard", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You attempt to reshape another creature's memories. One creature that you can see within range makes a Wisdom saving throw. If you are fighting the creature, it has Advantage on the save. On a failed save, the target has the Charmed condition for the duration. While Charmed in this way, the target also has the Incapacitated condition and is unaware of its surroundings, though it can hear you. If it takes any damage or is targeted by another spell, this spell ends, and no memories are modified. \n\nWhile this charm lasts, you can affect the target's memory of an event that it experienced within the last 24 hours and that lasted no more than 10 minutes. You can permanently eliminate all memory of the event, allow the target to recall the event with perfect clarity, change its memory of the event's details, or create a memory of some other event. \n\nYou must speak to the target to describe how its memories are affected, and it must be able to understand your language for the modified memories to take root. Its mind fills in any gaps in the details of your description. If the spell ends before you finish describing the modified memories, the creature's memory isn't altered. Otherwise, the modified memories take hold when the spell ends. \n\nA modified memory doesn't necessarily affect how a creature behaves, particularly if the memory contradicts the creature's natural inclinations, alignment, or beliefs. An illogical modified memory, such as a false memory of how much the creature enjoyed swimming in acid, is dismissed as a bad dream. The DM might deem a modified memory too nonsensical to affect a creature. A Remove Curse or Greater Restoration spell cast on the target restores the creature's true memory.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can alter the target's memories of an event that took place up to 7 days ago (level 6 spell slot), 30 days ago (level 7 spell slot), 365 days ago (level 8 spell slot), or any time in the creature's past (level 9 spell slot).", "gistDe": "Erlaubt es, die Erinnerung einer widerstandsunfähigen Kreatur an ein vergangenes Erlebnis zu verändern oder zu löschen. Mächtiger, ethisch fragwürdiger Manipulationszauber."}, {"key": "srd-2024_moonbeam", "name": "Moonbeam", "level": 2, "school": "evocation", "classes": ["druid"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a moonseed leaf", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "A silvery beam of pale light shines down in a 5-foot-radius, 40- foot-high Cylinder centered on a point within range. Until the spell ends, Dim Light fills the Cylinder, and you can take a Magic action on later turns to move the Cylinder up to 60 feet. When the Cylinder appears, each creature in it makes a Constitution saving throw. On a failed save, a creature takes 2d10 Radiant damage, and if the creature is shape-shifted (as a result of the Polymorph spell, for example), it reverts to its true form and can't shape-shift until it leaves the Cylinder. On a successful save, a creature takes half as much damage only. A creature also makes this save when the spell's area moves into its space and when it enters the spell's area or ends its turn there. A creature makes this save only once per turn.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d10 for each spell slot level above 2.", "gistDe": "Erzeugt eine bewegliche Lichtsäule, die Kreaturen darin mit Strahlungsschaden trifft und Formwandler zurückverwandelt. Solider Flächenschadenzauber mit Zusatznutzen gegen Gestaltwandler."}, {"key": "srd-2024_move-earth", "name": "Move Earth", "level": 6, "school": "transmutation", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a miniature shovel", "duration": "Concentration, up to 2 hours", "concentration": true, "description": "Choose an area of terrain no larger than 40 feet on a side within range. You can reshape dirt, sand, or clay in the area in any manner you choose for the duration. You can raise or lower the area's elevation, create or fill in a trench, erect or flatten a wall, or form a pillar. The extent of any such changes can't exceed half the area's largest dimension. For example, if you affect a 40-foot square, you can create a pillar up to 20 feet high, raise or lower the square's elevation by up to 20 feet, dig a trench up to 20 feet deep, and so on. It takes 10 minutes for these changes to complete. Because the terrain's transformation occurs slowly, creatures in the area can't usually be trapped or injured by the ground's movement. At the end of every 10 minutes you spend concentrating on the spell, you can choose a new area of terrain to affect within range. This spell can't manipulate natural stone or stone construction. Rocks and structures shift to accommodate the new terrain. If the way you shape the terrain would make a structure unstable, it might collapse. \n\nSimilarly, this spell doesn't directly affect plant growth. The moved earth carries any plants along with it.", "higherLevel": null, "gistDe": "Formt über mehrere Minuten hinweg ein großes Geländestück aus Erde grundlegend um, etwa durch Gräben, Wälle oder Hügel. Langsamer, aber mächtiger Geländeveränderungszauber."}, {"key": "srd-2024_nondetection", "name": "Nondetection", "level": 3, "school": "abjuration", "classes": ["bard", "ranger", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a pinch of diamond dust worth 25+ GP, which the spell consumes", "duration": "8 hours", "concentration": false, "description": "For the duration, you hide a target that you touch from Divination spells. The target can be a willing creature, or it can be a place or an object no larger than 10 feet in any dimension. The target can't be targeted by any Divination spell or perceived through magical scrying sensors.", "higherLevel": null, "gistDe": "Schützt eine Kreatur, einen Ort oder einen Gegenstand für die Dauer vor Wahrsagezaubern und magischer Ortung. Guter Schutz gegen Überwachung."}, {"key": "srd-2024_pass-without-trace", "name": "Pass without Trace", "level": 2, "school": "abjuration", "classes": ["druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "Self (30-foot emanation)", "components": "V, S, M", "material": "ashes from burned mistletoe", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You radiate a concealing aura in a 30-foot Emanation for the duration. While in the aura, you and each creature you choose have a +10 bonus to Dexterity (Stealth) checks and leave no tracks.", "higherLevel": null, "gistDe": "Verbessert die Heimlichkeit der eigenen Gruppe erheblich und lässt keine Spuren zurück. Wichtiger Zauber für unbemerktes Reisen."}, {"key": "srd-2024_passwall", "name": "Passwall", "level": 5, "school": "transmutation", "classes": ["wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a pinch of sesame seeds", "duration": "1 hour", "concentration": false, "description": "A passage appears at a point that you can see on a wooden, plaster, or stone surface (such as a wall, ceiling, or floor) within range and lasts for the duration. You choose the opening's dimensions: up to 5 feet wide, 8 feet tall, and 20 feet deep. The passage creates no instability in a structure surrounding it. \n\nWhen the opening disappears, any creatures or objects still in the passage created by the spell are safely ejected to an unoccupied space nearest to the surface on which you cast the spell.", "higherLevel": null, "gistDe": "Erschafft einen begehbaren Durchgang durch eine Wand aus Stein, Holz oder Gips. Praktischer Zauber, um Hindernisse zu umgehen."}, {"key": "srd-2024_phantasmal-force", "name": "Phantasmal Force", "level": 2, "school": "illusion", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a bit of fleece", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You attempt to craft an illusion in the mind of a creature you can see within range. The target makes an Intelligence saving throw. On a failed save, you create a phantasmal object, creature, or other phenomenon that is no larger than a 10-foot Cube and that is perceivable only to the target for the duration. The phantasm includes sound, temperature, and other stimuli. \n\nThe target can take a Study action to examine the phantasm with an Intelligence (Investigation) check against your spell save DC. If the check succeeds, the target realizes that the phantasm is an illusion, and the spell ends. \n\nWhile affected by the spell, the target treats the phantasm as if it were real and rationalizes any illogical outcomes from interacting with it. For example, if the target steps through a phantasmal bridge and survives the fall, it believes the bridge exists and something else caused it to fall. \n\nAn affected target can even take damage from the illusion if the phantasm represents a dangerous creature or hazard. On each of your turns, such a phantasm can deal 2d8 Psychic damage to the target if it is in the phantasm's area or within 5 feet of the phantasm. The target perceives the damage as a type appropriate to the illusion.", "higherLevel": null, "gistDe": "Erschafft eine nur für ein Ziel sichtbare Illusion, die bei fortbestehendem Glauben an ihre Echtheit sogar realen Schaden verursachen kann. Psychologischer Täuschungszauber."}, {"key": "srd-2024_phantasmal-killer", "name": "Phantasmal Killer", "level": 4, "school": "illusion", "classes": ["bard", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You tap into the nightmares of a creature you can see within range and create an illusion of its deepest fears, visible only to that creature. The target makes a Wisdom saving throw. On a failed save, the target takes 4d10 Psychic damage and has Disadvantage on ability checks and attack rolls for the duration. On a successful save, the target takes half as much damage, and the spell ends. \n\nFor the duration, the target makes a Wisdom saving throw at the end of each of its turns. On a failed save, it takes the Psychic damage again. On a successful save, the spell ends.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d10 for each spell slot level above 4.", "gistDe": "Erschafft ein Zerrbild der größten Ängste des Ziels, das wiederholt psychischen Schaden verursacht und Nachteile bei Würfen gibt, bis ein Rettungswurf gelingt. Starker Einzelziel-Schadenszauber."}, {"key": "srd-2024_phantom-steed", "name": "Phantom Steed", "level": 3, "school": "illusion", "classes": ["wizard"], "castingTime": "1 minute", "ritual": true, "range": "30 feet", "components": "V, S", "material": null, "duration": "1 hour", "concentration": false, "description": "A Large, quasi-real, horselike creature appears on the ground in an unoccupied space of your choice within range. You decide the creature's appearance, and it is equipped with a saddle, bit, and bridle. Any of the equipment created by the spell vanishes in a puff of smoke if it is carried more than 10 feet away from the steed. \n\nFor the duration, you or a creature you choose can ride the steed. The steed uses the **Riding Horse** stat block, except it has a Speed of 100 feet and can travel 13 miles in an hour. When the spell ends, the steed gradually fades, giving the rider 1 minute to dismount. The spell ends early if the steed takes any damage.", "higherLevel": null, "gistDe": "Beschwört ein illusionäres, reitbares Pferd mit hoher Geschwindigkeit für lange Reisen. Guter Zauber zur schnellen Fortbewegung."}, {"key": "srd-2024_planar-ally", "name": "Planar Ally", "level": 6, "school": "conjuration", "classes": ["cleric"], "castingTime": "10 minutes", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You beseech an otherworldly entity for aid. The being must be known to you: a god, a demon prince, or some other being of cosmic power. That entity sends a Celestial, an Elemental, or a Fiend loyal to it to aid you, making the creature appear in an unoccupied space within range. If you know a specific creature's name, you can speak that name when you cast this spell to request that creature, though you might get a different creature anyway (DM's choice).\n\nWhen the creature appears, it is under no compulsion to behave a particular way. You can ask it to perform a service in exchange for payment, but it isn't obliged to do so. The requested task could range from simple (fly us across the chasm, or help us fight a battle) to complex (spy on our enemies, or protect us during our foray into the dungeon). You must be able to communicate with the creature to bargain for its services. \n\nPayment can take a variety of forms. A Celestial might require a sizable donation of gold or magic items to an allied temple, while a Fiend might demand a living sacrifice or a gift of treasure. Some creatures might exchange their service for a quest undertaken by you. \n\nA task that can be measured in minutes requires a payment worth 100 GP per minute. A task measured in hours requires 1,000 GP per hour. And a task measured in days (up to 10 days) requires 10,000 GP per day. The DM can adjust these payments based on the circumstances under which you cast the spell. If the task is aligned with the creature's ethos, the payment might be halved or even waived. Nonhazardous tasks typically require only half the suggested payment, while especially dangerous tasks might require a greater gift. Creatures rarely accept tasks that seem suicidal. \n\nAfter the creature completes the task, or when the agreed-upon duration of service expires, the creature returns to its home plane after reporting back to you if possible. If you are unable to agree on a price for the creature's service, the creature immediately returns to its home plane.", "higherLevel": null, "gistDe": "Ruft ein mächtiges außerweltliches Wesen wie einen Engel oder Dämon herbei, das gegen eine Gegenleistung einen Dienst erweisen kann. Kostspieliger Beschwörungs- und Verhandlungszauber."}, {"key": "srd-2024_planar-binding", "name": "Planar Binding", "level": 5, "school": "abjuration", "classes": ["bard", "cleric", "druid", "warlock", "wizard"], "castingTime": "1 hour", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a jewel worth 1,000+ GP, which the spell consumes", "duration": "24 hours", "concentration": false, "description": "You attempt to bind a Celestial, an Elemental, a Fey, or a Fiend to your service. The creature must be within range for the entire casting of the spell. (Typically, the creature is first summoned into the center of the inverted version of the Magic Circle spell to trap it while this spell is cast.) At the completion of the casting, the target must succeed on a Charisma saving throw or be bound to serve you for the duration. If the creature was summoned or created by another spell, that spell's duration is extended to match the duration of this spell. \n\nA bound creature must follow your commands to the best of its ability. You might command the creature to accompany you on an adventure, to guard a location, or to deliver a message. If the creature is Hostile, it strives to twist your commands to achieve its own objectives. If the creature carries out your commands completely before the spell ends, it travels to you to report this fact if you are on the same plane of existence. If you are on a different plane, it returns to the place where you bound it and remains there until the spell ends.", "higherLevel": "**Using a Higher-Level Spell Slot.** The duration increases with a spell slot of level 6 (10 days), 7 (30 days), 8 (180 days), and 9 (366 days).", "gistDe": "Versucht, ein außerweltliches Wesen dauerhaft an den Dienst des Wirkenden zu binden. Mächtiger, aber riskanter Bindungszauber."}, {"key": "srd-2024_plane-shift", "name": "Plane Shift", "level": 7, "school": "conjuration", "classes": ["cleric", "druid", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a forked, metal rod worth 250+ GP and attuned to a plane of existence", "duration": "Instantaneous", "concentration": false, "description": "You and up to eight willing creatures who link hands in a circle are transported to a different plane of existence. You can specify a target destination in general terms, such as the City of Brass on the Elemental Plane of Fire or the palace of Dispater on the second level of the Nine Hells, and you appear in or near that destination, as determined by the DM. \n\nAlternatively, if you know the sigil sequence of a teleportation circle on another plane of existence, this spell can take you to that circle. If the teleportation circle is too small to hold all the creatures you transported, they appear in the closest unoccupied spaces next to the circle.", "higherLevel": null, "gistDe": "Transportiert mehrere Kreaturen auf eine andere Existenzebene. Wichtiger Zauber für Planreisen oder um Gegner auf eine andere Ebene zu verbannen."}, {"key": "srd-2024_plant-growth", "name": "Plant Growth", "level": 3, "school": "transmutation", "classes": ["bard", "druid", "ranger"], "castingTime": "1 action or 8 hours", "ritual": false, "range": "150 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "This spell channels vitality into plants. The casting time you use determines whether the spell has the Overgrowth or the Enrichment effect below. \n\n**Overgrowth**. Choose a point within range. All normal plants in a 100-foot-radius Sphere centered on that point become thick and overgrown. A creature moving through that area must spend 4 feet of movement for every 1 foot it moves. You can exclude one or more areas of any size within the spell's area from being affected. \n\n**Enrichment**. All plants in a half-mile radius centered on a point within range become enriched for 365 days. The plants yield twice the normal amount of food when harvested. They can benefit from only one Plant Growth per year.", "higherLevel": null, "gistDe": "Lässt Pflanzen in einem großen Bereich entweder stark wuchern und so das Gelände unpassierbar machen, oder verbessert die Ernte für ein Jahr. Vielseitiger Geländezauber."}, {"key": "srd-2024_poison-spray", "name": "Poison Spray", "level": 0, "school": "necromancy", "classes": ["druid", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You spray toxic mist at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d12 Poison damage.", "higherLevel": "**Cantrip Upgrade.** The damage increases by 1d12 when you reach levels 5 (2d12), 11 (3d12), and 17 (4d12).", "gistDe": "Versprüht giftigen Nebel auf ein nahes Ziel und verursacht bei Treffer Giftschaden. Einfacher Nahkampf-Angriffscantrip."}, {"key": "srd-2024_polymorph", "name": "Polymorph", "level": 4, "school": "transmutation", "classes": ["bard", "druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a caterpillar cocoon", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You attempt to transform a creature that you can see within range into a Beast. The target must succeed on a Wisdom saving throw or shape-shift into Beast form for the duration. That form can be any Beast you choose that has a Challenge Rating equal to or less than the target's (or the target's level if it doesn't have a Challenge Rating). The target's game statistics are replaced by the stat block of the chosen Beast, but the target retains its alignment, personality, creature type, Hit Points, and Hit Point Dice. \n\nThe target gains a number of Temporary Hit Points equal to the Hit Points of the Beast form. The spell ends early on the target if it has no Temporary Hit Points left. \n\nThe target is limited in the actions it can perform by the anatomy of its new form, and it can't speak or cast spells. \n\nThe target's gear melds into the new form. The creature can't use or otherwise benefit from any of that equipment.", "higherLevel": null, "gistDe": "Verwandelt eine Kreatur in eine Tierform, wodurch ihre bisherigen Kampfwerte durch die des Tieres ersetzt werden. Sowohl offensiv gegen Gegner als auch defensiv für Verbündete einsetzbar."}, {"key": "srd-2024_power-word-heal", "name": "Power Word Heal", "level": 9, "school": "enchantment", "classes": ["bard", "cleric"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "A wave of healing energy washes over one creature you can see within range. The target regains all its Hit Points. If the creature has the Charmed, Frightened, Paralyzed, Poisoned, or Stunned condition, the condition ends. If the creature has the Prone condition, it can use its Reaction to stand up.", "higherLevel": null, "gistDe": "Heilt eine Kreatur ohne Rettungswurf vollständig und beendet dabei zahlreiche Zustände. Einer der stärksten Einzelziel-Heilzauber."}, {"key": "srd-2024_power-word-kill", "name": "Power Word Kill", "level": 9, "school": "enchantment", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You compel one creature you can see within range to die. If the target has 100 Hit Points or fewer, it dies. Otherwise, it takes 12d12 Psychic damage.", "higherLevel": null, "gistDe": "Tötet ein Ziel mit begrenzten Trefferpunkten sofort ohne Rettungswurf, sonst hoher psychischer Schaden. Extrem mächtiger Zauber der höchsten Stufe."}, {"key": "srd-2024_power-word-stun", "name": "Power Word Stun", "level": 8, "school": "enchantment", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You overwhelm the mind of one creature you can see within range. If the target has 150 Hit Points or fewer, it has the Stunned condition. Otherwise, its Speed is 0 until the start of your next turn. \n\nThe Stunned target makes a Constitution saving throw at the end of each of its turns, ending the condition on itself on a success.", "higherLevel": null, "gistDe": "Betäubt ein Ziel mit begrenzten Trefferpunkten sofort ohne Rettungswurf; bei mehr Trefferpunkten wird es nur kurz bewegungsunfähig."}, {"key": "srd-2024_prayer-of-healing", "name": "Prayer of Healing", "level": 2, "school": "abjuration", "classes": ["cleric", "paladin"], "castingTime": "10 minutes", "ritual": false, "range": "30 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Up to five creatures of your choice who remain within range for the spell's entire casting gain the benefits of a Short Rest and also regain 2d8 Hit Points. A creature can't be affected by this spell again until that creature finishes a Long Rest.", "higherLevel": "**Using a Higher-Level Spell Slot.** The healing increases by 1d8 for each spell slot level above 2.", "gistDe": "Heilt bis zu fünf Kreaturen leicht und gewährt ihnen die Vorteile einer kurzen Rast. Pro Kreatur nur einmal zwischen langen Rasten nutzbar."}, {"key": "srd-2024_prestidigitation", "name": "Prestidigitation", "level": 0, "school": "transmutation", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "10 feet", "components": "V, S", "material": null, "duration": "1 hour", "concentration": false, "description": "You create a magical effect within range. Choose the effect from the options below. If you cast this spell multiple times, you can have up to three of its non-instantaneous effects active at a time. \n\n**Sensory Effect**. You create an instantaneous, harmless sensory effect, such as a shower of sparks, a puff of wind, faint musical notes, or an odd odor. \n\n**Fire Play**. You instantaneously light or snuff out a candle, a torch, or a small campfire. \n\n**Clean or Soil**. You instantaneously clean or soil an object no larger than 1 cubic foot. \n\n**Minor Sensation**. You chill, warm, or flavor up to 1 cubic foot of nonliving material for 1 hour. \n\n**Magic Mark**. You make a color, a small mark, or a symbol appear on an object or a surface for 1 hour. \n\n**Minor Creation**. You create a nonmagical trinket or an illusory image that can fit in your hand. It lasts until the end of your next turn. A trinket can deal no damage and has no monetary worth.", "higherLevel": null, "gistDe": "Alltagscantrip für kleine, harmlose magische Spielereien wie Licht, Geruch, Reinigen, Färben oder winzige Illusionen. Kein Kampfnutzen."}, {"key": "srd-2024_prismatic-spray", "name": "Prismatic Spray", "level": 7, "school": "evocation", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self (60-foot cone)", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Eight rays of light flash from you in a 60-foot Cone. Each creature in the Cone makes a Dexterity saving throw. For each target, roll 1d8 to determine which color ray affects it, consulting the Prismatic Rays table.\n\n1d8 Ray \n\n1     Red. Failed Save: 12d6 Fire damage. Successful Save: Half as much damage. \n\n2     Orange. Failed Save: 12d6 Acid damage. Successful Save: Half as much damage. \n\n3 Yellow. Failed Save: 12d6 Lightning damage. Successful Save: Half as much damage. \n\n4    Green. Failed Save: 12d6 Poison damage. Successful Save: Half as much damage. \n\n5    Blue. Failed Save: 12d6 Cold damage. Successful Save: Half as much damage. \n\n6    Indigo. Failed Save: The target has the Restrained condition and makes a Constitution saving throw at the end of each of its turns. If it successfully saves three times, the condition ends. If it fails three times, it has the Petrified condition until it is freed by an effect like the Greater Restoration spell. The successes and failures needn't be consecutive; keep track of both until the target collects three of a kind. \n\n7    Violet. Failed Save: The target has the Blinded condition and makes a Wisdom saving throw at the start of your next turn. On a Successful Save, the condition ends. On a Failed Save, the condition ends, and the creature teleports to another plane of existence (DM's choice). \n\n8    Special. The target is struck by two rays. Roll twice, rerolling any 8.", "higherLevel": null, "gistDe": "Schießt mehrere zufällige Energiestrahlen in einem Kegel, jeder mit unterschiedlicher Wirkung von Schaden bis Verwandlung. Sehr mächtiger, unberechenbarer Flächenzauber."}, {"key": "srd-2024_prismatic-wall", "name": "Prismatic Wall", "level": 9, "school": "abjuration", "classes": ["bard", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "10 minutes", "concentration": false, "description": "A shimmering, multicolored plane of light forms a vertical opaque wall—up to 90 feet long, 30 feet high, and 1 inch thick—centered on a point within range. Alternatively, you shape the wall into a globe up to 30 feet in diameter centered on a point within range. The wall lasts for the duration. If you position the wall in a space occupied by a creature, the spell ends instantly without effect. The wall sheds Bright Light within 100 feet and Dim Light for an additional 100 feet. You and creatures you designate when you cast the spell can pass through and be near the wall without harm. If another creature that can see the wall moves within 20 feet of it or starts its turn there, the creature must succeed on a Constitution saving throw or have the Blinded condition for 1 minute. \n\nThe wall consists of seven layers, each with a different color. When a creature reaches into or passes through the wall, it does so one layer at a time through all the layers. Each layer forces the creature to make a Dexterity saving throw or be affected by that layer's properties as described in the Prismatic Layers table. \n\nThe wall, which has AC 10, can be destroyed one layer at a time, in order from red to violet, by means specific to each layer. If a layer is destroyed, it is gone for the duration. Antimagic Field has no effect on the wall, and Dispel Magic can affect only the violet layer. \n\n| Order | Effects                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   |\n| ----- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| 1     | **Red.** Failed Save: 12d6 Fire damage. Successful Save: Half as much damage. Additional Effects: Nonmagical ranged attacks can't pass through this layer, which is destroyed if it takes at least 25 Cold damage.                                                                                                                                                                                                                                                                                                                                                        |\n| 2     | **Orange**. Failed Save: 12d6 Acid damage. Successful Save: Half as much damage. Additional Effects: Magical ranged attacks can't pass through this layer, which is destroyed by a strong wind (such as the one created by Gust of Wind).                                                                                                                                                                                                                                                                                                                                 |\n| 3     | **Yellow**. Failed Save: 12d6 Lightning damage. Successful Save: Half as much damage. Additional Effects: The layer is destroyed if it takes at least 60 Force damage.                                                                                                                                                                                                                                                                                                                                                                                                    |\n| 4     | **Green**. Failed Save: 12d6 Poison damage. Successful Save: Half as much damage. Additional Effects: A Passwall spell, or another spell of equal or greater level that can open a portal on a solid surface, destroys this layer.                                                                                                                                                                                                                                                                                                                                        |\n| 5     | **Blue**. Failed Save: 12d6 Cold damage. Successful Save: Half as much damage. Additional Effects: The layer is destroyed if it takes at least 25 Fire damage.                                                                                                                                                                                                                                                                                                                                                                                                            |\n| 6     | **Indigo**. Failed Save: The target has the Restrained condition and makes a Constitution saving throw at the end of each of its turns. If it successfully saves three times, the condition ends. If it fails three times, it has the Petrified condition until it is freed by an effect like the Greater Restoration spell. The successes and failures needn't be consecutive; keep track of both until the target collects three of a kind. Additional Effects: Spells can't be cast through this layer, which is destroyed by Bright Light shed by the Daylight spell. |\n| 7     | **Violet**. Failed Save: The target has the Blinded condition and makes a Wisdom saving throw at the start of your next turn. On a Successful Save, the condition ends. On a Failed Save, the condition ends, and the creature teleports to another plane of existence (DM's choice). Additional Effects: This layer is destroyed by Dispel Magic.                                                                                                                                                                                                                        |.", "higherLevel": null, "gistDe": "Errichtet eine mehrschichtige magische Wand oder Kuppel, die blendet und Eindringlinge durch verschiedene gefährliche Effekte pro Schicht aufhält. Sehr starke Verteidigung."}, {"key": "srd-2024_private-sanctum", "name": "Private Sanctum", "level": 4, "school": "abjuration", "classes": ["wizard"], "castingTime": "10 minutes", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "a thin sheet of lead", "duration": "24 hours", "concentration": false, "description": "You make an area within range magically secure. The area is a Cube that can be as small as 5 feet to as large as 100 feet on each side. The spell lasts for the duration. \n\nWhen you cast the spell, you decide what sort of security the spell provides, choosing any of the following properties: \n\n- Sound can't pass through the barrier at the edge of the warded area. \n\n- The barrier of the warded area appears dark and foggy, preventing vision (including Dark vision) through it. \n\n- Sensors created by Divination spells can't appear inside the protected area or pass through the barrier at its perimeter. \n\n- Creatures in the area can't be targeted by Divination spells. \n\n- Nothing can teleport into or out of the warded area. \n\n- Planar travel is blocked within the warded area. Casting this spell on the same spot every day for 365 days makes the spell last until dispelled.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can increase the size of the Cube by 100 feet for each spell slot level above 4.", "gistDe": "Sichert einen Bereich gegen Sicht, Geräusche und magische Beobachtung von außen ab. Starker Schutzzauber für sichere Rückzugsorte."}, {"key": "srd-2024_produce-flame", "name": "Produce Flame", "level": 0, "school": "conjuration", "classes": ["druid"], "castingTime": "1 bonus action", "ritual": false, "range": "Self", "components": "V, S", "material": null, "duration": "10 minutes", "concentration": false, "description": "A flickering flame appears in your hand and remains there for the duration. While there, the flame emits no heat and ignites nothing, and it sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. The spell ends if you cast it again. \n\nUntil the spell ends, you can take a Magic action to hurl fire at a creature or an object within 60 feet of you. Make a ranged spell attack. On a hit, the target takes 1d8 Fire damage.", "higherLevel": "**Cantrip Upgrade.** The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", "gistDe": "Erzeugt eine leuchtende Flamme in der Hand, die als Lichtquelle dient und auch als Fernangriff mit Feuerschaden geworfen werden kann."}, {"key": "srd-2024_programmed-illusion", "name": "Programmed Illusion", "level": 6, "school": "illusion", "classes": ["bard", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S, M", "material": "jade dust worth 25+ GP", "duration": "Until dispelled", "concentration": false, "description": "You create an illusion of an object, a creature, or some other visible phenomenon within range that activates when a specific trigger occurs. The illusion is imperceptible until then. It must be no larger than a 30-foot Cube, and you decide when you cast the spell how the illusion behaves and what sounds it makes. This scripted performance can last up to 5 minutes.\n\nWhen the trigger you specify occurs, the illusion springs into existence and performs in the manner you described. Once the illusion finishes performing, it disappears and remains dormant for 10 minutes, after which the illusion can be activated again. The trigger can be as general or as detailed as you like, though it must be based on visual or audible phenomena that occur within 30 feet of the area. For example, you could
