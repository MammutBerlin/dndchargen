 where it doesn't have line of sight to you, the creature makes a Wisdom saving throw. On a successful save, the spell ends on that creature.", "higherLevel": null, "gistDe": "Versetzt Kreaturen in einem Kegelbereich in Panik, sodass sie fliehen und ihre Gegenstände fallen lassen."}, {"key": "srd-2024_feather-fall", "name": "Feather Fall", "level": 1, "school": "transmutation", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 reaction, which you take when you or a creature you can see within 60 feet of you falls", "ritual": false, "range": "60 feet", "components": "V, M", "material": "a small feather or piece of down", "duration": "1 minute", "concentration": false, "description": "Choose up to five falling creatures within range. A falling creature's rate of descent slows to 60 feet per round until the spell ends. If a creature lands before the spell ends, the creature takes no damage from the fall, and the spell ends for that creature.", "higherLevel": null, "gistDe": "Verlangsamt den Fall von bis zu fünf Kreaturen, sodass sie sicher landen, ohne Fallschaden zu nehmen."}, {"key": "srd-2024_find-familiar", "name": "Find Familiar", "level": 1, "school": "conjuration", "classes": ["wizard"], "castingTime": "1 hour", "ritual": true, "range": "10 feet", "components": "V, S, M", "material": "burning incense worth 10+ GP, which the spell consumes", "duration": "Instantaneous", "concentration": false, "description": "You gain the service of a familiar, a spirit that takes an animal form you choose: **Bat, Cat, Frog, Hawk, Lizard, Octopus, Owl, Rat, Raven, Spider, Weasel,** or another Beast that has a Challenge Rating of 0. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form, though it is a Celestial, Fey, or Fiend (your choice) instead of a Beast. Your familiar acts independently of you, but it obeys your commands. Telepathic Connection. While your familiar is within 100 feet of you, you can communicate with it telepathically. Additionally, as a Bonus Action, you can see through the familiar's eyes and hear what it hears until the start of your next turn, gaining the benefits of any special senses it has. \n\nFinally, when you cast a spell with a range of touch, your familiar can deliver the touch. Your familiar must be within 100 feet of you, and it must take a Reaction to deliver the touch when you cast the spell. \n\n**Combat.** The familiar is an ally to you and your allies. It rolls its own Initiative and acts on its own turn. A familiar can't attack, but it can take other actions as normal. Disappearance of the Familiar. When the familiar drops to 0 Hit Points, it disappears. It reappears after you cast this spell again. As a Magic action, you can temporarily dismiss the familiar to a pocket dimension. Alternatively, you can dismiss it forever. As a Magic action while it is temporarily dismissed, you can cause it to reappear in an unoccupied space within 30 feet of you. Whenever the familiar drops to 0 Hit Points or disappears into the pocket dimension, it leaves behind in its space anything it was wearing or carrying. \n\n**One Familiar Only.** You can't have more than one familiar at a time. If you cast this spell while you have a familiar, you instead cause it to adopt a new eligible form.", "higherLevel": null, "gistDe": "Beschwört einen tierähnlichen Geistbegleiter, durch dessen Augen man sehen kann und der Berührungszauber überbringen kann. Ein dauerhafter, nicht kampfstarker Helfer für Aufklärung und kleine Botengänge."}, {"key": "srd-2024_find-steed", "name": "Find Steed", "level": 2, "school": "conjuration", "classes": ["paladin"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You summon an otherworldly being that appears as a loyal steed in an unoccupied space of your choice within range. This creature uses the **Otherworldly Steed** stat block. If you already have a steed from this spell, the steed is replaced by the new one. The steed resembles a Large, rideable animal of your choice, such as a horse, a camel, a dire wolf, or an elk. Whenever you cast the spell, choose the steed's creature type-Celestial, Fey, or Fiend which determines certain traits in the stat block. \n\n**Combat.** The steed is an ally to you and your allies. In combat, it shares your Initiative count, and it functions as a controlled mount while you ride it (as defined in the rules on mounted combat). If you have the Incapacitated condition, the steed takes its turn immediately after yours and acts independently, focusing on protecting you. \n\n**Disappearance of the Steed.** The steed disappears if it drops to 0 Hit Points or if you die. When it disappears, it leaves behind anything it was wearing or carrying. If you cast this spell again, you decide whether you summon the steed that disappeared or a different one.", "higherLevel": "**Using a Higher-Level Spell Slot.** Use the spell slot's level for the spell's level in the stat block.", "gistDe": "Beschwört ein treues, magisches Reittier, das den Zauberer im Kampf trägt und beschützt. Klassischer Begleiterzauber, meist für berittene Kämpfer wie Paladine."}, {"key": "srd-2024_find-the-path", "name": "Find the Path", "level": 6, "school": "divination", "classes": ["bard", "cleric", "druid"], "castingTime": "1 minute", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a set of divination tools—such as cards or runes—worth 100+ GP", "duration": "Concentration, up to 1 day", "concentration": true, "description": "You magically sense the most direct physical route to a location you name. You must be familiar with the location, and the spell fails if you name a destination on another plane of existence, a moving destination (such as a mobile fortress), or an unspecific destination (such as “a green dragon's lair”). \n\nFor the duration, as long as you are on the same plane of existence as the destination, you know how far it is and in what direction it lies. Whenever you face a choice of paths along the way there, you know which path is the most direct.", "higherLevel": null, "gistDe": "Zeigt für die Dauer die kürzeste bekannte Route zu einem vertrauten Ort sowie Entfernung und Richtung dorthin. Nützlich für lange Reisen und Navigation."}, {"key": "srd-2024_find-traps", "name": "Find Traps", "level": 2, "school": "divination", "classes": ["cleric", "druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You sense any trap within range that is within line of sight. A trap, for the purpose of this spell, includes any object or mechanism that was created to cause damage or other danger. Thus, the spell would sense the Alarm or Glyph of Warding spell or a mechanical pit trap, but it wouldn't reveal a natural weakness in the floor, an unstable ceiling, or a hidden sinkhole. \n\nThis spell reveals that a trap is present but not its location. You do learn the general nature of the danger posed by a trap you sense.", "higherLevel": null, "gistDe": "Spürt die bloße Anwesenheit einer Falle in Sichtweite auf, verrät aber nicht die genaue Lage, nur die grobe Art der Gefahr. Reiner Aufklärungszauber ohne Kampfnutzen."}, {"key": "srd-2024_finger-of-death", "name": "Finger of Death", "level": 7, "school": "necromancy", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You unleash negative energy toward a creature you can see within range. The target makes a Constitution saving throw, taking 7d8 + 30 Necrotic damage on a failed save or half as much damage on a successful one. \n\nA Humanoid killed by this spell rises at the start of your next turn as a Zombie that follows your verbal orders.", "higherLevel": null, "gistDe": "Fügt einer Kreatur schweren nekrotischen Schaden zu; getötete Humanoide erheben sich als vom Zauberer kontrollierter Zombie. Starker Einzelzielangriff der oberen Stufen."}, {"key": "srd-2024_fire-bolt", "name": "Fire Bolt", "level": 0, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You hurl a mote of fire at a creature or an object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Fire damage. A flammable object hit by this spell starts burning if it isn't being worn or carried.", "higherLevel": "**Cantrip Upgrade.** The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10).", "gistDe": "Einfacher Fernkampf-Cantrip, der bei Treffer Feuerschaden verursacht und brennbare Objekte entzünden kann. Schaden wächst mit der Charakterstufe."}, {"key": "srd-2024_fire-shield", "name": "Fire Shield", "level": 4, "school": "evocation", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a bit of phosphorus or a firefly", "duration": "10 minutes", "concentration": false, "description": "Wispy flames wreathe your body for the duration, shedding Bright Light in a 10-foot radius and Dim Light for an additional 10 feet. The flames provide you with a warm shield or a chill shield, as you choose. The warm shield grants you Resistance to Cold damage, and the chill shield grants you Resistance to Fire damage. \n\nIn addition, whenever a creature within 5 feet of you hits you with a melee attack roll, the shield erupts with flame. The attacker takes 2d8 Fire damage from a warm shield or 2d8 Cold damage from a chill shield.", "higherLevel": null, "gistDe": "Umhüllt den Zauberer mit Flammen, die wahlweise Resistenz gegen Kälte oder Feuer geben und Nahkampfangreifer automatisch verbrennen. Guter Selbstschutz gegen Nahkämpfer."}, {"key": "srd-2024_fire-storm", "name": "Fire Storm", "level": 7, "school": "evocation", "classes": ["cleric", "druid", "sorcerer"], "castingTime": "1 action", "ritual": false, "range": "150 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "A storm of fire appears within range. The area of the storm consists of up to ten 10-foot Cubes, which you arrange as you like. Each Cube must be contiguous with at least one other Cube. Each creature in the area makes a Dexterity saving throw, taking 7d10 Fire damage on a failed save or half as much damage on a successful one. \n\nFlammable objects in the area that aren't being worn or carried start burning.", "higherLevel": null, "gistDe": "Erzeugt ein ausgedehntes Flammeninferno über mehrere zusammenhängende Felder, das allen darin hohen Feuerschaden zufügt. Starker Flächenangriff hoher Stufe."}, {"key": "srd-2024_fireball", "name": "Fireball", "level": 3, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "150 feet", "components": "V, S, M", "material": "a ball of bat guano and sulfur", "duration": "Instantaneous", "concentration": false, "description": "A bright streak flashes from you to a point you choose within range and then blossoms with a low roar into a fiery explosion. Each creature in a 20-foot-radius Sphere centered on that point makes a Dexterity saving throw, taking 8d6 Fire damage on a failed save or half as much damage on a successful one. Flammable objects in the area that aren't being worn or carried start burning.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 3.", "gistDe": "Erzeugt eine große Explosion an einem Zielpunkt, die allen Kreaturen im Umkreis erheblichen Feuerschaden zufügt. Einer der bekanntesten Flächenschadenszauber überhaupt."}, {"key": "srd-2024_flame-blade", "name": "Flame Blade", "level": 2, "school": "evocation", "classes": ["druid", "sorcerer"], "castingTime": "1 bonus action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a sumac leaf", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You evoke a fiery blade in your free hand. The blade is similar in size and shape to a scimitar, and it lasts for the duration. If you let go of the blade, it disappears, but you can evoke it again as a Bonus Action. \n\nAs a Magic action, you can make a melee spell attack with the fiery blade. On a hit, the target takes Fire damage equal to 3d6 plus your spellcasting ability modifier. \n\nThe flaming blade sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 2.", "gistDe": "Erschafft eine brennende Nahkampfwaffe aus reinem Feuer, mit der man angreift und die zugleich Licht spendet. Guter Nahkampf-Schadenszauber mit Lichtquelle."}, {"key": "srd-2024_flame-strike", "name": "Flame Strike", "level": 5, "school": "evocation", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a pinch of sulfur", "duration": "Instantaneous", "concentration": false, "description": "A vertical column of brilliant fire roars down from above. Each creature in a 10-foot-radius, 40-foot-high Cylinder centered on a point within range makes a Dexterity saving throw, taking 5d6 Fire damage and 5d6 Radiant damage on a failed save or half as much damage on a successful one.", "higherLevel": "**Using a Higher-Level Spell Slot.** The Fire damage and the Radiant damage increase by 1d6 for each spell slot level above 5.", "gistDe": "Lässt eine Feuersäule vom Himmel herabstürzen, die in einem Bereich sowohl Feuer- als auch Lichtschaden (Radiant) verursacht. Starker Flächenangriff mittlerer bis hoher Stufe."}, {"key": "srd-2024_flaming-sphere", "name": "Flaming Sphere", "level": 2, "school": "conjuration", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a ball of wax", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You create a 5-foot-diameter sphere of fire in an unoccupied space on the ground within range. It lasts for the duration. Any creature that ends its turn within 5 feet of the sphere makes a Dexterity saving throw, taking 2d6 Fire damage on a failed save or half as much damage on a successful one. \n\nAs a Bonus Action, you can move the sphere up to 30 feet, rolling it along the ground. If you move the sphere into a creature's space, that creature makes the save against the sphere, and the sphere stops moving for the turn. \n\nWhen you move the sphere, you can direct it over barriers up to 5 feet tall and jump it across pits up to 10 feet wide. Flammable objects that aren't being worn or carried start burning if touched by the sphere, and it sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 2.", "gistDe": "Erschafft eine rollende Feuerkugel, die nahestehende Kreaturen verbrennt und vom Zauberer über die Dauer gesteuert und bewegt werden kann."}, {"key": "srd-2024_flesh-to-stone", "name": "Flesh to Stone", "level": 6, "school": "transmutation", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a cockatrice feather", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You attempt to turn one creature that you can see within range into stone. The target makes a Constitution saving throw. On a failed save, it has the Restrained condition for the duration. On a successful save, its Speed is 0 until the start of your next turn. Constructs automatically succeed on the save. \n\nA Restrained target makes another Constitution saving throw at the end of each of its turns. If it successfully saves against this spell three times, the spell ends. If it fails its saves three times, it is turned to stone and has the Petrified condition for the duration. The successes and failures needn't be consecutive; keep track of both until the target collects three of a kind. \n\nIf you maintain your Concentration on this spell for the entire possible duration, the target is Petrified until the condition is ended by Greater Restoration or similar magic.", "higherLevel": null, "gistDe": "Versucht, eine Kreatur allmählich in Stein zu verwandeln; hält die Konzentration lange genug, wird das Ziel dauerhaft versteinert. Starker Kontrollzauber gegen einzelne Gegner."}, {"key": "srd-2024_floating-disk", "name": "Floating Disk", "level": 1, "school": "conjuration", "classes": ["wizard"], "castingTime": "1 action", "ritual": true, "range": "30 feet", "components": "V, S, M", "material": "a drop of mercury", "duration": "1 hour", "concentration": false, "description": "This spell creates a circular, horizontal plane of force, 3 feet in diameter and 1 inch thick, that floats 3 feet above the ground in an unoccupied space of your choice that you can see within range. The disk remains for the duration and can hold up to 500 pounds. If more weight is placed on it, the spell ends, and everything on the disk falls to the ground. \n\nThe disk is immobile while you are within 20 feet of it. If you move more than 20 feet away from it, the disk follows you so that it remains within 20 feet of you. It can move across uneven terrain, up or down stairs, slopes and the like, but it can't cross an elevation change of 10 feet or more. For example, the disk can't move across a 1O-foot-deep pit, nor could it leave such a pit if it was created at the bottom. \n\nIf you move more than 100 feet from the disk (typically because it can't move around an obstacle to follow you), the spell ends.", "higherLevel": null, "gistDe": "Erschafft eine schwebende, unsichtbare Kraftscheibe, die Lasten trägt und dem Zaubernden automatisch folgt. Praktisch zum Transport von Ausrüstung."}, {"key": "srd-2024_fly", "name": "Fly", "level": 3, "school": "transmutation", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a feather", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You touch a willing creature. For the duration, the target gains a Fly Speed of 60 feet and can hover. When the spell ends, the target falls if it is still aloft unless it can stop the fall.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 3.", "gistDe": "Verleiht einer berührten Kreatur für die Dauer die Fähigkeit zu fliegen. Nützlich für Mobilität, zum Überqueren von Hindernissen oder um Bodengefahren zu entgehen."}, {"key": "srd-2024_fog-cloud", "name": "Fog Cloud", "level": 1, "school": "conjuration", "classes": ["druid", "ranger", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You create a 20-foot-radius Sphere of fog centered on a point within range. The Sphere is Heavily Obscured. It lasts for the duration or until a strong wind (such as one created by Gust of Wind) disperses it.", "higherLevel": "**Using a Higher-Level Spell Slot.** The fog's radius increases by 20 feet for each spell slot level above 1.", "gistDe": "Erzeugt eine dichte Nebelkugel, die den Bereich stark vernebelt und die Sicht blockiert. Gut zum Verstecken, Fliehen oder Decken eines Rückzugs."}, {"key": "srd-2024_forbiddance", "name": "Forbiddance", "level": 6, "school": "abjuration", "classes": ["cleric"], "castingTime": "10 minutes", "ritual": true, "range": "Touch", "components": "V, S, M", "material": "ruby dust worth 1,000+ GP", "duration": "1 day", "concentration": false, "description": "You create a ward against magical travel that protects up to 40,000 square feet of floor space to a height of 30 feet above the floor. For the duration, creatures can't teleport into the area or use portals, such as those created by the Gate spell, to enter the area. The spell proofs the area against planar travel, and therefore prevents creatures from accessing the area by way of the Astral Plane, the Ethereal Plane, the Feywild, the Shadowfell, or the Plane Shift spell.\n\nIn addition, the spell damages types of creatures that you choose when you cast it. Choose one or more of the following: Aberrations, Celestials, Elementals, Fey, Fiends, and Undead. When a creature of a chosen type enters the spell's area for the first time on a turn or ends its turn there, the creature takes 5d10 Radiant or Necrotic damage (your choice when you cast this spell).\n\nYou can designate a password when you cast the spell. A creature that speaks the password as it enters the area takes no damage from the spell. \n\nThe spell's area can't overlap with the area of another Forbiddance spell. If you cast Forbiddance every day for 30 days in the same location, the spell lasts until it is dispelled, and the Material components are consumed on the last casting.", "higherLevel": null, "gistDe": "Schützt einen großen Bereich vor magischem und planarem Reisen (Teleportation, Portale) und schädigt bestimmte wählbare Kreaturentypen, die ihn betreten. Bei täglicher Wiederholung dauerhafter Ortsschutz."}, {"key": "srd-2024_forcecage", "name": "Forcecage", "level": 7, "school": "evocation", "classes": ["bard", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "100 feet", "components": "V, S, M", "material": "ruby dust worth 1,500+ GP, which the spell consumes", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "An immobile, Invisible, Cube-shaped prison composed of magical force springs into existence around an area you choose within range. The prison can be a cage or a solid box, as you choose. A prison in the shape of a cage can be up to 20 feet on a side and is made from 1/2-inch diameter bars spaced 1/2 inch apart. A prison in the shape of a box can be up to 10 feet on a side, creating a solid barrier that prevents any matter from passing through it and blocking any spells cast into or out from the area. \n\nWhen you cast the spell, any creature that is completely inside the cage's area is trapped. Creatures only partially within the area, or those too large to fit inside it, are pushed away from the center of the area until they are completely outside it. \n\nA creature inside the cage can't leave it by nonmagical means. If the creature tries to use teleportation or interplanar travel to leave, it must first make a Charisma saving throw. On a successful save, the creature can use that magic to exit the cage. On a failed save, the creature doesn't exit the cage and wastes the spell or effect. The cage also extends into the Ethereal Plane, blocking ethereal travel. This spell can't be dispelled by Dispel Magic.", "higherLevel": null, "gistDe": "Erschafft ein unsichtbares, fast unzerstörbares Gefängnis aus reiner magischer Kraft, das eingeschlossene Kreaturen kaum entkommen lässt, selbst mit Teleportation. Sehr starker Kontrollzauber hoher Stufe."}, {"key": "srd-2024_foresight", "name": "Foresight", "level": 9, "school": "divination", "classes": ["bard", "druid", "warlock", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a hummingbird feather", "duration": "8 hours", "concentration": false, "description": "You touch a willing creature and bestow a limited ability to see into the immediate future. For the duration, the target has Advantage on D20 Tests, and other creatures have Disadvantage on attack rolls against it. The spell ends early if you cast it again.", "higherLevel": null, "gistDe": "Verleiht einer Kreatur vorübergehend hellseherische Vorausahnung: bessere Erfolgschancen bei eigenen Würfen und schwerer zu treffen. Starker, lang anhaltender Einzelbuff."}, {"key": "srd-2024_freedom-of-movement", "name": "Freedom of Movement", "level": 4, "school": "abjuration", "classes": ["bard", "cleric", "druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a leather strap", "duration": "1 hour", "concentration": false, "description": "You touch a willing creature. For the duration, the target's movement is unaffected by Difficult Terrain, and spells and other magical effects can neither reduce the target's Speed nor cause the target to have the Paralyzed or Restrained conditions. The target also has a Swim Speed equal to its Speed. \n\nIn addition, the target can spend 5 feet of movement to automatically escape from nonmagical restraints, such as manacles or a creature imposing the Grappled condition on it.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 4.", "gistDe": "Schützt eine Kreatur davor, durch schwieriges Gelände, magische Fesselung oder Lähmung behindert zu werden, und erlaubt leichtes Entkommen aus nichtmagischen Fesseln."}, {"key": "srd-2024_freezing-sphere", "name": "Freezing Sphere", "level": 6, "school": "evocation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "300 feet", "components": "V, S, M", "material": "a miniature crystal sphere", "duration": "Instantaneous", "concentration": false, "description": "A frigid globe streaks from you to a point of your choice within range, where it explodes in a 60-foot-radius Sphere. Each creature in that area makes a Constitution saving throw, taking 10d6 Cold damage on failed save or half as much damage on a successful one.\n\nIf the globe strikes a body of water, it freezes the water to a depth of 6 inches over an area 30 feet square. This ice lasts for 1 minute. Creatures that were swimming on the surface of frozen water are trapped in the ice and have the Restrained condition. A trapped creature can take an action to make a Strength (Athletics) check against your spell save DC to break free.\n\nYou can refrain from firing the globe after completing the spell’s casting. If you do so, a globe about the size of a sling bullet, cool to the touch, appears in your hand. At any time, you or a creature you give the globe to can throw the globe (to a range of 40 feet) or hurl it with a sling (to the sling’s normal range). It shatters on impact, with the same effect as a normal casting of the spell. You can also set the globe down without shattering it. After 1 minute, if the globe hasn’t already shattered, it explodes.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 6.", "gistDe": "Schleudert eine Kälteexplosion, die eine große Fläche mit Kälteschaden trifft und Gewässer zu Eis gefrieren lassen kann. Starker Flächenschadenzauber mit Geländeeffekt."}, {"key": "srd-2024_gaseous-form", "name": "Gaseous Form", "level": 3, "school": "transmutation", "classes": ["sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a bit of gauze", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "A willing creature you touch shape-shifts, along with everything it's wearing and carrying, into a misty cloud for the duration. The spell ends on the target if it drops to 0 Hit Points or if it takes a Magic action to end the spell on itself. \n\nWhile in this form, the target's only method of movement is a Fly Speed of 10 feet, and it can hover. The target can enter and occupy the space of another creature. The target has Resistance to Bludgeoning, Piercing, and Slashing damage; it has Immunity to the Prone condition; and it has Advantage on Strength, Dexterity, and Constitution saving throws. The target can pass through narrow openings, but it treats liquids as though they were solid surfaces. \n\nThe target can't talk or manipulate objects, and any objects it was carrying or holding can't be dropped, used, or otherwise interacted with. Finally, the target can't attack or cast spells.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 3.", "gistDe": "Verwandelt eine willige Kreatur in eine gasförmige Wolke: sehr widerstandsfähig gegen körperlichen Schaden und in der Lage, durch Ritzen zu schlüpfen, kann aber weder kämpfen noch zaubern und ist langsam."}, {"key": "srd-2024_gate", "name": "Gate", "level": 9, "school": "conjuration", "classes": ["cleric", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a diamond worth 5,000+ GP", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You conjure a portal linking an unoccupied space you can see within range to a precise location on a different plane of existence. The portal is a circular opening, which you can make 5 to 20 feet in diameter. You can orient the portal in any direction you choose. The portal lasts for the duration, and the portal's destination is visible through it. \n\nThe portal has a front and a back on each plane where it appears. Travel through the portal is possible only by moving through its front. Anything that does so is instantly transported to the other plane, appearing in the unoccupied space nearest to the portal. Deities and other planar rulers can prevent portals created by this spell from opening in their presence or anywhere within their domains. \n\nWhen you cast this spell, you can speak the name of a specific creature (a pseudonym, title, or nickname doesn't work). If that creature is on a plane other than the one you are on, the portal opens next to the named creature and transports it to the nearest unoccupied space on your side of the portal. You gain no special power over the creature, and it is free to act as the DM deems appropriate. It might leave, attack you, or help you.", "higherLevel": null, "gistDe": "Öffnet ein Portal zu einer anderen Existenzebene, durch das man reisen kann; kann zusätzlich eine namentlich genannte Kreatur von dort herbeiholen. Extrem mächtiger Zauber der höchsten Stufe."}, {"key": "srd-2024_geas", "name": "Geas", "level": 5, "school": "enchantment", "classes": ["bard", "cleric", "druid", "paladin", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "60 feet", "components": "V", "material": null, "duration": "30 days", "concentration": false, "description": "You give a verbal command to a creature that you can see within range, ordering it to carry out some service or refrain from an action or a course of activity as you decide. The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target automatically succeeds if it can't understand your command. \n\nWhile Charmed, the creature takes 5d10 Psychic damage if it acts in a manner directly counter to your command. It takes this damage no more than once each day. \n\nYou can issue any command you choose, short of an activity that would result in certain death. Should you issue a suicidal command, the spell ends. \n\nA *Remove Curse, Greater Restoration,* or *Wish* spell ends this spell.", "higherLevel": "**Using a Higher-Level Spell Slot.** If you use a level 7 or 8 spell slot, the duration is 365 days. If you use a level 9 spell slot, the spell lasts until it is ended by one of the spells mentioned above.", "gistDe": "Erteilt einer Kreatur einen bindenden magischen Befehl, den sie befolgen muss; widersetzt sie sich, erleidet sie psychischen Schaden. Starke, lang anhaltende Zwangskontrolle."}, {"key": "srd-2024_gentle-repose", "name": "Gentle Repose", "level": 2, "school": "necromancy", "classes": ["cleric", "paladin", "wizard"], "castingTime": "1 action", "ritual": true, "range": "Touch", "components": "V, S, M", "material": "2 Copper Pieces, which the spell consumes", "duration": "10 days", "concentration": false, "description": "You touch a corpse or other remains. For the duration, the target is protected from decay and can't become Undead. \n\nThe spell also effectively extends the time limit on raising the target from the dead, since days spent under the influence of this spell don't count against the time limit of spells such as Raise Dead.", "higherLevel": null, "gistDe": "Bewahrt eine berührte Leiche vor Verwesung und verlängert dadurch die Frist, in der sie noch durch Wiederbelebungszauber zurückgeholt werden kann."}, {"key": "srd-2024_giant-insect", "name": "Giant Insect", "level": 4, "school": "conjuration", "classes": ["druid"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "You summon a giant centipede, spider, or wasp (chosen when you cast the spell). It manifests in an unoccupied space you can see within range and uses the **Giant Insect** stat block. The form you choose determines certain details in its stat block. The creature disappears when it drops to 0 Hit Points or when the spell ends. The creature is an ally to you and your allies. In combat, the creature shares your Initiative count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't issue any, it takes the Dodge action and uses its movement to avoid danger.", "higherLevel": "**Using a Higher-Level Spell Slot.** Use the spell slot's level for the spell's level in the stat block.", "gistDe": "Beschwört ein riesiges Insekt (Tausendfüßler, Spinne oder Wespe) als Kampfverbündeten, der eigene Befehle befolgt."}, {"key": "srd-2024_glibness", "name": "Glibness", "level": 8, "school": "enchantment", "classes": ["bard", "warlock"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V", "material": null, "duration": "1 hour", "concentration": false, "description": "Until the spell ends, when you make a Charisma check, you can replace the number you roll with a 15. Additionally, no matter what you say, magic that would determine if you are telling the truth indicates that you are being truthful.", "higherLevel": null, "gistDe": "Erlaubt es, Charisma-Proben durch eine feste hohe Zahl zu ersetzen, und lässt magische Lügendetektion den Zauberer stets als ehrlich erscheinen. Starker Täuschungs- und Überredungszauber."}, {"key": "srd-2024_globe-of-invulnerability", "name": "Globe of Invulnerability", "level": 6, "school": "abjuration", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self (10-foot emanation)", "components": "V, S, M", "material": "a glass bead", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "An immobile, shimmering barrier appears in a 10-foot Emanation around you and remains for the duration.\n\nAny spell of level 5 or lower cast from outside the barrier can't affect anything within it. Such a spell can target creatures and objects within the barrier, but the spell has no effect on them. Similarly, the area within the barrier is excluded from areas of effect created by such spells.", "higherLevel": "**Using a Higher-Level Spell Slot.** The barrier blocks spells of 1 level higher for each spell slot level above 6.", "gistDe": "Erschafft eine Schutzkuppel um den Zauberer, die schwächere gegnerische Zaubersprüche von außen abwehrt. Starker Schutz gegen feindliche Magie."}, {"key": "srd-2024_glyph-of-warding", "name": "Glyph of Warding", "level": 3, "school": "abjuration", "classes": ["bard", "cleric", "wizard"], "castingTime": "1 hour", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "powdered diamond worth 200+ GP, which the spell consumes", "duration": "Until dispelled or triggered", "concentration": false, "description": " You inscribe a glyph that later unleashes a magical effect. You inscribe it either on a surface (such as a table or a section of floor) or within an object that can be closed (such as a book or chest) to conceal the glyph. The glyph can cover an area no larger than 10 feet in diameter. If the surface or object is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered. The glyph is nearly imperceptible and requires a successful Wisdom (Perception) check against your spell save DC to notice. When you inscribe the glyph, you set its trigger and choose whether it's an explosive rune or a spell glyph, as explained below. \n\n**Set the Trigger.** You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph. Once a glyph is triggered, this spell ends. You can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don't trigger the glyph, such as those who say a certain password. \n\n**Explosive Rune.** When triggered, the glyph erupts with magical energy in a 20-foot-radius Sphere centered on the glyph. Each creature in the area makes a Dexterity saving throw. A creature takes 5d8 Acid, Cold, Fire, Lightning, or Thunder damage (your choice when you create the glyph) on a failed save or half as much damage on a successful one. \n\n**Spell Glyph.** You can store a prepared spell of level 3 or lower in the glyph by casting it as part of creating the glyph. The spell must target a single creature or an area. The spell being stored has no immediate effect when cast in this way. When the glyph is triggered, the stored spell takes effect. If the spell has a target, it targets the creature that triggered the glyph. If the spell affects an area, the area is centered on that creature. If the spell summons Hostile creatures or creates harmful objects or traps, they appear as close as possible to the intruder and attack it. If the spell requires Concentration, it lasts until the end of its full duration.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage of an explosive rune increases by 1d8 for each spell slot level above 3. If you create a spell glyph, you can store any spell of up to the same level as the spell slot you use for the Glyph of Warding.", "gistDe": "Versteckt eine magische Falle (Glyphe), die bei einem festgelegten Auslöser entweder explodiert oder einen zuvor gespeicherten Zauber freisetzt. Vielseitiger Sicherungs- und Fallenzauber."}, {"key": "srd-2024_goodberry", "name": "Goodberry", "level": 1, "school": "conjuration", "classes": ["druid", "ranger"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a sprig of mistletoe", "duration": "24 hours", "concentration": false, "description": "Ten berries appear in your hand and are infused with magic for the duration. A creature can take a Bonus Action to eat one berry. Eating a berry restores 1 Hit Point, and the berry provides enough nourishment to sustain a creature for one day. \n\nUneaten berries disappear when the spell ends.", "higherLevel": null, "gistDe": "Erschafft zehn magische Beeren, die je nach Verzehr eine geringe Menge Trefferpunkte heilen und für einen Tag Nahrung ersetzen. Kleiner Heil- und Versorgungszauber."}, {"key": "srd-2024_grease", "name": "Grease", "level": 1, "school": "conjuration", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a bit of pork rind or butter", "duration": "1 minute", "concentration": false, "description": "Nonflammable grease covers the ground in a 10-foot square centered on a point within range and turns it into Difficult Terrain for the duration. \n\nWhen the grease appears, each creature standing in its area must succeed on a Dexterity saving throw or have the Prone condition. A creature that enters the area or ends its turn there must also succeed on that save or fall Prone.", "higherLevel": null, "gistDe": "Bedeckt den Boden mit rutschigem, unbrennbarem Fett, das die Bewegung erschwert und Kreaturen zu Fall bringen kann."}, {"key": "srd-2024_greater-invisibility", "name": "Greater Invisibility", "level": 4, "school": "illusion", "classes": ["bard", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "A creature you touch has the Invisible condition until the spell ends.", "higherLevel": null, "gistDe": "Macht eine berührte Kreatur unsichtbar, bis der Zauber endet – auch während sie kämpft oder selbst zaubert, anders als bei einfacher Unsichtbarkeit."}, {"key": "srd-2024_greater-restoration", "name": "Greater Restoration", "level": 5, "school": "abjuration", "classes": ["bard", "cleric", "druid", "paladin", "ranger"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "diamond dust worth 100+ GP, which the spell consumes", "duration": "Instantaneous", "concentration": false, "description": "You touch a creature and magically remove one of the following effects from it: \n\n- 1 Exhaustion level \n\n- The Charmed or Petrified condition \n\n- A curse, including the target's Attunement to a cursed magic item \n\n- Any reduction to one of the target's ability scores \n\n- Any reduction to the target's Hit Point maximum.", "higherLevel": null, "gistDe": "Entfernt bei einer berührten Kreatur einen schweren Zustand: etwa Erschöpfung, Verzauberung, Versteinerung, einen Fluch oder eine dauerhafte Schwächung von Attributen bzw. maximalen Trefferpunkten."}, {"key": "srd-2024_guardian-of-faith", "name": "Guardian of Faith", "level": 4, "school": "conjuration", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V", "material": null, "duration": "8 hours", "concentration": false, "description": "A Large spectral guardian appears and hovers for the duration in an unoccupied space that you can see within range. The guardian occupies that space and is invulnerable, and it appears in a form appropriate for your deity or pantheon. \n\nAny enemy that moves to a space within 10 feet of the guardian for the first time on a turn or starts its turn there makes a Dexterity saving throw, taking 20 Radiant damage on a failed save or half as much damage on a successful one. The guardian vanishes when it has dealt a total of 60 damage.", "higherLevel": null, "gistDe": "Beschwört einen unverwundbaren, schwebenden Wächter, der nahe Feinde mit Lichtschaden angreift, bis er ein festgelegtes Gesamtschadenslimit erreicht hat."}, {"key": "srd-2024_guards-and-wards", "name": "Guards and Wards", "level": 6, "school": "abjuration", "classes": ["bard", "wizard"], "castingTime": "1 hour", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "a silver rod worth 10+ GP", "duration": "24 hours", "concentration": false, "description": "You create a ward that protects up to 2,500 square feet of floor space. The warded area can be up to 20 feet tall, and you shape it as one 50-foot square, one hundred 5-foot squares that are contiguous, or twenty-five 10-foot squares that are contiguous. When you cast this spell, you can specify individuals that are unaffected by the spell's effects. You can also specify a password that, when spoken aloud within 5 feet of the warded area, makes the speaker immune to its effects. The spell creates the effects below within the warded area. Dispel Magic has no effect on Guards and Wards itself, but each of the following effects can be dispelled. If all four are dispelled, Guards and Wards ends. If you cast the spell every day for 365 days on the same area, the spell thereafter lasts until all its effects are dispelled. \n\n**Corridors.** Fog fills all the warded corridors, making them Heavily Obscured. In addition, at each intersection or branching passage offering a choice of direction, there is a 50 percent chance that a creature other than you believes it is going in the opposite direction from the one it chooses. \n\n**Doors.** All doors in the warded area are magically locked, as if sealed by the Arcane Lock spell. In addition, you can cover up to ten doors with an illusion to make them appear as plain sections of wall. Stairs. Webs fill all stairs in the warded area from top to bottom, as in the Web spell. These strands regrow in 10 minutes if they are destroyed while Guards and Wards lasts. \n\n**Other Spell Effect.** Place one of the following magical effects within the warded area: \n\n- Dancing Lights in four corridors, with a simple program that the lights repeat as long as Guards and Wards lasts \n\n- Magic Mouth in two locations \n\n- Stinking Cloud in two locations (the vapors return within 10 minutes if dispersed while Guards and Wards lasts) \n\n- Gust of Wind in one corridor or room (the wind blows continuously while the spell lasts) \n\n- Suggestion in one 5-foot square; any creature that enters that square receives the suggestion mentally.", "higherLevel": null, "gistDe": "Belegt ein größeres Gebäude mit mehreren magischen Schutz- und Verwirrungseffekten (Nebel, verschlossene Türen, Netze auf Treppen und mehr), um Eindringlinge aufzuhalten."}, {"key": "srd-2024_guidance", "name": "Guidance", "level": 0, "school": "divination", "classes": ["cleric", "druid"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You touch a willing creature and choose a skill. Until the spell ends, the creature adds 1d4 to any ability check using the chosen skill.", "higherLevel": null, "gistDe": "Cantrip, der einer berührten Kreatur einen kleinen Bonus auf eine gewählte Fertigkeitsprobe verleiht."}, {"key": "srd-2024_guiding-bolt", "name": "Guiding Bolt", "level": 1, "school": "evocation", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "V, S", "material": null, "duration": "1 round", "concentration": false, "description": "You hurl a bolt of light toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 4d6 Radiant damage, and the next attack roll made against it before the end of your next turn has Advantage.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d6 for each spell slot level above 1.", "gistDe": "Fernkampfangriff mit Lichtschaden, der zusätzlich den nächsten Angriff eines Verbündeten gegen das getroffene Ziel begünstigt."}, {"key": "srd-2024_gust-of-wind", "name": "Gust of Wind", "level": 2, "school": "evocation", "classes": ["druid", "ranger", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Self", "components": "V, S, M", "material": "a legume seed", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "A Line of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the duration. Each creature in the Line must succeed on a Strength saving throw or be pushed 15 feet away from you in a direction following the Line. A creature that ends its turn in the Line must make the same save. \n\nAny creature in the Line must spend 2 feet of movement for every 1 foot it moves when moving closer to you.\n\nThe gust disperses gas or vapor, and it extinguishes candles and similar unprotected flames in the area. It causes protected flames, such as those of lanterns, to dance wildly and has a 50 percent chance to extinguish them. \n\nAs a Bonus Action on your later turns, you can change the direction in which the Line blasts from you.", "higherLevel": null, "gistDe": "Erzeugt eine starke Windlinie, die Kreaturen darin zurückdrängt, Bewegung gegen die Windrichtung erschwert und Flammen bzw. Nebel beeinflusst."}, {"key": "srd-2024_hallow", "name": "Hallow", "level": 5, "school": "abjuration", "classes": ["cleric"], "castingTime": "24 hours", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "incense worth 1,000+ GP, which the spell consumes", "duration": "Until dispelled", "concentration": false, "description": "You touch a point and infuse an area around it with holy or unholy power. The area can have a radius up to 60 feet, and the spell fails if the radius includes an area already under the effect of Hallow. The affected area has the following effects. \n\n**Hallowed Ward.** Choose any of these creature types: Aberration, Celestial, Elemental, Fey, Fiend, or Undead. Creatures of the chosen types can't willingly enter the area, and any creature that is possessed by or that has the Charmed or Frightened condition from such creatures isn't possessed, Charmed, or Frightened by them while in the area. \n\n**Extra Effect.** You bind an extra effect to the area from the list below:\n\n**Courage.** Creatures of any types you choose can't gain the Frightened condition while in the area. \n\n**Darkness.** Darkness fills the area. Normal light, as well as magical light created by spells of a level lower than this spell, can't illuminate the area. \n\n**Daylight.** Bright light fills the area. Magical Darkness created by spells of a level lower than this spell can't extinguish the light. \n\n**Peaceful Rest.** Dead bodies interred in the area can't be turned into Undead. \n\n**Extradimensional Interference.** Creatures of any types you choose can't enter or exit the area using teleportation or interplanar travel. \n\n**Fear.** Creatures of any types you choose have the Frightened condition while in the area. \n\n**Resistance.** Creatures of any types you choose have Resistance to one damage type of your choice while in the area. \n\n**Silence.** No sound can emanate from within the area, and no sound can reach into it. \n\n**Tongues.** Creatures of any types you choose can communicate with any other creature in the area even if they don't share a common language. \n\n**Vulnerability.** Creatures of any types you choose have Vulnerability to one damage type of your choice while in the area.", "higherLevel": null, "gistDe": "Weiht einen großen Bereich dauerhaft: hält bestimmte wählbare Kreaturentypen fern und fügt einen zusätzlichen wählbaren Effekt hinzu, etwa Licht, Furcht oder Resistenz. Starker, langfristiger Ortsschutzzauber."}, {"key": "srd-2024_hallucinatory-terrain", "name": "Hallucinatory Terrain", "level": 4, "school": "illusion", "classes": ["bard", "druid", "warlock", "wizard"], "castingTime": "10 minutes", "ritual": false, "range": "300 feet", "components": "V, S, M", "material": "a mushroom", "duration": "24 hours", "concentration": false, "description": "You make natural terrain in a 150-foot Cube in range look, sound, and smell like another sort of natural terrain. Thus, open fields or a road can be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock- strewn gully like a wide and smooth road. Manufactured structures, equipment, and creatures within the area aren't changed. \n\nThe tactile characteristics of the terrain are unchanged, so creatures entering the area are likely to notice the illusion. If the difference isn't obvious by touch, a creature examining the illusion can take the Study action to make an Intelligence (Investigation) check against your spell save DC to disbelieve it. If a creature discerns that the terrain is illusory, the creature sees a vague image superimposed on the real terrain.", "higherLevel": null, "gistDe": "Lässt natürliches Gelände optisch, akustisch und geruchlich wie eine andere Geländeart erscheinen, um Wege zu verbergen oder Fallen bzw. Hindernisse zu tarnen."}, {"key": "srd-2024_harm", "name": "Harm", "level": 6, "school": "necromancy", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "You unleash virulent magic on a creature you can see within range. The target makes a Constitution saving throw. On a failed save, it takes 14d6 Necrotic damage, and its Hit Point maximum is reduced by an amount equal to the Necrotic damage it took. On a successful save, it takes half as much damage only. This spell can't reduce a target's Hit Point maximum below 1.", "higherLevel": null, "gistDe": "Fügt einer Kreatur sehr hohen nekrotischen Schaden zu und verringert dauerhaft deren maximale Trefferpunkte entsprechend. Einer der stärksten reinen Einzelziel-Schadenszauber."}, {"key": "srd-2024_haste", "name": "Haste", "level": 3, "school": "transmutation", "classes": ["sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a shaving of licorice root", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Choose a willing creature that you can see within range. Until the spell ends, the target's Speed is doubled, it gains a +2 bonus to Armor Class, it has Advantage on Dexterity saving throws, and it gains an additional action on each of its turns. That action can be used to take only the Attack (one attack only), Dash, Disengage, Hide, or Utilize action. \n\nWhen the spell ends, the target is Incapacitated and has a Speed of 0 until the end of its next turn, as a wave of lethargy washes over it.", "higherLevel": null, "gistDe": "Beschleunigt eine willige Kreatur erheblich: doppelte Geschwindigkeit, bessere Rüstung und eine zusätzliche Handlung pro Runde; nach Zauberende ist das Ziel kurz handlungsunfähig."}, {"key": "srd-2024_heal", "name": "Heal", "level": 6, "school": "abjuration", "classes": ["cleric", "druid"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "Choose a creature that you can see within range. Positive energy washes through the target, restoring 70 Hit Points. This spell also ends the Blinded, Deafened, and Poisoned conditions on the target.", "higherLevel": "**Using a Higher-Level Spell Slot.** The healing increases by 10 for each spell slot level above 6.", "gistDe": "Heilt eine Kreatur um eine große Menge Trefferpunkte und beseitigt zugleich Blindheit, Taubheit und Vergiftung. Starker Einzelziel-Heilzauber."}, {"key": "srd-2024_healing-word", "name": "Healing Word", "level": 1, "school": "abjuration", "classes": ["bard", "cleric", "druid"], "castingTime": "1 bonus action", "ritual": false, "range": "60 feet", "components": "V", "material": null, "duration": "Instantaneous", "concentration": false, "description": "A creature of your choice that you can see within range regains Hit Points equal to 2d4 plus your spellcasting ability modifier.", "higherLevel": "**Using a Higher-Level Spell Slot.** The healing increases by 2d4 for each spell slot level above 1.", "gistDe": "Heilt aus der Ferne eine Kreatur um eine kleine Menge Trefferpunkte, ohne dass Berührung nötig ist. Schneller Notheilzauber, der wenig Aufwand kostet."}, {"key": "srd-2024_heat-metal", "name": "Heat Metal", "level": 2, "school": "transmutation", "classes": ["bard", "druid"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a piece of iron and a flame", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Choose a manufactured metal object, such as a metal weapon or a suit of Heavy or Medium metal armor, that you can see within range. You cause the object to glow red-hot. Any creature in physical contact with the object takes 2d8 Fire damage when you cast the spell. Until the spell ends, you can take a Bonus Action on each of your later turns to deal this damage again if the object is within range. \n\nIf a creature is holding or wearing the object and takes the damage from it, the creature must succeed on a Constitution saving throw or drop the object if it can. If it doesn't drop the object, it has Disadvantage on attack rolls and ability checks until the start of your next turn.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d8 for each spell slot level above 2.", "gistDe": "Erhitzt ein Metallobjekt wie eine Waffe oder Rüstung rotglühend, sodass der Träger Feuerschaden erleidet und das Objekt möglicherweise fallen lässt."}, {"key": "srd-2024_hellish-rebuke", "name": "Hellish Rebuke", "level": 1, "school": "evocation", "classes": ["warlock"], "castingTime": "1 reaction, which you take in response to taking damage from a creature that you can see within 60 feet of yourself", "ritual": false, "range": "60 feet", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "The creature that damaged you is momentarily surrounded by green flames. It makes a Dexterity saving throw, taking 2d10 Fire damage on a failed save or half as much damage on a successful one.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d10 for each spell slot level above 1.", "gistDe": "Reaktionszauber, der einem Angreifer, der den Zauberer soeben getroffen hat, mit Flammen antwortet und ihm Feuerschaden zufügt."}, {"key": "srd-2024_heroes-feast", "name": "Heroes' Feast", "level": 6, "school": "conjuration", "classes": ["bard", "cleric", "druid"], "castingTime": "10 minutes", "ritual": false, "range": "Self (10-foot cube)", "components": "V, S, M", "material": "a gem-encrusted bowl worth 1,000+ GP, which the spell consumes", "duration": "Instantaneous", "concentration": false, "description": "You conjure a feast that appears on a surface in an unoccupied 10- foot Cube next to you. The feast takes 1 hour to consume and disappears at the end of that time, and the beneficial effects don't set in until this hour is over. Up to twelve creatures can partake of the feast. \n\nA creature that partakes gains several benefits, which last for 24 hours. The creature has Resistance to Poison damage, and it has Immunity to the Frightened and Poisoned conditions. Its Hit Point maximum also increases by 2d10, and it gains the same number of Hit Points.", "higherLevel": null, "gistDe": "Beschwört ein Festmahl, das mehreren teilnehmenden Kreaturen für 24 Stunden Immunität gegen Furcht und Gift sowie mehr maximale Trefferpunkte verleiht."}, {"key": "srd-2024_heroism", "name": "Heroism", "level": 1, "school": "enchantment", "classes": ["bard", "paladin"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to the Frightened condition and gains Temporary Hit Points equal to your spellcasting ability modifier at the start of each of its turns.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 1.", "gistDe": "Macht eine berührte Kreatur für die Dauer furchtlos und verleiht ihr zu Rundenbeginn zusätzliche temporäre Trefferpunkte."}, {"key": "srd-2024_hex", "name": "Hex", "level": 1, "school": "enchantment", "classes": ["warlock"], "castingTime": "1 bonus action", "ritual": false, "range": "90 feet", "components": "V, S, M", "material": "the petrified eye of a newt", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You place a curse on a creature that you can see within range. Until the spell ends, you deal an extra 1d6 Necrotic damage to the target whenever you hit it with an attack roll. Also, choose one ability when you cast the spell. The target has Disadvantage on ability checks made with the chosen ability. \n\nIf the target drops to 0 Hit Points before this spell ends, you can use a Bonus Action on a later turn to curse a new creature.", "higherLevel": "**Using a Higher-Level Spell Slot.** Your Concentration can last longer with a spell slot of level 2 (up to 4 hours), 3-4 (up to 8 hours), or 5+ (24 hours).", "gistDe": "Verflucht eine Kreatur: zusätzlicher nekrotischer Schaden bei eigenen Treffern und ein erschwerter Attributswert für das Ziel; der Fluch kann bei Bedarf auf ein neues Ziel übertragen werden."}, {"key": "srd-2024_hideous-laughter", "name": "Hideous Laughter", "level": 1, "school": "enchantment", "classes": ["bard", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a tart and a feather", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "One creature of your choice that you can see within range makes a Wisdom saving throw. On a failed save, it has the Prone and Incapacitated conditions for the duration. During that time, it laughs uncontrollably if it's capable of laughter, and it can't end the Prone condition on it self. \n\nAt the end of each of its turns and each time it takes damage, it makes another Wisdom saving throw. The target has Advantage on the save if the save is triggered by damage. On a successful save, the spell ends.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 1.", "gistDe": "Lässt ein Ziel bei misslungenem Rettungswurf unkontrolliert lachen; es liegt am Boden und ist handlungsunfähig, bis ein erneuter Rettungswurf gelingt."}, {"key": "srd-2024_hold-monster", "name": "Hold Monster", "level": 5, "school": "enchantment", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "90 feet", "components": "V, S, M", "material": "a straight piece of iron", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Choose a creature that you can see within range. The target must succeed on a Wisdom saving throw or have the Paralyzed condition for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 5.", "gistDe": "Lähmt eine beliebige Kreatur, sofern ihr Willenswurf misslingt; sie darf am Ende jeder eigenen Runde erneut würfeln, um sich zu befreien."}, {"key": "srd-2024_hold-person", "name": "Hold Person", "level": 2, "school": "enchantment", "classes": ["bard", "cleric", "druid", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "V, S, M", "material": "a straight piece of iron", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "Choose a Humanoid that you can see within range. The target must succeed on a Wisdom saving throw or have the Paralyzed condition for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional Humanoid for each spell slot level above 2.", "gistDe": "Wie Hold Monster, aber beschränkt auf humanoide Ziele: lähmt sie bei misslungenem Rettungswurf, bis sie sich freiwürfelt."}, {"key": "srd-2024_holy-aura", "name": "Holy Aura", "level": 8, "school": "abjuration", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "Self (30-foot emanation)", "components": "V, S, M", "material": "a reliquary worth 1,000+ GP", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "For the duration, you emit an aura in a 30-foot Emanation. While in the aura, creatures of your choice have Advantage on all saving throws, and other creatures have Disadvantage on attack rolls against them. In addition, when a Fiend or an Undead hits an affected creature with a melee attack roll, the attacker must succeed on a Constitution saving throw or have the Blinded condition until the end of its next turn.", "higherLevel": null, "gistDe": "Umgibt mehrere gewählte Kreaturen mit einer Aura, die ihre Rettungswürfe verbessert und gegnerische Treffer erschwert; Dämonen oder Untote, die sie treffen, riskieren dabei geblendet zu werden."}, {"key": "srd-2024_hunter-s-mark", "name": "Hunter's Mark", "level": 1, "school": "divination", "classes": ["ranger"], "castingTime": "1 bonus action", "ritual": false, "range": "90 feet", "components": "V", "material": null, "duration": "Concentration, up to 1 hour", "concentration": true, "description": "You magically mark one creature you can see within range as your quarry. Until the spell ends, you deal an extra 1d6 Force damage to the target whenever you hit it with an attack roll. You also have Advantage on any Wisdom (Perception or Survival) check you make to find it. \n\nIf the target drops to 0 Hit Points before this spell ends, you can use a Bonus Action to mark a new creature you can see within range.", "higherLevel": "**Using a Higher-Level Spell Slot.** Your Concentration can last longer with a spell slot of level 3-4 (up to 8 hours) or 5+ (up to 24 hours).", "gistDe": "Markiert eine Kreatur als Beute: zusätzlicher Schaden bei eigenen Treffern gegen sie und bessere Chancen, sie wiederzufinden; die Markierung kann bei Bedarf auf ein neues Ziel übertragen werden."}, {"key": "srd-2024_hypnotic-pattern", "name": "Hypnotic Pattern", "level": 3, "school": "illusion", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "120 feet", "components": "S, M", "material": "a pinch of confetti", "duration": "Concentration, up to 1 minute", "concentration": true, "description": "You create a twisting pattern of colors in a 30-foot Cube within range. The pattern appears for a moment and vanishes. Each creature in the area who can see the pattern must succeed on a Wisdom saving throw or have the Charmed condition for the duration. While Charmed, the creature has the Incapacitated condition and a Speed of 0. \n\nThe spell ends for an affected creature if it takes any damage or if someone else uses an action to shake the creature out of its stupor.", "higherLevel": null, "gistDe": "Erschafft ein hypnotisierendes Farbmuster, das Kreaturen im Bereich bewegungsunfähig und wehrlos macht, bis sie Schaden erleiden oder wachgerüttelt werden."}, {"key": "srd-2024_ice-knife", "name": "Ice Knife", "level": 1, "school": "conjuration", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "60 feet", "components": "S, M", "material": "a drop of water or a piece of ice", "duration": "Instantaneous", "concentration": false, "description": "You create a shard of ice and fling it at one creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Piercing damage. Hit or miss, the shard then explodes. The target and each creature within 5 feet of it must succeed on a Dexterity saving throw or take 2d6 Cold damage.", "higherLevel": "**Using a Higher-Level Spell Slot.** The Cold damage increases by 1d6 for each spell slot level above 1.", "gistDe": "Schleudert einen Eissplitter, der bei Treffer Stichschaden verursacht und danach explodiert, wodurch Ziel und Umstehende zusätzlich Kälteschaden erleiden."}, {"key": "srd-2024_ice-storm", "name": "Ice Storm", "level": 4, "school": "evocation", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "300 feet", "components": "V, S, M", "material": "a mitten", "duration": "Instantaneous", "concentration": false, "description": "Hail falls in a 20-foot-radius, 40-foot-high Cylinder centered on a point within range. Each creature in the Cylinder makes a Dexterity saving throw. A creature takes 2d10 Bludgeoning damage and 4d6 Cold damage on a failed save or half as much damage on a successful one. \n\nHailstones turn ground in the Cylinder into Difficult Terrain until the end of your next turn.", "higherLevel": "**Using a Higher-Level Spell Slot.** The Bludgeoning damage increases by 1d10 for each spell slot level above 4.", "gistDe": "Lässt in einem zylindrischen Bereich Hagel niedergehen, der Wucht- und Kälteschaden verursacht und den Boden vorübergehend zu schwierigem Gelände macht."}, {"key": "srd-2024_identify", "name": "Identify", "level": 1, "school": "divination", "classes": ["bard", "wizard"], "castingTime": "1 minute", "ritual": true, "range": "Touch", "components": "V, S, M", "material": "a pearl worth 100+ GP", "duration": "Instantaneous", "concentration": false, "description": "You touch an object throughout the spell's casting. If the object is a magic item or some other magical object, you learn its properties and how to use them, whether it requires Attunement, and how many charges it has, if any. You learn whether any ongoing spells are affecting the item and what they are. If the item was created by a spell, you learn that spell's name. \n\nIf you instead touch a creature throughout the casting, you learn which ongoing spells, if any, are currently affecting it.", "higherLevel": null, "gistDe": "Enthüllt durch Berühren die magischen Eigenschaften eines Gegenstands oder verrät, welche Zauber gerade auf einer Kreatur wirken."}, {"key": "srd-2024_illusory-script", "name": "Illusory Script", "level": 1, "school": "illusion", "classes": ["bard", "warlock", "wizard"], "castingTime": "1 minute", "ritual": true, "range": "Touch", "components": "S, M", "material": "ink worth 10+ GP, which the spell consumes", "duration": "10 days", "concentration": false, "description": "You write on parchment, paper, or another suitable material and imbue it with an illusion that lasts for the duration. To you and any creatures you designate when you cast the spell, the writing appears normal, seems to be written in your hand, and conveys whatever meaning you intended when you wrote the text. To all others, the writing appears as if it were written in an unknown or magical script that is unintelligible. Alternatively, the illusion can alter the meaning, handwriting, and language of the text, though the language must be one you know. If the spell is dispelled, the original script and the illusion both disappear. \n\nA creature that has Truesight can read the hidden message.", "higherLevel": null, "gistDe": "Verschleiert einen geschriebenen Text so, dass nur ausgewählte Leser ihn normal lesen können, während er allen anderen unleserlich oder mit anderer Bedeutung erscheint."}, {"key": "srd-2024_imprisonment", "name": "Imprisonment", "level": 9, "school": "abjuration", "classes": ["warlock", "wizard"], "castingTime": "1 minute", "ritual": false, "range": "30 feet", "components": "V, S, M", "material": "a statuette of the target worth 5,000+ GP", "duration": "Until dispelled", "concentration": false, "description": "You create a magical restraint to hold a creature that you can see within range. The target must make a Wisdom saving throw. On a successful save, the target is unaffected, and it is immune to this spell for the next 24 hours. On a failed save, the target is imprisoned. While imprisoned, the target doesn't need to breathe, eat, or drink, and it doesn't age. Divination spells can't locate or perceive the imprisoned target, and the target can't teleport. Until the spell ends, the target is also affected by one of the following effects of your choice: \n\n**Burial.** The target is entombed beneath the earth in a hollow globe of magical force that is just large enough to contain the target. Nothing can pass into or out of the globe. \n\n**Chaining.** Chains firmly rooted in the ground hold the target in place. The target has the Restrained condition and can't be moved by any means. \n\n**Hedged Prison.** The target is trapped in a demiplane that is warded against teleportation and planar travel. The demiplane is your choice of a labyrinth, a cage, a tower, or the like. \n\n**Minimus Containment.** The target becomes 1 inch tall and is trapped inside an indestructible gemstone or a similar object. Light can pass through the gemstone (allowing the target to see out and other creatures to see in), but nothing else can pass through by any means. \n\n**Slumber.** The target has the Unconscious condition and can't be awoken. \n\n**Ending the Spell.** When you cast the spell, specify a trigger that will end it. The trigger can be as simple or as elaborate as you choose, but the DM must agree that it has a high likelihood of happening within the next decade. The trigger must be an observable action, such as someone making a particular offering at the temple of your god, saving your true love, or defeating a specific monster. \n\nA Dispel Magic spell can end the spell only if it is cast with a level 9 spell slot, targeting either the prison or the component used to create it.", "higherLevel": null, "gistDe": "Sperrt eine Kreatur dauerhaft ein, etwa durch Vergraben, Ketten, eine Zwischenwelt-Zelle, Miniaturisierung oder Dauerschlaf, bis ein festgelegter Auslöser eintritt. Extrem mächtiger Bannzauber."}, {"key": "srd-2024_incendiary-cloud", "name": "Incendiary Cloud", "level": 8, "school": "conjuration", "classes": ["druid", "sorcerer", "wizard"], "castingTime": "1 action", "ritual": false, "range": "150 feet", "components": "V, S", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "A swirling cloud of embers and smoke fills a 20-foot-radius Sphere centered on a point within range. The cloud's area is Heavily Obscured. It lasts for the duration or until a strong wind (like that created by Gust of Wind) disperses it. \n\nWhen the cloud appears, each creature in it makes a Dexterity saving throw, taking 10d8 Fire damage on a failed save or half as much damage on a successful one. A creature must also make this save when the Sphere moves into its space and when it enters the Sphere or ends its turn there. A creature makes this save only once per turn. \n\nThe cloud moves 10 feet away from you in a direction you choose at the start of each of your turns.", "higherLevel": null, "gistDe": "Erschafft eine treibende Wolke aus Glut und Rauch, die die Sicht blockiert und Kreaturen darin wiederholt hohen Feuerschaden zufügt."}, {"key": "srd-2024_inflict-wounds", "name": "Inflict Wounds", "level": 1, "school": "necromancy", "classes": ["cleric"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S", "material": null, "duration": "Instantaneous", "concentration": false, "description": "A creature you touch makes a Constitution saving throw, taking 2d10 Necrotic damage on a failed save or half as much damage on a successful one.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d10 for each spell slot level above 1.", "gistDe": "Berührungsangriff, der bei misslungenem Rettungswurf starken nekrotischen Schaden verursacht. Einfacher, kraftvoller Nahkampf-Schadenszauber."}, {"key": "srd-2024_insect-plague", "name": "Insect Plague", "level": 5, "school": "conjuration", "classes": ["cleric", "druid", "sorcerer"], "castingTime": "1 action", "ritual": false, "range": "300 feet", "components": "V, S, M", "material": "a locust", "duration": "Concentration, up to 10 minutes", "concentration": true, "description": "Swarming locusts fill a 20-foot-radius Sphere centered on a point you choose within range. The Sphere remains for the duration, and its area is Lightly Obscured and Difficult Terrain. \n\nWhen the swarm appears, each creature in it makes a Constitution saving throw, taking 4d10 Piercing damage on a failed save or half as much damage on a successful one. A creature also makes this save when it enters the spell's area for the first time on a turn or ends its turn there. A creature makes this save only once per turn.", "higherLevel": "**Using a Higher-Level Spell Slot.** The damage increases by 1d10 for each spell slot level above 5.", "gistDe": "Lässt einen Schwarm Heuschrecken in einem großen Bereich erscheinen, der die Sicht erschwert, das Gelände behindert und wiederholt Stichschaden zufügt."}, {"key": "srd-2024_instant-summons", "name": "Instant Summons", "level": 6, "school": "conjuration", "classes": ["wizard"], "castingTime": "1 minute", "ritual": true, "range": "Touch", "components": "V, S, M", "material": "a sapphire worth 1,000+ GP", "duration": "Until dispelled", "concentration": false, "description": "You touch the sapphire used in the casting and an object weighing 10 pounds or less whose longest dimension is 6 feet or less. The spell leaves an Invisible mark on that object and invisibly inscribes the object’s name on the sapphire. Each time you cast this spell, you must use a different sapphire.\n\nThereafter, you can take a Magic action to speak the object’s name and crush the sapphire. The object instantly appears in your hand regardless of physical or planar distances, and the spell ends.\n\nIf another creature is holding or carrying the object, crushing the sapphire doesn’t transport it, but instead you learn who that creature is and where that creature is currently located.", "higherLevel": null, "gistDe": "Markiert einen Gegenstand magisch, sodass er später jederzeit sofort in die eigene Hand herbeigerufen werden kann."}, {"key": "srd-2024_invisibility", "name": "Invisibility", "level": 2, "school": "illusion", "classes": ["bard", "sorcerer", "warlock", "wizard"], "castingTime": "1 action", "ritual": false, "range": "Touch", "components": "V, S, M", "material": "an eyelash in gum arabic", "duration": "Concentration, up to 1 hour", "concentration": true, "description": "A creature you touch has the Invisible condition until the spell ends. The spell ends early immediately after the target makes an attack roll, deals damage, or casts a spell.", "higherLevel": "**Using a Higher-Level Spell Slot.** You can target one additional creature for each spell slot level above 2.", "gistDe": "Macht eine berührte Kreatur unsichtbar, bis sie angreift, Schaden verursacht oder zaubert. Klassischer Zauber zum Schleichen oder Entkommen."}, {"key": "srd-2024_irresistible-dance", "name": "Irresistible Dance", "level": 6, "school": "enchantment", "classes": ["bard", "wizard"], "castingTime": "1 action", "ritual": false, "range": "30 feet", "components": "V", "material": null, "duration": "Concentration, up to 1 minute", "concentration": true, "description": "One creature that you can see within range must make a Wisdom saving throw. On a successful save, the target dances comically until the end of its next turn, during which it must spend all its movement to dance in place.\n\nOn a failed save, the target has the Charmed condition for the duration. While Charmed, the target dances comically, must use all its movement to dance in place, and has Disadvantage on Dexterity saving throws and attack rolls, and other creatures have
