<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charakterkompendium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment: #e8dcb8; --parchment-light: #f3ead1; --panel: #f7f1dc;
    --ink: #2c2013; --ink-soft: #52432c; --line: #a68e5c; --line-soft: #cdb989;
    --wine: #6f1f3a; --wine-deep: #4d1327; --ember: #b5651d; --ember-light: #d98c3f;
    --danger: #a33;
  }
  :root:not([data-theme="light"]){
    --parchment: #e8dcb8; --parchment-light: #f3ead1; --panel: #f7f1dc;
    --ink: #2c2013; --ink-soft: #52432c; --line: #a68e5c; --line-soft: #cdb989;
    --wine: #6f1f3a; --wine-deep: #4d1327; --ember: #b5651d; --ember-light: #d98c3f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --parchment: #1d1712; --parchment-light: #241c15; --panel: #29211a;
      --ink: #ecdfc2; --ink-soft: #c9b78f; --line: #6b5a3a; --line-soft: #453a27;
      --wine: #d8577d; --wine-deep: #a63a5c; --ember: #e2984f; --ember-light: #f0b877;
    }
  }
  :root[data-theme="dark"]{
    --parchment: #1d1712; --parchment-light: #241c15; --panel: #29211a;
    --ink: #ecdfc2; --ink-soft: #c9b78f; --line: #6b5a3a; --line-soft: #453a27;
    --wine: #d8577d; --wine-deep: #a63a5c; --ember: #e2984f; --ember-light: #f0b877;
  }
  *{box-sizing:border-box;}
  /* Nur waehrend der PDF-Erstellung aktiv (siehe doExportPdf) — schrumpft die Basis-
     Schriftgroesse global auf ~11px, damit mehr Inhalt pro Seite passt (wie bei Kien). */
  html,body{ margin:0; }
  body{
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Crimson Pro', Georgia, 'Times New Roman', serif;
    font-size: 16px;
    line-height: 1.5;
    padding: 20px 16px 60px;
  }
  .wrap{ max-width: 980px; margin: 0 auto; }
  h1,h2,h3{ font-family:'Cinzel', serif; color:var(--wine); margin:0; }
  a{ color:var(--wine); }

  /* ---- Topbar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    border:2px solid var(--line); border-radius:6px; background:var(--panel);
    padding:14px 18px; margin-bottom:18px;
  }
  .topbar h1{ font-size:1.5rem; }
  .topbar .sub{ font-size:0.85rem; color:var(--ink-soft); font-style:italic; margin-top:2px; }
  .topbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---- Buttons ---- */
  .btn{
    font-family:'Crimson Pro', serif; font-size:0.95rem; font-weight:600;
    border-radius:5px; padding:8px 16px; cursor:pointer; border:1.5px solid var(--wine);
    background:transparent; color:var(--wine); transition:background .15s;
  }
  .btn:hover{ background: rgba(111,31,58,0.08); }
  .btn.primary{ background:var(--wine); color:var(--parchment-light); }
  .btn.primary:hover{ background:var(--wine-deep); }
  .btn.danger{ border-color:var(--danger); color:var(--danger); }
  .btn.danger:hover{ background: rgba(163,51,51,0.08); }
  .btn.small{ padding:5px 10px; font-size:0.82rem; }
  .confirm-inline{ font-size:0.85rem; color:var(--danger); font-weight:600; align-self:center; }

  /* ---- List view ---- */
  .searchbar{ margin-bottom:14px; }
  .searchbar input{ width:100%; }
  .char-list{ display:flex; flex-direction:column; gap:8px; }
  .char-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1px solid var(--line-soft); border-radius:6px; background:var(--panel);
    padding:12px 16px; cursor:pointer; transition:border-color .15s;
  }
  .char-row:hover{ border-color:var(--wine); }
  .char-row .name{ font-family:'Cinzel', serif; font-weight:600; font-size:1.05rem; color:var(--wine); }
  .char-row .meta{ font-size:0.85rem; color:var(--ink-soft); font-style:italic; margin-top:2px; }
  .char-row .row-actions{ display:flex; gap:6px; flex-shrink:0; }
  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft); font-style:italic;
    border:1.5px dashed var(--line-soft); border-radius:8px;
  }

  /* ---- Forms ---- */
  fieldset{
    border:1px solid var(--line-soft); border-radius:6px; padding:14px 16px 18px; margin-bottom:16px; background:var(--panel);
  }
  legend{ font-family:'Cinzel', serif; color:var(--wine); font-weight:600; font-size:0.95rem; padding:0 8px; }
  label{ display:block; font-size:0.8rem; color:var(--ink-soft); margin-bottom:3px; }
  input[type=text], input[type=number], textarea, select{
    font-family:'Crimson Pro', serif; font-size:0.95rem; color:var(--ink);
    background:var(--parchment-light); border:1px solid var(--line-soft); border-radius:4px;
    padding:6px 8px; width:100%;
  }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--wine); outline-offset:1px; }
  textarea{ font-family:'Crimson Pro', monospace; font-size:0.88rem; resize:vertical; min-height:80px; line-height:1.4; }
  .field{ margin-bottom:10px; }
  .field-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .field-row .field{ flex:1 1 140px; min-width:120px; }
  .hint{ font-size:0.72rem; color:var(--ink-soft); font-style:italic; margin-top:3px; }
  .ability-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
  .save-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
  .save-grid label{ display:flex; align-items:center; gap:6px; font-size:0.9rem; color:var(--ink); }
  .skill-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px 16px; }
  .skill-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:0.88rem; }
  .skill-row select{ width:auto; min-width:100px; }
  .slots-grid{ display:grid; grid-template-columns:repeat(9,1fr); gap:6px; }
  .slots-grid .field label{ font-size:0.68rem; text-align:center; }
  .slots-grid input{ text-align:center; padding:4px; }
  .form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
  .error-text{ color:var(--danger); font-size:0.85rem; margin:6px 0 0; }
  .info-box{ background:var(--parchment-light); border:1px solid var(--ember); border-radius:5px; padding:10px 14px; margin-bottom:16px; font-size:0.85rem; color:var(--ink-soft); }
  .global-error{ background:#fbe4e4; border:1px solid var(--danger); color:var(--danger); padding:10px 14px; border-radius:6px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:0.88rem; }

  /* ---- Sheet (reused character-sheet look) ---- */
  header.sheet-head{
    border: 2px solid var(--line); border-radius: 6px; background: var(--panel);
    padding: 18px 24px; margin-bottom: 16px; position: relative;
  }
  header.sheet-head h1{ font-size:1.9rem; margin-bottom:3px; }
  .subline{ font-size: 1rem; color: var(--ink-soft); font-style: italic; }
  .header-meta{ display:flex; flex-wrap:wrap; gap:20px; margin-top:12px; font-size:0.9rem; }
  .header-meta div{ min-width:100px; }
  .header-meta .label{ display:block; color:var(--ink-soft); font-size:0.7rem; margin-bottom:1px; }
  .header-meta .val{ font-weight:600; }

  .grid{ display:grid; grid-template-columns:260px 1fr; gap:16px; }
  @media (max-width: 700px){ .grid{ grid-template-columns:1fr; } }

  .panel{ background:var(--panel); border:1px solid var(--line-soft); border-radius:6px; padding:14px 16px; margin-bottom:14px; }
  .panel > h2{ font-family:'Cinzel', serif; font-size:0.95rem; font-weight:600; color:var(--wine); margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line-soft); }

  .abilities{ display:flex; flex-direction:column; gap:7px; }
  .ability-box{ display:grid; grid-template-columns: 1fr 56px 48px; align-items:center; column-gap:8px; border:1px solid var(--line-soft); border-radius:5px; padding:7px 10px; background:var(--parchment-light); }
  .ability-box .nm{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .ability-box .sc{ font-size:0.8rem; color:var(--ink-soft); text-align:right; }
  .ability-box .md{ font-family:'Cinzel', serif; font-weight:700; font-size:1.1rem; color:var(--wine); text-align:right; }

  table.plain{ width:100%; border-collapse:collapse; font-size:0.9rem; }
  table.plain td, table.plain th{ padding:4px 4px; text-align:left; }
  table.plain thead th{ border-bottom:1px solid var(--line-soft); color:var(--ink-soft); font-weight:600; font-size:0.75rem; }
  table.plain tbody tr + tr td{ border-top:1px solid rgba(166,142,92,0.25); }
  .mod-col{ text-align:right; font-weight:600; white-space:nowrap; }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; border:1.3px solid var(--wine); margin-right:5px; }
  .dot.f1{ background:var(--wine); }
  .dot.f2{ background:var(--ember); border-color:var(--ember); }

  .vitals{ display:flex; gap:10px; margin-bottom:14px; }
  .vitals .vital-box{ flex:1; min-width:0; }
  @media (max-width:620px){ .vitals{ flex-wrap:wrap; } .vitals .vital-box{ flex:1 1 40%; } }
  .vital-box{ background:var(--panel); border:1px solid var(--line-soft); border-radius:6px; text-align:center; padding:10px 6px; }
  .vital-box .big{ font-family:'Cinzel', serif; font-weight:700; font-size:1.45rem; color:var(--wine); }
  .vital-box .cap{ font-size:0.68rem; color:var(--ink-soft); margin-top:3px; }

  .tag{ display:inline-block; font-size:0.7rem; color:var(--ink-soft); border:1px solid var(--line-soft); border-radius:10px; padding:1px 7px; margin-right:4px; }
  .note{ font-size:0.78rem; color:var(--ink-soft); font-style:italic; margin-top:6px; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ font-size:0.85rem; border:1px solid var(--line-soft); border-radius:5px; padding:3px 9px; background:var(--parchment-light); }
  .chip em{ font-style:normal; color:var(--wine); font-weight:600; font-size:0.85em; margin-left:4px; }
  .two-col{ columns: 2; column-gap: 24px; }
  .two-col .feature{ break-inside: avoid; -webkit-column-break-inside: avoid; }
  @media (max-width:620px){ .two-col{ columns: 1; } }
  .feature{ margin-bottom:9px; }
  .feature .fn{ font-weight:600; color:var(--wine); }
  .feature .fn .orig{ font-weight:400; font-style:italic; color:var(--ink-soft); font-size:0.85em; }
  .feature .fd{ color:var(--ink-soft); font-size:0.88rem; }
  .spell-level-title{ font-weight:600; color:var(--ink-soft); font-size:0.8rem; margin:10px 0 4px; display:flex; align-items:center; gap:8px; }
  .spell-level-title::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
  .spell-list{ display:flex; flex-wrap:wrap; gap:6px 10px; margin:0; padding:0; list-style:none; }
  .spell-list li{ font-size:0.88rem; }
  .spell-list li .orig{ color:var(--ink-soft); font-size:0.76rem; font-style:italic; }
  .slots{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .slot-group{ text-align:center; }
  .slot-group .lvl{ font-size:0.7rem; color:var(--ink-soft); }
  .pip{ display:inline-block; width:10px; height:10px; border-radius:50%; border:1.3px solid var(--ember); background:var(--ember); margin:3px 2px 0; }

  .appendix{ margin-top:26px; }
  .app-title{ font-size:1.5rem; }
  .spell-card{ border:1px solid var(--line-soft); border-radius:6px; background:var(--panel); padding:11px 15px; margin-bottom:9px; }
  .spell-card h3{ font-family:'Cinzel', serif; font-size:1rem; color:var(--wine); margin:0 0 2px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; align-items:baseline; }
  .spell-card h3 .orig{ font-size:0.78rem; color:var(--ink-soft); font-style:italic; font-family:'Crimson Pro', serif; font-weight:400; }
  .spell-meta{ font-size:0.78rem; color:var(--ink-soft); margin-bottom:5px; }
  .spell-meta span{ margin-right:13px; }
  .spell-desc{ font-size:0.92rem; }
  .level-heading{ font-family:'Cinzel', serif; color:var(--wine); font-size:1.02rem; margin:20px 0 10px; padding-bottom:5px; border-bottom:2px solid var(--line-soft); }

  .sheet-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; padding:0; font-size:12pt; }
    .grid{ display:block; overflow:hidden; } /* overflow:hidden hier als Clearfix, s.u. */
    .grid > div:first-child{ float:left; width:31%; box-sizing:border-box; padding-right:14px; }
    .grid > div:last-child{ float:right; width:67%; box-sizing:border-box; }
    .panel, .vital-box, .spell-card, .feature, header.sheet-head, .ability-box{ page-break-inside: avoid; break-inside: avoid; }
    .features-panel{ page-break-before: always; break-before: page; }
    .two-col{ columns: 1; } /* Mehrspaltenlayout + Umbruch ueber mehrere Seiten ist bei langen Merkmale-Listen unzuverlaessig — beim Drucken lieber einspaltig, aber garantiert sauber */
    .appendix{ page-break-before: always; break-before: page; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <p style="text-align:center;color:var(--ink-soft);font-style:italic;">Lade Charakterkompendium…</p>
</div>

<script>

/* ============== Daten & Hilfsfunktionen ============== */
const ABILS = [['str','Stärke'],['dex','Geschicklichkeit'],['con','Konstitution'],['int','Intelligenz'],['wis','Weisheit'],['cha','Charisma']];
const SKILLS = [
  ['acr','Akrobatik','dex'],['ani','Mit Tieren umgehen','wis'],['arc','Arkane Kunde','int'],
  ['ath','Athletik','str'],['dec','Täuschen','cha'],['his','Geschichte','int'],
  ['ins','Einschätzen','wis'],['itm','Einschüchtern','cha'],['inv','Nachforschung','int'],
  ['med','Medizin','wis'],['nat','Naturkunde','int'],['prc','Wahrnehmung','wis'],
  ['prf','Auftreten','cha'],['per','Überzeugen','cha'],['rel','Religion','int'],
  ['slt','Fingerfertigkeit','dex'],['ste','Heimlichkeit','dex'],['sur','Überlebenskunst','wis']
];
const SCHOOLS = ['Bannmagie','Beschwörung','Wahrsagerei','Verzauberung','Hervorrufung','Illusion','Nekromantie','Verwandlung'];
const ABILITY_LABEL_DE = { str:'Stärke', dex:'Geschicklichkeit', con:'Konstitution', int:'Intelligenz', wis:'Weisheit', cha:'Charisma' };
const LANGUAGES = [
  ['common','Gemeinsprache'],['dwarvish','Zwergisch'],['elvish','Elfisch'],['giant','Riesisch'],
  ['gnomish','Gnomisch'],['goblin','Goblinisch'],['halfling','Halblingisch'],['orc','Orkisch'],
  ['abyssal','Abyssisch'],['celestial','Himmlisch'],['draconic','Drakonisch'],['deep-speech','Tiefensprache'],
  ['infernal','Infernalisch'],['primordial','Ursprache'],['sylvan','Sylvanisch'],['undercommon','Unterreichssprache']
];
const TOOLS = [
  ['alchemist','Alchemistenausrüstung'],['brewer','Braukunst-Werkzeug'],['calligrapher','Kalligraphenausrüstung'],
  ['carpenter','Zimmermannswerkzeug'],['cartographer','Kartografenausrüstung'],['cobbler','Schusterwerkzeug'],
  ['cook','Kochutensilien'],['glassblower','Glasbläserausrüstung'],['jeweler','Juwelierswerkzeug'],
  ['leatherworker','Ledererwerkzeug'],['mason','Maurerwerkzeug'],['painter','Malutensilien'],
  ['potter','Töpferwerkzeug'],['smith','Schmiedewerkzeug'],['tinker','Tüftlerwerkzeug'],
  ['weaver','Weberwerkzeug'],['woodcarver','Holzschnitzerwerkzeug'],
  ['disguise','Verkleidungsset'],['forgery','Fälscherausrüstung'],['herbalism','Kräuterkundeset'],
  ['navigator','Navigationswerkzeug'],['poisoner','Gifthändlerset'],['thieves','Diebeswerkzeug'],
  ['gaming','Spielset'],['musical','Musikinstrument'],['vehicles','Fahrzeuge']
];
const ARMOR_CATS = [['light','Leichte Rüstung'],['medium','Mittelschwere Rüstung'],['heavy','Schwere Rüstung'],['shields','Schilde']];
const WEAPON_CATS = [['simple','Einfache Waffen'],['martial','Kriegswaffen']];
const RESISTANCES = [
  ['acid','Säure'],['bludgeoning','Wucht'],['cold','Kälte'],['fire','Feuer'],['force','Kraft'],
  ['lightning','Blitz'],['necrotic','Nekrotisch'],['piercing','Stich'],['poison','Gift'],
  ['psychic','Psychisch'],['radiant','Strahlend'],['slashing','Hieb'],['thunder','Donner']
];
const MOVEMENT_TYPES = [['speed','Gehen'],['speedFly','Fliegen'],['speedSwim','Schwimmen'],['speedClimb','Klettern'],['speedBurrow','Graben']];
const VISION_TYPES = [['darkvision','Dunkelsicht'],['blindsight','Blindsicht'],['tremorsense','Erschütterungssinn'],['truesight','Wahre Sicht']];

// Baut aus einer angekreuzten Codeliste + einem Freitext-Zusatz den fertigen
// Anzeigetext (fuers Charakterblatt) bzw. dient als Grundlage fuers Formular.
function combineChecked(checkedCodes, labelList, freeText){
  const labels = (checkedCodes||[]).map(code => (labelList.find(x=>x[0]===code)||[])[1]).filter(Boolean);
  if(freeText && freeText.trim()) labels.push(freeText.trim());
  return labels.join(', ');
}
// Baut z.B. "9 m (30 ft), Fliegen 9 m (30 ft)" aus den befuellten Bewegungs-/Sichtarten.
// Die erste Art (Gehen bzw. Dunkelsicht) wird ohne Namenspraefix gezeigt, alle
// weiteren mit ihrem Namen davor, damit es sich wie ein normaler Wert liest.
function combineTyped(typeList, c){
  return typeList
    .map(([field,label], i) => c[field] ? (i===0 ? c[field] : `${label} ${c[field]}`) : null)
    .filter(Boolean)
    .join(', ');
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function mod(score){ return Math.floor(((Number(score)||0)-10)/2); }
function fmt(n){ n = Math.round(n); return (n>=0?'+':'') + n; }
function parseLines(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split('|').map(s=>s.trim()));
}
function fld(arr,i){ return (arr && arr[i] != null) ? arr[i] : ''; }

function emptyChar(){
  const skillProf = {}; SKILLS.forEach(s=>skillProf[s[0]]=0);
  const saveProf = {}; ABILS.forEach(a=>saveProf[a[0]]=false);
  return {
    name:'', subtitle:'', background:'', size:'Mittelgroß',
    speed:'9 m (30 ft)', speedFly:'', speedSwim:'', speedClimb:'', speedBurrow:'',
    darkvision:'', blindsight:'', tremorsense:'', truesight:'',
    profBonus:2, untrainedBonus:0,
    abilities:{str:10,dex:10,con:10,int:10,wis:10,cha:10},
    saveProf, skillProf,
    ac:10, initiative:0, hpCur:0, hpMax:0,
    weaponsText:'', spellEnabled:false, spellAbility:'', spellDc:0, spellAttack:0,
    slots:['','','','','','','','',''],
    spellsText:'', featuresText:'', magicItemsText:'', equipmentText:'',
    profArmor:'', profWeapons:'', profTools:'', resistance:'', languages:'', notes:'',
    armorChecked:[], weaponsChecked:[], toolsChecked:[], resistanceChecked:[], languagesChecked:[]
  };
}

/* ============== Startbeispiel (Kien Funkensucher) ============== */
const KIEN = {
  name:'Kien Funkensucher',
  subtitle:'Tiefling (Infernales Erbe) · Barde 5 · Bardenschule: College of Lore',
  background:'Weiser', size:'Mittelgroß', speed:'9 m (30 ft)', darkvision:'18 m (60 ft)',
  profBonus:3, untrainedBonus:1,
  abilities:{str:8,dex:15,con:14,int:8,wis:14,cha:18},
  saveProf:{str:false,dex:true,con:false,int:false,wis:false,cha:true},
  skillProf:{acr:0,ani:1,arc:2,ath:0,dec:0,his:1,ins:1,itm:0,inv:1,med:0,nat:0,prc:2,prf:0,per:1,rel:1,slt:0,ste:0,sur:0},
  ac:15, initiative:2, hpCur:45, hpMax:45,
  weaponsText:
`Dolch|Wurfwaffe 6/18 m|+5|1W4+2 stechend
Rapier|nicht geübt|+2|1W8+2 stechend
Feuerpfeil|Cantrip · 36 m|+7|2W10 Feuer
Grünflammenklinge|Cantrip · Nahkampf|+7|Waffenschaden + 4 Kraft (Hauptziel); 4 Feuer an Nebenziel in 1,5 m
Versengender Strahl|2. Grad · 36 m · 3 Strahlen|+7 je Strahl|2W6 Feuer je Treffer`,
  spellEnabled:true, spellAbility:'Charisma', spellDc:15, spellAttack:7,
  slots:[4,3,2,0,0,0,0,0,0],
  spellsText:
`0|Bissiger Spott|Vicious Mockery|Verzauberung|1 Aktion|18 m|V|Sofort|Ein verbaler Hieb voller Spott. Bei misslungenem Weisheitsrettungswurf erleidet das Ziel psychischen Schaden und hat Nachteil auf seinen nächsten Angriffswurf vor Ende seines nächsten Zuges.
0|Magische Hand|Mage Hand|Beschwörung|1 Aktion|9 m|V+S|1 Minute|Erschafft eine schwebende, geisterhafte Hand, die auf Distanz kleine Gegenstände greifen, bewegen oder Schlösser/Behälter öffnen kann (keine Angriffe, kein Tragen > 5 kg).
0|Kleine Illusion|Minor Illusion|Illusion|1 Aktion|9 m|S+M (Wollflocke)|1 Minute|Erzeugt entweder ein stummes Bild eines Objekts (max. 1,5 m Würfel) oder ein Geräusch an einem Ort in Reichweite. Bei genauer Untersuchung wird die Illusion als solche erkennbar.
0|Gaukelei|Prestidigitation|Verwandlung|1 Aktion|3 m|V+S|1 Stunde|Sammlung kleiner magischer Tricks: ein Licht entfachen, einen harmlosen Sinneseindruck erzeugen, Kleidung reinigen oder trocknen, ein Objekt geschmacklich verändern u. Ä.
0|Thaumaturgie|Thaumaturgy|Verwandlung|1 Aktion|9 m|V|1 Minute|Kleine übernatürliche Effekte auf Distanz: die eigene Stimme dröhnen lassen, Flammen kurz auflodern lassen, Türen sanft auf- oder zuschlagen, die Stimme verändern usw.
0|Feuerpfeil|Fire Bolt|Hervorrufung|1 Aktion|36 m|V+S|Sofort|Fernkampf-Zauberangriff auf eine Kreatur oder ein Objekt in Reichweite. Bei Treffer 2W10 Feuerschaden (Schaden skaliert mit Charakterstufe); entzündet unbewachte brennbare Objekte.
0|Grünflammenklinge|Green-Flame Blade|Hervorrufung|1 Aktion|Selbst|S+M (Nahkampfwaffe)|Sofort|Nahkampf-Zauberangriff mit einer geführten Nahkampfwaffe. Bei Treffer zusätzlich Kraftschaden in Höhe des Zaubermodifikators; ein zweites Ziel in 1,5 m des Hauptziels erleidet denselben Schaden als Feuer.
1|Höllischer Tadel|Hellish Rebuke|Hervorrufung|1 Reaktion|18 m|V+S|Sofort|Reaktion, nachdem man selbst Schaden von einer sichtbaren Kreatur erlitten hat: Diese muss einen Geschicklichkeitsrettungswurf bestehen oder erleidet Feuerschaden (bei Erfolg halb).
1|Magie entdecken|Detect Magic|Wahrsagerei|1 Aktion|Selbst|V+S|10 Minuten · Konzentration|Für die Dauer spürt der Wirkende Magie in 9 m Umkreis und kann bei Sichtkontakt die Schule der Magie eines magischen Gegenstands oder Effekts erkennen.
1|Missklingendes Flüstern|Dissonant Whispers|Verzauberung|1 Aktion|18 m|V|Sofort|Disharmonische Worte hallen im Kopf des Ziels. Bei misslungenem Weisheitsrettungswurf psychischer Schaden, und das Ziel muss seine gesamte Bewegung nutzen, um auf schnellstem Weg vom Wirkenden wegzulaufen.
1|Farbenpracht|Color Spray|Illusion|1 Aktion|Selbst (4,5 m Kegel)|V+S+M (buntes Sandkorn)|Sofort|Ein greller Farbblitz. Kreaturen im Kegel werden bis zu einer bestimmten Gesamt-TP-Summe (abhängig vom Zaubergrad) für 1 Runde geblendet, beginnend bei den niedrigsten Trefferpunkten.
1|Vertrauten rufen|Find Familiar|Beschwörung|1 Stunde|3 m|V+S+M (Räucherwerk, wird verbraucht)|Sofort|Beschwört einen Geistervertrauten in Tiergestalt (Wahl aus einer Liste), der dem Wirkenden dient, Befehle versteht und über den bei Berührung Zauber mit Reichweite Berührung gewirkt werden können.
1|Heilendes Wort|Healing Word|Bannmagie|1 Bonusaktion|18 m|V|Sofort|Eine Kreatur in Reichweite erhält 1W4 + Zaubermodifikator Trefferpunkte zurück — praktisch als Bonusaktion aus der Distanz, ohne Berührung.
1|Sprachen verstehen|Comprehend Languages|Wahrsagerei|1 Aktion|Selbst|V+S+M (Ruß und Salz)|1 Stunde|Für die Dauer versteht der Wirkende die wörtliche Bedeutung jeder gesprochenen Sprache, die er hört, sowie jeder geschriebenen Sprache, die er berührt (kein Zauber zum Sprechen fremder Sprachen).
1|Schild|Shield|Bannmagie|1 Reaktion|Selbst|V+S|1 Runde|Reaktion auf einen Angriffstreffer oder das Ziel des Zaubers Magic Missile: Die Rüstungsklasse steigt bis zum Beginn des nächsten eigenen Zuges um 5, zusätzlich wird Magic Missile dadurch vollständig negiert.
2|Dunkelheit|Darkness|Hervorrufung|1 Aktion|18 m|V+M (Fledermausfell & Kohle)|10 Minuten · Konzentration|Magische Finsternis breitet sich aus einem Punkt in Reichweite in einer 4,5 m-Kugel aus und blockiert auch normale Dunkelsicht.
2|Nebelschritt|Misty Step|Beschwörung|1 Bonusaktion|Selbst|V|Sofort|Kurzzeitige silbrige Nebelhülle, aus der man sich bis zu 9 m an einen sichtbaren, unbesetzten Ort teleportiert.
2|Drachenodem|Dragon's Breath|Verwandlung|1 Bonusaktion|Berührung|V+S+M (scharfe Paprika)|1 Minute · Konzentration|Eine berührte einwillige Kreatur erhält für die Dauer einen Odemangriff (Kegel, gewählter Schadenstyp), den sie als Aktion einsetzen kann; Ziele im Kegel machen einen Rettungswurf gegen halben oder vollen Schaden.
2|Schweben|Levitate|Verwandlung|1 Aktion|18 m|V+S+M (Metallfeder)|10 Minuten · Konzentration|Eine Kreatur oder ein Objekt in Reichweite schwebt bis zu 6 m über dem Boden und kann sich langsam vertikal und horizontal bewegen (Kreatur mit Rettungswurf bei Unwilligkeit).
2|Versengender Strahl|Scorching Ray|Hervorrufung|1 Aktion|36 m|V+S|Sofort|Drei Feuerstrahlen, die auf ein oder mehrere Ziele in Reichweite verteilt werden können. Jeder ist ein eigener Fernkampf-Zauberangriff; bei Treffer 2W6 Feuerschaden pro Strahl.
3|Feuerball|Fireball|Hervorrufung|1 Aktion|45 m|V+S+M (Fledermausmist & Schwefel)|Sofort|Explosion in einer 6 m-Kugel um einen Punkt in Reichweite. Geschicklichkeitsrettungswurf gegen 8W6 Feuerschaden, bei Erfolg halb; entzündet unbewachte brennbare Objekte im Bereich.
3|Hast|Haste|Verwandlung|1 Aktion|9 m|V+S+M (Süßholzspan)|1 Minute · Konzentration|Eine einwillige Kreatur in Reichweite erhält verdoppelte Bewegungsrate, +2 auf die Rüstungsklasse, Vorteil auf Geschicklichkeitsrettungswürfe und eine zusätzliche Aktion pro Zug (eingeschränkt auf Angriff, Bewegen, Ausweichen o. Ä.). Nach Zauberende ist das Ziel für eine Runde regungsunfähig.`,

const STATIC_SPECIES = [{"key": "custom_warforged_62536e", "name": "Warforged", "size": "Mittelgroß", "speed": "9 m (30 ft)", "speedFly": "", "speedSwim": "", "speedClimb": "", "speedBurrow": "", "darkvision": "", "blindsight": "", "tremorsense": "", "truesight": "", "abilityBonuses": {"str": 0, "dex": 0, "con": 0, "int": 0, "wis": 0, "cha": 0}, "skillsChecked": [], "resistanceChecked": ["poison"], "languagesChecked": ["common"], "traits": [], "source": "custom"}, {"key": "srd-2024_dragonborn", "name": "Dragonborn", "size": "Mittelgroß", "speed": "9 m (30 ft)", "darkvision": "18 m (60 ft)", "traits": [{"name": "Draconic Ancestry", "desc": "Your lineage stems from a dragon progenitor. Choose the kind of dragon from the Draconic Ancestors table. Your choice affects your Breath Weapon and Damage Resistance traits as well as your appearance.\n\nTable: Draconic Ancestors\n\n| Dragon | Damage Type |\n|---|---|\n| Black | Acid |\n| Blue | Lightning |\n| Brass |Fire |\n| Bronze | Lightning |\n| Copper | Acid|\n|Gold|Fire|\n|Green|Poison|\n|Red|Fire|\n|Silver|Cold|\n|White|Cold|", "descDe": "Wähle die Drachenart deiner Abstammung. Diese Wahl beeinflusst deine Atemwaffe und deine Schadensresistenz."}, {"name": "Breath Weapon", "desc": "When you take the Attack action on your turn, you can replace one of your attacks with an exhalation of magical energy in either a 15-foot Cone or a 30-foot Line that is 5 feet wide (choose the shape each time). Each creature in that area must make a Dexterity saving throw (DC 8 plus your Constitution modifier and Proficiency Bonus). On a failed save, a creature takes 1d10 damage of the type determined by your Draconic Ancestry trait. On a successful save, a creature takes half as much damage. This damage increases by 1d10 when you reach character levels 5 (2d10), 11 (3d10), and 17 (4d10).\n\nYou can use this Breath Weapon a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.", "descDe": "Statt eines Angriffs kannst du als Aktion magische Energie in einer 4,5-m-Linie (15 Fuß) oder einer 3-m-Kegelform (10 Fuß) ausstoßen (je nach Form deiner Drachenabstammung). Jede Kreatur im Bereich muss einen Rettungswurf ablegen (Konstitution oder Geschicklichkeit, je nach Abstammung); bei einem Fehlschlag erleidet sie Schaden des passenden Typs, bei Erfolg nur die Hälfte. Der Schaden skaliert mit deiner Stufe. Du regenerierst diese Fähigkeit nach einer kurzen oder langen Rast."}, {"name": "Damage Resistance", "desc": "You have Resistance to the damage type determined by your Draconic Ancestry trait.", "descDe": "Du hast Widerstand gegen den Schadenstyp, der mit deiner Drachenabstammung verknüpft ist."}, {"name": "Darkvision", "desc": "You have Darkvision with a range of 60 feet", "descDe": "Du siehst 18 m (60 Fuß) weit im Dunkeln."}, {"name": "Draconic Flight", "desc": "When you reach character level 5, you can channel draconic magic to give yourself temporary flight. As a Bonus Action, you sprout spectral wings on your back that last for 10 minutes or until you retract the wings (no action required) or have the Incapacitated condition. During that time, you have a Fly Speed equal to your Speed. Your wings appear to be made of the same energy as your Breath Weapon. Once you use this trait, you can't use it again until you finish a Long Rest.", "descDe": ""}]}, {"key": "srd-2024_dwarf", "name": "Dwarf", "size": "Mittelgroß", "speed": "9 m (30 ft)", "darkvision": "36 m (120 ft)", "traits": [{"name": "Darkvision", "desc": "You have Darkvision with a range of 120 feet.", "descDe": "Du siehst 36 m (120 Fuß) weit im Dunkeln."}, {"name": "Dwarven Resilience", "desc": "You have Resistance to Poison damage. You also have Advantage on saving throws you make to avoid or end the Poisoned condition.", "descDe": "Du hast Widerstand gegen Giftschaden. Außerdem hast du Vorteil bei Rettungswürfen, um den Zustand Vergiftet zu vermeiden oder zu beenden."}, {"name": "Dwarven Toughness", "desc": "Your Hit Point maximum increases by 1, and it increases by 1 again whenever you gain a level.", "descDe": "Deine maximalen Trefferpunkte erhöhen sich um 1, und sie erhöhen sich um weitere 1, sobald du eine Stufe aufsteigst."}, {"name": "Stonecunning", "desc": "As a Bonus Action, you gain Tremorsense with a range of 60 feet for 10 minutes. You must be on a stone surface or touching a stone surface to use this Tremorsense. The stone can be natural or worked.\n\nYou can use this Bonus Action a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest.", "descDe": "Als Bonusaktion erhältst du für 10 Minuten Erschütterungssinn mit einer Reichweite von 18 m (60 Fuß). Dafür musst du dich auf einer Steinoberfläche befinden oder diese berühren. Du kannst diese Bonusaktion so oft nutzen wie dein Übungsbonus und erhältst alle verbrauchten Nutzungen nach einer langen Rast zurück."}]}, {"key": "srd-2024_elf", "name": "Elf", "size": "Mittelgroß", "speed": "9 m (30 ft)", "darkvision": "18 m (60 ft)", "traits": [{"name": "Darkvision", "desc": "You have Darkvision with a range of 60 feet.", "descDe": "Du siehst 18 m (60 Fuß) weit im Dunkeln."}, {"name": "Elven Lineage", "desc": "You are part of a lineage that grants you supernatural abilities. Choose a lineage from the Elven Lineages table. You gain the level 1 benefit of that lineage.\n\nWhen you reach character levels 3 and 5, you learn a higher-level spell, as shown on the table. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have of the appropriate level.\n\nTable: Elven Lineages\n\n|Lineage|Level 1|Level 3|Level 5|\n|---|---|---|---|\n|Drow|The range of your Darkvision increases to 120 feet. You also know the Dancing Lights cantrip.|Faerie Fire|Darkness|\n|High Elf|You know the Prestidigitation cantrip. Whenever you finish a Long Rest, you can replace that cantrip with a different cantrip from the Wizard spell list.|Detect Magic|Misty Step|\n|Wood Elf|Your Speed increases to 35 feet. You also know the Druidcraft cantrip.|Longstrider|Pass without Trace|\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the lineage).", "descDe": ""}, {"name": "Fey Ancestry", "desc": "You have Advantage on saving throws you make to avoid or end the Charmed condition.", "descDe": "Du hast Vorteil bei Rettungswürfen, um den Zustand Bezaubert zu vermeiden oder zu beenden."}, {"name": "Keen Senses", "desc": "You have proficiency in the Insight, Perception, or Survival skill.", "descDe": "Du bist geübt in der Fertigkeit Wahrnehmung."}, {"name": "Trance", "desc": "You don't need to sleep, and magic can't put you to sleep. You can finish a Long Rest in 4 hours if you spend those hours in a trancelike meditation, during which you retain consciousness.", "descDe": "Du brauchst keinen Schlaf und magische Effekte können dich nicht in Schlaf versetzen. Du kannst einen langen Rast in 4 Stunden abschließen, wenn du diese Zeit in einem trance-ähnlichen, halbbewussten Zustand verbringst, während dessen du weiterhin bei Bewusstsein bleibst."}]}, {"key": "srd-2024_gnome", "name": "Gnome", "size": "Klein", "speed": "9 m (30 ft)", "darkvision": "18 m (60 ft)", "traits": [{"name": "Darkvision", "desc": "You have Darkvision with a range of 60 feet.", "descDe": "Du siehst 18 m (60 Fuß) weit im Dunkeln."}, {"name": "Gnomish Cunning", "desc": "You have Advantage on Intelligence, Wisdom, and Charisma saving throws.", "descDe": "Du hast Vorteil bei Rettungswürfen für Intelligenz, Weisheit und Charisma."}, {"name": "Gnomish Lineage", "desc": "You are part of a lineage that grants you supernatural abilities. Choose one of the following options; whichever one you choose, Intelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the lineage):\n\n**Forest Gnome.** You know the *Minor Illusion* cantrip. You also always have the *Speak with Animals* spell prepared. You can cast it without a spell slot a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest. You can also use any spell slots you have to cast the spell.\n\n**Rock Gnome.** You know the *Mending* and *Prestidigitation* cantrips. In addition, you can spend 10 minutes casting *Prestidigitation* to create a Tiny clockwork device (AC 5, 1 HP), such as a toy, fire starter, or music box. When you create the device, you determine its function by choosing one effect from *Prestidigitation*; the device produces that effect whenever you or another creature takes a Bonus Action to activate it with a touch. If the chosen effect has options within it, you choose one of those options for the device when you create it. For example, if you choose the spell's ignite-extinguish effect, you determine whether the device ignites or extinguishes fire; the device doesn't do both. You can have three such devices in existence at a time, and each falls apart 8 hours after its creation or when you dismantle it with a touch as a Utilize action.", "descDe": ""}]}, {"key": "srd-2024_goliath", "name": "Goliath", "size": "Mittelgroß", "speed": "11 m (35 ft)", "darkvision": "", "traits": [{"name": "Giant Ancestry", "desc": "You are descended from Giants. Choose one of the following benefits—a supernatural boon from your ancestry; you can use the chosen benefit a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Long Rest:\n\n- **Cloud's Jaunt (Cloud Giant)**. As a Bonus Action, you magically teleport up to 30 feet to an unoccupied space you can see.\n- **Fire's Burn (Fire Giant)**. When you hit a target with an attack roll and deal damage to it, you can also deal 1d10 Fire damage to that target.\n- **Frost's Chill (Frost Giant)**. When you hit a target with an attack roll and deal damage to it, you can also deal 1d6 Cold damage to that target and reduce its Speed by 10 feet until the start of your next turn.\n- **Hill's Tumble (Hill Giant)**. When you hit a Large or smaller creature with an attack roll and deal damage to it, you can give that target the Prone condition.\n- **Stone's Endurance (Stone Giant)**. When you take damage, you can take a Reaction to roll 1d12. Add your Constitution modifier to the number rolled and reduce the damage by that total.\n- **Storm's Thunder (Storm Giant)**. When you take damage from a creature within 60 feet of you, you can take a Reaction to deal 1d8 Thunder damage to that creature.", "descDe": "Du besitzt eine übernatürliche Fähigkeit, die auf einem deiner riesischen Vorfahren beruht. Diese Fähigkeit lädt sich nach einer langen Rast wieder auf."}, {"name": "Large Form", "desc": "Starting at character level 5, you can change your size to Large as a Bonus Action if you're in a big enough space. This transformation lasts for 10 minutes or until you end it (no action required). For that duration, you have Advantage on Strength checks, and your Speed increases by 10 feet. Once you use this trait, you can't use it again until you finish a Long Rest.", "descDe": "Ab Stufe 5 kannst du als Bonusaktion für 10 Minuten die Größenkategorie Groß annehmen, sofern der Platz es zulässt. Danach musst du erst eine kurze oder lange Rast beenden, bevor du das erneut nutzen kannst."}, {"name": "Powerful Build", "desc": "You have Advantage on any ability check you make to end the Grappled condition. You also count as one size larger when determining your carrying capacity.", "descDe": ""}]}, {"key": "srd-2024_halfling", "name": "Halfling", "size": "Klein", "speed": "9 m (30 ft)", "darkvision": "", "traits": [{"name": "Brave", "desc": "You have Advantage on saving throws you make to avoid or end the Frightened condition.", "descDe": "Du hast Vorteil bei Rettungswürfen, um den Zustand Verängstigt zu vermeiden oder zu beenden."}, {"name": "Halfling Nimbleness", "desc": "You can move through the space of any creature that is a size larger than you, but you can't stop in the same space.", "descDe": "Du kannst dich durch das Feld jeder Kreatur bewegen, die eine größere Größenkategorie als du selbst hat."}, {"name": "Luck", "desc": "When you roll a 1 on the d20 of a D20 Test, you can reroll the die, and you must use the new roll.", "descDe": "Würfelst du bei einem Angriffswurf, einer Fähigkeitsprobe oder einem Rettungswurf eine 1, kannst du den Würfel neu werfen — du musst das neue Ergebnis verwenden."}, {"name": "Naturally Stealthy", "desc": "You can take the Hide action even when you are obscured only by a creature that is at least one size larger than you.", "descDe": "Du kannst dich hinter einer Kreatur verstecken, die mindestens eine Größenkategorie größer ist als du."}]}, {"key": "srd-2024_human", "name": "Human", "size": "Klein", "speed": "9 m (30 ft)", "darkvision": "", "traits": [{"name": "Resourceful", "desc": "You gain Heroic Inspiration whenever you finish a Long Rest.", "descDe": "Du erhältst Inspiration (Heldenpunkt), sobald du eine lange Rast abschließt."}, {"name": "Skillful", "desc": "You gain proficiency in one skill of your choice.", "descDe": "Du bist geübt in einer Fertigkeit deiner Wahl."}, {"name": "Versatile", "desc": "You gain an Origin feat of your choice (see \"Feats\"). Skilled is recommended.", "descDe": "Du erhältst einen Ursprungs-Feat deiner Wahl."}]}, {"key": "srd-2024_orc", "name": "Orc", "size": "Mittelgroß", "speed": "9 m (30 ft)", "darkvision": "36 m (120 ft)", "traits": [{"name": "Adrenaline Rush", "desc": "You can take the Dash action as a Bonus Action. When you do so, you gain a number of Temporary Hit Points equal to your Proficiency Bonus.\n\nYou can use this trait a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a Short or Long Rest.", "descDe": "Du kannst als Bonusaktion die Hetzen-Aktion ausführen. Wenn du das tust, erhältst du temporäre Trefferpunkte in Höhe deines Übungsbonus. Du regenerierst diese Fähigkeit, sobald du dich ausruhst (kurz oder lang) oder Inspiration (Heldenpunkt) verwendest."}, {"name": "Darkvision", "desc": "You have Darkvision with a range of 120 feet.", "descDe": "Du siehst 18 m (60 Fuß) weit im Dunkeln."}, {"name": "Relentless Endurance", "desc": "When you are reduced to 0 Hit Points but not killed outright, you can drop to 1 Hit Point instead. Once you use this trait, you can't do so again until you finish a Long Rest.", "descDe": "Wenn ein Schaden dich auf 0 Trefferpunkte reduzieren würde, ohne dich sofort zu töten, kannst du stattdessen auf 1 Trefferpunkt bleiben. Du kannst das erst wieder nutzen, nachdem du eine lange Rast beendet hast."}]}, {"key": "srd-2024_tiefling", "name": "Tiefling", "size": "Klein", "speed": "9 m (30 ft)", "darkvision": "18 m (60 ft)", "traits": [{"name": "Darkvision", "desc": "You have Darkvision with a range of 60 feet.", "descDe": "Du siehst 18 m (60 Fuß) weit im Dunkeln."}, {"name": "Fiendish Legacy", "desc": "You are the recipient of a legacy that grants you supernatural abilities. Choose a legacy from the Fiendish Legacies table. You gain the level 1 benefit of the chosen legacy.\n\nWhen you reach character levels 3 and 5, you learn a higher-level spell, as shown on the table. You always have that spell prepared. You can cast it once without a spell slot, and you regain the ability to cast it in that way when you finish a Long Rest. You can also cast the spell using any spell slots you have of the appropriate level.\n\nIntelligence, Wisdom, or Charisma is your spellcasting ability for the spells you cast with this trait (choose the ability when you select the legacy).\n\n**Table: Fiendish Legacies**\n\n|Legacy|Level 1|Level 3|Level 5|\n|---|---|---|---|\n|Abyssal|You have Resistance to Poison damage. You also know the Poison Spray cantrip.|Ray of Sickness|Hold Person|\n|Chthonic|You have Resistance to Necrotic damage. You also know the Chill Touch cantrip.|False Life|Ray of Enfeeblement|\n|Infernal|You have Resistance to Fire damage. You also know the Fire Bolt cantrip.|Hellish Rebuke|Darkness|", "descDe": "Du wählst ein Höllisches Erbe (Abyssisch, Chthonisch oder Infernalisch). Es bestimmt zusätzliche Zaubertricks/Zauber, die du wirken kannst, sowie eine Schadensresistenz."}, {"name": "Otherworldly Presence", "desc": "You know the *Thaumaturgy* cantrip. When you cast it with this trait, the spell uses the same spellcasting ability you use for your Fiendish Legacy trait.", "descDe": "Du kennst den Zaubertrick Thaumaturgy. Sobald du ihn mit diesem Merkmal wirkst, kannst du ihn ohne Verbrauch einer Zauberkomponente wirken."}]}];

en Feat Attributssteigerung oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst.", "levels": [4, 8, 12, 16]}, {"key": "srd-2024_barbarian_barbarian-subclass", "name": "Barbarian Subclass", "desc": "You gain a Barbarian subclass of your choice. The Path of the Berserker subclass is detailed after this class's description. A subclass is a specialization that grants you features at certain Barbarian levels. For the rest of your career, you gain each of your subclass's features that are of your Barbarian level or lower.", "descDe": "", "levels": [3]}, {"key": "srd-2024_barbarian_brutal-strike", "name": "Brutal Strike", "desc": "If you use Reckless Attack, you can forgo any Advantage on one Strength-based attack roll of your choice on your turn. The chosen attack roll mustn't have Disadvantage. If the chosen attack roll hits, the target takes an extra 1d10 damage of the same type dealt by the weapon or Unarmed Strike, and you can cause one Brutal Strike effect of your choice. You have the following effect options.\n\n**Forceful Blow.** The target is pushed 15 feet straight away from you. You can then move up to half your Speed straight toward the target without provoking Opportunity Attacks.\n\n**Hamstring Blow.** The target's Speed is reduced by 15 feet until the start of your next turn. A target can be affected by only one Hamstring Blow at a time the most recent one.", "descDe": "Setzt du Rücksichtsloser Angriff ein und triffst mit einem Nahkampf-Waffenangriff mit Stärke, kannst du einen zusätzlichen, verheerenden Effekt auslösen (deine Wahl); dafür erleidest du selbst Nachteil bei diesem Angriffswurf.", "levels": [9]}, {"key": "srd-2024_barbarian_danger-sense", "name": "Danger Sense", "desc": "You gain an uncanny sense of when things aren't as they should be, giving you an edge when you dodge perils. You have Advantage on Dexterity saving throws unless you have the Incapacitated condition.", "descDe": "Du hast Vorteil bei Geschicklichkeitsrettungswürfen gegen Effekte, die du sehen kannst, wie Fallen und manche Zauber, solange du nicht Blind, Taub oder Kampfunfähig bist.", "levels": [2]}, {"key": "srd-2024_barbarian_epic-boon", "name": "Epic Boon", "desc": "You gain an Epic Boon feat (see \"Feats\") or another feat of your choice for which you qualify. Boon of Irresistible Offense is recommended.", "descDe": "Du erhältst einen Epischen Feat deiner Wahl.", "levels": [19]}, {"key": "srd-2024_barbarian_extra-attack", "name": "Extra Attack", "desc": "You can attack twice instead of once whenever you take the Attack action on your turn.", "descDe": "Du kannst zweimal statt einmal angreifen, wenn du die Angriffsaktion in deinem Zug ausführst.", "levels": [5]}, {"key": "srd-2024_barbarian_fast-movement", "name": "Fast Movement", "desc": "Your speed increases by 10 feet while you aren't wearing Heavy armor.", "descDe": "Deine Grundbewegungsrate erhöht sich um 3 m (10 Fuß), solange du keine schwere Rüstung trägst.", "levels": [5]}, {"key": "srd-2024_barbarian_feral-instinct", "name": "Feral Instinct", "desc": "Your instincts are so honed that you have Advantage on Initiative rolls.", "descDe": "Du hast Vorteil bei Initiativewürfen. Außerdem kannst du, wenn du überrascht bist, aber bereits in Rage bist oder in deinem ersten Zug in Rage gerätst, trotzdem handeln.", "levels": [7]}, {"key": "srd-2024_barbarian_improved-brutal-strike", "name": "Improved Brutal Strike", "desc": "You have honed new ways to attack furiously. The following effects are now among your Brutal Strike options.\n\n**Staggering Blow.** The target has Disadvantage on the next saving throw it makes, and it can't make Opportunity Attacks until the start of your next turn.\n\n**Sundering Blow.** Before the start of your next turn, the next attack roll made by another creature against the target gains a +5 bonus to the roll. An attack roll can gain only one Sundering Blow bonus.", "descDe": "", "levels": [13]}, {"key": "srd-2024_barbarian_improved-brutal-strike-enhanced", "name": "Improved Brutal Strike (Enhanced)", "desc": "The extra damage of your Brutal Strike increases to 2d10. In addition, you can use two different Brutal Strike effects whenever you use your Brutal Strike feature.", "descDe": "", "levels": [17]}, {"key": "srd-2024_barbarian_indomitable-might", "name": "Indomitable Might", "desc": "If your total for a Strength check or Strength saving throw is less than your Strength score, you can use that score in place of the total.", "descDe": "Ist das Ergebnis deiner Stärkeprobe niedriger als dein Stärkewert, kannst du stattdessen diesen Wert verwenden.", "levels": [18]}, {"key": "srd-2024_barbarian_instinctive-pounce", "name": "Instinctive Pounce", "desc": "As part of the Bonus Action you take to enter your Rage, you can move up to half your Speed.", "descDe": "Als Teil der Bonusaktion, mit der du in Rage gerätst, kannst du dich bis zu deiner halben Bewegungsrate weit bewegen.", "levels": [7]}, {"key": "srd-2024_barbarian_persistent-rage", "name": "Persistent Rage", "desc": "When you roll Initiative, you can regain all expended uses of Rage. After you regain uses of Rage in this way, you can't do so again until you finish a Long Rest.\n\nIn addition, your Rage is so fierce that it now lasts for 10 minutes without you needing to do anything to extend it from round to round. Your Rage ends early if you have the Unconscious condition (not just the Incapacitated condition) or don Heavy armor.", "descDe": "Deine Rage endet nur noch, wenn du bewusstlos wirst oder sie selbst beendest.", "levels": [15]}, {"key": "srd-2024_barbarian_primal-champion", "name": "Primal Champion", "desc": "You embody primal power. Your Strength and Constitution scores increase by 4, to a maximum of 25.", "descDe": "Deine Stärke und Konstitution erhöhen sich je um 4, bis zu einem Maximum von 25.", "levels": [20]}, {"key": "srd-2024_barbarian_primal-knowledge", "name": "Primal Knowledge", "desc": "You gain proficiency in another skill of your choice from the skill list available to Barbarians at level 1.\n\nIn addition, while your Rage is active, you can channel primal power when you attempt certain tasks; whenever you make an ability check using one of the following skills, you can make it as a Strength check even if it normally uses a different ability: Acrobatics, Intimidation, Perception, Stealth, or Survival. When you use this ability, your Strength represents primal power coursing through you, honing your agility, bearing, and senses.", "descDe": "Während einer Rage kannst du zusätzlich Übung in einer der Fertigkeiten Akrobatik, Einschätzen, Einschüchtern, Naturkunde oder Wahrnehmung einsetzen.", "levels": [3]}, {"key": "srd-2024_barbarian_rage", "name": "Rage", "desc": "You can imbue yourself with a primal power called Rage, a force that grants you extraordinary might and resilience. You can enter it as a Bonus Action if you aren't wearing Heavy armor.\n\nYou can enter your Rage the number of times shown for your Barbarian level in the Rages column of the Barbarian Features table. You regain one expended use when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest.\n\nWhile active, your Rage follows the rules below. *Damage Resistance.* You have Resistance to Bludgeoning, Piercing, and Slashing damage.\n\n**Rage Damage.** When you make an attack using Strength—with either a weapon or an Unarmed Strike—and deal damage to the target, you gain a bonus to the damage that increases as you gain levels as a Barbarian, as shown in the Rage Damage column of the Barbarian Features table.\n\n**Strength Advantage.** You have Advantage on Strength checks and Strength saving throws.\n\n**No Concentration or Spells.** You can't maintain Concentration, and you can't cast spells.\n\n**Duration.** The Rage lasts until the end of your next turn, and it ends early if you don Heavy armor or have the Incapacitated condition. If your Rage is still active on your next turn, you can extend the Rage for another round by doing one of the following:\n- Make an attack roll against an enemy.\n- Force an enemy to make a saving throw.\n- Take a Bonus Action to extend your Rage.\n\nEach time the Rage is extended, it lasts until the end of your next turn. You can maintain a Rage for up to 10 minutes.", "descDe": "Als Bonusaktion kannst du in Rage geraten. Solange du in Rage bist, gilt: Du hast Vorteil bei Stärke-Fähigkeitsproben und Stärke-Rettungswürfen (außer bei Übungen); dein Nahkampf-Waffenschaden mit Stärke erhält einen Bonus (siehe Barbarenmerkmale-Tabelle); du hast Widerstand gegen Wucht-, Hieb- und Stichschaden. Du kannst keine Zauber wirken oder konzentrieren, außer bestimmten Merkmalen erlauben das. Die Rage endet vorzeitig, wenn du bewusstlos wirst oder eine Runde lang weder angegriffen noch Schaden erlitten hast. Du regenerierst alle verbrauchten Nutzungen nach einer langen Rast.", "levels": [1]}, {"key": "srd-2024_barbarian_reckless-attack", "name": "Reckless Attack", "desc": "You can throw aside all concern for defense to attack with increased ferocity. When you make your first attack roll on your turn, you can decide to attack recklessly. Doing so gives you Advantage on attack rolls using Strength until the start of your next turn, but attack rolls against you have Advantage during that time.", "descDe": "Wenn du zum ersten Mal in deinem Zug einen Angriff ausführst, kannst du dich rücksichtslos in den Kampf stürzen. Du erhältst dadurch bis zum Beginn deines nächsten Zugs Vorteil bei Angriffswürfen mit Stärke, aber auch alle Angriffswürfe gegen dich haben bis dahin Vorteil.", "levels": [2]}, {"key": "srd-2024_barbarian_relentless-rage", "name": "Relentless Rage", "desc": "Your Rage can keep you fighting despite grievous wounds. If you drop to 0 Hit Points while your Rage is active and don't die outright, you can make a DC 10 Constitution saving throw. If you succeed, your Hit Points instead change to a number equal to twice your Barbarian level.\n\nEach time you use this feature after the first, the DC increases by 5. When you finish a Short or Long Rest, the DC resets to 10.", "descDe": "Wenn du während einer Rage auf 0 Trefferpunkte fällst, ohne sofort zu sterben, kannst du einen Konstitutionsrettungswurf (SG 10, steigt bei jeder erneuten Nutzung um 5) ablegen; bei Erfolg bleibst du auf 1 Trefferpunkt.", "levels": [11]}, {"key": "srd-2024_barbarian_unarmored-defense", "name": "Unarmored Defense", "desc": "While you aren't wearing any armor, your base Armor Class equals 10 plus your Dexterity and Constitution modifiers. You can use a Shield and still gain this benefit.", "descDe": "Trägst du keine Rüstung, beträgt deine Rüstungsklasse 10 + Geschicklichkeitsmodifikator + Konstitutionsmodifikator. Du kannst dabei einen Schild verwenden und behältst diesen Vorteil trotzdem.", "levels": [1]}, {"key": "srd-2024_barbarian_weapon-mastery", "name": "Weapon Mastery", "desc": "Your training with weapons allows you to use the mastery properties of two kinds of Simple or Martial Melee weapons of your choice, such as Greataxes and Handaxes. Whenever you finish a Long Rest, you can practice weapon drills and change one of those weapon choices.\n\nWhen you reach certain Barbarian levels, you gain the ability to use the mastery properties of more kinds of weapons, as shown in the Weapon Mastery column of the Barbarian Features table.", "descDe": "Du beherrschst die Meistereigenschaften einer Anzahl von Waffen, mit denen du geübt bist (siehe Barbarenmerkmale-Tabelle). Du kannst diese Auswahl bei jedem Stufenaufstieg ändern.", "levels": [1]}], "resourceTables": {"Rage Damage": {"1": "+2", "2": "+2", "3": "+2", "4": "+2", "5": "+2", "6": "+2", "7": "+2", "8": "+2", "9": "+3", "10": "+3", "11": "+3", "12": "+3", "13": "+3", "14": "+3", "15": "+3", "16": "+4", "17": "+4", "18": "+4", "19": "+4", "20": "+4"}, "Rages": {"1": "2", "2": "2", "3": "3", "4": "3", "5": "3", "6": "4", "7": "4", "8": "4", "9": "4", "10": "4", "11": "4", "12": "5", "13": "5", "14": "5", "15": "5", "16": "5", "17": "6", "18": "6", "19": "6", "20": "6"}, "Weapon Mastery": {"1": "2", "2": "2", "3": "2", "4": "3", "5": "3", "6": "3", "7": "3", "8": "3", "9": "3", "10": "4", "11": "4", "12": "4", "13": "4", "14": "4", "15": "4", "16": "4", "17": "4", "18": "4", "19": "4", "20": "4"}}, "spellSlotsByLevel": {}}, {"key": "srd-2024_bard", "name": "Bard", "hitDie": "w8", "savingThrows": ["cha", "dex"], "skillChoiceCount": 3, "weaponProficiencies": "Simple weapons", "armorProficiencies": "Light armor", "toolProficiencies": "Choose 3 Musical Instruments", "armorChecked": ["light"], "weaponsChecked": ["simple"], "toolsChecked": ["musical"], "startingEquipment": "Choose A or B: (A) Leather Armor, 2 Daggers, Musical Instrument of your choice, Entertainer's Pack, and 19 GP; or (B) 90 GP", "isCaster": true, "spellAbility": "cha", "features": [{"key": "srd-2024_bard_ability-score-improvement", "name": "Ability Score Improvement", "desc": "You gain the Ability Score Improvement feat (see \"Feats\") or another feat of your choice for which you qualify. You gain this feature again at Bard levels 8, 12, and 16.", "descDe": "Du erhältst den Feat Attributssteigerung (siehe „Feats\") oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst. Du erhältst dieses Merkmal erneut auf den Bardenstufen 8, 12 und 16.", "levels": [4, 8, 12, 16]}, {"key": "srd-2024_bard_bard-subclass", "name": "Bard Subclass", "desc": "You gain a Bard subclass of your choice. The College of Lore subclass is detailed after this class's description. A subclass is a specialization that grants you features at certain Bard levels. For the rest of your career, you gain each of your subclass's features that are of your Bard level or lower.", "descDe": "", "levels": []}, {"key": "srd-2024_bard_bardic-inspiration", "name": "Bardic Inspiration", "desc": "You can supernaturally inspire others through words, music, or dance. This inspiration is represented by your Bardic Inspiration die, which is a d6.\n\n**Using Bardic Inspiration.** As a Bonus Action, you can inspire another creature within 60 feet of yourself who can see or hear you. That creature gains one of your Bardic Inspiration dice. A creature can have only one Bardic Inspiration die at a time.\n\nOnce within the next hour when the creature fails a D20 Test, the creature can roll the Bardic Inspiration die and add the number rolled to the d20, potentially turning the failure into a success. A Bardic Inspiration die is expended when it's rolled.\n\n**Number of Uses.** You can confer a Bardic Inspiration die a number of times equal to your Charisma modifier (minimum of once), and you regain all expended uses when you finish a Long Rest.\n\n**At Higher Levels.** Your Bardic Inspiration die changes when you reach certain Bard levels, as shown in the Bardic Die column of the Bard Features table. The die becomes a d8 at level 5, a d10 at level 10, and a d12 at level 15.", "descDe": "Du kannst andere auf übernatürliche Weise durch Worte, Musik oder Tanz inspirieren. Diese Inspiration wird durch deinen Bardeninspirationswürfel dargestellt, einem W6. — Als Bonusaktion kannst du ein anderes Wesen in 18 m, das dich sehen oder hören kann, inspirieren. Dieses Wesen erhält einen deiner Bardeninspirationswürfel (ein Wesen kann immer nur einen gleichzeitig besitzen). Innerhalb der nächsten Stunde kann das Wesen, sobald es eine W20-Probe verpatzt, den Würfel dazuaddieren — dadurch kann aus einem Fehlschlag ein Erfolg werden. Der Würfel wird beim Würfeln verbraucht. — Du kannst einen Bardeninspirationswürfel so oft vergeben, wie dein Charisma-Modifikator angibt (mindestens einmal), und erhältst alle verbrauchten Nutzungen nach einer langen Rast zurück. Der Würfel wird auf Stufe 5 zu einem W8, auf Stufe 10 zu einem W10 und auf Stufe 15 zu einem W12.", "levels": [1]}, {"key": "srd-2024_bard_countercharm", "name": "Countercharm", "desc": "You can use musical notes or words of power to disrupt mind-influencing effects. If you or a creature within 30 feet of you fails a saving throw against an effect that applies the Charmed or Frightened condition, you can take a Reaction to cause the save to be rerolled, and the new roll has Advantage.", "descDe": "Du kannst mit Tönen oder Machtworten geisteslenkende Effekte stören. Scheitert ein Rettungswurf gegen einen Effekt, der Bezaubert oder Verängstigt hervorruft (bei dir oder einem Wesen in 9 m), kannst du als Reaktion die Wiederholung dieses Rettungswurfs erzwingen — mit Vorteil.", "levels": [7]}, {"key": "srd-2024_bard_epic-boon", "name": "Epic Boon", "desc": "You gain an Epic Boon feat (see \"Feats\") or another feat of your choice for which you qualify. Boon of Spell Recall is recommended.", "descDe": "Du erhältst einen Epischen Feat (siehe „Feats\") oder einen anderen Feat deiner Wahl, für den du die Voraussetzungen erfüllst. Empfohlen: Segen der Zaubererinnerung.", "levels": [19]}, {"key": "srd-2024_bard_expertise", "name": "Expertise", "desc": "You gain Expertise (see \"Rules Glossary\") in two of your skill proficiencies of your choice. Performance and Persuasion are recommended if you have proficiency in them.\n\nAt Bard level 9, you gain Expertise in two more of your skill proficiencies of your choice.", "descDe": "Du erhältst Expertise (siehe Regelglossar) in zwei Fertigkeiten deiner Wahl, in denen du bereits geübt bist. Empfohlen: Auftreten und Überzeugen, sofern vorhanden. — Auf Bardenstufe 9 erhältst du Expertise in zwei weiteren Fertigkeiten deiner Wahl.", "levels": [2]}, {"key": "srd-2024_bard_font-of-inspiration", "name": "Font of Inspiration", "desc": "You now regain all your expended uses of Bardic Inspiration when you finish a Short or Long Rest.\n\nIn addition, you can expend a spell slot (no action required) to regain one expended use of Bardic Inspiration.", "descDe": "Du erhältst nun alle verbrauchten Nutzungen der Bardeninspiration sowohl nach einer kurzen als auch nach einer langen Rast zurück. — Außerdem kannst du (ohne Aktion) einen Zauberplatz ausgeben, um eine verbrauchte Nutzung der Bardeninspiration zurückzuerhalten.", "levels": [5]}, {"key": "srd-2024_bard_jack-of-all-trades", "name": "Jack of All Trades", "desc": "You can add half your Proficiency Bonus (round down) to any ability check you make that uses a skill proficiency you lack and that doesn't otherwise use your Proficiency Bonus.\n\nFor example, if you make a Strength (Athletics) check and lack Athletics proficiency, you can add half your Proficiency Bonus to the check.", "descDe": "Du kannst die Hälfte deines Übungsbonus (abgerundet) zu jeder Fähigkeitsprobe addieren, für die du keine Fertigkeitsübung besitzt und die deinen Übungsbonus sonst nicht einbezieht.", "levels": [2]}, {"key": "srd-2024_bard_magical-secrets", "name": "Magical Secrets", "desc": "You've learned secrets from various magical traditions. Whenever you reach a Bard level (including this level) and the Prepared Spells number in the Bard Features table increases, you can choose any of your new prepared spells from the Bard, Cleric, Druid, and Wizard spell lists, and the chosen spells count as Bard spells for you (see a class's section for its spell list). In addition, whenever you replace a spell prepared for this class, you can replace it with a spell from those lists.", "descDe": "Du hast Geheimnisse verschiedener magischer Traditionen erlernt. Immer wenn sich die Zahl vorbereiteter Zauber in der Bardenmerkmale-Tabelle erhöht (auch auf dieser Stufe), kannst du neue vorbereitete Zauber aus den Zauberlisten von Barde, Kleriker, Druide und Zauberer wählen — sie gelten für dich als Bardenzauber. Beim Ersetzen eines vorbereiteten Zaubers kannst du ebenfalls aus diesen Listen wählen.", "levels": [10]}, {"key": "srd-2024_bard_spellcasting", "name": "Spellcasting", "desc": "You have learned to cast spells through your bardic arts. See \"Spells\" for the rules on spellcasting. The information below details how you use those rules with Bard spells, which appear in the Bard spell list later in the class's description.\n\n**Cantrips.** You know two cantrips of your choice from the Bard spell list. *Dancing Lights* and *Vicious Mockery* are recommended.\n\nWhenever you gain a Bard level, you can replace one of your cantrips with another cantrip of your choice from the Bard spell list.\n\nWhen you reach Bard levels 4 and 10, you learn another cantrip of your choice from the Bard spell list, as shown in the Cantrips column of the Bard Features table.\n\n**Spell Slots.** The Bard Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a Long Rest.\n\n**Prepared Spells of Level 1+.** You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose four level 1 spells from the Bard spell list. *Charm Person*, *Color Spray*, *Dissonant Whispers*, and *Healing Word* are recommended.\n\nThe number of spells on your list increases as you gain Bard levels, as shown in the Prepared Spells column of the Bard Features table. Whenever that number increases, choose additional spells from the Bard spell list until the number of spells on your list matches the number on the table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 3 Bard, your list of prepared spells can include six spells of levels 1 and 2 in any combination.\n\nIf another Bard feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Bard spells for you.\n\n**Changing Your Prepared Spells.** Whenever you gain a Bard level, you can replace one spell on your list with another Bard spell for which you have spell slots.\n\n**Spellcasting Ability.** Charisma is your spellcasting ability for your Bard spells.\n\n**Spellcasting Focus.** You can use a Musical Instrument as a Spellcasting Focus for your Bard spells.", "descDe": "Du hast gelernt, durch deine bardische Kunst Zauber zu wirken. — **Zaubertricks.** Du kennst zwei Zaubertricks deiner Wahl aus der Bardenzauberliste. Bei jedem Stufenaufstieg kannst du einen Zaubertrick gegen einen anderen aus der Bardenzauberliste austauschen. Auf Bardenstufe 4 und 10 lernst du einen weiteren Zaubertrick hinzu. — **Zauberplätze.** Du regenerierst alle verbrauchten Zauberplätze nach einer langen Rast. — **Vorbereitete Zauber des 1. Grades und höher.** Wähle zu Beginn vier Zauber des 1. Grades aus der Bardenzauberliste. Die Anzahl wählbarer Zauber steigt mit deiner Bardenstufe. Bei jedem Stufenaufstieg kannst du einen vorbereiteten Zauber gegen einen anderen Bardenzauber austauschen, für den du einen Zauberplatz besitzt. — Charisma ist dein Zauberattribut für Bardenzauber. Du kannst ein Musikinstrument als Zauberfokus verwenden.", "levels": [1]}, {"key": "srd-2024_bard_superior-inspiration", "name": "Superior Inspiration", "desc": "When you roll Initiative, you regain expended uses of Bardic Inspiration until you have two if you have fewer than that.", "descDe": "Würfelst du deine Initiative und hast weniger als zwei Nutzungen der Bardeninspiration übrig, erhältst du Nutzungen zurück, bis du zwei hast.", "levels": [18]}, {"key": "srd-2024_bard_words-of-creation", "name": "Words of Creation", "desc": "You have mastered two of the Words of Creation: the words of life and death. You therefore always have the *Power Word Heal* and *Power Word Kill* spells prepared. When you cast either spell, you can target a second creature with it if that creature is within 10 feet of the first target.", "descDe": "Du beherrschst zwei der Schöpfungsworte: das Wort des Lebens und das Wort des Todes. Dadurch hast du stets die Zauber Heilendes Machtwort und Todesmachtwort vorbereitet. Wirkst du einen davon, kannst du ein zweites Ziel innerhalb von 3 m des ersten mit einbeziehen.", "levels": [20]}], "resourceTables": {"Bardic Die": {"1": "D6", "2": "D6", "3": "D6", "4": "D6", "5": "D8", "6": "D8", "7": "D8", "8": "D8", "9": "D8", "10": "D10", "11": "D10", "12": "D10", "13": "D10", "14": "D10", "15": "D12", "16": "D12", "17": "D12", "18": "D12", "19": "D12", "20": "D12"}, "Cantrips": {"1": "2", "2": "2", "3": "2", "4": "3", "5": "3", "6": "3", "7": "3", "8": "3", "9": "3", "10": "4", "11": "4", "12": "4", "13": "4", "14": "4", "15": "4", "16": "4", "17": "4", "18": "4", "19": "4", "20": "4"}, "Prepared Spells": {"1": "4", "2": "5", "3": "6", "4": "7", "5": "9", "6": "10", "7": "11", "8": "12", "9": "14", "10": "15", "11": "16", "12": "16", "13": "17", "14": "17", "15": "18", "16": "18", "17": "19", "18": "20", "19": "21", "20": "22"}}, "spellSlotsByLevel": {"1": [2, 0, 0, 0, 0, 0, 0, 0, 0], "2": [3, 0, 0, 0, 0, 0, 0, 0, 0], "3": [4, 2, 0, 0, 0, 0, 0, 0, 0], "4": [4, 3, 0, 0, 0, 0, 0, 0, 0], "5": [4, 3, 2, 0, 0, 0, 0, 0, 0], "6": [4, 3, 3, 0, 0, 0, 0, 0, 0], "7": [4, 3, 3, 1, 0, 0, 0, 0, 0], "8": [4, 3, 3, 2, 0, 0, 0, 0, 0], "9": [4, 3, 3, 3, 1, 0, 0, 0, 0], "10": [4, 3, 3, 3, 2, 0, 0, 0, 0], "11": [4, 3, 3, 3, 2, 1, 0, 0, 0], "12": [4, 3, 3, 3, 2, 1, 0, 0, 0], "13": [4, 3, 3, 3, 2, 1, 1, 0, 0], "14": [4, 3, 3, 3, 2, 1, 1, 0, 0], "15": [4, 3, 3, 3, 2, 1, 1, 1, 0], "16": [4, 3, 3, 3, 2, 1, 1, 1, 0], "17": [4, 3, 3, 3, 2, 1, 1, 1, 1], "18": [4, 3, 3, 3, 3, 1, 1, 1, 1], "19": [4, 3, 3, 3, 3, 2, 1, 1, 1], "20": [4, 3, 3, 3, 3, 2, 2, 1, 1]}}, {"key": "srd-2024_cleric", "name": "Cleric", "hitDie": "w8", "savingThrows": ["cha", "wis"], "skillChoiceCount": 2, "weaponProficiencies": "Simple weapons", "armorProficiencies": "Light and Medium armor and Shields", "toolProficiencies": "", "armorChecked": ["light", "medium", "shields"], "weaponsChecked": ["simple"], "toolsChecked": [], "startingEquipment": "Choose A or B: (A) Chain Shirt, Shield, Mace, Holy Symbol, Priest's Pack, and 7 GP; or (B) 110 GP", "isCaster": true, "spellAbility": "wis", "features": [{"key": "srd-2024_cleric_ability-score-improvement", "name": "Ability Score Improvement", "desc": "You gain the Ability Score Improvement feat (see \"Feats\") or another feat of your choice for which you qualify. You gain this feature again at Cleric levels 8, 12, and 16.", "descDe": "", "levels": [4, 8, 12, 16]}, {"key": "srd-2024_cleric_blessed-strikes", "name": "Blessed Strikes", "desc": "Divine power infuses you in battle. You gain one of the following options of your choice (if you get either option from a Cleric subclass in an older book, use only the option you choose for this feature).\n\n**Divine Strike.** Once on each of your turns when you hit a creature with an attack roll using a weapon, you can cause the target to take an extra 1d8 Necrotic or Radiant damage (your choice).\n\n**Potent Spellcasting.** Add your Wisdom modifier to the damage you deal with any Cleric cantrip.", "descDe": "", "levels": [7]}, {"key": "srd-2024_cleric_channel-divinity", "name": "Channel Divinity", "desc": "You can channel divine energy directly from the Outer Planes to fuel magical effects. You start with two such effects: Divine Spark and Turn Undead, each of which is described below. Each time you use this class's Channel Divinity, choose which Channel Divinity effect from this class to create. You gain additional effect options at higher Cleric levels.\n\nYou can use this class's Channel Divinity twice. You regain one of its expended uses when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest. You gain additional uses when you reach certain Cleric levels, as shown in the Channel Divinity column of the Cleric Features table.\n\nIf a Channel Divinity effect requires a saving throw, the DC equals the spell save DC from this class's Spellcasting feature.\n\n**Divine Spark.** As a Magic action, you point your Holy Symbol at another creature you can see within 30 feet of yourself and focus divine energy at it. Roll 1d8 and add your Wisdom modifier. You either restore Hit Points to the creature equal to that total or force the creature to make a Constitution saving throw. On a failed save, the creature takes Necrotic or Radiant damage (your choice) equal to that total. On a successful save, the creature takes half as much damage (round down).\n\nYou roll an additional d8 when you reach Cleric levels 7 (2d8), 13 (3d8), and 18 (4d8).\n\n**Turn Undead.** As a Magic action, you present your Holy Symbol and censure Undead creatures. Each Undead of your choice within 30 feet of you must make a Wisdom saving throw. If the creature fails its save, it has the Frightened and Incapacitated conditions for 1 minute. For that duration, it tries to move as far from you as it can on its turns. This effect ends early on the creature if it takes any damage, if you have the Incapacitated condition, or if you die.", "descDe": "Du kannst göttliche Energie direkt aus den Außenebenen kanalisieren, um magische Effekte zu erzeugen. Du beginnst mit zwei solchen Effekten: Untote Vertreiben und einem weiteren, der von deiner Domäne bestimmt wird. Jedes Mal, wenn du Kanal der Göttlichkeit einsetzt, wählst du, welchen Effekt du erzeugen willst. Höhere Klerikerstufen bringen weitere Effekte.", "levels": [2]}, {"key": "srd-2024_cleric_cleric-subclasses", "name": "Cleric Subclasses", "desc": "You gain a Cleric subclass of your choice. The Life Domain subclass is detailed after this class's description. A subclass is a specialization that grants you features at certain Cleric levels. For the rest of your career, you gain each of your subclass's features that are of your Cleric level or lower.", "descDe": "", "levels": [3]}, {"key": "srd-2024_cleric_divine-intervention", "name": "Divine Intervention", "desc": "You can call on your deity or pantheon to intervene on your behalf. As a Magic action, choose any Cleric spell of level 5 or lower that doesn't require a Reaction to cast. As part of the same action, you cast that spell without expending a spell slot or needing Material components. You can't use this feature again until you finish a Long Rest.", "descDe": "", "levels": [10]}, {"key": "srd-2024_cleric_divine-order", "name": "Divine Order", "desc": "You have dedicated yourself to one of the following sacred roles of your choice.\n\n**Protector.** Trained for battle, you gain proficiency with Martial weapons and training with Heavy armor.\n\n**Thaumaturge.** You know one extra cantrip from the Cleric spell list. In addition, your mystical connection to the divine gives you a bonus to your Intelligence (Arcana or Religion) checks. The bonus equals your Wisdom modifier (minimum of +1).", "descDe": "Du hast dich einer der folgenden geweihten Aufgaben verschrieben: **Schützer** — du erhältst Übung mit Kriegswaffen und Übung mit schwerer Rüstung. **Gelehrter** — du erhältst einen Zaubertrick der Magierliste deiner Wahl sowie Übung in einer Wissensfertigkeit deiner Wahl (Arkane Kunde, Geschichte, Naturkunde oder Religion).", "levels": [1]}, {"key": "srd-2024_cleric_epic-boon", "name": "Epic Boon", "desc": "You gain an Epic Boon feat (see \"Feats\") or another feat of your choice for which you qualify. Boon of Fate is recommended.", "descDe": "", "levels": [19]}, {"key": "srd-2024_cleric_greater-divine-intervention", "name": "Greater Divine Intervention", "desc": "You can call on even more powerful divine intervention. When you use your Divine Intervention feature, you can choose *Wish* when you select a spell. If you do so, you can't use Divine Intervention again until you finish 2d4 Long Rests.", "descDe": "", "levels": [20]}, {"key": "srd-2024_cleric_improved-blessed-strikes", "name": "Improved Blessed Strikes", "desc": "The option you chose for Blessed Strikes grows more powerful.\n\n**Divine Strike.** The extra damage of your Divine Strike increases to 2d8.\n\n**Potent Spellcasting.** When you cast a Cleric cantrip and deal damage to a creature with it, you can give vitality to yourself or another creature within 60 feet of yourself, granting a number of Temporary Hit Points equal to twice your Wisdom modifier.", "descDe": "", "levels": [14]}, {"key": "srd-2024_cleric_sear-undead", "name": "Sear Undead", "desc": "Whenever you use Turn Undead, you can roll a number of d8s equal to your Wisdom modifier (minimum of 1d8) and add the rolls together. Each Undead that fails its saving throw against that use of Turn Undead takes Radiant damage equal to the roll's total. This damage doesn't end the turn effect.", "descDe": "Ab Stufe 5 wird ein Untotes der Herausforderungsstufe 1/2 oder niedriger, das seinen Rettungswurf gegen dein Merkmal Untote Vertreiben verpatzt, sofort vernichtet.", "levels": [5]}, {"key": "srd-2024_cleric_spellcasting", "name": "Spellcasting", "desc": "You have learned to cast spells through prayer and meditation. See \"Spells\" for the rules on spellcasting. The information below details how you use those rules with Cleric spells, which appear on the Cleric spell list later in the class's description.\n\n**Cantrips.** You know three cantrips of your choice from the Cleric spell list. *Guidance*, *Sacred Flame*, and *Thaumaturgy* are recommended.\n\nWhenever you gain a Cleric level, you can replace one of your cantrips with another cantrip of your choice from the Cleric spell list.\n\nWhen you reach Cleric levels 4 and 10, you learn another cantrip of your choice from the Cleric spell list, as shown in the Cantrips column of the Cleric Features table.\n\n**Spell Slots.** The Cleric Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a Long Rest.\n\n**Prepared Spells of Level 1+.** You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose four level 1 spells from the Cleric spell list. *Bless*, *Cure Wounds*, *Guiding Bolt*, and *Shield of Faith* are recommended.\n\nThe number of spells on your list increases as you gain Cleric levels, as shown in the Prepared Spells column of the Cleric Features table. Whenever that number increases, choose additional spells from the Cleric spell list until the number of spells on your list matches the number on the table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 3 Cleric, your list of prepared spells can include six spells of levels 1 and 2 in any combination.\n\nIf another Cleric feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Cleric spells for you.\n\n**Changing Your Prepared Spells.** Whenever you finish a Long Rest, you can change your list of prepared spells, replacing any of the spells there with other Cleric spells for which you have spell slots.\n\n**Spellcasting Ability.** Wisdom is your spellcasting ability for your Cleric spells.\n\n**Spellcasting Focus.** You can use a Holy Symbol as a Spellcasting Focus for your Cleric spells.", "descDe": "Du hast gelernt, durch Gebet und Meditation Zauber zu wirken. — Charisma ist NICHT dein Zauberattribut als Kleriker; stattdessen ist es Weisheit. Ein Heiliges Symbol dient dir als Zauberfokus.", "levels": [1]}], "resourceTables": {"Cantrips": {"1": "3", "2": "3", "3": "3", "4": "4", "5": "4", "6": "4", "7": "4", "8": "4", "9": "4", "10": "5", "11": "5", "12": "5", "13": "5", "14": "5", "15": "5", "16": "5", "17": "5", "18": "5", "19": "5", "20": "5"}, "Channel Divinity": {"2": "2", "3": "2", "4": "2", "5": "2", "6": "3", "7": "3", "8": "3", "9": "3", "10": "3", "11": "3", "12": "3", "13": "3", "14": "3", "15": "3", "16": "3", "17": "3", "18": "4", "19": "4", "20": "4"}, "Prepared Spells": {"1": "4", "2": "5", "3": "6", "4": "7", "5": "9", "6": "10", "7": "11", "8": "12", "9": "14", "10": "15", "11": "16", "12": "16", "13": "17", "14": "17", "15": "18", "16": "18", "17": "19", "18": "20", "19": "21", "20": "
