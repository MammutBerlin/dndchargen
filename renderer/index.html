/* ---- "Vorlage übernehmen" im manuellen Formular: schreibt direkt in die
   bereits gerenderten Formularfelder, ohne neu zu rendern (kein Verlust
   sonstiger, noch ungespeicherter Eingaben). Alles danach frei editierbar. ---- */
// Dieselbe Bereinigung wie beim Assistenten (lib/character-builder.js oneLine):
// Markdown-Tabellen lesbar zusammenfassen, Hervorhebungen entfernen, eingebettete
// Zeilenumbrueche glaetten — sonst zerreisst ein mehrzeiliger Open5e-Text unser
// Pipe-Zeilenformat (Merkmale/Ausruestung: eine Zeile pro Eintrag).
function stripMarkdownTableClient(text){
  const lines = String(text||'').split('\n');
  const out = []; let i = 0;
  while(i < lines.length){
    if(/^\s*\|.*\|\s*$/.test(lines[i])){
      const rows = [];
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        const cells = lines[i].split('|').map(c=>c.trim()).filter(Boolean);
        if(!cells.every(c=>/^:?-+:?$/.test(c))) rows.push(cells.join(' – '));
        i++;
      }
      if(rows.length) out.push(rows.join('; '));
    } else { out.push(lines[i]); i++; }
  }
  return out.join('\n');
}
function oneLineClient(s){
  let t = String(s==null?'':s);
  t = stripMarkdownTableClient(t);
  t = t.replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1');
  return t.replace(/\s*\n+\s*/g,' — ').replace(/[ \t]{2,}/g,' ').trim();
}
// Baut eine Pipe-Zeile aus einzeln bereinigten Feldern (wie lib/character-builder.js
// pipe()) — verhindert, dass ein zufaelliges "|" im Beschreibungstext mit den
// eigenen Trennzeichen kollidiert.
function pipeLineClient(fields){
  return fields.map(f => oneLineClient(f).replace(/\|/g,'/')).join('|');
}
function appendLine(elId, line){
  const el = document.getElementById(elId);
  if(!el || !line) return;
  el.value = [el.value, line].filter(Boolean).join('\n');
}
function appendCsv(elId, text){
  const el = document.getElementById(elId);
  if(!el || !text) return;
  el.value = [el.value.trim(), text].filter(Boolean).join(', ');
}
function checkByValue(cls, code){
  const el = document.querySelector('.'+cls+'[value="'+code+'"]');
  if(el) el.checked = true;
}
function setMovementOrVision(prefix, field, value){
  const chk = document.getElementById(prefix+'chk_'+field);
  const val = document.getElementById(prefix+'val_'+field);
  if(!chk || !val || !value) return;
  chk.checked = true;
  val.disabled = false;
  val.value = value;
}
function applySpeciesTemplate(){
  const key = document.getElementById('tpl_species').value;
  const sp = srdSpecies.find(s => s.key === key);
  if(!sp) return;
  if(sp.size) document.getElementById('f_size').value = sp.size;
  MOVEMENT_TYPES.forEach(([field]) => setMovementOrVision('mv', field, sp[field]));
  VISION_TYPES.forEach(([field]) => setMovementOrVision('vi', field, sp[field]));
  if(sp.abilityBonuses){
    ABILS_ORDER.forEach(([code]) => {
      const bonus = Number(sp.abilityBonuses[code]) || 0;
      if(!bonus) return;
      const el = document.getElementById('ab_'+code);
      if(el) el.value = (Number(el.value) || 0) + bonus;
    });
  }
  (sp.skillsChecked||[]).forEach(code => {
    const sel = document.getElementById('sk_'+code);
    if(sel && Number(sel.value)===0) sel.value = '1';
  });
  (sp.resistanceChecked||[]).forEach(code => checkByValue('chk_resist', code));
  (sp.languagesChecked||[]).forEach(code => checkByValue('chk_lang', code));
  (sp.traits||[]).forEach(t => appendLine('f_features', pipeLineClient([t.name, '', t.desc, t.descDe||''])));
}
function applyBackgroundTemplate(){
  const key = document.getElementById('tpl_background').value;
  const bg = srdBackgrounds.find(b => b.key === key);
  if(!bg) return;
  if(bg.name) document.getElementById('f_background').value = bg.name;
  if(bg.bonusMode === 'fixed' && bg.abilityBonuses){
    ABILS_ORDER.forEach(([code]) => {
      const bonus = Number(bg.abilityBonuses[code]) || 0;
      if(!bonus) return;
      const el = document.getElementById('ab_'+code);
      if(el) el.value = (Number(el.value) || 0) + bonus;
    });
  }
  (bg.skillProficiencies||[]).forEach(code => {
    const sel = document.getElementById('sk_'+code);
    if(sel && Number(sel.value)===0) sel.value = '1';
  });
  (bg.toolsChecked||[]).forEach(code => checkByValue('chk_tool', code));
  appendCsv('f_profTools', bg.toolProficiency);
  if(bg.feat) appendLine('f_features', pipeLineClient([bg.feat, 'Herkunfts-Feat', '']));
  if(bg.equipmentText) appendLine('f_equipment', pipeLineClient(['Hintergrund-Ausrüstung (Wahl): ' + bg.equipmentText, '']));
}
function applyClassTemplate(){
  const key = document.getElementById('tpl_class').value;
  const kl = srdClasses.find(c => c.key === key);
  if(!kl) return;
  (kl.savingThrows||[]).forEach(code => {
    const el = document.getElementById('sv_'+code);
    if(el) el.checked = true;
  });
  (kl.armorChecked||[]).forEach(code => checkByValue('chk_armor', code));
  (kl.weaponsChecked||[]).forEach(code => checkByValue('chk_weapon', code));
  (kl.toolsChecked||[]).forEach(code => checkByValue('chk_tool', code));
  appendCsv('f_profArmor', kl.armorProficiencies);
  appendCsv('f_profWeapons', kl.weaponProficiencies);
  appendCsv('f_profTools', kl.toolProficiencies);
  if(kl.isCaster){
    document.getElementById('f_spellEnabled').checked = true;
    document.getElementById('f_spAbility').value = ABILITY_LABEL_DE[kl.spellAbility] || '';
    const slots = (kl.spellSlotsByLevel && kl.spellSlotsByLevel[1]) || [];
    for(let i=0;i<9;i++){ const el = document.getElementById('slot_'+i); if(el) el.value = slots[i]||0; }
  }
  (kl.features||[]).filter(f => (f.levels||[]).includes(1)).forEach(f => appendLine('f_features', pipeLineClient([f.name, '', f.desc, f.descDe||''])));
  if(kl.startingEquipment) appendLine('f_equipment', pipeLineClient(['Start-Ausrüstung (Wahl): ' + kl.startingEquipment, '']));
}

function wizardUpdate(patch){ Object.assign(wizard, patch); render(); }
// Siehe wizardDraftUpdateSilent/customUpdateSilent: reine Text-/Zahlen-Felder
// duerfen bei jedem Tastendruck NICHT neu rendern (sonst Fokusverlust) — aber
// die Eingabe MUSS trotzdem im Zustand landen, sonst geht sie beim naechsten
// Re-Render (ausgeloest durch ein ganz anderes Feld, z.B. Klassenauswahl)
// wieder verloren. Genau das war der gemeldete Bug beim Namensfeld.
function wizardUpdateSilent(patch){ Object.assign(wizard, patch); }
function wizardToggleSkill(code){
  const i = wizard.skillChoices.indexOf(code);
  if(i>=0) wizard.skillChoices.splice(i,1);
  else wizard.skillChoices.push(code);
  render();
}
function wizardSetMode(which, mode){ wizard[which+'Mode'] = mode; render(); }
function wizardDraftUpdate(which, patch){ Object.assign(wizard[which+'Draft'], patch); render(); }
// Fuer reine Text-/Zahlen-/Textarea-Felder: Zustand aktualisieren OHNE neu zu
// rendern. Ein Re-Render bei jedem Tastendruck wuerde das Eingabefeld (per
// innerHTML) neu erzeugen und damit den Fokus killen — nach jedem Zeichen
// muesste man wieder reinklicken. Nur fuer Felder, von denen keine andere
// sichtbare Stelle im Formular live abhaengt (Zaehler etc.).
function wizardDraftUpdateSilent(which, patch){ Object.assign(wizard[which+'Draft'], patch); }
function wizardDraftToggle(which, field, code, max){
  const arr = wizard[which+'Draft'][field];
  const i = arr.indexOf(code);
  if(i>=0) arr.splice(i,1);
  else if(arr.length < max) arr.push(code);
  render();
}
function wizardSetAbility(code, value){
  wizard.baseAbilities[code] = Number(value);
  render();
}
function pointBuySpent(abilities){
  return ABILS_ORDER.reduce((sum, [code]) => sum + (POINT_BUY_COST[abilities[code]] ?? 0), 0);
}

async function doCreateFromWizard(){
  const w = wizard;
  const name = (w.name || '').trim();
  if(!name){ wizardUpdate({error:'Bitte einen Namen eintragen.'}); return; }

  const abilities = Object.assign({}, w.baseAbilities);
  const spent = pointBuySpent(abilities);
  if(spent > POINT_BUY_BUDGET){
    wizardUpdate({error:`Zu viele Punkte verteilt (${spent} von ${POINT_BUY_BUDGET}). Bitte anpassen.`});
    return;
  }

  const speciesKeyFromList = w.speciesMode==='list' ? document.getElementById('wiz_species').value : null;
  if(w.speciesMode==='list' && !speciesKeyFromList){ wizardUpdate({error:'Bitte eine Spezies auswählen.'}); return; }
  if(w.speciesMode==='new' && !w.speciesDraft.name.trim()){ wizardUpdate({error:'Bitte einen Namen für die neue Spezies eintragen.'}); return; }

  const backgroundKeyFromList = w.backgroundMode==='list' ? document.getElementById('wiz_background').value : null;
  if(w.backgroundMode==='list' && !backgroundKeyFromList){ wizardUpdate({error:'Bitte einen Hintergrund auswählen.'}); return; }
  const backgroundObj = w.backgroundMode==='new' ? w.backgroundDraft : srdBackgrounds.find(b=>b.key===backgroundKeyFromList);
  if(w.backgroundMode==='new'){
    if(!backgroundObj.name.trim()){ wizardUpdate({error:'Bitte einen Namen für den neuen Hintergrund eintragen.'}); return; }
    if(backgroundObj.bonusMode === 'choice' && backgroundObj.abilityChoices.length !== 3){ wizardUpdate({error:'Beim neuen Hintergrund bitte genau drei Attribute für den Bonus auswählen (oder auf „Feste Werte" umschalten).'}); return; }
  }

  const classKeyFromList = w.classMode==='list' ? document.getElementById('wiz_class').value : null;
  if(w.classMode==='list' && !classKeyFromList){ wizardUpdate({error:'Bitte eine Klasse auswählen.'}); return; }
  const classObj = w.classMode==='new' ? w.classDraft : srdClasses.find(c=>c.key===classKeyFromList);
  if(w.classMode==='new'){
    if(!classObj.name.trim()){ wizardUpdate({error:'Bitte einen Namen für die neue Klasse eintragen.'}); return; }
    if(classObj.savingThrows.length !== 2){ wizardUpdate({error:'Bei der neuen Klasse bitte genau zwei Rettungswurf-Attribute auswählen.'}); return; }
  }

  const skillChoices = w.skillChoices.slice();
  if(skillChoices.length !== classObj.skillChoiceCount){
    wizardUpdate({error:`Bitte genau ${classObj.skillChoiceCount} Fertigkeiten wählen (aktuell ${skillChoices.length}).`});
    return;
  }

  let bgBonusChoice;
  if(w.bgMode === 'even'){
    bgBonusChoice = { mode:'even' };
  } else {
    const plus2 = w.bgPlus2;
    const plus1 = w.bgPlus1;
    if(!plus2 || !plus1 || plus2 === plus1){
      wizardUpdate({error:'Bitte zwei unterschiedliche Attribute für +2/+1 wählen.'});
      return;
    }
    bgBonusChoice = { mode:'2-1', plus2, plus1 };
  }

  wizardUpdate({error:''});
  try{
    // Neu eingetippte Spezies/Hintergrund/Klasse zuerst als eigene Inhalte speichern
    // (dadurch stehen sie danach auch fuer kuenftige Charaktere zur Auswahl), dann
    // wie gewohnt mit den zurueckgegebenen Schluesseln weiterrechnen.
    let speciesKey = speciesKeyFromList;
    if(w.speciesMode==='new'){
      const saved = await apiFetch('/api/custom/species', { method:'POST', body: JSON.stringify({
        name: w.speciesDraft.name, size: w.speciesDraft.size, speed: w.speciesDraft.speed,
        darkvision: w.speciesDraft.darkvision, traits: parseTraitLines(w.speciesDraft.traitsText)
      })});
      speciesKey = saved.key;
    }

    let backgroundKey = backgroundKeyFromList;
    if(w.backgroundMode==='new'){
      const saved = await apiFetch('/api/custom/backgrounds', { method:'POST', body: JSON.stringify({
        name: w.backgroundDraft.name, bonusMode: w.backgroundDraft.bonusMode,
        abilityChoices: w.backgroundDraft.abilityChoices, abilityBonuses: w.backgroundDraft.abilityBonuses,
        skillProficiencies: w.backgroundDraft.skillProficiencies, toolsChecked: w.backgroundDraft.toolsChecked,
        toolProficiency: w.backgroundDraft.toolProficiency,
        feat: w.backgroundDraft.feat, equipmentText: w.backgroundDraft.equipmentText
      })});
      backgroundKey = saved.key;
    }

    let classKey = classKeyFromList;
    if(w.classMode==='new'){
      const saved = await apiFetch('/api/custom/classes', { method:'POST', body: JSON.stringify({
        name: w.classDraft.name, hitDie: w.classDraft.hitDie, savingThrows: w.classDraft.savingThrows,
        skillChoiceCount: w.classDraft.skillChoiceCount, weaponProficiencies: w.classDraft.weaponProficiencies,
        armorProficiencies: w.classDraft.armorProficiencies, toolProficiencies: w.classDraft.toolProficiencies,
        startingEquipment: w.classDraft.startingEquipment, casterProgression: w.classDraft.casterProgression,
        spellAbility: w.classDraft.casterProgression==='none' ? null : w.classDraft.spellAbility,
        features: parseFeatureLines(w.classDraft.featuresText)
      })});
      classKey = saved.key;
    }

    const built = await apiFetch('/api/srd/build-level1', {
      method:'POST',
      body: JSON.stringify({ speciesKey, backgroundKey, classKey, baseAbilities: abilities, bgBonusChoice, skillChoices })
    });
    built.name = name;
    const saved = await apiFetch('/api/characters', { method:'POST', body: JSON.stringify(built) });
    wizard = null;
    srdLoaded = false; // naechster Assistenten-Aufruf laedt auch die eben neu angelegten Inhalte
    await loadCharacters();
    goSheet(saved.id);
  }catch(e){
    wizardUpdate({error:''});
    showError(e, 'Charakter konnte nicht erstellt werden:');
  }
}

async function doLevelUp(id){
  const c = characters.find(x => x.id === id);
  if(!c || !c.classKey) return;
  try{
    const updated = await apiFetch('/api/srd/level-up/' + encodeURIComponent(id), {
      method:'POST', body: JSON.stringify({ newLevel: (c.level||1) + 1 })
    });
    await loadCharacters();
    goSheet(updated.id);
  }catch(e){
    showError(e, 'Stufenaufstieg fehlgeschlagen:');
  }
}

/* ============== Eigene Inhalte (Spezies/Hintergründe/Klassen) ============== */
function parseTraitLines(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const i = l.indexOf('|');
    return i<0 ? { name:l, desc:'' } : { name:l.slice(0,i).trim(), desc:l.slice(i+1).trim() };
  });
}
function traitsToLines(traits){ return (traits||[]).map(t=>`${t.name}|${t.desc}`).join('\n'); }
function parseFeatureLines(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts = l.split('|');
    const levels = (parts[0]||'').split(',').map(s=>Number(s.trim())).filter(n=>n>=1 && n<=20);
    return { levels, name:(parts[1]||'').trim(), desc:(parts[2]||'').trim() };
  });
}
function featuresToLines(features){ return (features||[]).map(f=>`${(f.levels||[]).join(',')}|${f.name}|${f.desc}`).join('\n'); }

async function saveCustom(){
  const d = customDraft;
  if(!d.name || !d.name.trim()){ customError = 'Bitte einen Namen eintragen.'; render(); return; }

  let body, url;
  if(customTab === 'species'){
    body = { name:d.name, size:d.size, speed:d.speed, speedFly:d.speedFly, speedSwim:d.speedSwim, speedClimb:d.speedClimb, speedBurrow:d.speedBurrow,
      darkvision:d.darkvision, blindsight:d.blindsight, tremorsense:d.tremorsense, truesight:d.truesight,
      abilityBonuses:d.abilityBonuses, skillsChecked:d.skillsChecked, resistanceChecked:d.resistanceChecked, languagesChecked:d.languagesChecked,
      traits: parseTraitLines(d.traitsText) };
    url = '/api/custom/species' + (customEditKey ? '/'+encodeURIComponent(customEditKey) : '');
  } else if(customTab === 'background'){
    if(d.bonusMode === 'choice' && d.abilityChoices.length !== 3){
      customError = 'Bitte genau drei Attribute für den Bonus auswählen (oder auf „Feste Werte" umschalten).'; render(); return;
    }
    body = { name:d.name, bonusMode:d.bonusMode, abilityChoices:d.abilityChoices, abilityBonuses:d.abilityBonuses,
      skillProficiencies:d.skillProficiencies, toolsChecked:d.toolsChecked,
      toolProficiency:d.toolProficiency, feat:d.feat, equipmentText:d.equipmentText };
    url = '/api/custom/backgrounds' + (customEditKey ? '/'+encodeURIComponent(customEditKey) : '');
  } else {
    if(d.savingThrows.length !== 2){ customError = 'Bitte genau zwei Rettungswurf-Attribute auswählen.'; render(); return; }
    body = { name:d.name, hitDie:d.hitDie, savingThrows:d.savingThrows, skillChoiceCount:d.skillChoiceCount,
      armorChecked:d.armorChecked, weaponsChecked:d.weaponsChecked, toolsChecked:d.toolsChecked,
      weaponProficiencies:d.weaponProficiencies, armorProficiencies:d.armorProficiencies, toolProficiencies:d.toolProficiencies,
      startingEquipment:d.startingEquipment, casterProgression:d.casterProgression,
      spellAbility: d.casterProgression==='none' ? null : d.spellAbility,
      features: parseFeatureLines(d.featuresText) };
    url = '/api/custom/classes' + (customEditKey ? '/'+encodeURIComponent(customEditKey) : '');
  }

  try{
    await apiFetch(url, { method: customEditKey ? 'PUT' : 'POST', body: JSON.stringify(body) });
    srdLoaded = false; // erzwingt Neuladen der SRD-/Custom-Listen beim naechsten Besuch
    customDraft = null; customEditKey = null;
    await goCustom(customTab);
  }catch(e){
    customError = 'Speichern fehlgeschlagen: ' + (e && e.message ? e.message : e);
    render();
  }
}

/* Drucken: auf einer normalen Website ist window.print() nicht blockiert — der Browser
   uebernimmt die Seitenaufteilung ueber die @media-print-Regeln im Stylesheet (siehe
   .features-panel und .appendix: break-before:page). Kein Canvas-Umweg noetig.

   Merkmale & Zauberanhang bleiben IMMER bei fester, gut lesbarer 12pt-Schrift (siehe
   body{font-size:12pt} im Stylesheet) — das war der ganze Punkt der letzten Aenderung,
   das soll hier nicht wieder aufgeweicht werden. NUR #pdf-page1-group (Kopf+Vitals+
   Attribute/Faehigkeiten/Waffen/Zauberwirken/Ausruestung) wird per CSS-`zoom` so weit
   herunterskaliert, wie noetig, um auf eine Seite zu passen — "so gross wie moeglich,
   so klein wie noetig". Startet bei 100% (= den vollen 12pt) und schrumpft in kleinen
   Schritten, bis der gemessene Inhalt unter eine grobe A4-Zielhoehe passt oder eine
   Mindestgroesse erreicht ist (darunter waere selbst der Kopf nicht mehr lesbar). */
const PDF_PAGE1_TARGET_HEIGHT_PX = 1000; // grobe Annaeherung an nutzbare A4-Hoehe bei 96dpi minus Standardraender
const PDF_MIN_ZOOM = 0.55;
async function doPrint(){
  const group = document.getElementById('pdf-page1-group');
  if(!group){ window.print(); return; }
  group.style.zoom = '1';
  await new Promise(r => setTimeout(r, 30)); // Reflow abwarten, bevor gemessen wird
  let zoomLevel = 1;
  while(group.scrollHeight > PDF_PAGE1_TARGET_HEIGHT_PX && zoomLevel > PDF_MIN_ZOOM){
    zoomLevel = Math.round((zoomLevel - 0.03) * 100) / 100;
    group.style.zoom = String(zoomLevel);
    await new Promise(r => setTimeout(r, 0));
  }
  window.print();
  const resetZoom = () => { group.style.zoom = ''; window.removeEventListener('afterprint', resetZoom); };
  window.addEventListener('afterprint', resetZoom);
}

/* ============== JSON-Import (FoundryVTT dnd5e Actor Export) ============== */
const SCHOOL_MAP = {abj:'Bannmagie',con:'Beschwörung',div:'Wahrsagerei',enc:'Verzauberung',evo:'Hervorrufung',ill:'Illusion',nec:'Nekromantie',trs:'Verwandlung'};
const DURATION_UNIT_MAP = {inst:'Sofort',turn:'Zug',round:'Runde(n)',minute:'Minute(n)',hour:'Stunde(n)',day:'Tag(e)',month:'Monat(e)',year:'Jahr(e)',perm:'Permanent',spec:'Speziell',disp:'bis aufgehoben'};
const ACTIVATION_MAP = {action:'1 Aktion',bonus:'1 Bonusaktion',reaction:'1 Reaktion',minute:'1 Minute',hour:'1 Stunde',special:'Speziell',legendary:'Legendäre Aktion'};
const SIZE_MAP = {tiny:'Winzig',sm:'Klein',med:'Mittelgroß',lg:'Groß',huge:'Riesig',grg:'Gigantisch'};
const ARMOR_PROF_MAP = {lgt:'Leichte Rüstung',med:'Mittelschwere Rüstung',hvy:'Schwere Rüstung',shl:'Schilde'};
const WEAPON_PROF_MAP = {sim:'Einfache Waffen',mar:'Kriegswaffen'};
const DMG_TYPE_MAP = {fire:'Feuer',cold:'Kälte',acid:'Säure',poison:'Gift',lightning:'Blitz',thunder:'Donner',necrotic:'Nekrotisch',radiant:'Strahlend',force:'Kraft',psychic:'Psychisch',bludgeoning:'Wucht',piercing:'Stich',slashing:'Hieb'};
const CURRENCY_MAP = {gp:'GM',sp:'SM',cp:'KM',pp:'PM',ep:'EM'};

function stripHtml(html){
  let s = String(html||'');
  s = s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n\n').replace(/<li>/gi,'• ').replace(/<\/li>/gi,'\n');
  s = s.replace(/<[^>]+>/g,'');
  s = s.replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  s = s.replace(/\[\[\/damage\s+(\d+)d(\d+)(?:\s+type=(\w+))?\]\]/gi, (m,n,d,t)=> n+'W'+d + (t? ' '+(DMG_TYPE_MAP[t]||t): ''));
  s = s.replace(/\[\[\/(?:r|heal)\s+([^\]]+)\]\]/gi, (m,r)=> r.trim().replace(/^(\d*)d(\d+)$/i, (mm,a,b)=> (a||'')+'W'+b));
  s = s.replace(/@[A-Za-z]+\[([^|\]]*)(?:\|[^\]]*)?\]/g, (m,label)=> (label && !label.startsWith('.')) ? label : '');
  s = s.replace(/&Reference\[[a-zA-Z]+=([^\]]+)\]/gi, '$1');
  s = s.replace(/\n{3,}/g,'\n\n').replace(/[ \t]{2,}/g,' ').trim();
  return s;
}

/* Unser Textformat ist zeilenbasiert (eine Zauber-/Waffen-/Merkmalszeile pro Zeile,
   Felder mit "|" getrennt) — ein "\n" INNERHALB eines Feldes (z. B. ein mehrabsätziger
   Zaubertext mit "Bei höherem Zauberplatz ...") würde das Format zerreißen, weil jede
   Zeile für eine neue Karteikarte gehalten wird. Deshalb hier jedes Feld auf eine
   einzelne Zeile plätten, bevor Zeilen gebaut werden. */
function oneLine(s){
  return String(s==null?'':s).replace(/\s*\n+\s*/g, ' — ').replace(/\|/g,'/').replace(/[ \t]{2,}/g,' ').trim();
}
function pipeLine(fields){
  return fields.map(f => oneLine(f)).join('|');
}

// Foundry/PHB-Exporte fuehren manche Zauber noch unter dem markenrechtlich
// gebundenen Original-Namen (z.B. "Bigby's Hand") — die SRD-5.2-Freigabe hat
// diese Namen durch neutrale ersetzt ("Arcane Hand"). Selbe Liste wie beim
// Aufbau von lib/spell-data.js (server-seitig, s. dortiger Kommentar).
const SPELL_RENAMES_DE = {
  "bigby's hand":'arcane hand', "drawmij's instant summons":'instant summons',
  "evard's black tentacles":'black tentacles', "leomund's secret chest":'secret chest',
  "leomund's tiny hut":'tiny hut', "melf's acid arrow":'acid arrow',
  "mordenkainen's faithful hound":'faithful hound', "mordenkainen's magnificent mansion":'magnificent mansion',
  "mordenkainen's private sanctum":'private sanctum', "mordenkainen's sword":'arcane sword',
  "nystul's magic aura":"arcanist's magic aura", "otiluke's freezing sphere":'freezing sphere',
  "otto's irresistible dance":'irresistible dance', "rary's telepathic bond":'telepathic bond',
  "tasha's hideous laughter":'hideous laughter', "tenser's floating disk":'floating disk'
};
function lookupSpellGistDe(spellName){
  const n = String(spellName||'').toLowerCase().trim();
  const target = SPELL_RENAMES_DE[n] || n;
  const found = srdSpells.find(s => s.name.toLowerCase() === target);
  return found ? (found.gistDe || '') : '';
}
let deTranslations = null;
async function ensureDeTranslationsLoaded(){
  if(deTranslations) return;
  try{ deTranslations = await apiFetch('/api/de-translations'); }
  catch(e){ deTranslations = { species:{}, classes:{} }; } // Import funktioniert dann einfach ohne Uebersetzung weiter
}
function slugifyDe(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
const SRD_SPECIES_NAMES = ['dragonborn','dwarf','elf','gnome','goliath','halfling','human','orc','tiefling'];
function matchSrdSpeciesKey(raceName){
  // Foundry-Rassennamen enthalten oft eine Unterrasse ("Dwarf (Hill)", "High Elf") —
  // unser SRD-Cache kennt nur die Basis-Spezies, daher genuegt ein Enthalten-Check.
  const n = String(raceName||'').toLowerCase();
  const found = SRD_SPECIES_NAMES.find(s => n.includes(s));
  return found ? 'srd-2024_'+found : null;
}
function lookupFeatureDe(it, raceItem, classItems){
  if(!deTranslations) return '';
  const subtype = it.system?.type?.value;
  const name = (it.name||'').trim();
  if(subtype==='race' && raceItem){
    const speciesKey = matchSrdSpeciesKey(raceItem.name);
    const table = speciesKey && deTranslations.species[speciesKey];
    return (table && table[name]) || '';
  }
  if(subtype==='class'){
    // Bei Mehrklassen (selten, aber moeglich) alle vorhandenen Klassen durchprobieren.
    for(const cls of classItems){
      const key = 'srd-2024_' + slugifyDe(cls.name) + '_' + slugifyDe(name);
      const table = deTranslations.classes['srd-2024_'+slugifyDe(cls.name)];
      if(table && table[key]) return table[key];
    }
  }
  return '';
}
function parseFoundryActor(json){
  const sys = json.system || {};
  const items = json.items || [];
  const out = emptyChar();
  out.name = json.name || '';

  ABILS.forEach(([k])=>{
    const a = (sys.abilities||{})[k] || {};
    out.abilities[k] = Number(a.value)||10;
    out.saveProf[k] = !!(a.proficient && Number(a.proficient) >= 1);
  });

  let hasHalfSkill = false;
  SKILLS.forEach(([k])=>{
    const s = (sys.skills||{})[k];
    if(s){
      const v = Number(s.value)||0;
      if(v===0.5){ out.skillProf[k]=0; hasHalfSkill=true; }
      else out.skillProf[k] = Math.max(0, Math.min(2, Math.round(v)));
    }
  });

  const classItems = items.filter(it=>it.type==='class');
  const totalLevel = classItems.reduce((sum,it)=> sum + (Number(it.system?.levels)||0), 0);
  const classDesc = classItems.map(it => it.name + (it.system?.levels? ' '+it.system.levels : '')).join(' / ');
  const raceItem = items.find(it=>it.type==='race');
  const subclassItem = items.find(it=>it.type==='subclass');
  const backgroundItem = items.find(it=>it.type==='background');
  out.background = backgroundItem ? backgroundItem.name : '';
  out.subtitle = [raceItem?raceItem.name:'', classDesc, subclassItem?subclassItem.name:''].filter(Boolean).join(' · ');
  out.profBonus = Number(sys.attributes?.prof) || (totalLevel ? Math.floor((totalLevel-1)/4)+2 : 2);

  out.size = SIZE_MAP[sys.traits?.size] || sys.traits?.size || 'Mittelgroß';
  const walk = raceItem?.system?.movement?.walk || sys.attributes?.movement?.walk;
  if(walk) out.speed = Math.round(Number(walk)*0.3)+' m ('+walk+' ft)';
  const dv = raceItem?.system?.senses?.ranges?.darkvision || sys.attributes?.senses?.ranges?.darkvision;
  if(dv) out.darkvision = Math.round(Number(dv)*0.3)+' m ('+dv+' ft)';

  out.hpMax = Number(sys.attributes?.hp?.max) || 0;
  out.hpCur = sys.attributes?.hp?.value != null ? Number(sys.attributes.hp.value) : out.hpMax;

  let ac = Number(sys.attributes?.ac?.flat) || 0;
  const dexMod = mod(out.abilities.dex);
  if(!ac){
    let base = 10, dexAdd = dexMod, shieldBonus = 0;
    const armorItem = items.find(it=>it.type==='equipment' && it.system?.equipped && it.system?.armor?.value!=null && ['light','medium','heavy'].includes(it.system?.type?.value));
    if(armorItem){
      base = Number(armorItem.system.armor.value)||10;
      const cap = armorItem.system.armor.dex;
      if(cap===0) dexAdd=0; else if(cap!=null) dexAdd = Math.min(dexMod, Number(cap));
    }
    const shieldItem = items.find(it=>it.type==='equipment' && it.system?.equipped && it.system?.type?.value==='shield');
    if(shieldItem) shieldBonus = Number(shieldItem.system.armor?.value)||0;
    ac = base + dexAdd + shieldBonus;
  }
  out.ac = ac;
  out.initiative = dexMod;

  const strMod = mod(out.abilities.str);
  const weaponProfCodes = new Set((sys.traits?.weaponProf?.value)||[]);
  out.weaponsText = items.filter(it=>it.type==='weapon' && it.system?.equipped && it.name && it.name.trim()).map(it=>{
    const s = it.system||{};
    const props = s.properties||[];
    const isFinesse = props.includes('fin');
    const typeVal = (s.type?.value||'').toLowerCase();
    const isRanged = typeVal.endsWith('r');
    const isUnarmed = typeVal.includes('unarmed');
    const abilityMod = isFinesse ? Math.max(strMod, dexMod) : (isRanged ? dexMod : strMod);
    const proficient = isUnarmed
      || (typeVal.startsWith('simple') && weaponProfCodes.has('sim'))
      || (typeVal.startsWith('martial') && weaponProfCodes.has('mar'))
      || s.proficient === 1 || s.proficient === true;
    const attackBonus = abilityMod + (proficient ? (out.profBonus||0) : 0);
    const attackStr = fmt(attackBonus);

    const dmg = s.damage?.base;
    let dmgStr = '';
    if(dmg && dmg.denomination){
      const type = (dmg.types && dmg.types[0]) ? (DMG_TYPE_MAP[dmg.types[0]]||dmg.types[0]) : '';
      const flatBonus = Number(dmg.bonus)||0;
      const totalBonus = abilityMod + flatBonus;
      dmgStr = (dmg.number||1)+'W'+dmg.denomination + (totalBonus!==0? fmt(totalBonus) : '') + (type?' '+type:'');
    }
    const tag = isFinesse ? 'Fein' : (proficient ? '' : 'nicht geübt');
    return pipeLine([it.name, tag, attackStr, dmgStr]);
  }).join('\n');

  const spellMap = new Map();
  items.filter(it=>it.type==='spell').forEach(it=>{
    if(!it.name || !it.name.trim()) return; // kaputte/unaufgeloeste Verweise ohne echten Namen
    if(spellMap.has(it.name)) return;
    const s = it.system||{};
    const desc = stripHtml(s.description?.value);
    if(!desc || desc.trim().length < 3) return; // Platzhalter ohne echten Zaubertext ueberspringen
    const comp=[]; (s.properties||[]).forEach(p=>{ if(p==='vocal')comp.push('V'); if(p==='somatic')comp.push('S'); if(p==='material')comp.push('M'); });
    let compStr = comp.join('+');
    if(comp.includes('M') && s.materials?.value) compStr += ' ('+s.materials.value+')';
    const range = s.range?.units==='self' ? 'Selbst' : s.range?.units==='touch' ? 'Berührung' : (s.range?.value? s.range.value+' ft':'');
    const dur = (s.duration?.value && String(s.duration.value)!=='0') ? (s.duration.value+' '+(DURATION_UNIT_MAP[s.duration.units]||s.duration.units||'')) : (DURATION_UNIT_MAP[s.duration?.units]||'Sofort');
    const time = ACTIVATION_MAP[s.activation?.type] || (s.activation?.type||'');
    const gistDe = lookupSpellGistDe(it.name);
    spellMap.set(it.name, pipeLine([s.level ?? 0, it.name, '', SCHOOL_MAP[s.school]||s.school||'', time, range, compStr, dur, desc, gistDe]));
  });
  out.spellsText = Array.from(spellMap.values()).join('\n');
  out.spellEnabled = spellMap.size>0;
  if(out.spellEnabled){
    const scAbbr = sys.attributes?.spellcasting;
    const scLabel = {str:'Stärke',dex:'Geschicklichkeit',con:'Konstitution',int:'Intelligenz',wis:'Weisheit',cha:'Charisma'}[scAbbr] || '';
    out.spellAbility = scLabel;
    const scMod = mod(out.abilities[scAbbr] || 10);
    out.spellDc = 8 + out.profBonus + scMod;
    out.spellAttack = out.profBonus + scMod;
    const sp = sys.spells||{};
    let slots = [1,2,3,4,5,6,7,8,9].map(n=> Number(sp['spell'+n]?.value)||0);
    if(slots.every(v=>v===0) && sp.pact && Number(sp.pact.max)>0){
      const lvl = Math.max(1, Math.min(9, Number(sp.pact.level)||1));
      slots[lvl-1] = Number(sp.pact.value) || Number(sp.pact.max) || 0;
    }
    out.slots = slots;
  }

  out.featuresText = items.filter(it=>it.type==='feat' && it.name && it.name.trim()).map(it=>{
    const first = stripHtml(it.system?.description?.value).split(/\n{2,}/)[0] || '';
    const de = lookupFeatureDe(it, raceItem, classItems);
    return pipeLine([it.name, '', first, de]);
  }).join('\n');

  out.equipmentText = items.filter(it=>['equipment','loot','tool','consumable','container'].includes(it.type) && it.name && it.name.trim()).map(it=>{
    const price = it.system?.price;
    let priceStr = '';
    if(price && price.value){
      priceStr = price.value + ' ' + (CURRENCY_MAP[price.denomination] || price.denomination || '');
    }
    return pipeLine([it.name, priceStr]);
  }).join('\n');

  out.profArmor = (sys.traits?.armorProf?.value||[]).map(c=>ARMOR_PROF_MAP[c]||c).join(', ');
  out.profWeapons = (sys.traits?.weaponProf?.value||[]).map(c=>WEAPON_PROF_MAP[c]||c).join(', ');
  out.resistance = (sys.traits?.dr?.value||[]).map(c=>DMG_TYPE_MAP[c]||c).join(', ');
  out.languages = (sys.traits?.languages?.value||[]).join(', ');

  out._hasHalfSkill = hasHalfSkill;
  return out;
}

// Ein eigener Export (siehe exportCharacterJson) traegt immer 'abilities' UND
// 'skillProf' als oberste Felder — das hat ein FoundryVTT-Export nie (der hat
// stattdessen 'system'+'items'). Reicht als zuverlaessige Unterscheidung.
function looksLikeOwnExport(json){
  return !!(json && typeof json === 'object' && json.abilities && json.skillProf);
}
async function handleImportFile(){
  let res;
  try{ res = await window.electronAPI.openJsonFile(); }
  catch(e){ showError(e, 'Datei konnte nicht geöffnet werden.'); return; }
  if(!res || !res.ok) return; // Dialog abgebrochen

  let json;
  try{ json = JSON.parse(res.content); }
  catch(e){ showError(e, 'Die Datei „' + res.fileName + '" ist kein gültiges JSON.'); return; }

  if(looksLikeOwnExport(json)){
    try{
      const data = Object.assign({}, json); delete data.id; delete data.createdAt; delete data.updatedAt;
      if(!data.name || !String(data.name).trim()) throw apiError('Die Datei enthält keinen Charakternamen.');
      const saved = await apiFetch('/api/characters', { method:'POST', body: JSON.stringify(data) });
      await loadCharacters();
      goSheet(saved.id);
    }catch(e){ showError(e, 'Import fehlgeschlagen:'); }
    return;
  }

  let mapped;
  try{
    await Promise.all([ensureDeTranslationsLoaded(), ensureSpellsLoaded()]);
    mapped = parseFoundryActor(json);
  }catch(e){
    showError(e, 'Die Datei „' + res.fileName + '" konnte nicht gelesen werden. Erwartet wird ein FoundryVTT-Charakter-Export oder eine mit diesem Tool exportierte Charakterdatei (.json).');
    return;
  }
  const half = mapped._hasHalfSkill;
  delete mapped._hasHalfSkill;
  draftChar = mapped;
  importNotice = 'Automatisch aus „' + esc(res.fileName) + '" befüllt — bitte vor dem Speichern prüfen. Rüstungsklasse, Zauber-SG/-Angriffsbonus sowie Waffen-Angriff/-Schaden werden aus Attributen, Übungsbonus und Waffeneigenschaften berechnet; bei magischen Waffen oder Sonderregeln ggf. von Hand nachbessern.'
    + (half ? ' Einige Fertigkeiten hatten einen halben Übungsbonus (z. B. durch „Alleskönner") — dafür bitte den Wert bei „Bonus auf ungeübte Fertigkeiten" eintragen.' : '');
  view = 'form'; currentId = null; formError = '';
  render();
}

// Speichert den aktuellen Charakter als .json-Datei — zum Weitergeben an
// Mitspieler (die es hier ueber "JSON importieren" wieder einlesen) oder als
// persoenliches Backup, unabhaengig vom Browser-Speicher dieses Rechners.
async function exportCharacterJson(id){
  const c = characters.find(x=>x.id===id);
  if(!c) return;
  const suggested = (c.name||'charakter').replace(/[\\/:*?"<>|]+/g,'_') + '.json';
  try{ await window.electronAPI.saveJsonFile(suggested, JSON.stringify(c, null, 2)); }
  catch(e){ showError(e, 'Export fehlgeschlagen:'); }
}

/* ============== Render Dispatch ============== */
function render(){
  const app = document.getElementById('app');
  if(!dbReady){
    app.innerHTML = '<p style="text-align:center;color:var(--ink-soft);font-style:italic;">Lade Charakterkompendium…</p>';
    return;
  }
  let body;
  if(view==='list') body = renderList();
  else if(view==='form') body = renderForm();
  else if(view==='sheet') body = renderSheet();
  else if(view==='wizard') body = renderWizard();
  else if(view==='custom') body = renderCustom();
  const banner = globalError ? `<div class="global-error"><span>⚠ ${esc(globalError)}</span><button class="btn small" onclick="dismissError()">Schließen</button></div>` : '';
  app.innerHTML = banner + body;
}

/* ============== List View ============== */
function renderList(){
  const q = filterText.trim().toLowerCase();
  const list = characters
    .filter(c => !q || (c.name||'').toLowerCase().includes(q) || (c.subtitle||'').toLowerCase().includes(q))
    .slice()
    .sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'de'));

  let rows;
  if(list.length===0){
    rows = `<div class="empty-state">${characters.length===0 ? 'Noch keine Charaktere im Kompendium.' : 'Keine Treffer für diese Suche.'}<br><br><button class="btn primary" onclick="goNew()">+ Neuen Charakter anlegen</button></div>`;
  } else {
    rows = '<div class="char-list">' + list.map(c => `
      <div class="char-row" onclick="${confirmDeleteId===c.id?'':`goSheet('${c.id}')`}">
        <div>
          <div class="name">${esc(c.name||'(ohne Namen)')}</div>
          <div class="meta">${esc(c.subtitle||'')}</div>
        </div>
        <div class="row-actions">
          ${confirmDeleteId===c.id ? `
            <span class="confirm-inline">Wirklich löschen?</span>
            <button class="btn small danger" onclick="event.stopPropagation(); confirmDelete('${c.id}')">Ja, löschen</button>
            <button class="btn small" onclick="event.stopPropagation(); cancelDelete()">Abbrechen</button>
          ` : `
            <button class="btn small" onclick="event.stopPropagation(); goEdit('${c.id}')">Bearbeiten</button>
            <button class="btn small danger" onclick="event.stopPropagation(); askDelete('${c.id}')">Löschen</button>
          `}
        </div>
      </div>`).join('') + '</div>';
  }

  return `
    <div class="topbar">
      <div>
        <h1>🪕 Charakterkompendium</h1>
        <div class="sub">${characters.length} Charakter${characters.length===1?'':'e'} · sortiert nach Namen</div>
      </div>
      <div class="topbar-actions">
        <button class="btn" onclick="loadCharacters()">🔄 Aktualisieren</button>
        <button class="btn" onclick="handleImportFile()">📥 JSON importieren</button>
        <button class="btn" onclick="window.electronAPI.openDataFolder()">📁 Datenordner öffnen</button>
        <button class="btn" onclick="goCustom('species')">📚 Eigene Inhalte</button>
        <button class="btn primary" onclick="goWizard()">🧙 Neu per Assistent (SRD)</button>
        <button class="btn primary" onclick="goNew()">+ Neuer Charakter (manuell)</button>
      </div>
    </div>
    <div class="searchbar">
      <input type="text" placeholder="Nach Namen oder Untertitel suchen…" value="${esc(filterText)}" oninput="onSearch(this.value)">
    </div>
    ${rows}
  `;
}

async function saveForm(ev){
  ev.preventDefault();
  const name = document.getElementById('f_name').value.trim();
  if(!name){
    formError = 'Bitte einen Namen eintragen.';
    render();
    return false;
  }
  const skillProf = {}; SKILLS.forEach(([k])=> skillProf[k] = Number(document.getElementById('sk_'+k).value)||0);
  const saveProf = {}; ABILS.forEach(([k])=> saveProf[k] = document.getElementById('sv_'+k).checked);
  const abilities = {}; ABILS.forEach(([k])=> abilities[k] = Number(document.getElementById('ab_'+k).value)||10);
  const slots = []; for(let i=0;i<9;i++) slots.push(Number(document.getElementById('slot_'+i).value)||0);

  const movementVals = {};
  MOVEMENT_TYPES.forEach(([field]) => {
    const checked = document.getElementById('mvchk_'+field).checked;
    movementVals[field] = checked ? document.getElementById('mvval_'+field).value.trim() : '';
  });
  const visionVals = {};
  VISION_TYPES.forEach(([field]) => {
    const checked = document.getElementById('vichk_'+field).checked;
    visionVals[field] = checked ? document.getElementById('vival_'+field).value.trim() : '';
  });
  const checkedValues = cls => Array.from(document.querySelectorAll('.'+cls+':checked')).map(el => el.value);

  const data = {
    name,
    subtitle: document.getElementById('f_subtitle').value.trim(),
    background: document.getElementById('f_background').value.trim(),
    size: document.getElementById('f_size').value.trim(),
    ...movementVals,
    ...visionVals,
    profBonus: Number(document.getElementById('f_profBonus').value)||0,
    untrainedBonus: Number(document.getElementById('f_untrained').value)||0,
    abilities, saveProf, skillProf,
    ac: Number(document.getElementById('f_ac').value)||0,
    initiative: Number(document.getElementById('f_init').value)||0,
    hpCur: Number(document.getElementById('f_hpcur').value)||0,
    hpMax: Number(document.getElementById('f_hpmax').value)||0,
    weaponsText: document.getElementById('f_weapons').value,
    spellEnabled: document.getElementById('f_spellEnabled').checked,
    spellAbility: document.getElementById('f_spAbility').value.trim(),
    spellDc: Number(document.getElementById('f_spDc').value)||0,
    spellAttack: Number(document.getElementById('f_spAtk').value)||0,
    slots,
    spellsText: document.getElementById('f_spells').value,
    featuresText: document.getElementById('f_features').value,
    magicItemsText: document.getElementById('f_magicItems').value,
    equipmentText: document.getElementById('f_equipment').value,
    armorChecked: checkedValues('chk_armor'),
    weaponsChecked: checkedValues('chk_weapon'),
    toolsChecked: checkedValues('chk_tool'),
    resistanceChecked: checkedValues('chk_resist'),
    languagesChecked: checkedValues('chk_lang'),
    profArmor: document.getElementById('f_profArmor').value.trim(),
    profWeapons: document.getElementById('f_profWeapons').value.trim(),
    profTools: document.getElementById('f_profTools').value.trim(),
    resistance: document.getElementById('f_resistance').value.trim(),
    languages: document.getElementById('f_languages').value.trim(),
    notes: document.getElementById('f_notes').value
  };

  try{
    const method = currentId ? 'PUT' : 'POST';
    const url = currentId ? '/api/characters/'+encodeURIComponent(currentId) : '/api/characters';
    const saved = await apiFetch(url, { method, body: JSON.stringify(data) });
    formError = '';
    await loadCharacters();
    goSheet(saved.id);
  }catch(e){
    formError = 'Speichern fehlgeschlagen: ' + (e && e.message ? e.message : e);
    render();
  }
  return false;
}

/* ============== Assistent-Ansicht ============== */
function renderWizard(){
  if(!wizard) return '';
  const w = wizard;

  if(!srdLoaded){
    return `
      <div class="topbar"><div><h1>🧙 Neuer Charakter per Assistent</h1></div>
      <div class="topbar-actions"><button class="btn" onclick="goList()">← Zurück zur Liste</button></div></div>
      <p style="text-align:center;color:var(--ink-soft);font-style:italic;">Lade SRD-Daten…</p>`;
  }

  // Je nach Modus kommt das Objekt, mit dem der Rest des Formulars rechnet,
  // entweder aus der Liste (SRD + eigene, bereits gespeichert) oder direkt
  // aus dem gerade eingetippten Inline-Entwurf (noch nicht gespeichert).
  const background = w.backgroundMode==='new' ? w.backgroundDraft : srdBackgrounds.find(b => b.key === w.backgroundKey);
  const klass = w.classMode==='new' ? w.classDraft : srdClasses.find(c => c.key === w.classKey);

  function sourceTag(item){ return item.source==='custom' ? ' (eigene)' : ' (SRD)'; }

        <select onchange="wizardDraftUpdate('species',{size:this.value})">

      </div>
      <div class="field"><label>Bewegung</label><input type="text" placeholder="9 m (30 ft)" value="${esc(w.speciesDraft.speed)}" oninput="wizardDraftUpdateSilent('species',{speed:this.value})"></div>

    </div>

      <textarea rows="4" oninput="wizardDraftUpdateSilent('species',{traitsText:this.value})">${esc(w.speciesDraft.traitsText)}</textarea>
    </div>`;

  const backgroundInlineHtml = `
    <div class="field"><label>Name *</label><input type="text" value="${esc(w.backgroundDraft.name)}" oninput="wizardDraftUpdateSilent('background',{name:this.value})"></div>
    <div class="field">
      <label>Attributsbonus</label>
      <div style="display:flex; gap:16px; margin-bottom:8px; font-size:0.9rem;">
        <label><input type="radio" name="wiz_new_bg_bonus_mode" ${w.backgroundDraft.bonusMode==='choice'?'checked':''} onchange="wizardDraftUpdate('background',{bonusMode:'choice'})"> Klassische Wahl</label>
        <label><input type="radio" name="wiz_new_bg_bonus_mode" ${w.backgroundDraft.bonusMode==='fixed'?'checked':''} onchange="wizardDraftUpdate('background',{bonusMode:'fixed'})"> Feste Werte</label>
      </div>
      ${w.backgroundDraft.bonusMode==='choice' ? `
        <div>genau drei Attribute zur Wahl auswählen (gew.: ${w.backgroundDraft.abilityChoices.length}/3)</div>
        <div style="display:flex; gap:16px; flex-wrap:wrap;">
          ${ABILS_ORDER.map(([code,label]) => `
            <label style="display:flex; align-items:center; gap:6px;">
              <input type="checkbox" ${w.backgroundDraft.abilityChoices.includes(code)?'checked':''} onchange="wizardDraftToggle('background','abilityChoices','${code}',3)"> ${label}
            </label>`).join('')}
        </div>
      ` : `
        <div class="ability-grid">
          ${ABILS_ORDER.map(([code,label]) => `
            <div class="field"><label>${label}</label><input type="number" value="${w.backgroundDraft.abilityBonuses[code]||0}" oninput="wizardDraftUpdateSilent('background',{abilityBonuses: Object.assign({}, wizard.backgroundDraft.abilityBonuses, {${code}: Number(this.value)||0})})"></div>`).join('')}
        </div>
      `}
    </div>
    <div class="field"><label>Fertigkeiten-Übung durch den Hintergrund</label>
      <div class="skill-grid">
        ${SKILLS.map(([code,label]) => `
          <label style="display:flex; align-items:center; gap:6px; font-size:0.88rem;">
            <input type="checkbox" ${w.backgroundDraft.skillProficiencies.includes(code)?'checked':''} onchange="wizardDraftToggle('background','skillProficiencies','${code}',99)"> ${label}
          </label>`).join('')}
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Werkzeugübung</label><input type="text" value="${esc(w.backgroundDraft.toolProficiency)}" oninput="wizardDraftUpdateSilent('background',{toolProficiency:this.value})"></div>
      <div class="field"><label>Herkunfts-Feat</label><input type="text" value="${esc(w.backgroundDraft.feat)}" oninput="wizardDraftUpdateSilent('background',{feat:this.value})"></div>
    </div>
    <div class="field"><label>Startausrüstung (Wahl, freier Text)</label><textarea rows="2" oninput="wizardDraftUpdateSilent('background',{equipmentText:this.value})">${esc(w.backgroundDraft.equipmentText)}</textarea></div>`;

  const classInlineHtml = `
    <div class="field"><label>Name *</label><input type="text" value="${esc(w.classDraft.name)}" oninput="wizardDraftUpdateSilent('class',{name:this.value})"></div>
    <div class="field-row">
      <div class="field"><label>Trefferwürfel</label>
        <select onchange="wizardDraftUpdate('class',{hitDie:this.value})">
          ${['w6','w8','w10','w12'].map(h=>`<option value="${h}" ${w.classDraft.hitDie===h?'selected':''}>${h}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Wählbare Fertigkeiten (Anzahl)</label><input type="number" min="0" max="18" value="${w.classDraft.skillChoiceCount}" oninput="wizardDraftUpdateSilent('class',{skillChoiceCount:Number(this.value)})"></div>
    </div>
    <div class="field"><label>Rettungswürfe — genau zwei auswählen (gew.: ${w.classDraft.savingThrows.length}/2)</label>
      <div style="display:flex; gap:16px; flex-wrap:wrap;">
        ${ABILS_ORDER.map(([code,label]) => `
          <label style="display:flex; align-items:center; gap:6px;">
            <input type="checkbox" ${w.classDraft.savingThrows.includes(code)?'checked':''} onchange="wizardDraftToggle('class','savingThrows','${code}',2)"> ${label}
          </label>`).join('')}
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Waffenübung</label><input type="text" value="${esc(w.classDraft.weaponProficiencies)}" oninput="wizardDraftUpdateSilent('class',{weaponProficiencies:this.value})"></div>
      <div class="field"><label>Rüstungsübung</label><input type="text" value="${esc(w.classDraft.armorProficiencies)}" oninput="wizardDraftUpdateSilent('class',{armorProficiencies:this.value})"></div>
      <div class="field"><label>Werkzeugübung</label><input type="text" value="${esc(w.classDraft.toolProficiencies)}" oninput="wizardDraftUpdateSilent('class',{toolProficiencies:this.value})"></div>
    </div>
    <div class="field"><label>Startausrüstung (Wahl, freier Text)</label><textarea rows="2" oninput="wizardDraftUpdateSilent('class',{startingEquipment:this.value})">${esc(w.classDraft.startingEquipment)}</textarea></div>
    <div class="field-row">
      <div class="field"><label>Zauberfortschritt</label>
        <select onchange="wizardDraftUpdate('class',{casterProgression:this.value})">
          <option value="none" ${w.classDraft.casterProgression==='none'?'selected':''}>Keiner</option>
          <option value="full" ${w.classDraft.casterProgression==='full'?'selected':''}>Voller Zauberwirker</option>
          <option value="half" ${w.classDraft.casterProgression==='half'?'selected':''}>Halber Zauberwirker</option>
        </select>
      </div>
      ${w.classDraft.casterProgression!=='none' ? `
      <div class="field"><label>Zauberattribut</label>
        <select onchange="wizardDraftUpdate('class',{spellAbility:this.value})">
          <option value="">— wählen —</option>
          ${ABILS_ORDER.map(([code,label])=>`<option value="${code}" ${w.classDraft.spellAbility===code?'selected':''}>${label}</option>`).join('')}

      <textarea rows="5" oninput="wizardDraftUpdateSilent('class',{featuresText:this.value})">${esc(w.classDraft.featuresText)}</textarea>
    </div>`;

  let bgBonusHtml = '';
  if(background && background.bonusMode === 'fixed' && background.abilityBonuses){
    const parts = ABILS_ORDER.filter(([code]) => background.abilityBonuses[code]).map(([code,label]) => `${label} ${fmt(background.abilityBonuses[code])}`);
    bgBonusHtml = `<div class="field"><div class="hint">Fester Attributsbonus von „${esc(background.name||'(neuer Hintergrund)')}": ${parts.join(', ')||'keiner'} — keine Auswahl nötig.</div></div>`;
  } else if(background && background.abilityChoices && background.abilityChoices.length){
    bgBonusHtml = `
      <div class="field">
        <label>Attributsbonus aus „${esc(background.name||'(neuer Hintergrund)')}" (wählbar: ${background.abilityChoices.map(a=>ABILITY_LABEL_DE[a]||a).join(', ')})</label>

        </div>
        ${w.bgMode==='2-1' ? (() => {
          // Browser zeigt bei leerem/ungueltigem Zustand optisch trotzdem die erste
          // Option an (Standard-Select-Verhalten) — ohne diese Korrektur klafft eine
          // Luecke zwischen dem, was zu sehen ist, und dem tatsaechlichen Zustand,

          if(!w.bgPlus2 || !background.abilityChoices.includes(w.bgPlus2)) w.bgPlus2 = background.abilityChoices[0];
          if(!w.bgPlus1 || !background.abilityChoices.includes(w.bgPlus1) || w.bgPlus1===w.bgPlus2){

  const pbRemaining = POINT_BUY_BUDGET - pbSpent;
  const abilityInputs = ABILS_ORDER.map(([code,label]) => `
    <div class="field"><label>${label}</label>

    </div>`).join('');

  return `
    <div class="topbar">
      <div><h1>🧙 Neuer Charakter per Assistent</h1><div class="sub">Spezies, Hintergrund und Klasse aus SRD 5.2 + euren eigenen Inhalten — oder direkt hier neu anlegen.</div></div>
      <div class="topbar-actions"><button class="btn" onclick="goList()">← Zurück zur Liste</button></div>
    </div>

    <fieldset>
      <legend>Name</legend>
      <div class="field"><label for="wiz_name">Name *</label><input type="text" id="wiz_name" value="${esc(w.name)}" oninput="wizardUpdateSilent({name:this.value})"></div>
    </fieldset>

    <fieldset>
      <legend>Spezies</legend>
      ${modeToggle('species')}
      ${w.speciesMode==='list'
        ? `<select id="wiz_species" onchange="wizardUpdate({speciesKey:this.value})"><option value="">— wählen —</option>${speciesOptions}</select>`
        : speciesInlineHtml}
    </fieldset>

    <fieldset>
      <legend>Hintergrund</legend>
      ${modeToggle('background')}
      ${w.backgroundMode==='list'
        ? `<select id="wiz_background" onchange="wizardUpdate({backgroundKey:this.value})"><option value="">— wählen —</option>${backgroundOptions}</select>`
        : backgroundInlineHtml}
      ${bgBonusHtml}
    </fieldset>

    <fieldset>
      <legend>Klasse</legend>
      ${modeToggle('class')}
      ${w.classMode==='list'
        ? `<select id="wiz_class" onchange="wizardUpdate({classKey:this.value})"><option value="">— wählen —</option>${classOptions}</select>`
        : classInlineHtml}
      ${skillsHtml}
    </fieldset>

    <fieldset>
      <legend>Attribute — Point-Buy (${POINT_BUY_BUDGET} Punkte)</legend>
      <div class="ability-grid">${abilityInputs}</div>
      <div class="hint" style="${pbRemaining<0?'color:var(--danger);font-weight:600;':''}">Verbleibende Punkte: ${pbRemaining} von ${POINT_BUY_BUDGET} ${pbRemaining<0?'— zu viele Punkte verteilt!':''}</div>
    </fieldset>

    ${w.error ? `<p class="error-text">${esc(w.error)}</p>` : ''}
    <div class="form-actions">
      <button type="button" class="btn" onclick="goList()">Abbrechen</button>
      <button type="button" class="btn primary" onclick="doCreateFromWizard()">Charakter erstellen</button>
    </div>
  `;
}

/* ============== Eigene-Inhalte-Ansicht ============== */
function renderCustom(){
  if(!srdLoaded){
    return `
      <div class="topbar"><div><h1>📚 Eigene Inhalte</h1></div>
      <div class="topbar-actions"><button class="btn" onclick="goList()">← Zurück zur Liste</button></div></div>
      <p style="text-align:center;color:var(--ink-soft);font-style:italic;">Lade Daten…</p>`;
  }
  if(customDraft) return renderCustomForm();

  const tabs = [['species','Spezies'],['background','Hintergründe'],['class','Klassen']];
  const tabsHtml = tabs.map(([t,label]) => `
    <button class="btn ${customTab===t?'primary':''}" onclick="goCustom('${t}')">${label}</button>
  `).join('');

  const list = customTab==='species'?srdSpecies:customTab==='background'?srdBackgrounds:srdClasses;
  const customItems = list.filter(x => x.source==='custom').sort((a,b)=>a.name.localeCompare(b.name));
  const srdCount = list.length - customItems.length;

  const rows = customItems.map(item => `
    <div class="panel" style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <strong>${esc(item.name)}</strong>
        <div style="display:flex; gap:8px;">
          <button class="btn small" onclick="goCustomEdit('${customTab}','${item.key}')">Bearbeiten</button>
          ${customConfirmDeleteKey===item.key ? `
            <span class="confirm-inline">Wirklich löschen?</span>
            <button class="btn danger small" onclick="confirmDeleteCustom('${customTab}','${item.key}')">Ja, löschen</button>
            <button class="btn small" onclick="cancelDeleteCustom()">Abbrechen</button>
          ` : `<button class="btn danger small" onclick="askDeleteCustom('${item.key}')">Löschen</button>`}
        </div>
      </div>
    </div>`).join('');

  const emptyHtml = customItems.length ? '' : `<p style="color:var(--ink-soft); font-style:italic;">Noch keine eigenen ${tabs.find(t=>t[0]===customTab)[1]} angelegt.</p>`;

  return `
    <div class="topbar">
      <div><h1>📚 Eigene Inhalte</h1><div class="sub">Zusätzlich zu den ${srdCount} SRD-Einträgen — stehen danach im Assistenten mit zur Auswahl.</div></div>
      <div class="topbar-actions"><button class="btn" onclick="goList()">← Zurück zur Liste</button></div>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:16px;">${tabsHtml}</div>
    <button class="btn primary" style="margin-bottom:16px;" onclick="goCustomNew('${customTab}')">+ Neu anlegen</button>
    ${emptyHtml}
    ${rows}
  `;
}

            ${ABILS_ORDER.map(([code,label]) => `

      </div>
      <div class="field"><label>Fertigkeiten-Übung durch den Hintergrund</label>

  } else {
    const saveChecks = ABILS_ORDER.map(([code,label]) => `
      <label style="display:flex; align-items:center; gap:6px;">
        <input type="checkbox" ${d.savingThrows.includes(code)?'checked':''} onchange="customToggleAbility('savingThrows','${code}',2)"> ${label}
      </label>`).join('');
    const armorChecks = ARMOR_CATS.map(([code,label]) => `<label style="display:flex; align-items:center; gap:5px; font-size:0.88rem;"><input type="checkbox" ${d.armorChecked.includes(code)?'checked':''} onchange="customToggleAbility('armorChecked','${code}',99)"> ${label}</label>`).join('');
    const weaponChecks = WEAPON_CATS.map(([code,label]) => `<label style="display:flex; align-items:center; gap:5px; font-size:0.88rem;"><input type="checkbox" ${d.weaponsChecked.includes(code)?'checked':''} onchange="customToggleAbility('weaponsChecked','${code}',99)"> ${label}</label>`).join('');
    const classToolChecks = TOOLS.map(([code,label]) => `<label style="display:flex; align-items:center; gap:5px; font-size:0.88rem;"><input type="checkbox" ${d.toolsChecked.includes(code)?'checked':''} onchange="customToggleAbility('toolsChecked','${code}',99)"> ${label}</label>`).join('');
    fieldsHtml = `
      <div class="field"><label>Name *</label><input type="text" value="${esc(d.name)}" oninput="customUpdateSilent({name:this.value})"></div>
      <div class="field-row">
        <div class="field"><label>Trefferwürfel</label>
          <select onchange="customUpdate({hitDie:this.value})">
            ${['w6','w8','w10','w12'].map(h=>`<option value="${h}" ${d.hitDie===h?'selected':''}>${h}</option>`).join('')}

        </div>
        <div class="field"><label>Wählbare Fertigkeiten (Anzahl)</label><input type="number" min="0" max="18" value="${d.skillChoiceCount}" oninput="customUpdateSilent({skillChoiceCount:Number(this.value)})"></div>
      </div>
      <div class="field"><label>Rettungswürfe — genau zwei auswählen (gew.: ${d.savingThrows.length}/2)</label>
        <div style="display:flex; gap:16px; flex-wrap:wrap;">${saveChecks}</div>
      </div>
      <div class="field-row">
        <div class="field" style="flex:1;"><label>Rüstungsübung</label>
          <div style="display:flex; gap:14px; flex-wrap:wrap;">${armorChecks}</div>
          <input type="text" value="${esc(d.armorProficiencies)}" placeholder="Sonstige, freier Text" oninput="customUpdateSilent({armorProficiencies:this.value})" style="margin-top:6px;">
        </div>

      </div>

      <div class="field-row">
        <div class="field"><label>Zauberfortschritt</label>
          <select onchange="customUpdate({casterProgression:this.value})">
            <option value="none" ${d.casterProgression==='none'?'selected':''}>Keiner</option>
            <option value="full" ${d.casterProgression==='full'?'selected':''}>Voller Zauberwirker (wie Barde/Kleriker/Magier)</option>
            <option value="half" ${d.casterProgression==='half'?'selected':''}>Halber Zauberwirker (wie Paladin/Waldläufer)</option>
          </select>
        </div>
        ${d.casterProgression!=='none' ? `
        <div class="field"><label>Zauberattribut</label>

        <textarea rows="8" oninput="customUpdateSilent({featuresText:this.value})">${esc(d.featuresText)}</textarea>
      </div>`;
  }

  return `
    <div class="topbar">
      <div><h1>${title}</h1></div>

    </div>
    <fieldset>${fieldsHtml}</fieldset>
    ${errorHtml}
    <div class="form-actions">
      <button type="button" class="btn" onclick="goCustomCancel()">Abbrechen</button>

function skillBonus(c, key, ability){
  const m = mod(c.abilities[ability]);
  const p = (c.skillProf && c.skillProf[key]) || 0;
  let b = m + Math.floor((c.profBonus||0) * p);
  if(p===0) b += (c.untrainedBonus||0);
  return b;
}
function saveBonus(c, ab){
  return mod(c.abilities[ab]) + (c.saveProf[ab] ? (c.profBonus||0) : 0);
}

function buildSheetParts(c){
  const passivePerception = 10 + skillBonus(c,'prc','wis');

  const abilitiesHtml = ABILS.map(([k,label]) => `
    <div class="ability-box"><span class="nm">${label}</span><span class="sc">${esc(c.abilities[k])}</span><span class="md">${fmt(mod(c.abilities[k]))}</span></div>
  `).join('');

  const savesHtml = ABILS.map(([k,label]) => `
    <tr><td><span class="dot ${c.saveProf[k]?'f1':''}"></span>${label}</td><td class="mod-col">${fmt(saveBonus(c,k))}</td></tr>
  `).join('');

  const skillsHtml = SKILLS.map(([k,label,ab]) => {
    const p = (c.skillProf && c.skillProf[k]) || 0;
    return `<tr><td><span class="dot ${p===1?'f1':p===2?'f2':''}"></span>${label}</td><td class="mod-col">${fmt(skillBonus(c,k,ab))}</td></tr>`;
  }).join('');

  const weapons = parseLines(c.weaponsText);
  const weaponsTable = weapons.length ? `
    <table class="plain">
      <thead><tr><th>Waffe / Zauber</th><th>Angriff</th><th>Schaden</th></tr></thead>
      <tbody>${weapons.map(w=>`<tr><td><strong>${esc(fld(w,0))}</strong> ${fld(w,1)?`<span class="tag">${esc(fld(w,1))}</span>`:''}</td><td class="mod-col">${esc(fld(w,2))}</td><td>${esc(fld(w,3))}</td></tr>`).join('')}</tbody>
    </table>` : '<p class="note">Keine Waffen/Angriffe eingetragen.</p>';

  const spellRows = parseLines(c.spellsText).filter(r => fld(r,1).trim()); // [grad, nameDe, nameEn, school, time, range, comp, dur, desc]
  const byLevel = {};
  spellRows.forEach(r=>{
    const lvl = parseInt(fld(r,0),10) || 0;
    (byLevel[lvl] = byLevel[lvl]||[]).push(r);
  });
  const levels = Object.keys(byLevel).map(Number).sort((a,b)=>a-b);

  let spellcastingPanel = '';
  if(c.spellEnabled){
    const slotGroups = (c.slots||[]).map((v,i)=> Number(v)>0 ? `<div class="slot-group"><div class="lvl">Grad ${i+1}</div><div>${Array.from({length:Number(v)}).map(()=>'<span class="pip"></span>').join('')}</div></div>` : '').join('');
    const levelBlocks = levels.map(lvl => `
      <div class="spell-level-title">${lvl===0?'Zaubertricks':lvl+'. Grad'}</div>
      <ul class="spell-list">${byLevel[lvl].map(r=>`<li>${esc(fld(r,1))} ${fld(r,2)?`<span class="orig">${esc(fld(r,2))}</span>`:''}</li>`).join('')}</ul>
    `).join('');
    spellcastingPanel = `
      <div class="panel">
        <h2>Zauberwirken</h2>
        <div class="header-meta" style="margin-top:0;">
          <div><span class="label">Zauberattribut</span><span class="val">${esc(c.spellAbility)}</span></div>
          <div><span class="label">Rettungswurf-SG</span><span class="val">${esc(c.spellDc)}</span></div>
          <div><span class="label">Angriffsbonus</span><span class="val">${fmt(c.spellAttack)}</span></div>
        </div>
        <div class="slots">${slotGroups}</div>
        ${levelBlocks}
      </div>`;
  }

  const features = parseLines(c.featuresText);
  const hasDeTranslation = features.some(f => fld(f,3).trim());
  const featCol = (arr) => arr.map(f=>{
    const deText = fld(f,3).trim();
    const desc = (featuresLangDe && deText) ? deText : fld(f,2);
    return `<div class="feature"><div class="fn">${esc(fld(f,0))} ${fld(f,1)?`<span class="orig">${esc(fld(f,1))}</span>`:''}</div><div class="fd">${esc(desc)}</div></div>`;
  }).join('');
  const featuresPanel = features.length ? `
    <div class="panel features-panel">
      <h2>Merkmale &amp; Fähigkeiten
        ${hasDeTranslation ? `<button class="btn small no-print" style="float:right; margin-top:-4px;" onclick="toggleFeaturesLang()">${featuresLangDe ? '🇬🇧 English anzeigen' : '🇩🇪 Deutsch anzeigen'}</button>` : ''}
      </h2>
      <div class="two-col">${featCol(features)}</div>
    </div>` : '';

  const magicItems = parseLines(c.magicItemsText);
  const magicItemsPanel = magicItems.length ? `
    <div class="panel"><h2>Magische Gegenstände</h2>
      ${magicItems.map(m=>`<div class="feature"><div class="fn">${esc(fld(m,0))} ${fld(m,1)?`<span class="orig">${esc(fld(m,1))}</span>`:''} ${fld(m,2)?'— '+esc(fld(m,2)):''}</div><div class="fd">${esc(fld(m,3))}</div></div>`).join('')}
    </div>` : '';

  const equipment = parseLines(c.equipmentText);
  const equipmentPanel = equipment.length ? `
    <div class="panel"><h2>Ausrüstung</h2>
      <div class="tag-row">${equipment.map(e=>`<span class="chip">${esc(fld(e,0))}${fld(e,1)?` <em>${esc(fld(e,1))}</em>`:''}</span>`).join('')}</div>
    </div>` : '';

  const profsPanel = `
    <div class="panel"><h2>Übungen, Sprachen &amp; Widerstände</h2>
      <div class="header-meta" style="margin-top:0;">
        <div><span class="label">Rüstungen</span><span class="val">${esc(combineChecked(c.armorChecked, ARMOR_CATS, c.profArmor))||'—'}</span></div>
        <div><span class="label">Waffen</span><span class="val">${esc(combineChecked(c.weaponsChecked, WEAPON_CATS, c.profWeapons))||'—'}</span></div>
        <div><span class="label">Werkzeuge</span><span class="val">${esc(combineChecked(c.toolsChecked, TOOLS, c.profTools))||'—'}</span></div>
        <div><span class="label">Widerstand</span><span class="val">${esc(combineChecked(c.resistanceChecked, RESISTANCES, c.resistance))||'—'}</span></div>
        <div><span class="label">Sprachen</span><span class="val">${esc(combineChecked(c.languagesChecked, LANGUAGES, c.languages))||'—'}</span></div>
      </div>
    </div>`;

  const notesPanel = c.notes ? `<div class="panel"><h2>Notizen</h2><div class="fd" style="white-space:pre-wrap;">${esc(c.notes)}</div></div>` : '';

  const appendixHtml = spellRows.length ? `
    <div class="appendix">
      <h1 class="app-title">Anhang: Zauberbeschreibungen</h1>
      <div class="subline">Alle eingetragenen Zauber mit Werten und Beschreibung, sortiert nach Grad.</div>
      ${levels.map(lvl => `
        <div class="level-heading">${lvl===0?'Zaubertricks (Grad 0)':lvl+'. Grad'}</div>
        ${byLevel[lvl].map(r => `
          <div class="spell-card">
            <h3><span>${esc(fld(r,1))}</span>${fld(r,2)?`<span class="orig">${esc(fld(r,2))}</span>`:''}</h3>
            <div class="spell-meta"><span>${esc(fld(r,3))}</span><span>${esc(fld(r,4))}</span><span>${esc(fld(r,5))}</span><span>${esc(fld(r,6))}</span><span>${esc(fld(r,7))}</span></div>
            ${fld(r,9) ? `<div class="spell-desc" style="font-style:italic; margin-bottom:4px;">${esc(fld(r,9))}</div>` : ''}
            <div class="spell-desc">${esc(fld(r,8))}</div>
          </div>`).join('')}
      `).join('')}
    </div>` : '';

  const headerHtml = `
    <header class="sheet-head">
      <h1>${esc(c.name)}</h1>
      <div class="subline">${esc(c.subtitle)}</div>
      <div class="header-meta">
        <div><span class="label">Hintergrund</span><span class="val">${esc(c.background)||'—'}</span></div>
        <div><span class="label">Größe</span><span class="val">${esc(c.size)||'—'}</span></div>
        <div><span class="label">Bewegung</span><span class="val">${esc(combineTyped(MOVEMENT_TYPES, c))||'—'}</span></div>
        <div><span class="label">Sicht</span><span class="val">${esc(combineTyped(VISION_TYPES, c))||'—'}</span></div>
      </div>
    </header>`;

  const vitalsHtml = `
    <div class="vitals">
      <div class="vital-box"><div class="big">${esc(c.ac)}</div><div class="cap">Rüstungsklasse</div></div>
      <div class="vital-box"><div class="big">${fmt(c.initiative)}</div><div class="cap">Initiative</div></div>
      <div class="vital-box"><div class="big">${esc(c.hpCur)} / ${esc(c.hpMax)}</div><div class="cap">Trefferpunkte</div></div>
      <div class="vital-box"><div class="big">${fmt(c.profBonus)}</div><div class="cap">Übungsbonus</div></div>
      <div class="vital-box"><div class="big">${passivePerception}</div><div class="cap">Passive Wahrnehmung</div></div>
    </div>`;

  const abilitiesPanel = `<div class="panel"><h2>Attribute</h2><div class="abilities">${abilitiesHtml}</div></div>`;
  const savesPanel = `<div class="panel"><h2>Rettungswürfe</h2><table class="plain"><tbody>${savesHtml}</tbody></table><div class="note">● geübt</div></div>`;
  const skillsPanel = `<div class="panel"><h2>Fertigkeiten</h2><table class="plain"><tbody>${skillsHtml}</tbody></table><div class="note">● geübt · ● Expertise</div></div>`;
  const weaponsPanel = `<div class="panel"><h2>Waffen &amp; Angriffe</h2>${weaponsTable}</div>`;

  return {
    c, headerHtml, vitalsHtml, abilitiesPanel, savesPanel, skillsPanel, weaponsPanel,
    spellcastingPanel, featuresPanel, magicItemsPanel, equipmentPanel, profsPanel, notesPanel, appendixHtml
  };
}

function renderSheet(standalone){
  const c = characters.find(x=>x.id===currentId);
  if(!c) return `<div class="empty-state">Charakter nicht gefunden.<br><br><button class="btn" onclick="goList()">Zurück zur Liste</button></div>`;
  const p = buildSheetParts(c);

  const actionsHtml = standalone ? '' : `
    <div class="sheet-actions no-print">
      <button class="btn" onclick="goList()">← Zurück zur Liste</button>
      <button class="btn" onclick="goEdit('${c.id}')">Bearbeiten</button>
      ${c.classKey ? `<button class="btn" onclick="doLevelUp('${c.id}')">⬆ Auf Stufe ${(c.level||1)+1}</button>` : ''}
      <button class="btn" onclick="doPrint()">🖨️ Drucken / als PDF</button>
      <button class="btn" onclick="exportCharacterJson('${c.id}')">📤 Als Datei exportieren</button>
      ${confirmDeleteId===c.id ? `
        <span class="confirm-inline">Wirklich endgültig löschen?</span>
        <button class="btn danger" onclick="confirmDelete('${c.id}')">Ja, löschen</button>
        <button class="btn" onclick="cancelDelete()">Abbrechen</button>
      ` : `<button class="btn danger" onclick="askDelete('${c.id}')">Löschen</button>`}
    </div>`;

  return `
    ${actionsHtml}
    <div id="pdf-page1-group">
      ${p.headerHtml}
      ${p.vitalsHtml}
      <div class="grid">
        <div>
          ${p.abilitiesPanel}
          ${p.savesPanel}
          ${p.skillsPanel}
        </div>
        <div>
          ${p.weaponsPanel}
          ${p.spellcastingPanel}
          ${p.magicItemsPanel}
          ${p.equipmentPanel}
          ${p.profsPanel}
          ${p.notesPanel}
        </div>
